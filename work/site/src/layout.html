<!doctype html>
<html lang="{{lang}}"{{html_attrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{canonical}}">
{{hreflangs}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="PoE2 Runbook">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta property="og:locale" content="{{og_locale}}">
{{og_alternates}}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{root}}assets/icon.png">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script src="{{root}}assets/lang.js"></script>
<script src="{{root}}assets/config.js" defer></script>
<script src="{{root}}assets/site.js" defer></script>
</head>
<body class="p-{{page}}">

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="{{brand_href}}"><img src="{{root}}assets/icon.png" width="28" height="28" alt="">PoE2 Runbook</a>
    <nav class="bar-nav" aria-label="{{w nav}}">
      <details class="langs">
        <summary class="lang"><span class="ln">{{lang_name}}</span><span class="lc">{{lang_code}}</span><span aria-hidden="true"> ▾</span></summary>
        <div class="langs-menu">{{lang_menu}}</div>
      </details>
      <a class="btn btn-s" href="{{dl_href}}" data-dl-link>{{w download}}</a>
    </nav>
  </div>
</header>

<main id="top">
{{body}}
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <p>© 2026 Sergei Labutin</p>
    <nav aria-label="{{w pages}}">
      <a href="{{install}}">{{w install}}</a>
      <a href="{{safety}}">{{w reads}}</a>
      <a href="{{about}}#licence" data-repo rel="noopener noreferrer">{{w source}}</a>
      <a href="{{about}}#licence">{{w licence}}</a>
      <a href="{{about}}#contact" data-contact-row hidden>{{w contact}}</a>
    </nav>
    <p class="ggg"{{ggg_lang}}>This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</p>
  </div>
</footer>

</body>
</html>
