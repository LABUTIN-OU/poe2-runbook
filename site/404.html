<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>PoE2 Runbook — page not found</title>
<link rel="icon" href="/favicon.ico">
<!-- Эту страницу хостинг отдаёт по любому несуществующему адресу, на любой глубине: относительные пути отсюда
     не сработали бы. Поэтому стили — внутри, а ссылки домой — от корня сайта («/» и «/ru/»). -->
<style>
:root{color-scheme:dark light;--bg:#111316;--card:#1a1d22;--line:#2d323a;--text:#eceae6;--muted:#98a0aa;--accent:#7fb2ff}
@media (prefers-color-scheme:light){:root{--bg:#f4f2ee;--card:#ffffff;--line:#d9d5cc;--text:#1b1d21;--muted:#5b636e;--accent:#1d5fc4}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:12vh 16px 40px}
.card{padding:18px 18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.name{margin:0 0 14px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em}
h1{margin:0 0 6px;font-size:24px;font-weight:600;line-height:1.2}
p{margin:0 0 4px}
.sep{height:1px;margin:16px 0;background:var(--line)}
a{color:var(--accent)}
.foot{margin:14px 2px 0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <p class="name">PoE2 Runbook</p>
    <h1>There is no page at this address</h1>
    <p><a href="/">To the program's page</a></p>
    <div class="sep"></div>
    <h1 lang="ru">По этому адресу страницы нет</h1>
    <p lang="ru"><a href="/ru/">На страницу программы</a></p>
  </div>
  <p class="foot">poe2.labutin.gg — the only official address of the program<br><span lang="ru">poe2.labutin.gg — единственный официальный адрес программы</span></p>
</main>
</body>
</html>
