addEventListener('resize', abtPlace);
document.addEventListener('click', e => {
  const t = e.target;
  const b = t.closest && t.closest('#abt [data-abt]');
  if (b) {
    if (b.dataset.abt === 'shut') abtBack();
    else if (b.dataset.abt.startsWith('file:')) abtFile(b.dataset.abt.slice(5));
    return;
  }
  const site = t.closest && t.closest('#abt a[data-site]');
  if (site) {
    // окно программы открывает ссылку в браузере системы само; встроенный браузер приложения Claude открыл бы её вместо
    // этой страницы — там её открывает программа (POST /api/open), не вышло — открывается здесь же
    if (!/\bClaude\/\d/.test(navigator.userAgent)) return;
    e.preventDefault();
    fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({page: 'site'})})
      .then(r => r.json()).then(r => { if (!r.ok) location.href = site.href; }).catch(() => { location.href = site.href; });
    return;
  }
  if (ABOUT.open && t.closest && !t.closest('#abt') && !t.closest('.setw')) abtShow(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ABOUT.open) abtShow(false); });
const BAR_KEY = 'appBar';
let barMemo = '';
// --- Герой и план -------------------------------------------------------------------------------------------------
// Переключатель слева в шапке — одинаковый на обеих страницах: герой и выбранный план. Выбранный план один на обе
// страницы: по нему идёт герой, его играет «Игра» и правит «Редактор»; переключатель режима план не меняет.
// По нажатию под ним открывается список (ctxPanel): герои — кем играют сейчас, кого больше нет; планы библиотеки — строка
// плана целиком и есть выбор; присланный файл плана. Список шириной в колонку страницы и до низа окна, крутится целиком;
// страница под ним стоит (подложка ловит колесо и нажатие мимо); закрывается по Esc и нажатию мимо.
// Данные даёт страница: CTX.data = {plans: {library, list, current, ask, inGame}, heroes: [забеги]}; CTX.page — 'play' |
// 'edit'; CTX.edit — план на странице редактора (выбранный); CTX.after() — после действия (редактор спрашивает данные
// заново, «Игре» они приходят сами); CTX.before(дело) — перед сменой плана (редактор сперва спрашивает о несохранённых
// правках); CTX.picked() — план сменён (редактор открывает выбранный план).
const CTX = {data: null, page: 'play', edit: '', editTitle: '', open: false, all: false, arm: null, msg: null, same: null, busy: false,
  q: null, after: () => {}, before: go => go(), picked: () => ctxShow(false)};
const ctxEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// Адрес ссылки, собранный из данных (код фильтра, имя из плана), — только http или https: javascript:, data: и прочее
// ссылкой не становятся (пустой адрес). Относительный адрес — от адреса страницы.
const webLink = u => { try { const x = new URL(String(u), location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (err) { return ''; } };
// Картинка, которой нет (рисунка у программы нет), прячется — обработчиком отсюда, а не встроенным onerror=…: встроенные
// обработчики страница не выполняет (Content-Security-Policy). Такой картинке страница ставит атрибут data-hide.
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.hasAttribute('data-hide')) t.style.visibility = 'hidden';
}, true);
const ctxPlan = id => { const p = CTX.data && CTX.data.plans; return (p && (p.list || []).find(q => q.id === id)) || null; };
const ctxTitle = id => { const x = ctxPlan(id); return x ? x.title : ''; };
// Текущий герой словами страницы. Героя без имени (лог называет героя со второго уровня) зовут его классом; героя ещё
// нет (лог не начинал забег) — пусто.
function ctxHero() {
  const cur = ((CTX.data && CTX.data.heroes) || []).find(r => r.current);
  return cur ? cur.name || cur.cls || T('новый герой') : '';
}
// Надпись переключателя — одна на обе страницы: герой и выбранный план (в редакторе — название, как его набирают).
function ctxLabel() {
  const d = CTX.data, p = d && d.plans;
  if (!p) return null;
  const plan = CTX.page === 'edit' ? CTX.editTitle || ctxTitle(CTX.edit) : ctxTitle(p.current);
  return {text: [ctxHero(), plan].filter(Boolean).join(' · '), ask: !!p.ask};
}
function appBar() {
  const cur = CTX.page;
  let mem = null;
  try { mem = JSON.parse(localStorage.getItem(BAR_KEY) || 'null'); } catch (err) { /* нет памяти */ }
  const lab = ctxLabel() || {text: (mem && mem[cur + 'Text']) || '', ask: false};
  const tip = lab.ask ? T('Новый герой: по какому плану он идёт? Выберите план в списке') : T('Герои и планы');
  const btn = open => `<button class="ctxb${lab.ask ? ' need' : ''}${open ? ' on' : ''}" data-ctx="toggle" aria-haspopup="dialog" ` +
    `aria-expanded="${open}" title="${ctxEsc(tip)}"><span class="ctxt">${ctxEsc(lab.text || T('Герои и планы'))}</span>` +
    `<span class="ctxc" aria-hidden="true">▾</span></button>`;
  // обновление программы (updParts) — только в живом ряду: в запомненном для первого кадра оно могло устареть
  const row = (open, lg, st, up) => btn(open) + (up ? updParts() : '') +
    `<div class="corner">${modeSwitch(cur)}${setSwitch(st)}${langSwitch(lg)}</div>`;
  // ряд другой страницы остаётся, каким та его запомнила (на том же языке)
  const keep = mem && mem.lang === I18N.lang ? mem : {};
  const memo = JSON.stringify(Object.assign({}, keep, {lang: I18N.lang, [cur]: row(false, false, false), [cur + 'Text']: lab.text}));
  if (memo !== barMemo) {
    barMemo = memo;
    try { localStorage.setItem(BAR_KEY, memo); } catch (err) { /* без памяти браузера шапка появится чуть позже */ }
  }
  return `<div class="abar">${row(CTX.open, langOpen, SET.open, true)}</div>` + updLine();
}
// Первый ряд шапки заново — когда изменились герой, план или открыт ли список (вся страница при этом не рисуется)
function ctxBar() {
  const a = document.querySelector('#hbar .abar');
  if (!a) return;
  const n = a.nextElementSibling;           // строка объявления (updLine) рисуется вместе с первым рядом
  if (n && n.classList.contains('updl')) n.remove();
  a.outerHTML = Q(appBar());
}
// Время героя: меньше минуты — «42 сек», до десяти минут — «4:38», дальше — «12 мин», от часа — «3 ч 30 мин»
function ctxTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + ' ' + T('сек');
  if (sec < 600) return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const m = Math.floor(sec / 60);
  return m < 60 ? m + ' ' + T('мин') : Math.floor(m / 60) + ' ' + T('ч') + ' ' + String(m % 60).padStart(2, '0') + ' ' + T('мин');
}
// Когда план прислан — днём, без часов: «23.11.2026»
const ctxDay = at => String(at || '').replace(/^(\d{4})-(\d\d)-(\d\d).*$/, '$3.$2.$1');
const ctxArmed = key => !!CTX.arm && CTX.arm.key === key && Date.now() - CTX.arm.at < 6000;
// Список героев и планов.
// Герои: живые и текущий; погибшие и удалённые — за «все герои». «Играю им» — вернуться к прежнему герою: действует с его
// входа в игру (с экрана выбора персонажа), со второго нажатия. «Нет героя» — погиб или удалён, а лог не сказал (тоже со
// второго нажатия); «вернуть» снимает это слово. У погибшего вместо кнопок — даты жизни.
// Планы: свои и присланные. Строка плана целиком — выбор: герой идёт по этому плану, «Игра» и «Редактор» — о нём;
// выбранный план — с ✓. Герой в игре — сперва вопрос под строкой (шаг, цели и фильтр шага сменятся прямо в игре); новому
// герою, которого спрашивают о плане, выбор — сразу ответ. «Убрать» — у плана, по которому не идёт ни один живой герой
// (со второго нажатия; выбранный не убрать). Внизу — «Новый план» и «Добавить план из файла».
function ctxPanel() {
  const d = CTX.data;
  if (!d || !d.plans) return `<p class="ctxw">${T('Загрузка…')}</p>`;
  const p = d.plans, lib = !!p.library;
  const day = ts => { const t = new Date(ts * 1000); return String(t.getDate()).padStart(2, '0') + '.' + String(t.getMonth() + 1).padStart(2, '0'); };
  // --- герои
  const all = (d.heroes || []).slice().reverse();
  const alive = all.filter(r => r.current || (r.fate || 'alive') === 'alive');
  const runs = CTX.all ? all : alive;
  const toggle = all.length > alive.length || CTX.all
    ? `<button class="mini" data-cxall>${CTX.all ? T('только живые ·') + ' ' + alive.length : T('все герои ·') + ' ' + all.length}</button>` : '';
  const hero = r => {
    const born = day(r.started), end = r.died ? day(r.died) : born;
    const act = r.current ? `<span class="runnow">${T('сейчас')}</span>`
      : r.fate === 'dead' ? `<span class="runl" title="${ctxEsc(T('погиб'))}">${end !== born ? born + ' – ' + end : born}</span>`
        : r.fate === 'gone' ? (r.byHand ? `<span class="runl">${T('нет героя')}</span>` +
            `<button class="mini" data-cxgone="${ctxEsc(r.id)}:off" title="${ctxEsc(T('Герой есть: снова предлагать его'))}">${T('вернуть')}</button>`
          : `<span class="runl">${T('удалён')}</span>`)
          : `<button class="mini${ctxArmed('run:' + r.id) ? ' arm' : ''}" data-cxrun="${ctxEsc(r.id)}" title="${ctxEsc(T('«Играю им» — после входа этим героем в игру'))}">` +
            `${ctxArmed('run:' + r.id) ? T('Точно?') : T('Играю им')}</button>` +
            `<button class="mini rm${ctxArmed('gone:' + r.id) ? ' arm' : ''}" data-cxgone="${ctxEsc(r.id)}:on" title="${ctxEsc(T('Героя больше нет — погиб или удалён: не предлагать его'))}">` +
            `${ctxArmed('gone:' + r.id) ? T('Точно?') : T('Нет героя')}</button>`;
    const plan = lib ? `<span class="runp">${ctxEsc(r.plan ? ctxTitle(r.plan) : T('план убран'))}</span>` : '';
    const gone = r.fate === 'dead' || r.fate === 'gone';
    return `<div class="runrow${lib ? ' lib' : ''}${r.current ? ' cur' : ''}${gone ? ' gone' : ''}">` +
      `<span class="runn">${ctxEsc(r.name || '—')}</span><span class="runc">${ctxEsc(r.cls || T('герой'))} ${r.level}</span>` +
      `<span class="runz">${ctxEsc(r.zone || '—')}</span>${plan}` +
      `<span class="runt">${r.spent != null ? ctxTime(r.spent) : ''}</span><span class="runa">${act}</span></div>`;
  };
  const heads = `<div class="runrow runhead${lib ? ' lib' : ''}"><span>${T('герой')}</span><span>${T('класс')}</span><span class="runz">${T('где')}</span>` +
    (lib ? `<span class="runp">${T('план')}</span>` : '') + `<span class="runt">${T('время')}</span><span></span></div>`;
  let h = `<div class="cxs"><div class="cxh"><h3>${T('Герои')}</h3>${toggle}</div>` +
    (runs.length ? heads + runs.map(hero).join('') : `<p class="ctxw">${T('Героев пока нет: лог не начинал забег')}</p>`) + '</div>';
  // --- планы
  const ask = !!p.ask;
  const plan = x => {
    const mine = x.id === p.current;
    // план из каталога — с именем его автора (из подписанного каталога); пришедший с программой — так и сказано
    const cat = x.catalog, born = x.received && x.received.by === 'program';
    const tag = cat ? T('автор: {0}', cat.author.name) : born ? T('с программой') : x.received ? T('присланный') : !x.from ? T('мой')
      : x.from.template ? T('из шаблона') : x.from.take === 'route' ? T('маршрут «{0}»', x.from.title || '') : T('копия «{0}»', x.from.title || '');
    const tip = cat ? T('Из каталога: версия {0} от {1}', cat.version, ctxDay(cat.published || cat.at))
      : born ? T('Пришёл вместе с программой {0}', ctxDay(x.received.at))
        : x.received ? T('Прислан файлом «{0}» {1}', x.received.file || '', ctxDay(x.received.at)) : '';
    // в каталоге версия новее (редактор): вместо автора — «есть новая версия»; нажатие ведёт к строке каталога, где
    // «Обновить» и что изменилось (автор — там же и в подсказке)
    const newer = CTX.page === 'edit' && x.newer && x.uid ? `<button class="mini upd" data-cxcat="show:${ctxEsc(x.uid)}" ` +
      `title="${ctxEsc((cat ? T('автор: {0}', cat.author.name) + ' · ' : '') + T('В каталоге — версия {0}: что изменилось и «Обновить» — в разделе «Каталог»', x.newer))}">` +
      `${T('есть новая версия')}</button>` : '';
    const yes = lib && mine && ask ? `<button class="mini go" data-cxpick="${ctxEsc(x.id)}">${T('Да, по нему')}</button>` : '';
    const rm = lib && !mine && !x.heroes ? `<button class="mini rm${ctxArmed('rm:' + x.id) ? ' arm' : ''}" data-cxrm="${ctxEsc(x.id)}" ` +
      `title="${ctxEsc(T('Убрать план из библиотеки (папка плана уйдёт в backup/removed). План, по которому идёт живой герой, не убрать'))}">` +
      `${ctxArmed('rm:' + x.id) ? T('Точно?') : T('Убрать')}</button>` : '';
    const pick = !lib ? '' : ` data-cxpick="${ctxEsc(x.id)}" role="button" tabindex="0" aria-pressed="${mine}" title="${ctxEsc(mine
      ? T('Выбранный план: по нему идёт герой, его играет «Игра» и правит «Редактор»')
      : T('Выбрать план: герой пойдёт по нему, «Игра» и «Редактор» — о нём'))}"`;
    const row = `<div class="planrow${mine ? ' cur' : ''}${lib ? ' pick' : ''}"${pick}>` +
      `<span class="pln">${mine ? '<span class="tdone">✓</span> ' : ''}${ctxEsc(x.title)}</span>` +
      `<span class="plc">${ctxEsc(x.clsName || '')}</span><span class="plt"${tip ? ` title="${ctxEsc(tip)}"` : ''}>${newer || ctxEsc(tag)}</span>` +
      `<span class="runa">${yes}${rm}</span></div>`;
    // герой в игре: выбор этого плана ждёт ответа — вопрос прямо под строкой
    return row + (CTX.q !== x.id ? '' : `<div class="cxq"><span>${T('{0} в игре: шаг, цели и фильтр шага станут по плану «{1}». Сменить?',
      ctxEsc(ctxHero() || T('герой')), ctxEsc(x.title))}</span><span class="runa"><button class="mini go" data-cxyes="${ctxEsc(x.id)}">${T('Сменить')}</button>` +
      `<button class="mini" data-cxno>${T('Отмена')}</button></span></div>`);
  };
  const list = (p.list || []).slice().sort((a, b) => a.title.localeCompare(b.title, I18N.locale));
  h += `<div class="cxs"><div class="cxh"><h3${ask ? ' class="need"' : ''}>${ask ? T('Новый герой — по какому плану?') : T('Планы')}</h3></div>` +
    list.map(plan).join('');
  if (CTX.same) {
    // присланный план уже есть (та же метка): заменить его этим файлом или добавить отдельным планом
    h += `<div class="cxq"><span>${T('План «{0}» у вас уже есть. Заменить его этим файлом?', ctxEsc(CTX.same.title))}</span>` +
      `<span class="runa"><button class="mini go" data-cxsame="replace">${T('Заменить')}</button>` +
      `<button class="mini" data-cxsame="separate">${T('Добавить отдельно')}</button><button class="mini" data-cxsame="cancel">${T('Отмена')}</button></span></div>`;
  }
  if (lib) {
    h += `<div class="cxadd"><button class="mini add" data-cxnew title="${ctxEsc(T('Свой план: из шаблона кампании или на основе любого плана'))}">${T('Новый план')}</button>` +
      `<button class="mini add" data-cxadd>${T('Добавить план из файла')}</button></div>`;
  }
  h += '</div>';
  if (lib && CTX.page === 'edit') h += catSection();
  if (CTX.msg) h += `<p class="cxmsg${CTX.msg.ok ? ' ok' : ''}">${ctxEsc(CTX.msg.text)}</p>`;
  return h;
}
// Место списка: прямо под первым рядом шапки, по ширине колонки — от левого края переключателя до правого края языка (не
// шире окна), высота — до низа окна. Подложка — ниже первого ряда: режим и язык остаются под рукой.
function ctxPlace() {
  const box = document.getElementById('ctx'), bg = document.getElementById('ctxbg'), row = document.querySelector('#hbar .abar');
  if (!box || !row) return;
  const r = row.getBoundingClientRect(), b = document.querySelector('#hbar .ctxb'), c = document.querySelector('#hbar .corner');
  const left = b ? Math.max(8, Math.round(b.getBoundingClientRect().left)) : 8;
  const right = Math.min(innerWidth - 8, c ? Math.round(c.getBoundingClientRect().right) : innerWidth - 8);
  box.style.top = Math.round(r.bottom + 4) + 'px';
  box.style.left = left + 'px';
  box.style.width = Math.max(0, right - left) + 'px';
  box.style.maxHeight = Math.max(120, Math.round(innerHeight - r.bottom - 12)) + 'px';
  if (bg) bg.style.top = Math.round(r.bottom) + 'px';
}
// Содержимое списка — заново, только когда оно изменилось; прокрутка списка остаётся на месте
let ctxMemo = '';
function ctxPaint() {
  const box = document.getElementById('ctx'), bg = document.getElementById('ctxbg');
  if (!box) return;
  box.hidden = bg.hidden = !CTX.open;
  if (!CTX.open) { ctxMemo = ''; return; }
  const html = Q(ctxPanel());
  if (html !== ctxMemo) {
    const top = box.scrollTop;
    box.innerHTML = html;
    box.scrollTop = top;
    ctxMemo = html;
  }
  ctxPlace();
}
function ctxShow(open) {
  if (CTX.open === open) return;
  CTX.open = open;
  if (!open) { CTX.arm = null; CTX.msg = null; CTX.same = null; CTX.all = false; CTX.q = null; CAT.q = null; CAT.flash = ''; }
  ctxBar();
  ctxPaint();
  if (open) { const box = document.getElementById('ctx'); box.scrollTop = 0; box.focus({preventScroll: true}); catLoad(true); }
}
// Второе нажатие в течение 6 с — действие; первое — «Точно?»
function ctxArm(key) {
  if (ctxArmed(key)) { CTX.arm = null; return true; }
  CTX.arm = {key, at: Date.now()};
  CTX.msg = null;
  setTimeout(() => { if (CTX.arm && CTX.arm.key === key) { CTX.arm = null; ctxPaint(); } }, 6000);
  ctxPaint();
  return false;
}
// Запрос программе; ответ — {ok, …}. Ошибка связи — {ok: false} с причиной.
function ctxPost(url, body) {
  CTX.busy = true;
  return fetch(langUrl(url), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json().catch(() => ({ok: r.ok})))
    .catch(() => ({ok: false, problems: [T('нет связи с программой')]}))
    .finally(() => { CTX.busy = false; });
}
function ctxDone(j, text, close) {
  CTX.msg = j.ok ? (text ? {ok: true, text} : null) : {ok: false, text: (j.problems || []).join('; ') || T('программа отказала')};
  if (j.ok && close) ctxShow(false);
  else ctxPaint();
  if (j.ok) CTX.after();
}
// Выбрать план: герой идёт по нему, «Игра» и «Редактор» — о нём. Редактор сперва спрашивает о несохранённых правках
// (CTX.before; список на это время закрыт), потом открывает выбранный план (CTX.picked). Не вышло — список с причиной.
function ctxPick(id) {
  CTX.q = null;
  CTX.before(() => ctxPost('/api/plans', {use: id}).then(j => {
    if (!j.ok) { if (!CTX.open) ctxShow(true); ctxDone(j); return; }
    CTX.picked();
  }));
}
// Присланный файл плана: страница читает его сама и отдаёт программе; та проверяет, что это план, и кладёт его в
// библиотеку. План с той же меткой уже есть — вопрос: заменить его этим файлом или добавить отдельно.
let ctxFile = null;
function ctxImport(extra) {
  if (!ctxFile) return;
  ctxPost('/api/plans', Object.assign({import: ctxFile.data, file: ctxFile.name}, extra || {})).then(j => {
    if (j.same) { CTX.same = j.same; CTX.msg = null; ctxPaint(); return; }
    CTX.same = null;
    ctxFile = null;
    ctxDone(j, j.ok ? T('Добавлен план «{0}»', j.title || '') : '');
  });
}
document.addEventListener('change', e => {
  if (e.target.id !== 'ctxfile' || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0];
  e.target.value = '';
  f.text().then(t => {
    let data = null;
    try { data = JSON.parse(t); } catch (err) { data = null; }
    if (!data || typeof data !== 'object') { CTX.msg = {ok: false, text: T('Это не файл плана: в нём не JSON')}; ctxPaint(); return; }
    ctxFile = {data, name: f.name};
    ctxImport();
  }, () => { CTX.msg = {ok: false, text: T('Файл не прочитан')}; ctxPaint(); });
});
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest) return;
  if (t.closest('[data-ctx="toggle"]')) { ctxShow(!CTX.open); return; }
  if (t.closest('[data-ctx="open"]')) { ctxShow(true); return; }
  if (!CTX.open) return;
  if (t.id === 'ctxbg') { ctxShow(false); return; }
  if (!t.closest('#ctx') || CTX.busy) return;
  const el = t.closest('[data-cxall], [data-cxrun], [data-cxgone], [data-cxrm], [data-cxyes], [data-cxno], [data-cxpick], [data-cxadd], ' +
    '[data-cxsame], [data-cxnew], [data-cxcat]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.cxcat !== undefined) { catAct(ds.cxcat); return; }
  if (ds.cxall !== undefined) { CTX.all = !CTX.all; ctxPaint(); return; }
  if (ds.cxrun !== undefined) {
    if (!ctxArm('run:' + ds.cxrun)) return;
    ctxPost('/api/mark', {run: ds.cxrun}).then(j => ctxDone(j.ok ? j : {ok: false, problems: [j.problems ? j.problems.join('; ')
      : T('Не переключено: после последнего входа в игру создан новый герой — эта сессия его')]}, '', true));
    return;
  }
  if (ds.cxgone !== undefined) {
    const k = ds.cxgone.lastIndexOf(':'), id = ds.cxgone.slice(0, k), on = ds.cxgone.slice(k + 1) === 'on';
    if (on && !ctxArm('gone:' + id)) return;
    ctxPost('/api/mark', {gone: {run: id, on}}).then(j => ctxDone(j));
    return;
  }
  if (ds.cxrm !== undefined) {
    if (!ctxArm('rm:' + ds.cxrm)) return;
    const title = ctxTitle(ds.cxrm);
    ctxPost('/api/plans', {remove: ds.cxrm}).then(j => ctxDone(j, T('План «{0}» убран', title)));
    return;
  }
  if (ds.cxno !== undefined) { CTX.q = null; ctxPaint(); return; }
  if (ds.cxyes !== undefined) { ctxPick(ds.cxyes); return; }
  if (ds.cxpick !== undefined) {
    const id = ds.cxpick, p = CTX.data.plans;
    if (id === p.current && !p.ask) { ctxShow(false); return; }        // он и так выбран
    // новому герою выбор — ответ на вопрос; герой в игре — сперва вопрос под строкой; иначе — сразу
    if (!p.ask && p.inGame) { CTX.q = id; CTX.arm = null; CTX.msg = null; ctxPaint(); return; }
    ctxPick(id);
    return;
  }
  if (ds.cxnew !== undefined) { ctxNewOpen(); return; }
  if (ds.cxadd !== undefined) {
    let inp = document.getElementById('ctxfile');
    if (!inp) {
      inp = document.createElement('input');
      Object.assign(inp, {type: 'file', id: 'ctxfile', accept: '.json,application/json', hidden: true});
      document.body.appendChild(inp);
    }
    inp.click();
    return;
  }
  if (ds.cxsame !== undefined) {
    if (ds.cxsame === 'cancel') { CTX.same = null; ctxFile = null; ctxPaint(); return; }
    ctxImport(ds.cxsame === 'replace' ? {replace: CTX.same.id} : {separate: true});
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && CTX.open && !document.querySelector('.leave')) ctxShow(false);
  // строка плана — кнопка: Enter и пробел выбирают план, как нажатие
  else if ((e.key === 'Enter' || e.key === ' ') && CTX.open && e.target.matches && e.target.matches('#ctx .planrow[data-cxpick]')) {
    e.preventDefault();
    e.target.click();
  }
});
// --- Каталог одобренных планов (только в «Редакторе») -------------------------------------------------------------
// Планы, которые одобрил автор программы (программа: plancat.py). Сама программа спрашивает каталог, только пока
// включено «Проверять обновления»; выключено — только по кнопке «Спросить каталог». Строка: название, класс и восхождение (названия из
// данных игры на языке страницы), автор плана (ссылкой — только http(s)), под ней — для какой игры (другая версия игры —
// жёлтым), версия плана и день; у плана, который можно обновить, — что изменилось, у остальных — о чём план. Справа —
// «Поставить» (плана нет), «Обновить» (в каталоге версия новее), или состояние: «поставлен», «ваш план» (свой план с
// той же меткой — его каталог не меняет). Поставленный план — только для просмотра, как любой полученный. Каталог
// программа спрашивает, когда список открывают в редакторе (не чаще раза в минуту), и вместе с проверкой обновлений;
// файл плана качается только по нажатию. Слова каталога — простым текстом (ctxEsc), никогда не разметкой.
const CAT = {data: null, busy: false, fresh: false, load: '', q: null, flash: ''};
function catLoad(refresh) {
  if (CTX.page !== 'edit') return;
  CAT.fresh = false;
  fetch(langUrl('/api/plancat')).then(r => (r.ok ? r.json() : null)).catch(() => null)
    .then(d => { if (d && d.list && !CAT.fresh) { CAT.data = d; ctxPaint(); } });
  if (refresh) catPost({refresh: true});
}
// refresh — открыли список (программа спросит каталог, только если ей можно спрашивать сайт самой); ask — «Спросить
// каталог»: спрашивает сразу
function catPost(body) {
  CAT.busy = true;
  ctxPaint();
  fetch(langUrl('/api/plancat'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json()).catch(() => null).then(d => {
      CAT.busy = false;
      if (d && d.list) { CAT.data = d; CAT.fresh = true; }
      ctxPaint();
      CTX.after();            // у планов библиотеки «есть новая версия» — по только что полученному каталогу
    });
}
const catTime = t => (t ? new Date(t * 1000).toLocaleTimeString(I18N.locale || undefined, {hour: '2-digit', minute: '2-digit'}) : '');
function catSection() {
  const d = CAT.data, list = (d && d.list) || [], last = d && d.last;
  let st = '', bad = false;
  if (d && !d.can) { st = T('в этой сборке нет ключа подписи — проверять нечем'); bad = true; }
  else if (CAT.busy && !(d && d.got)) st = T('запрос каталога…');
  else if (d && !d.auto && !d.got) st = T('программа не спрашивает его: выключено «Проверять обновления»');
  else if (last && last.code !== 'ok' && last.code !== 'none') { st = last.text + (d.got ? ' · ' + T('показан полученный в {0}', catTime(d.got)) : ''); bad = true; }
  else if (d && d.got) st = T('получен в {0}', catTime(d.got));
  const row = r => {
    const who = r.author || {}, link = who.url ? webLink(who.url) : '';
    const author = link ? `<a href="${ctxEsc(link)}" target="_blank" rel="noopener noreferrer" data-cxauthor="${ctxEsc(r.uid)}" ` +
      `title="${ctxEsc(T('Страница автора плана: {0}', link))}">${ctxEsc(who.name)}</a>` : ctxEsc(who.name);
    const hero = [r.cls, r.asc].filter(Boolean).join(' · ');
    const act = CAT.load === r.uid || r.job ? `<span class="runl">${T('загрузка…')}</span>`
      : r.state === 'new' ? `<button class="mini add" data-cxcat="get:${ctxEsc(r.uid)}" title="${ctxEsc(T('Поставить план в библиотеку: он будет только для просмотра, его новые версии придут из каталога'))}">${T('Поставить')}</button>`
        : r.state === 'update' ? `<button class="mini go" data-cxcat="get:${ctxEsc(r.uid)}" title="${ctxEsc(T('Обновить план до версии из каталога: герой продолжит с того же шага, отметки останутся'))}">${T('Обновить')}</button>`
          : r.state === 'own' ? `<span class="runl" title="${ctxEsc(T('В библиотеке ваш план с этой меткой: его правите вы, каталог его не меняет'))}">${T('ваш план')}</span>`
            : `<span class="runl" title="${ctxEsc(r.state === 'older' ? T('У вас версия {0} — в каталоге старее: не ставится', r.have) : T('Та же версия, что в каталоге'))}">${T('поставлен')}</span>`;
    const game = !r.game ? '' : r.other ? `<span class="catg" title="${ctxEsc(T('Программа сделана для игры {0}: план может не сойтись с игрой', (d && d.game) || ''))}">${ctxEsc(T('для игры {0}', r.game))}</span>`
      : `<span>${ctxEsc(T('для игры {0}', r.game))}</span>`;
    const ver = `<span${r.changed && r.state !== 'update' ? ` title="${ctxEsc(T('Что изменилось: {0}', r.changed))}"` : ''}>` +
      `${ctxEsc([T('версия {0}', r.version), ctxDay(r.published)].filter(Boolean).join(' · '))}</span>`;
    const have = r.state === 'update' && r.have ? `<span>${ctxEsc(T('у вас версия {0}', r.have))}</span>` : '';
    const more = r.state === 'update' && r.changed ? `<div class="catc">${ctxEsc(T('Что изменилось: {0}', r.changed))}</div>`
      : r.summary ? `<div>${ctxEsc(r.summary)}</div>` : '';
    // обновить план, по которому идёт герой, пока он в игре: сперва вопрос — шаг и цели сменятся прямо в игре
    const q = CAT.q !== r.uid ? '' : `<div class="cxq"><span>${ctxEsc(T('{0} в игре: шаг, цели и фильтр шага станут по новой версии плана «{1}». Обновить?',
      ctxHero() || T('герой'), r.title))}</span><span class="runa"><button class="mini go" data-cxcat="yes:${ctxEsc(r.uid)}">${T('Обновить')}</button>` +
      `<button class="mini" data-cxcat="no">${T('Отмена')}</button></span></div>`;
    return `<div class="catrow${CAT.flash === r.uid ? ' flash' : ''}" data-catrow="${ctxEsc(r.uid)}">` +
      `<span class="pln" title="${ctxEsc(r.title)}">${ctxEsc(r.title)}</span><span class="plc" title="${ctxEsc(hero)}">${ctxEsc(hero)}</span>` +
      `<span class="cata">${author}</span><span class="runa">${act}</span>` +
      `<div class="catd"><div>${[game, ver, have].filter(Boolean).join(' · ')}</div>${more}</div></div>` + q;
  };
  const empty = list.length ? '' : CAT.busy || !d ? '' : d.can && last && (last.code === 'ok' || last.code === 'none') ? T('в каталоге пока нет планов') : '';
  // «Проверять обновления» выключено: каталог программа сама не спрашивает — спросить его можно этой кнопкой
  const ask = d && d.can && !d.auto ? `<button class="mini" data-cxcat="ask"${CAT.busy ? ' disabled' : ''} ` +
    `title="${ctxEsc(T('Спросить каталог у poe2.labutin.gg сейчас: в запросе — только номер версии программы'))}">${T('Спросить каталог')}</button>` : '';
  return `<div class="cxs"><div class="cxh"><h3 title="${ctxEsc(T('Каталог одобренных планов: их одобрил автор программы. Список — с poe2.labutin.gg'))}">` +
    `${T('Каталог')}</h3><span class="catr"><span class="catst${bad ? ' bad' : ''}">${ctxEsc(st)}</span>${ask}</span></div>` +
    list.map(row).join('') + (empty ? `<p class="ctxw">${ctxEsc(empty)}</p>` : '') + '</div>';
}
// «Поставить» / «Обновить»: программа качает файл, сверяет его с подписанным каталогом и кладёт план в библиотеку.
// Обновлён план, который сейчас открыт в редакторе, — редактор открывает его новую версию.
function catGet(uid) {
  CAT.q = null;
  CAT.load = uid;
  CTX.msg = null;
  ctxPaint();
  ctxPost('/api/plancat', {get: uid}).then(j => {
    CAT.load = '';
    if (j.ok && !j.fresh && CTX.page === 'edit' && CTX.edit === j.plan) { CTX.picked(); return; }
    ctxDone(j, j.ok ? (j.fresh ? T('Поставлен план «{0}»', j.title || '') : T('План «{0}» обновлён до версии {1}', j.title || '', j.version)) : '');
    catLoad(false);
  });
}
// строка каталога — на виду и подсвечена (нажали «есть новая версия» у плана)
function catShow(uid) {
  CAT.flash = uid;
  ctxPaint();
  const el = Array.from(document.querySelectorAll('#ctx [data-catrow]')).find(x => x.dataset.catrow === uid);
  if (el) el.scrollIntoView({block: 'nearest'});
  setTimeout(() => { if (CAT.flash === uid) { CAT.flash = ''; ctxPaint(); } }, 2400);
}
function catAct(v) {
  const k = v.indexOf(':'), what = k < 0 ? v : v.slice(0, k), uid = k < 0 ? '' : v.slice(k + 1);
  if (what === 'no') { CAT.q = null; ctxPaint(); return; }
  if (what === 'ask') { if (!CAT.busy) catPost({ask: true}); return; }
  if (what === 'show') { catShow(uid); return; }
  if (what === 'yes') { catGet(uid); return; }
  if (what !== 'get') return;
  const r = ((CAT.data && CAT.data.list) || []).find(x => x.uid === uid), p = CTX.data && CTX.data.plans;
  if (r && r.state === 'update' && p && p.inGame && r.plan === p.current) { CAT.q = uid; CTX.msg = null; ctxPaint(); return; }
  catGet(uid);
}
// страница автора: окно программы и браузер открывают её сами (новая вкладка); встроенный браузер приложения Claude
// открыл бы её вместо этой страницы — там её открывает программа (POST /api/open, адрес — из каталога, не отсюда)
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('#ctx a[data-cxauthor]');
  if (!a || !/\bClaude\/\d/.test(navigator.userAgent)) return;
  e.preventDefault();
  fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({page: 'author', uid: a.dataset.cxauthor})}).catch(() => {});
});
// колесо и касание на подложке страницу не крутят: под списком она стоит
for (const ev of ['wheel', 'touchmove']) {
  document.addEventListener(ev, e => { if (CTX.open && e.target && e.target.id === 'ctxbg') e.preventDefault(); }, {passive: false});
}
// «Новый план» — единственный способ завести свой план: название, основа (шаблон кампании или любой план библиотеки) и что
// взять — план целиком или только маршрут (билд тогда пустой; у шаблона — только маршрут). Готовый план сразу выбран (по
// нему идёт герой) и открывается в редакторе на вкладке «Билд». «Сделать копию» и «Сделать свой план на его основе» в
// редакторе открывают это же окно.
const NW = {open: false, base: '', take: 'all', title: '', typed: false, busy: false, msg: null};
function nwTitle() {
  if (NW.typed) return NW.title;
  return NW.base === 'template' || NW.take === 'route' ? T('Новый план') : T('{0} · копия', ctxTitle(NW.base));
}
function ctxNewOpen(base, take) {
  const p = CTX.data && CTX.data.plans;
  if (!p || !p.library) return;
  ctxShow(false);
  const ids = (p.list || []).map(x => x.id);
  NW.base = base === 'template' ? (p.template ? 'template' : ids[0] || '') : ids.includes(base) ? base : p.template ? 'template' : ids[0] || '';
  NW.take = NW.base === 'template' ? 'route' : take === 'route' ? 'route' : 'all';
  Object.assign(NW, {typed: false, title: '', msg: null, busy: false, open: true});
  nwPaint(true);
}
function nwPaint(first) {
  let box = document.getElementById('ctxnew');
  if (!NW.open) { if (box) box.remove(); return; }
  if (!box) { box = document.createElement('div'); box.id = 'ctxnew'; document.body.appendChild(box); }
  const p = CTX.data.plans, list = (p.list || []).slice().sort((a, b) => a.title.localeCompare(b.title, I18N.locale));
  const tpl = NW.base === 'template';
  const opt = (v, name) => `<option value="${ctxEsc(v)}"${v === NW.base ? ' selected' : ''}>${ctxEsc(name)}</option>`;
  const take = tpl ? `<span class="nwfix">${T('маршрут кампании — только то, что задаёт игра; билд пустой')}</span>`
    : '<span class="nwtake">' + [['all', T('Весь план')], ['route', T('Только маршрут — билд пустой')]].map(([v, n]) =>
      `<button class="mini${NW.take === v ? ' on' : ''}" data-nw="take:${v}">${n}</button>`).join('') + '</span>';
  // новый план сразу станет выбранным: что это значит для героя — одной строкой (герой в игре — жёлтой)
  const who = ctxHero();
  const note = p.inGame ? `<p class="nwnote">${T('{0} в игре — шаг, цели и фильтр шага станут по новому плану', ctxEsc(who))}</p>`
    : `<p class="nwhint">${who ? T('{0} пойдёт по новому плану', ctxEsc(who)) : T('По новому плану пойдёт первый герой')}</p>`;
  box.innerHTML = Q('<div class="nwbox" role="dialog" aria-modal="true" aria-labelledby="nw-h">' +
    `<h3 id="nw-h">${T('Новый план')}</h3>` +
    `<label class="nwrow"><span class="lab">${T('Название')}</span><input data-nw="title" maxlength="80" value="${ctxEsc(nwTitle())}"></label>` +
    `<label class="nwrow"><span class="lab">${T('Основа')}</span><select data-nw="base">` +
    (p.template ? opt('template', T('Шаблон кампании')) : '') +
    list.map(x => opt(x.id, x.title + (x.received ? ' · ' + T('присланный') : ''))).join('') + '</select></label>' +
    `<div class="nwrow"><span class="lab">${T('Взять')}</span>${take}</div>` + note +
    (NW.msg ? `<p class="cxmsg">${ctxEsc(NW.msg)}</p>` : '') +
    `<div class="nwbtns"><button class="mini go" data-nw="create"${NW.busy ? ' disabled' : ''}>${T('Создать')}</button>` +
    `<button class="mini" data-nw="cancel">${T('Отмена')}</button></div></div>`);
  if (first) { const i = box.querySelector('[data-nw="title"]'); i.focus(); i.select(); }
}
function nwClose() { NW.open = false; nwPaint(); }
function nwCreate() {
  if (NW.busy) return;
  const title = nwTitle().trim(), base = NW.base;
  if (!title) { NW.msg = T('Назовите план'); nwPaint(); return; }
  NW.msg = null;
  // новый план сразу станет выбранным: редактор сперва спрашивает о несохранённых правках (окно на это время закрыто;
  // сохранённые правки попадут и в копию — она берёт план, как он записан)
  nwClose();
  CTX.before(() => {
    NW.busy = true;
    ctxPost('/api/plans', {create: {title, base, take: base === 'template' ? 'route' : NW.take}}).then(j => {
      NW.busy = false;
      if (!j.ok) { NW.msg = (j.problems || []).join('; ') || T('программа отказала'); NW.open = true; nwPaint(); return; }
      // новый план — сразу в редактор, на вкладку «Билд»: сначала название, класс и вознесение
      location.href = '/admin?from=' + encodeURIComponent(base) + '#build';
    });
  });
}
document.addEventListener('input', e => {
  if (NW.open && e.target.dataset && e.target.dataset.nw === 'title') { NW.title = e.target.value; NW.typed = true; }
});
document.addEventListener('change', e => {
  if (!NW.open || !e.target.dataset || e.target.dataset.nw !== 'base') return;
  NW.base = e.target.value;
  if (NW.base === 'template') NW.take = 'route';
  nwPaint();
});
document.addEventListener('click', e => {
  if (!NW.open || !e.target.closest) return;
  if (e.target.id === 'ctxnew') { nwClose(); return; }            // нажатие мимо окна — закрыть
  const b = e.target.closest('button[data-nw]');
  if (!b) return;
  const v = b.dataset.nw;
  if (v === 'cancel') nwClose();
  else if (v === 'create') nwCreate();
  else if (v.startsWith('take:')) { NW.take = v.slice(5); nwPaint(); }
});
document.addEventListener('keydown', e => {
  if (!NW.open) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); nwClose(); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.nw === 'title') { e.preventDefault(); nwCreate(); }
}, true);
window.addEventListener('resize', () => { if (CTX.open) ctxPlace(); });
// язык сменили на другой странице (редактор плана, страница забега) — эта идёт следом
window.addEventListener('storage', e => {

      msg = {ok: false, text: T('Плана «{0}» больше нет — открыт план героя', PLAN)};
      PLAN = '';
      return load();
    }
    D = d;
    if (d.planId !== undefined) {
      PLAN = d.planId;
      // в адресе плана нет: редактор всегда открывает выбранный (старые ссылки /admin?plan=… — тоже)
      history.replaceState(null, '', '/admin' + location.hash);
    }
    // список героев и планов в шапке: что правится и что есть
    CTX.edit = PLAN;
    CTX.data = {plans: d.plans, heroes: d.runs};
    if (d.stages) {
      S = {stages: d.stages.map(s => ({id: s.id, name: s.name, from: s.from || null, tree: s.tree || null, atlas: s.atlas || null,
        kind: s.kind || null, attrs: s.attrs ? s.attrs.slice() : null, stats: s.stats ? s.stats.slice() : null}))};
      if (d.goals) {
        // то, что относится к билду целиком: название, герой (класс и вознесение), свои статы
        S.title = d.buildTitle || '';
        S.hero = Object.assign({}, d.hero);
        S.statDefs = JSON.parse(JSON.stringify(d.statDefs || []));
      }
      if (d.goals && d.treePlan) {
        // деревья билда: версии дерева героя и атласа; атрибут узла «Характеристика» пишется его id (str / dex /
        // int), в старых записях — словом («инт»). Атрибута «по умолчанию» у дерева нет: узел без выбора — пустой
        // (старым узлам, которые опирались на «по умолчанию», программа уже записала его явно)
        const vers = list => list.map(v => ({id: v.id, name: v.name, nodes: v.nodes.map(n => tnode(n.id, attrId(n.attr), n.opt)),
          items: (v.items || []).map(x => ({id: x.id, slot: x.slot})),        // узлы с предметов (зачарование амулета)
          without: v.without || ''}));                                         // запасная версия: пока узлов на амулете нет
        S.tree = {versions: vers(d.treePlan.tree.versions)};
        S.atlas = {versions: vers(d.treePlan.atlas.versions)};
      }
      if (d.goals) S.goals = JSON.parse(JSON.stringify(d.goals));     // цели — как в файле, со всеми их полями
      if (d.goals && d.classes) S.slots = JSON.parse(JSON.stringify(d.slots));   // слоты — как в файле
      // Заметки у умения и у того, что при нём (камень поддержки, уровень камня), нет — у них есть подсказка. На
      // странице забега заметку показывало только наведение мыши, а записана она была у одной цели из 56. Страница
      // её не держит: при первом сохранении билда она уходит из файла.
      if (d.goals) for (const g of S.goals) if (tabOf(g) === 'gems') delete g.note;
      // Подсказки у целей больше нет: что о цели знает игра, страница забега пишет сама. Подсказка из файла,
      // записанного раньше, уходит из него при первом сохранении.
      if (d.goals) for (const g of S.goals) delete g.hint;
      if (d.goals && d.route) {
        S.route = {steps: JSON.parse(JSON.stringify(d.route.steps)), goals: JSON.parse(JSON.stringify(d.route.goals))};
        for (const g of S.route.goals) delete g.hint;
        // точку перехода называет её зона: своё название у точки было только повтором названия зоны — страница его
        // не держит, и при первом сохранении маршрута оно уходит из файла

        // задач (строк текста) у шага нет: всё, что на шаге делают, — его цели. Задачи из файла, записанного раньше,
        // уходят из него при первом сохранении маршрута
        for (const s of S.route.steps) delete s.notes;

      R = d.rare || null;
      TA = d.treeAttrs || null;
      checked = saved;
      fresh.clear();
      freshSteps.clear();
      freshSlots.clear();
      for (const k of Object.keys(badTime)) delete badTime[k];

}

// Списки названий из данных игры — подсказки к полям «название»: умения, поддержки, базы вещей по слотам.

function eff(i) {

// Выбор версии дерева для этапа; кнопка рядом открывает эту версию на вкладке «Дерево». Первый пункт — этап

// Из чего складывается стат: lines — свойства игры её же словами (у стата, который несёт сама вещь, первой

// Поле названия цели с выдачей вещей игры (kind: nb — предмет слота, ns — умение, nu — камень поддержки). Это
// то же поле названия: набранное сразу становится названием цели (своё название — «любой», «жёлтый щит» — так и

const nameField = (kind, g, hint) => '<div class="spwrap nw">' +
  `<input class="t spick" data-pick="${kind}:${esc(g.id)}" data-pk="sp:${kind}:${esc(g.id)}" data-id="${esc(g.id)}" data-f="title" ` +

// Выдача поля названия. Предмет: базы классов его периода по уровню зоны; с запросом — ещё и базы остальных классов
// игры (cls: выбранный класс добавится в период). Умение — камни умений, камень поддержки — камни поддержки. more —
// сколько не поместилось; taken — что в плане уже стоит (без выбора).
const NAME_ROWS = 40;
function nameItems() {
  const g = goal(PK.i);
  if (!g) return [];
  const words = PK.q.toLowerCase().split(/\s+/).filter(Boolean);
  // слова ищутся и в названии, как оно записано в плане («Русское (English)»), и в названии на языке страницы
  const hit = t => { const s = (I18N.lang === I18N.source ? t : t + ' ' + showName(t)).toLowerCase(); return words.every(w => s.includes(w)); };
  const drop = r => (r.level > 1 ? ' ' + dropWords(r.level) : '');
  let rows = [], extra = [];
  const taken = [];
  if (PK.kind === 'nb') {
    const sl = slotOf(g.slot), per = perOf(sl, g.use), mine = new Set((per && per.classes) || []);
    const used = new Set(S.goals.filter(x => x.slot === g.slot && !x.part && x !== g && (x.use || '') === (g.use || '')).map(x => x.title));
    for (const r of basesOf([...mine])) {
      if (!hit(r.name)) continue;
      const row = {name: r.name, sub: className(gearParts(r.gear)[0]) + drop(r)};
      if (used.has(r.name)) taken.push(Object.assign(row, {why: T('уже в этом периоде')})); else rows.push(row);
    }

    }

      : S.goals.filter(x => x.for === g.for && x !== g && !isLevel(x))).map(x => x.title));
    for (const r of (skill ? D.gems.skills : D.gems.supports)) {

// Выдача поля зоны. Без запроса: зона, где герой сейчас, и зоны того же акта, что у шага или его соседей, —

const ZONE_ROWS = 30;
function zoneItems() {
  const words = PK.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = a => { const t = [a.own, a.ru, a.here, a.name, a.code].filter(Boolean).join(' ').toLowerCase(); return words.every(w => t.includes(w)); };
  const real = a => (a.town || a.level > 0) && !/hideout/i.test(a.code);       // не меню, не убежище
  const used = new Map();       // зона -> шаг, который по ней узнаётся
  for (const s of S.route.steps) for (const c of [s.zone].concat(s.also || [])) if (c && !used.has(c)) used.set(c, s.name || s.id);
  const item = (a, now) => ({type: 'zone', code: a.code, name: a.own || a.name, now: !!now, step: used.get(a.code) || null,
    sub: [a.own ? a.name : '', actOf(a.code), a.town ? T('город') : a.level ? (T('ур.') + ' ') + a.level : '', a.code].filter(Boolean).join(' · ')});
  const order = (a, b) => (b.town - a.town) || (a.level - b.level) || (a.code < b.code ? -1 : 1);

  }
  const found = (D.areas || []).filter(hit).sort((a, b) => (real(b) - real(a)) || (a.act - b.act) || order(a, b));
  out.more = Math.max(0, found.length - ZONE_ROWS);

// Зона шага выбрана: шаг узнаётся по ней (событие и уровень зоны снимаются); название шага идёт за зоной,

// ---- список статов этапа: как им пользуется сравнение вещей ----

// Стат, который в список добавил выбор в соседней строке этапа: как он помечен и что сказано в подсказке.

  const auto = (ids, by) => { for (const id of ids) if (!have.has(id)) { have.add(id); rows.push({id, k: -1, by}); } };
  auto(k ? k.stats.map(x => x.id) : [], 'kind');

const grpCap = g => `<div class="sgrp" title="${esc(GRP[g][2])}"><b>${GRP[g][0]}</b> — ${GRP[g][1]}</div>`;
// Свой список этапа — строками. У редкого стата: место, слоты, стрелки; у остальных порядка нет. Стат, добавленный
// выбором защиты или атрибутов, вместо «Убрать» помечен строкой, где он выбран.
function statRows(st, i) {
  const o = statOrder(i);
  const row = (r, n, list) => {
    const key = st.id + ':' + r.id, isOpen = openStats.has(key), info = isOpen ? statInfo(r.id) : null, own = r.k >= 0;
    return `<div class="stt${isOpen ? ' open' : ''}${own ? '' : ' auto'}"><div class="srow"><span class="n">${list ? n + 1 : ''}</span>` +
      `<button class="sname" data-stopen="${esc(key)}" title="${esc(isOpen ? T('Свернуть') : (T('Из чего складывается:') + ' ') + statWhy(r.id))}">` +
      `<span class="car">${isOpen ? '▾' : '▸'}</span>${esc(statName(r.id))}</button>` +
      (r.gone ? `<span class="why" title="${esc(whyVoid(o.tree, r.gone))}">${T('не в счёт: узел «{0}»', esc(r.gone.node))}</span>` : '') +
      (list && r.slots.length ? `<span class="swhere" title="${esc((T('Стат бывает на слотах:') + ' ') + r.slots.join(', '))}">${esc(r.slots.join(' · '))}</span>` : '') +
      '<span class="fill"></span>' +
      (list ? `<button data-up="${i}:${esc(r.id)}"${n ? '' : ' disabled'} title="${T('Важнее')}">↑</button>` +
        `<button data-down="${i}:${esc(r.id)}"${n < list.length - 1 ? '' : ' disabled'} title="${T('Менее важно')}">↓</button>` : '') +
      '<span class="send">' + (own ? `<button data-drop="${i}:${r.k}">${T('Убрать')}</button>`
        : `<span class="sby" title="${esc(BYTIP[r.by])}">${BY[r.by]}</span>`) + '</span></div>' +
      (isOpen ? '<div class="sparts">' + info.lines.map(t => `<div>${esc(t)}</div>`).join('') +
        (info.note ? `<div class="snote">${esc(info.note)}</div>` : '') +
        (info.own ? ('<div class="snote">' + T('свой стат билда') + '<button data-goto="build" title="' + T('Название и состав своих статов — на вкладке «Билд»') + '">' + T('изменить') + '</button></div>') : '') +
        '</div>' : '') + '</div>';
  };
  return (o.rare.length ? (o.flat ? '' : grpCap('rare')) + o.rare.map((r, n) => row(r, n, o.rare)).join('') : '') +
    (o.sum.length ? grpCap('sum') + o.sum.map(r => row(r, 0, null)).join('') : '') +
    o.off.map(r => row(r, 0, null)).join('');
}
// Тот же список словами — у этапа, который статы не менял: строка на группу.
function statLines(i) {
  const o = statOrder(i), from0 = setBy(i, 'stats');
  const nm = r => esc(statName(r.id)) + (r.k < 0 ? ` (${BY[r.by]})` : '');
  const line = (g, rows) => (!rows.length ? '' : g
    ? `<div class="wrow"><span class="wl" title="${esc(GRP[g][2])}">${GRP[g][0]}</span><span class="wn">${rows.map(nm).join(', ')}</span></div>`
    : `<div class="wn">${rows.map(nm).join(', ')}</div>`);
  const none = !o.rare.length && !o.sum.length && !o.off.length;
  return (from0 ? `<div>${T('как на этапе «{0}»', esc(from0))}</div>` : '') +
    (none ? ('<div>' + T('статов нет') + '</div>') : line(o.flat ? '' : 'rare', o.rare) + line('sum', o.sum) +
      o.off.map(r => `<div class="no" title="${esc(whyVoid(o.tree, r.gone))}">${esc(statName(r.id))} ${T('не в счёт: узел «{0}»', esc(r.gone.node))}</div>`).join(''));
}
// Программа ответила, какие статы редкие: списки этапов — на страницу без перерисовки (поле «Добавить стат», в котором
// печатают, стоит вне списка и остаётся на месте).
function paintOrder() {
  for (const el of document.querySelectorAll('[data-strows]')) {
    const i = +el.dataset.strows, st = S.stages[i];
    if (st) el.innerHTML = st.stats ? statRows(st, i) : statLines(i);
  }
}
// Редкий стат — на место выше или ниже (dir: −1 или 1) среди редких. В списке этапа два стата меняются местами;
// стат, добавленный выбором защиты или атрибутов, при этом встаёт в список — дальше его место задаёт автор.
function moveStat(i, sid, dir) {
  const st = S.stages[i], rows = statOrder(i).rare.map(r => r.id), at = rows.indexOf(sid), to = at + dir;
  if (!st || !st.stats || at < 0 || to < 0 || to >= rows.length) return;
  const up = rows[Math.min(at, to)], low = rows[Math.max(at, to)];      // low встаёт над up
  const a = st.stats.indexOf(up), b = st.stats.indexOf(low);
  if (a >= 0 && b >= 0) { st.stats[a] = low; st.stats[b] = up; }
  else if (a >= 0) st.stats.splice(a, 0, low);
  else if (b < 0) st.stats.push(low);
}

// ---- выбор стата: одно поле с поиском ----
// Выдача поля. У этапа: статы, которых в его списке ещё нет (готовые и свои), — ищутся и по названию, и по
// свойствам, из которых складываются; когда что-то набрано — ещё и свойства игры: выбранное станет своим
// статом билда. У своего стата и у «нового своего стата» — только свойства игры.
const PROP_ROWS = 40, DEAD_ROWS = 8;
function pickerItems() {
  if (!PK) return [];
  if (ZK.has(PK.kind)) return zoneItems();
  if (PK.kind === 'lm') return lmItems();
  if (PK.kind === 'say') return sayItems();
  if (PK.kind === 'rw') return rwItems();
  if (PK.kind === 'an') return anItems();
  if (NK.has(PK.kind)) return nameItems();
  const words = PK.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = text => { const t = text.toLowerCase(); return words.every(w => t.includes(w)); };
  const out = [];
  // что список этапа уже считает: названное этапом и добавленное выбором защиты и атрибутов — второй раз не предлагается
  let listed = new Set();
  if (PK.kind === 'stage') {
    const o = S.stages[PK.i] ? statOrder(PK.i) : {rare: [], sum: [], off: []};
    listed = new Set(o.rare.concat(o.sum, o.off).map(r => r.id));
    for (const c of statList()) {
      if (listed.has(c.id)) continue;
      const info = statInfo(c.id);
      if (hit(c.name + ' ' + info.lines.join(' '))) out.push({type: 'stat', id: c.id, name: c.name, desc: info.lines.join(' · '), note: info.note, own: !!c.own});
    }
    if (!words.length) return out;
  }
  // какие свойства уже входят в какой-нибудь стат: рядом со свойством это сказано — чтобы не завести дубль;
  // свойство, которое входит в стат из списка этапа, не выбрать вовсе: оно посчиталось бы дважды
  const inStat = new Map(), inList = new Map();
  for (const c of statList()) {
    for (const t of statInfo(c.id).lines) {
      if (!inStat.has(t)) inStat.set(t, c.name);
      if (listed.has(c.id) && !inList.has(t)) inList.set(t, c.name);
    }
  }
  const def = PK.kind === 'def' ? S.statDefs[PK.i] : null, two = key => /\s/.test(key);
  let n = 0;
  out.more = 0;
  out.counted = [];      // свойства, которые список этапа уже считает: [{name, stat}] — показаны без выбора
  for (const r of D.props || []) {
    if (def && (def.lines.includes(r.key) || (def.lines.length && two(def.lines[0]) !== two(r.key)))) continue;
    if (!hit(r.text)) continue;
    const text = r.text.replace((' ' + T('· на самом предмете')), '');
    if (inList.has(text)) { out.counted.push({name: r.text, stat: inList.get(text)}); continue; }
    if (n++ < PROP_ROWS) out.push({type: 'prop', key: r.key, name: r.text, inStat: inStat.get(text) || null});
    else out.more++;
  }
  return out;
}
// Выдача готова: показать её; выделенная строка — в видимой части выдачи (саму страницу не двигаем).
function showPanel(panel) {
  panel.hidden = false;
  const hi = panel.querySelector('.prow.hi');
  if (!hi) return;
  if (hi.offsetTop < panel.scrollTop) panel.scrollTop = hi.offsetTop;
  else if (hi.offsetTop + hi.offsetHeight > panel.scrollTop + panel.clientHeight) panel.scrollTop = hi.offsetTop + hi.offsetHeight - panel.clientHeight;
}
// Выдача рисуется прямо под полем, без перерисовки страницы: поле, в котором печатают, остаётся на месте.
// Реплики игры для поля «Реплики в логе»: код строки -> «Имя: текст» на языке страницы. Это все NPC игры —
// большой список: читается один раз, когда поле впервые показано.
function loadSay() {
  if (SAY || SAYWAIT) return;
  SAYWAIT = true;
  fetch(langUrl('/api/speech')).then(r => r.json()).then(d => { SAY = d || {}; render(); })
    .catch(() => { SAYWAIT = false; });
}
const heardIds = g => (Array.isArray(g && g.heard) ? g.heard : g && g.heard ? [g.heard] : []);
// Тексты свойств игры на языке страницы (их же игра пишет в строку награды) — один раз, когда поле показано.
function loadStats() {
  if (STATS || STATWAIT) return;
  STATWAIT = true;
  fetch(langUrl('/api/stats')).then(r => r.json()).then(d => { STATS = d || {}; render(); })
    .catch(() => { STATWAIT = false; });
}
const rewardKeys = g => (Array.isArray(g && g.reward) ? g.reward : g && g.reward ? [g.reward] : []);
// Выдача поля награды: свойства игры, где нашлись все набранные слова (в тексте или коде); выбранные не предлагаются.
function rwItems() {
  const out = [], have = new Set(rewardKeys(routeGoal(PK.i))), words = PK.q.toLowerCase().split(/\s+/).filter(Boolean);
  let more = 0;
  if (STATS && words.length) {
    // короткий текст — первым: «+# к духу» раньше «+1 к духу за каждые # энергетического щита…»
    const hits = Object.entries(STATS).filter(([id, text]) => !have.has(id) &&
      words.every(w => (text + ' ' + id).toLowerCase().includes(w))).sort((x, y) => x[1].length - y[1].length);
    for (const [id, text] of hits.slice(0, SAY_ROWS)) out.push({id, name: text, full: text, sub: id});
    more = Math.max(0, hits.length - SAY_ROWS);
  }
  out.more = more;
  return out;
}
// Выдача поля: строки игры, где нашлись все набранные слова (в имени говорящего, тексте или коде строки);
// уже выбранные не предлагаются.
const SAY_ROWS = 40;
function sayItems() {
  const out = [], have = new Set(heardIds(routeGoal(PK.i))), words = PK.q.toLowerCase().split(/\s+/).filter(Boolean);
  let more = 0;
  if (SAY && words.length) {
    for (const [id, text] of Object.entries(SAY)) {
      if (have.has(id)) continue;
      const t = (text + ' ' + id).toLowerCase();
      if (!words.every(w => t.includes(w))) continue;
      // длинный монолог — первые слова, целиком он в подсказке строки
      if (out.length < SAY_ROWS) out.push({id, name: text.length > 160 ? text.slice(0, 157) + '…' : text, full: text, sub: id});
      else more++;
    }
  }
  out.more = more;
  return out;
}
function paintPicker() {

      (items.more ? `<div class="pnone">${T('и ещё {0} — уточните запрос', items.more)}</div>` : '') +

  }
  if (PK.kind === 'lm') {

  showPanel(panel);
}
// Строка выдачи выбрана. Этап: стат встаёт в конец его списка (свойство игры сначала становится своим статом).
// Свой стат: свойство складывается в него. «Новый свой стат»: заводится стат, курсор — в его название.
function pickCommit(n) {
  const it = PKITEMS[n], pk = PK;
  if (!it || !pk) return;
  if (NK.has(pk.kind)) {
    // цель названа вещью игры: база другого класса приводит свой класс в слот; дальше — всё, что следует из названия
    const g = goal(pk.i);
    PK = null;
    focusKey = '-';             // выбор сделан: курсор из поля уходит, выдача закрывается
    if (!g) return;
    if (it.cls) { const sl = slotOf(g.slot); addPerClass(sl, perOf(sl, g.use), it.cls); }
    g.title = it.name;
    titled(g);
    return;
  }
  if (ZK.has(pk.kind)) {
    const [sid, k] = String(pk.i).split('|'), st = rstep(sid);
    PK = null;
    focusKey = '-';             // выбор сделан: курсор из поля уходит, выдача закрывается
    if (!st) return;
    if (pk.kind === 'zone') setStepZone(st, it.code);
    else if (pk.kind === 'also') {
      // ещё одна зона того же шага; поле остаётся в работе — зоны добавляют подряд
      if (it.code !== st.zone && !(st.also || []).includes(it.code)) st.also = (st.also || []).concat([it.code]);
      PK = {kind: 'also', i: pk.i, q: '', hi: 0};
      focusKey = 'sp:also:' + pk.i;
    } else {
      // зона точки перехода: точку называет её зона, своего названия у точки нет
      const t = (st.touch || [])[+k];
      if (t) t.zone = it.code;
    }
    return;
  }
  if (pk.kind === 'an') {
    // узел встаёт в версию с амулета. На амулете один узел (новое зачарование заменяет прежнее): прежний уходит,
    // и сообщение это называет
    const cur = tePlan().versions.find(v => v.id === pk.i), slot = ((D.anoint || {}).slots || [])[0];
    PK = null;
    focusKey = '-';
    if (!cur || !slot) return;
    const was = (cur.items || []).find(x => x.slot === slot), byId = new Map(((D.anoint || {}).nodes || []).map(r => [r[0], r[1]]));
    if (it.cut) {
      // узел был в пути версии: он и путь только к нему из версии уходят (вернуть — нажать его на карте снова)
      const cut = new Set(it.cut);
      teSet(cur.nodes.filter(n => !cut.has(n.id)), '');
    }
    cur.items = (cur.items || []).filter(x => x.slot !== slot).concat([{id: it.id, slot}]);
    const freed = it.cut ? ` · ${T('освобождено')} ${it.cut.length} ${plural(it.cut.length, 'очко', 'очка', 'очков')}` : '';
    TE.msg = {ok: true, text: (was ? T('с амулета: «{0}» вместо «{1}»', it.name, byId.get(was.id) || was.id) : T('с амулета: «{0}»', it.name)) + freed};
    return;
  }
  if (pk.kind === 'rw') {
    // свойство игры встаёт в награду цели (одно — строкой, несколько — списком); поле остаётся в работе
    const g = routeGoal(pk.i), keys = rewardKeys(g);
    if (g && !keys.includes(it.id)) { keys.push(it.id); g.reward = keys.length === 1 ? keys[0] : keys.slice(); }
    PK = {kind: 'rw', i: pk.i, q: '', hi: 0};
    focusKey = 'sp:rw:' + pk.i;
    return;
  }
  if (pk.kind === 'say') {
    // строка игры встаёт в реплики цели (одна — строкой, несколько — списком); поле остаётся в работе
    const g = routeGoal(pk.i), ids = heardIds(g);
    if (g && !ids.includes(it.id)) { ids.push(it.id); g.heard = ids.length === 1 ? ids[0] : ids.slice(); }
    PK = {kind: 'say', i: pk.i, q: '', hi: 0};
    focusKey = 'sp:say:' + pk.i;
    return;
  }
  if (pk.kind === 'lm') {
    // запись справочника встаёт на шаг ссылкой; поле остаётся в работе — записи берут подряд. Механика и восхождение
    // бывают на многих шагах: у их ссылки свой id — по названию и шагу («abyss-badlands») — и ref, id записи
    const r = LM[it.id] || {};
    const link = isMulti(r) ? {id: freeId(slug(engExact(r.title)) + '-' + pk.i), ref: it.id, need: pk.i} : {id: it.id, need: pk.i};
    S.route.goals.splice(goalSpot(pk.i), 0, link);
    fresh.add(link.id);
    if (r.options) open.add(link.id);      // награда с выбором: варианты — сразу на экран
    PK = {kind: 'lm', i: pk.i, q: '', hi: 0};
    focusKey = 'sp:lm:' + pk.i;
    return;
  }
  if (pk.kind === 'stage') {
    const st = S.stages[pk.i];
    if (!st || !st.stats) return;
    const id = it.type === 'stat' ? it.id : ownStat(propOf(it.key)).id;
    if (!st.stats.includes(id)) st.stats.push(id);
  } else if (pk.kind === 'def') {
    const def = S.statDefs[pk.i];
    if (def && !def.lines.includes(it.key)) def.lines.push(it.key);
  } else {
    PK = null;
    focusKey = 'sd:' + ownStat(propOf(it.key)).id;
    return;
  }
  PK = {kind: pk.kind, i: pk.i, q: '', hi: 0};       // поле остаётся в работе: статы добавляют подряд
  focusKey = 'sp:' + pk.kind + ':' + pk.i;
}

function stageHtml(st, i) {
  const was = before(i);
  // с какого шага: у первого этапа — с начала забега; у остальных — любой шаг, с которого не начинается другой
  const used = new Set(S.stages.filter(x => x !== st).map(x => x.from));
  let opts = '', act = null;
  for (const s of STEPLIST) {
    if (s.act !== act) { opts += (act === null ? '' : '</optgroup>') + `<optgroup label="${esc(s.act || '')}">`; act = s.act; }
    opts += `<option value="${esc(s.id)}"${s.id === st.from ? ' selected' : ''}${used.has(s.id) ? ' disabled' : ''}>${esc(s.name)}</option>`;
  }
  const from = i === 0 ? ('<span class="lab">' + T('с самого начала') + '</span>')
    : `<span class="lab">${T('с')}</span><select data-from="${i}">${opts}</optgroup></select>`;
  const par = (name, own, body, tip) => `<div class="par${own ? '' : ' same'}"><span class="lab"${tip ? ` title="${esc(tip)}"` : ''}>${name}</span><div>${body}</div></div>`;
  // Кнопка «не менять»: этап этот параметр не называет — действует то, что назвал прежний этап (оно
  // обведено пунктиром и названо словами рядом).
  const same = (k, own) => (i ? `<button class="same${own ? '' : ' on'}" data-same="${k}:${i}" ` +
    `title="${T('Этап это не меняет: действует заданное на этапе «{0}»', esc(setBy(i, k) || '—'))}">${SAME}</button>` : '');
  // База защиты — в один ряд, сокращениями, которые понимают все игроки: AR — Armour (броня), EV — Evasion
  // (уклонение), ES — Energy Shield (энергощит); полное название — в подсказке кнопки и словами рядом.
  const kinds = '<div class="row one">' + same('kind', st.kind) +
    D.kinds.map(x => `<button class="kind${x.id === st.kind ? ' on' : !st.kind && x.id === was.kind ? ' was' : ''}" data-kind="${i}:${esc(x.id)}" ` +
      `title="${esc(x.label + (' ' + T('· базы требуют:') + ' ') + (x.needs.map(y => y.name).join(', ') || '—'))}">${esc(x.short || x.label)}</button>`).join('') + '</div>';
  // Атрибуты — на чём билд делает упор в вещах: какие из них считать, когда вещи сравниваются. Хватит ли
  // атрибута камню или вещи, сказано у самого камня и у самой вещи (и в проверке билда), не здесь.
  const mine = st.attrs || [], old = was.attrs || [];
  const attrs = '<div class="row one">' + same('attrs', st.attrs) +
    (D.attrs || []).map(a => `<button class="kind${st.attrs ? (mine.includes(a.id) ? ' on' : '') : old.includes(a.id) ? ' was' : ''}" ` +
      `data-attr="${i}:${esc(a.id)}" title="${T('Считать {0} на предметах, когда они сравниваются', esc(a.name.toLowerCase()))}">${esc(a.name)}</button>`).join('') + '</div>';
  // Статы: свой список этапа (строками, под ним поле «Добавить стат») или тот, что действует с прежнего этапа (словами).
  // И там и там — всё, по чему вещи сравниваются: названное этапом и добавленное выбором защиты и атрибутов.
  const stats = st.stats
    ? `<div data-strows="${i}">${statRows(st, i)}</div><div class="row">` + pickField('stage', i, T('Добавить стат: название или свойство игры…')) +
      (i ? `<button class="same" data-same="stats:${i}" title="${T('Этап статы не меняет: вернуть список этапа «{0}»', esc(setBy(i, 'stats') || '—'))}">${SAME}</button>` : '') + '</div>'
    : `<div class="row top"><div class="was-list" data-strows="${i}">${statLines(i)}</div>` +
      `<button${i ? '' : ' class="add"'} data-own="${i}" title="${i ? T('Завести этапу свой список: он начнётся с копии этого') : T('Назвать статы билда')}">${i ? T('изменить на этом этапе') : T('Добавить статы')}</button></div>`;
  return `<div class="stage"><div class="row"><input class="name" data-name="${i}" value="${esc(st.name)}" maxlength="60">${from}` +
    `<span class="fill"></span><button data-del="${i}"${S.stages.length > 1 ? '' : ' disabled'}>${T('Удалить')}</button></div>` +
    par(T('Дерево'), st.tree, treeSelect('tree', st, i)) +
    // атлас — только у этапа, который начинается на картах; этап кампании с названной версией (старый файл) её
    // показывает — с замечанием, чтобы версию можно было убрать
    (stageOnMaps(st, i) ? par(T('Атлас'), st.atlas, treeSelect('atlas', st, i))
      : st.atlas ? par(T('Атлас'), st.atlas, treeSelect('atlas', st, i) + `<div class="warn">${T('этап начинается до карт — атласа там нет')}</div>`) : '') +
    par(T('Защита'), st.kind, kinds) + par(T('Атрибуты'), st.attrs, attrs) +
    par(T('Статы'), st.stats, stats, T('По этим статам сравниваются предметы')) + '</div>';
}

// --- билд целиком: название и герой ---
// Класс и вознесение — из данных дерева игры; от класса зависят атрибуты, с которыми герой начинает.
const heroClass = id => (D.heroes || []).find(c => c.id === id);
const heroLabel = x => (x.name && x.name !== x.id ? x.name + ' (' + x.id + ')' : x.id);

    `<a class="btn" href="/api/plan-file?plan=${encodeURIComponent(PLAN)}" download data-planfile title="${esc(T('Файл плана — чтобы отдать его другому игроку. В нём план, как он записан: несохранённых правок в нём нет'))}">${T('Скачать файл плана')}</a></div>`;
