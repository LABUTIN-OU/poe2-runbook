<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Editor — PoE2 Runbook</title>
<style>
:root{
  --bg:#111316;--card:#1a1d22;--tile:#20242a;--line:#2d323a;
  --text:#eceae6;--muted:#98a0aa;--accent:#7fb2ff;
  --due:#e6a93f;--due-text:#f4d08a;--over:#f0604f;--over-bg:#3a1915;--over-text:#ffc1b8;--ok:#5cbd88;--ok-bg:#14291d;
  --col:900px;   /* колонка программы: шапка, страница и нижняя полоса — одной ширины, в «Игре» и в «Редакторе» одной */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
/* переход к строке и курсор в поле не уходят под закреплённые полосы; верхний отступ ставит программа — по высоте шапки */
html{scroll-padding-bottom:70px}
#app{max-width:var(--col);margin:0 auto;padding:14px 14px 90px}
a{color:var(--accent);text-decoration:none}
/* Шапка программы — одна на обеих страницах, закреплена сверху. Её полоса и черта под ней — на всю ширину окна, а сама
   шапка — в колонке программы (--col), вровень со страницей: первый ряд — герой и план слева, режим («Игра · Редактор»)
   и язык справа; второй — навигация самой страницы (вкладки редактора, разделы «Игры»). Колонка и высота рядов в обоих
   режимах одни: при смене режима шапка не сдвигается и верх не прыгает. Она выше всплывающих списков (.spanel):
   прокрученный список уходит под неё. */
.hbar{position:sticky;top:0;z-index:7;background:var(--bg);border-bottom:1px solid var(--line)}
.abar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;max-width:var(--col);margin:0 auto;padding:0 14px}
.abar .aname{min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .in{max-width:var(--col);margin:0 auto;padding:0 14px}
html{scrollbar-gutter:stable}   /* место полосы прокрутки — всегда за страницей: колонка и шапка в ней не сдвигаются, есть прокрутка или нет */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;min-height:42px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-size:14px;line-height:20px;white-space:nowrap;cursor:pointer}
.tabs button:hover{filter:brightness(1.15)}
.tabs button.on{border-color:var(--accent);background:#1c2a40;font-weight:700}
.tabs .cnt{color:var(--muted);font-weight:400;margin-left:6px}
.tabs button.warn .cnt{color:var(--due-text);font-weight:700}
@media (max-width:780px){.abar,.hbar .in{padding-left:8px;padding-right:8px}.tabs{gap:4px;min-height:38px}.tabs button{padding:5px 8px;font-size:13px}}
/* Вкладки — блоки плана: билд целиком (название, герой, проверка), дерево, маршрут, этапы (что меняется
   целиком) и цели по носителям (что меняется по одному). У «Билда» — счёт проверки: сколько замечаний править.
   Вид вкладок — в стилях шапки выше: такой же, как у разделов «Игры». */
@media (max-width:780px){#app{padding-left:8px;padding-right:8px}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h3{margin:10px 0 6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stage{border:1px solid var(--line);border-radius:8px;background:var(--tile);padding:10px;margin-bottom:8px}
/* Параметр этапа — строка: слева его имя, справа выбор. Что этап назвал сам — ярко; что действует
   с прежнего этапа — приглушено. */
.par{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start;margin-top:8px}
.par > .lab{padding-top:7px}
.par.same > .lab{opacity:.75}
.par .warn{margin-top:4px;font-size:12px;color:var(--due-text)}     /* параметр, которого на этом этапе быть не может */
input,select,textarea{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input.name{width:220px;font-weight:600}
select{max-width:320px}
select.same{color:var(--muted)}
button{padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:default;filter:none}
button.kind{padding:7px 11px;font-size:14px}
button.kind.on{border-color:var(--accent);background:#1c2a40;font-weight:700}
button.kind.was{border-color:var(--muted);border-style:dashed;color:var(--muted)}   /* действует с прежнего этапа */
button.same{color:var(--muted)}
button.same.on{border-color:var(--muted);color:var(--text);font-weight:600}
button.go{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;padding:8px 20px;font-size:14px}
button.ask{border-color:var(--over);color:var(--over-text)}
/* Удаление — красным: у него есть последствия. Это кнопки, которые убирают карточку целиком (шаг, цель, проверку,
   этап, слот, свой стат, версию дерева, все узлы версии); второе нажатие («точно удалить?») — ярче. Крестик у строки —
   не сюда. */
button[data-rsx],button[data-rmr],button[data-unsay],button[data-unrw],button[data-rm],button[data-del],button[data-sx],button[data-sdx],button[data-wrm],button[data-tact="vdel"],button[data-tact="clear"],button[data-tattr="del"],button[data-topt="del"]{border-color:#8a3a30;color:var(--over-text)}
button[data-rsx].ask,button[data-rmr].ask,button[data-rm].ask,button[data-del].ask,button[data-sx].ask,button[data-sdx].ask,button[data-tact="vdel"].ask,button[data-tact="clear"].ask{border-color:var(--over);background:var(--over-bg)}
/* Добавление — зелёным, как удаление — красным: действие узнаётся по цвету. Кнопка называет его словами
   («Добавить шаг») и стоит в конце своего списка справа — там же, где остальные действия (ряд .adds). */
button.add{border-color:#2f6e4c;color:#a9e2c2}
.lab{color:var(--muted);font-size:13px}
.fill{flex:1}
.was-list{color:var(--muted);font-size:14px;padding-top:6px}
.stat{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:4px}
/* Стат в списке этапа — строка: место, название, порядок, убрать. Название — кнопка: нажатие раскрывает
   под строкой, из чего стат складывается (свойства игры, по одному на строке). */
.stt{padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:4px}
.stt.open{border-color:var(--muted)}
.stt .srow{display:flex;align-items:center;gap:8px}
.stt .n{flex:none;width:22px;color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.stt .sname{flex:0 1 auto;min-width:0;border:0;background:none;padding:3px 0;font-size:14px;font-weight:600;color:var(--text);
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stt .sname .car{display:inline-block;width:16px;color:var(--muted);font-weight:400;font-size:13px}
.stt .sname:hover .car{color:var(--text)}
.stt .why{flex:none;font-size:12px;color:var(--due-text)}
.stt .srow > button:not(.sname){flex:none;padding:3px 9px}
.sparts{padding:1px 0 5px 45px;font-size:13px;color:var(--muted)}
.sparts .snote{margin-top:3px;font-size:12px}
.sparts .snote button{padding:1px 8px;font-size:12px;margin-left:6px}
/* Список этапа — двумя группами, как им пользуется сравнение вещей: редкие статы решают по порядку (номер,
   слоты, стрелки), остальные складываются (порядка у них нет). Стат, добавленный выбором защиты или
   атрибутов, стоит в том же списке — пунктиром, с пометкой на месте кнопки «Убрать». */
.sgrp{margin:9px 0 4px;font-size:12px;color:var(--muted)}
.sgrp:first-child{margin-top:2px}
.sgrp b{font-weight:600;color:var(--text)}
.stt.auto{border-style:dashed;background:none}
.stt .swhere{flex:0 100 auto;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stt .send{flex:none;display:flex;justify-content:flex-end;min-width:70px}
.stt .send button{padding:3px 9px}
.stt .sby{font-size:12px;color:var(--muted);padding:0 4px}
.row.top{align-items:flex-start}
.was-list{flex:1 1 300px;min-width:0}
.was-list .wrow{display:grid;grid-template-columns:118px 1fr;gap:8px;margin-top:4px}
.was-list .wl{font-size:12px;padding-top:2px}
.was-list .wn{color:var(--text);opacity:.82}
.was-list .no{color:var(--due-text);margin-top:4px}
/* Поле «Добавить стат»: под ним — выдача поиска. Строка выдачи: название стата и мелко — из чего он складывается;
   у свойства игры — его текст. Выдача лежит поверх страницы и ничего не сдвигает. */
.spwrap{position:relative;flex:1 1 320px;min-width:240px}
.spwrap input{width:100%}
.spanel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;max-height:360px;overflow-y:auto;
  border:1px solid var(--accent);border-radius:8px;background:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.55);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.spanel .pgrp{padding:7px 10px 3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.spanel .pnone{padding:8px 10px;color:var(--muted);font-size:13px}
button.prow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:6px 10px;font-size:14px}
button.prow:hover{filter:none}
button.prow.hi{background:var(--tile)}
.prow .pn{font-weight:600}
.prow .ptag{margin-left:8px;font-size:12px;font-weight:400;color:var(--muted)}
.prow .pd{display:block;margin-top:1px;font-size:12px;color:var(--muted);white-space:normal}
.spanel .pdead{border-top:1px solid var(--line);padding:6px 10px;font-size:14px;color:var(--muted)}
.pdead .ptag{margin-left:8px;font-size:12px}
/* Поле выбора зоны: показывает название зоны; в работе — поиск по названию и коду. Зоны того же шага — метками. */
.spwrap.zw{flex:0 1 440px;min-width:220px}
/* поле «Добавить из справочника игры» шага: выдача — во всю ширину ряда */
.spwrap.lw{position:static;flex:0 1 440px;min-width:240px}
/* поле названия цели с выдачей вещей игры: место в строке — как у прежнего поля названия */
.grow > .spwrap.nw{flex:1 1 auto;min-width:140px}
.rstep.cd > .grow > .spwrap.nw{flex:0 1 310px}
.rstep.cd.og > .grow > .spwrap.nw{flex:0 1 470px}
.spwrap.nw input{font-weight:600}
.spwrap.nw .spanel{min-width:380px}
.adds.lmrow{position:relative}
/* запись справочника игры на шаге: название — текстом (факт, а не поле), пометки — мелко */
.grow .rname{flex:1 1 auto;min-width:140px;padding:3px 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .rtags{flex:none;color:var(--muted);font-size:12px}
.grow .rtags .todo{color:var(--due-text)}
/* варианты награды с выбором: столбцом — тексты длинные; выбранный автором выделен */
.opts{display:flex;flex-direction:column;gap:4px}
.opts button{display:block;width:100%;text-align:left;padding:6px 10px}
.opts button.on{border-color:var(--accent);background:#1c2a40;font-weight:600}
.opts .oname{display:block;margin-top:1px;color:var(--muted);font-size:12px;font-weight:400}
/* цель шага: слева слово вида — «босс», «награда», «задание», «уровень» */
.g.kw .grow .lead{width:54px;text-align:left}
.g.kw > .gsub,.g.kw > .gdet{padding-left:64px}
.prow .ptag.now{color:var(--ok)}
.zchip{flex:none;display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--card)}
.rline .zchip button{padding:0 6px;border:0;background:none;color:var(--over-text);font-size:15px}
/* Цель — строка: что, к какому шагу; второй строкой мелко — с какого шага; остальное за «⋯».
   Носитель (умение, слот) — карточка со своими целями. */
.holder{border:1px solid var(--line);border-radius:8px;background:var(--tile);padding:8px 10px;margin-bottom:8px}
.holder > .g.head{border:0;background:none;padding:0 0 4px}
.holder > .g.head input.t{font-weight:700;font-size:15px}
.g{border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:4px;padding:4px 6px}
.g.open{border-color:var(--muted)}
.grow{display:flex;align-items:center;gap:6px}
.grow .lead{flex:none;width:26px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grow input.t{flex:1 1 auto;min-width:140px;font-weight:600}
.grow select.need{flex:none;width:200px}
.grow button{flex:none;padding:3px 8px}
.grow .tools{flex:none;width:88px;display:flex;gap:6px;justify-content:flex-end}   /* одна ширина: списки шагов стоят в столбец */
.grow .num{flex:none}
.gsub{padding:2px 4px 1px 4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g.led > .gsub{padding-left:36px}
input.num{width:74px}
select.stat{flex:1 1 auto;min-width:140px;max-width:none}
select.lv{flex:none;width:70px}
.gdet{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:8px 6px 4px 6px}
.g.led > .gdet{padding-left:36px}
.fld{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}
.fld.wide{grid-column:1 / -1}
.fld input,.fld select,.fld textarea{width:100%;max-width:none}
.fld textarea{min-height:56px;resize:vertical}
.fld .row{gap:6px}
.gdet .end{grid-column:1 / -1;display:flex;align-items:center;gap:10px}
.adds{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin:6px 0 2px}
/* пояснение в таком ряду и поле поиска, которым тоже добавляют, — слева; кнопки — справа */
.adds > .lab,.adds > .spwrap{margin-right:auto}
/* Ряд кнопок параметра этапа не переносится: подписи короткие (у баз защиты — сокращения AR / EV / ES),
   полное название — рядом словами и в подсказке кнопки. */
.row.one{flex-wrap:nowrap}
.row.one > button{flex:none}
.row.one > .lab{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.edit{font-size:13px;white-space:nowrap}
input.wide{width:100%;max-width:520px}
/* Замечание проверки у цели: чего не хватает камню или вещи. */
.fnd{padding:1px 4px 2px 4px;color:var(--due-text);font-size:12px}
.g.led > .fnd{padding-left:36px}
/* Проверка билда (вкладка «Билд»): замечание — строка: что, чего не хватает, к какому шагу, переход к месту правки. */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--tile);margin-bottom:4px}
.crow .tx{color:var(--due-text);font-weight:600}
.crow .chips{margin-top:5px}
.crow.note .tx{color:var(--text)}
.crow .sub{color:var(--muted);font-size:12px}
.crow button{padding:3px 9px}
.okline{color:var(--ok);padding:4px 0 8px}
/* Вкладка «Дерево»: над картой — версии и действия, на карте снизу слева — что даёт узел под курсором.
   Узлы версии светлые; у «Характеристики» цвет по выбранному атрибуту, как в игре: сила — красный,
   ловкость — зелёный, интеллект — синий. Жёлтым — путь, который возьмёт нажатие; в атласе зелёной обводкой —
   что герой уже взял, красной — узел с выбором, который нужно отметить сначала. */
button.mini{padding:2px 8px;font-size:12px;color:var(--muted)}
button.mini.on{border-color:var(--accent);color:var(--text)}
/* Версии — вкладки; под ними карточка открытой версии, устроенная как карточка этапа: название, где действует,
   «Удалить»; дальше счёт версии, действия и её карта. Пунктир — версия, которую не выбрал ни один этап: черновик. */
.vtabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.vtabs .add{margin-left:auto}   /* «Добавить версию» — справа, после вкладок версий */
button.vtab{padding:5px 10px;font-size:13px;color:var(--muted)}
button.vtab.idle{border-style:dashed;border-color:var(--muted)}
button.vtab.on{border-color:var(--accent);background:#1c2a40;color:var(--text);font-weight:700}
.vcard{margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--tile)}
.medit{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px}
.medit .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.mdot{color:var(--due-text);font-weight:400}
.msum,.mmsg{padding:2px 7px;color:var(--muted)}
.msum b{color:var(--text);font-weight:600}
.msum .stale{opacity:.5}        /* версию правят — программа ещё не пересчитала */
.msum .todo{color:var(--due-text)}
.mmsg{color:var(--ok)}
.mmsg.bad{color:var(--over-text)}
.tmap{position:relative;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.mwrap{position:relative}
.mbox{height:620px;cursor:crosshair;touch-action:none;user-select:none}
.msvg{display:block}
.mctl{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.me{fill:none;stroke:#2c323b;stroke-width:1.2}
.me.plan{stroke:#4a6a96;stroke-width:1.8}
.me.pre{stroke:var(--due);stroke-width:1.8}
.mn{stroke-width:1.2}
.mn.rest{fill:#262b33;stroke:#39404b}
.mn.ed{fill:#cfd8e6;stroke:var(--accent);stroke-width:1.4}
.mn.ed.a-str{fill:#d2584f;stroke:#ffd9d4}
.mn.ed.a-dex{fill:#55a95a;stroke:#d9f5da}
.mn.ed.a-int{fill:#4a80dc;stroke:#d6e4ff}
.mn.ed.a-none{fill:var(--bg);stroke:#cfd8e6;stroke-width:1.6}     /* «Характеристика» без выбранного атрибута — пустая */
.mn.pre{fill:var(--due);stroke:#fff3d6;stroke-width:1.2}
.mn.got{stroke:var(--ok);stroke-width:2.2}
.mn.rest.got{fill:#1d3327}
.mn.hov{stroke:#fff;stroke-width:2.4}
.mn.blk{stroke:var(--over);stroke-width:2.8}
/* взятый узел под курсором: он и всё, что на нём держится, — то, что уберёт нажатие (отмены нет) */
.mn.ed.cut{fill:var(--over-bg);stroke:var(--over);stroke-width:2.4}
.me.cut{stroke:var(--over);stroke-width:1.8}
.mlab{font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none;fill:var(--text)}
.mlab.root{fill:var(--muted);font-weight:700;letter-spacing:.05em}
.mlab.blk{fill:var(--over-text);font-weight:700}
.mlab .mord{fill:var(--accent);font-weight:700}       /* каким по счёту из больших узлов берут этот */
.mopt{font-weight:700;fill:#fff;paint-order:stroke;stroke:#10131a;stroke-width:2.5px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}   /* номер выбранного варианта — в кружке узла атласа */
.minfo{position:absolute;left:8px;bottom:8px;max-width:380px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);font-size:12px;pointer-events:none}
.minfo b{display:block;font-size:13px}
.minfo span{display:block}
.minfo .mk{color:var(--muted);font-size:11px}
.minfo .mc{margin:2px 0;padding-left:6px;border-left:2px solid var(--accent)}
.minfo .mc.none{color:var(--muted);border-left-color:var(--line)}
.minfo .mo{padding-left:10px;color:var(--muted)}
.minfo .mo.on{color:var(--text);font-weight:600}
.minfo .mw{margin-top:3px;color:var(--due-text)}
.mmenu{position:absolute;z-index:2;display:flex;gap:4px;padding:4px;border:1px solid var(--accent);border-radius:8px;background:var(--bg)}
.mmenu button.mini.on{border-color:var(--text);font-weight:700}
.mmenu.col{flex-direction:column;align-items:stretch;width:372px}
.mmenu.col button.mini{text-align:left;white-space:normal;line-height:1.3;padding:4px 8px;color:var(--text)}
.mmenu.col button.mini.on{border-color:var(--accent);background:#1c2a40;font-weight:400}
.mmenu.col button.mini b{display:inline-block;min-width:17px;color:var(--accent)}
.mmenu .a-str{color:#e58c84}
.mmenu .a-dex{color:#8fd092}
.mmenu .a-int{color:#8fb4f0}
/* Свой стат билда: название и свойства игры, которые в него складываются, — по одному на строке. */
.own .pline{display:flex;align-items:center;gap:8px;padding:2px 0 2px 6px;font-size:13px;color:var(--muted)}
.own .pline span{flex:1 1 auto;min-width:0}
.own .pline button{flex:none;padding:0 7px;border:0;background:none;color:var(--muted);font-size:15px}
.own .spwrap{margin-top:4px}
/* Слот — носитель вещей: в шапке карточки его название, классы предметов и место в списке; за «⋯» —
   классы, что в слоте носят, удаление. */
.own .how{flex:1 1 60px;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .chips{margin-top:0}
.fld .chips select,.fld .row select{width:auto}
/* Плашки: цели и ссылки одной строкой. */
.sname .lab{margin-left:8px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;background:var(--tile);padding:1px 2px 1px 8px;font-size:13px}
.chip.lost{border-color:var(--over);color:var(--over-text)}
.chip button{border:0;background:none;color:var(--over-text);padding:1px 6px;font-size:14px}
.chips select{max-width:340px}
/* Маршрут: шаг — строка (название, как узнаётся, что на нём есть), подробности за «⋯». */
/* Акт — отдельный блок страницы с крупным названием: когда раскрыто много шагов, граница между актами видна */
/* над актами — строка вкладки: что это и целевое время всего маршрута (своего названия у маршрута нет) */
.rtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 10px}
.rtop h2{margin:0}
.acth{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.acth .aname{font-size:20px;font-weight:700;color:var(--text)}
.acth .asum{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
/* целевое время шага — в его строке: у всех шагов поле стоит в одном столбце */
.rstep input.clock{flex:none;width:78px;text-align:right;font-variant-numeric:tabular-nums;padding:3px 8px}
.rstep input.clock.bad{border-color:var(--over);color:var(--over-text)}
.rstep{border:1px solid var(--line);border-radius:8px;background:var(--tile);padding:5px 8px;margin-bottom:4px}
.rstep.open{border-color:var(--muted);padding-bottom:8px}
.rstep > .grow input.t{flex:0 1 280px}
.rstep .how{flex:1 1 60px;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Раскрытый шаг — как карточка этапа: блок — строка, слева его имя, справа содержимое; между блоками черта.
   Так видно, где какой блок начинается, и поля одного блока не сливаются с соседними. */
.rpar{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:start;margin-top:8px;padding:8px 2px 0 4px;border-top:1px solid var(--line)}
.rpar > .lab{padding-top:6px}
.rpar > .rval{min-width:0}
.rpar .rline:last-child,.rpar .adds:last-child{margin-bottom:0}
.rpar .ways{display:flex;gap:6px;margin-bottom:6px}
.rpar .rline .lead{width:76px}
/* Действия над карточкой (перенести, удалить) — отдельной строкой внизу справа: это не поля, их не заполняют */
.cacts{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding:8px 2px 0 4px;border-top:1px solid var(--line)}
/* цели билда, чей срок — этот шаг: справка в блоке «Цели» шага, каждая — ссылка на свою вкладку */
.due{display:flex;align-items:flex-start;gap:6px;margin:4px 0 6px}
.due .lead{flex:none;width:76px;padding-top:5px;color:var(--muted);font-size:12px}
.due .duec{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.due button{padding:3px 9px;font-size:13px;color:var(--muted)}
.cacts select{max-width:260px;color:var(--muted)}
.cacts a.btn{padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px}
.cacts a.btn:hover{filter:brightness(1.15)}
/* Присланный план — только просмотр: поля читаются как текст, кнопок правки нет — остаётся то, чем план смотрят */
#app.ro input:disabled,#app.ro select:disabled,#app.ro textarea:disabled{opacity:1;color:var(--text);cursor:default}
#app.ro button:disabled{display:none}
#app.ro input:placeholder-shown,#app.ro textarea:placeholder-shown{display:none}      /* пустое поле при просмотре ничего не говорит */
#app.ro .cacts:not(.pacts){display:none}       /* действия карточек (перенести, удалить) — правка */
.gdet .end .fill{flex:1}
.gdet .end select{max-width:240px;color:var(--muted)}
/* «Добавить шаг» — в конце блока акта, справа: шаги добавляют по ходу прохождения */
.actadd{display:flex;justify-content:flex-end;margin:8px 0 0}
.rline{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rline input.w{flex:1 1 auto}
.rline input.code{flex:none;width:170px}
.rline .lead{flex:none;width:96px;color:var(--muted);font-size:12px}
.rline button{flex:none;padding:3px 8px}
.none{color:var(--muted);font-size:13px;padding:2px 0 4px}
/* Фильтр шага: с этого шага включают этот фильтр игры. В строке шага — плашкой: смены фильтра видно, не раскрывая
   карточек. Фильтра нет в игре — красным. */
.rstep .fsw{flex:none;max-width:220px;padding:1px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstep .fsw.bad{border-color:var(--over);color:var(--over-text)}
.rval select.fsel.bad{border-color:var(--over);color:var(--over-text)}
.rval .fpage{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}
.rval .fpage:hover{text-decoration:underline}
.fhint{margin:2px 0 0;color:var(--muted);font-size:12px}
.fhint.bad{color:var(--over-text)}
.rline .lead.n{width:20px;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.bar .in{max-width:var(--col);margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
@media (max-width:780px){.bar .in{padding-left:8px;padding-right:8px}}   /* узкое окно: вровень со страницей и шапкой */
.msg{font-size:13px;color:var(--ok)}
.msg.bad{color:var(--over-text)}
.alert{background:var(--over-bg);color:var(--over-text);border:1px solid var(--over);border-radius:8px;padding:10px 12px;margin-bottom:12px}
/* Умение, слот и цель «Прочего» — строка, как шаг маршрута: название, что записано, порядок, «⋯». Раскрытое —
   карточка блоками-строками (имя блока слева, содержимое справа); действие над ней — отдельной строкой внизу справа. */
.rstep.cd > .grow input.t{flex:0 1 310px}
.rstep.cd > .grow .tools{width:auto}
.rstep.cd.og > .grow input.t{flex:0 1 470px}   /* «Прочее»: название длинное, сводка короткая */
.rstep.cd > .grow .how{white-space:normal;line-height:1.35}   /* сводка длинная — переносится, а не обрезается */
.rstep.cd .fnd:empty,.rstep > .fnd:empty{display:none}
.rstep > .fnd{padding-left:10px}
.fnd .soft{color:var(--muted)}
.rstep.cd > .rpar{grid-template-columns:126px 1fr}
/* Период слота — что в нём носят с шага: строка «Носят» (шаг начала, классы, род базы), под ней его предметы
   и статы. Периоды идут по порядку шагов; между ними разделитель потолще. */
.rstep.cd .per > .rpar{grid-template-columns:126px 1fr}
.per + .per{margin-top:12px;border-top:2px solid var(--line)}
.per + .per > .rpar:first-child{border-top:0}
.per .wend{color:var(--muted);font-size:13px}
.per .wnote{color:var(--muted);font-size:13px;margin-top:6px}
.per .rval > .chips{margin-top:6px}
.per > .cacts{border-top:0;margin-top:2px;padding-top:0}
.adds select.add{width:auto;max-width:340px;border-color:#2f6e4c;color:#a9e2c2}
.adds select.add option{color:var(--text)}
.rstep.cd > .fnd{padding-left:10px}
.rstep.cd .rline > .lab{flex:none}
.rstep.cd .rline > select.need{flex:none;width:210px}
.rstep.cd .rline > select{max-width:340px}
.rstep.cd .rval > input.w,.rstep.cd .rval > textarea{width:100%}
.rstep.cd .rval textarea{min-height:32px;resize:vertical;display:block}
.rstep.cd .g{background:var(--card)}
.rstep.cd .grow > .lab.due{flex:none}
.rstep.cd .rline.lvl + .fnd{padding-left:2px;margin:-2px 0 4px}
/* справка игры о названной вещи: строка текста, а не поле — автор её не выбирает */
.fact{padding:6px 0 5px;font-size:13px}
.fact.none{color:var(--muted)}
/* подробности поддержки — строками, поле на строку */
.gdet.rows{display:block;padding:2px 2px 4px 32px}
.gdet.rows .rpar{border-top:0;margin-top:6px;padding:0;grid-template-columns:100px 1fr}
.gdet.rows .rline{flex-wrap:wrap}
.gdet.rows .rline > select.need{flex:1 1 120px;width:auto;min-width:0}
.gdet.rows .cacts{margin-top:8px}
.rstep.cd .rval .chips{margin-top:0}
.rstep.cd .rval .chips select,.rstep.cd .rval .row select{width:auto}
.rstep.cd > .cacts > .lab{margin-right:auto}
/* Убрать — то же удаление: крестики и слово «Убрать» красные, как «Удалить». Правило стоит последним: у мелких
   кнопок (.mini) свой цвет задан раньше. */
button[data-rnx],button[data-rtx],button[data-gx],button[data-sdlx],button[data-drop],button[data-lx],
button[data-tact="clear"],button[data-topt="del"],button[data-tattr="del"]{border-color:#8a3a30;color:var(--over-text)}
/* Переключатель языка: кнопка с кодом текущего языка; под ней по нажатию — список языков, каждый своим названием. */
.lang{position:relative;display:inline-flex;margin-left:auto;flex:none}
.lg{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:600;letter-spacing:.04em;line-height:1.5;cursor:pointer}
.lg:hover,.lg.on{color:var(--text)}
.lgc{font-size:9px;color:var(--muted)}
.lgm{position:absolute;top:calc(100% + 6px);right:0;z-index:63;display:flex;flex-direction:column;min-width:200px;padding:4px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.lgi{display:flex;align-items:baseline;gap:10px;padding:5px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);
  font:inherit;font-size:14px;line-height:20px;text-align:left;white-space:nowrap;cursor:pointer}
.lgi b{min-width:22px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.lgi:hover{background:var(--tile)}
.lgi.on,.lgi.on b{color:var(--accent);cursor:default}
/* Японский, корейский, тайский: шрифты Windows для этих письменностей (латиница и цифры остаются Segoe UI). */
html:lang(ja) body{font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",Meiryo,system-ui,sans-serif}
html:lang(ko) body{font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif}
html:lang(th) body{font-family:"Segoe UI","Leelawadee UI",Tahoma,system-ui,sans-serif}
/* Режим программы — «Игра · Разбор · Редактор»: одна программа, три режима. Переключатель стоит на одном месте всех
   страниц, рядом с языком; текущий режим — цветом акцента, как выбранная вкладка. */
.corner{display:inline-flex;align-items:center;gap:12px;margin-left:auto;flex:none}
.corner .lang{margin-left:0}
/* Настройки программы: кнопка в первом ряду шапки (рядом с языком) и окно под ней. Строка — одна настройка: слева — что
   это, справа — выбор; выбранное — как выбранный режим в переключателе рядом. Настройка, которая сейчас ни на что не
   влияет (окна поверх игры выключены), — бледная. */
.setw{position:relative;display:inline-flex;flex:none}
.setb{padding:3px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;
  font-size:13px;cursor:pointer}
.setb:hover{color:var(--text);background:var(--tile)}
.setb.on{color:var(--text);background:#1c2a40}
.setp{position:absolute;top:calc(100% + 6px);right:0;z-index:63;width:max-content;max-width:calc(100vw - 16px);padding:4px 14px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--text);
  font-size:14px;line-height:20px;white-space:nowrap;cursor:default}
.seth{display:flex;align-items:center;justify-content:space-between;gap:24px;height:38px}
.seth b{font-size:15px}
.setx{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;
  cursor:pointer}
.setx:hover{color:var(--text);border-color:var(--muted)}
.setr{display:flex;align-items:center;justify-content:space-between;gap:28px;min-height:38px}
.setr.gap{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.setr.dim .setl{color:var(--muted)}
.setc{display:inline-flex;align-items:center;gap:10px;min-width:0}
.sets{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seto{padding:3px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;line-height:20px;cursor:pointer}
.seto + .seto{border-left:1px solid var(--line)}
.seto:hover:not(:disabled):not(.on){color:var(--text);background:var(--tile)}
.seto.on{color:var(--text);background:#1c2a40;cursor:default}
.seto:disabled{cursor:default}
.setr.dim .sets{opacity:.5}
.setd{color:var(--muted);font-size:13px}
.setd.bad{color:var(--over-text)}
/* О программе: окно встаёт на место окна «Настройки» — тот же угол, строка заголовка той же высоты, ✕ на том же месте;
   шириной до 620 px. Крутится только тело окна: заголовок с ✕ стоит, и полоса прокрутки ✕ не сдвигает. Текст файла
   (LICENSE…) — как есть, моноширинным. */
.abt{position:fixed;z-index:64;display:flex;flex-direction:column;width:min(620px,calc(100vw - 24px));box-sizing:border-box;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--text);
  font-size:14px;line-height:20px;cursor:default}
.abt[hidden]{display:none}
.abt .abh{flex:none;height:42px;padding:4px 14px 0}      /* как окно «Настройки»: 4 px сверху + строка 38 px */
.abt .abh b{font-size:15px}
.abt .abb{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 14px 12px}
.abt .abs{padding:10px 0 4px;border-top:1px solid var(--line)}
.abt .abs.abtop{padding-top:0;border-top:0}
.abt h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.abt p{margin:0 0 6px}
.abt .abn{font-size:18px;font-weight:700;line-height:24px}
.abt .abm{color:var(--muted)}
.abt .abc{margin:2px 0 6px}
.abt .abr{margin-bottom:4px}
.abt a{color:var(--accent);text-decoration:none}
.abt a:hover{text-decoration:underline}
.abt .abq{padding:5px 10px;border-left:2px solid var(--line);background:var(--tile);font:13px/19px Consolas,"Cascadia Mono",monospace;
  overflow-wrap:anywhere}
.abt .aba{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.abt .abl{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.abt .abl td{padding:1px 0;vertical-align:top}
.abt .abl td + td{padding-left:14px;color:var(--muted)}
.abt .abl td:nth-child(2){white-space:nowrap}
.abt .abl tr.sub td:first-child{padding-left:16px;color:var(--muted)}
.abt .abx{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/17px Consolas,"Cascadia Mono",monospace}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode a{padding:3px 12px;font-size:13px;color:var(--muted);text-decoration:none}
.mode a + a{border-left:1px solid var(--line)}
.mode a[href]:hover{color:var(--text);background:var(--tile)}
.mode a.on{color:var(--text);background:#1c2a40;cursor:default}   /* без жирного: ширина переключателя одна в обоих режимах */
/* Уход из редактора с несохранёнными правками: вопрос поверх страницы — сохранить, отменить правки или остаться. */
.leave{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.leave .box{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.leave h3{margin:0 0 6px;font-size:16px;letter-spacing:0;text-transform:none;color:var(--text)}
.leave p{margin:0 0 14px;color:var(--muted);font-size:14px}
.leave .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.leave .btns button{padding:6px 14px;font-size:14px}
.leave button.go{border-color:var(--accent)}
.leave button.drop{border-color:#8a3a30;color:var(--over-text)}
/* Герой и план — переключатель слева в первом ряду шапки (одинаковый на обеих страницах). Длинное название обрезается
   «…»; новый герой, которого спрашивают о плане, — жёлтым, как цель на своём шаге. */
.ctxb{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:min(60%,560px);padding:3px 10px;border-radius:7px;
  border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;line-height:18px;cursor:pointer}

.ctxb .ctxc{flex:none;color:var(--muted);font-size:11px}
.ctxb.on{border-color:var(--accent)}
.ctxb.need{border-color:var(--due);background:#33290f;color:var(--due-text)}
.ctxb.need .ctxc{color:var(--due-text)}
/* Обновление программы (updParts, updLine). В первом ряду шапки, у правого угла, — «есть версия …» и «Обновить» (во
   время загрузки — «загрузка …%», не вышло — почему, красным, и та же кнопка): ряд той же высоты, страница под ним не
   сдвигается. Объявление автора программы для всех — своей строкой под этим рядом, в колонке программы: одна строка
   (длинное — с «…», целиком в подсказке), цветом «обратите внимание»; строка есть, только пока объявление есть в файле
   обновления, и с первого кадра (браузер помнит последнее объявление). */
.updw{display:inline-flex;align-items:center;gap:8px;flex:none;margin-left:auto;font-size:13px;white-space:nowrap}
.updw + .corner{margin-left:0}
.updw .updv.bad{color:var(--over-text)}
.updb{padding:3px 12px;border-radius:7px;border:1px solid var(--accent);background:#1c2a40;color:var(--text);font:inherit;
  font-size:13px;line-height:18px;cursor:pointer}
.updb:hover{filter:brightness(1.15)}
.updb:disabled{opacity:.6;cursor:default}
/* Окно «Настройки» и список языков стоят в шапке, а шапка — свой слой (z-index 7): пока одно из них открыто, вся шапка
   встаёт над всплывающими окнами «Игры» (сравнение предмета 61, путевой камень 60, очки дерева 59) — что открыл сам
   игрок, под ними не прячется; закрыли — шапка снова на своём слое. */
.hbar:has(.setp,.lgm){z-index:63}
.updl{display:flex;align-items:baseline;gap:8px;max-width:var(--col);margin:-4px auto 0;padding:0 14px 8px;font-size:13px;

@media (max-width:780px){.updl{padding-left:8px;padding-right:8px}}
/* Список под ним: шириной в колонку страницы (место и размер ставит ctxPlace), до низа окна, крутится целиком; подложка
   ниже первого ряда шапки ловит нажатие мимо и колесо — страница под списком стоит. Список — над всплывающими окнами

#ctxbg{position:fixed;left:0;right:0;bottom:0;top:44px;z-index:61;background:rgba(0,0,0,.45)}

#ctx .mini{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;

#ctx .mini:hover{color:var(--text);filter:none}
#ctx .mini.arm{border-color:var(--due);color:var(--due-text)}
#ctx .mini.go{border-color:var(--accent);color:var(--text)}
#ctx .mini.rm{border-color:#8a3a30;color:var(--over-text)}
#ctx .mini.rm.arm{border-color:var(--over);background:var(--over-bg)}
#ctx .mini.add{border-color:#2f6e4c;color:#a9e2c2}
/* таблицы героев и планов: столбцы одной ширины во всех строках, ничего не съезжает; текст длиннее столбца — «…» */
#ctx .runrow,#ctx .planrow{display:grid;column-gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#ctx .runrow{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 74px 160px}
#ctx .runrow.lib{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.2fr) 74px 160px}
#ctx .planrow{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 160px}
#ctx .runrow > span,#ctx .planrow > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx .runhead{border-top:0;padding:2px 0;font-size:11px;color:var(--muted)}
#ctx .runn,#ctx .pln{font-weight:600}
#ctx .runt{text-align:right;font-variant-numeric:tabular-nums}
#ctx .runa{display:flex;justify-content:flex-end;align-items:center;gap:6px}
#ctx .runl,#ctx .plt,#ctx .plc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#ctx .runnow{color:var(--ok);font-weight:600}
#ctx .tdone{color:var(--ok)}
#ctx .runrow.cur .runn,#ctx .planrow.cur .pln{color:var(--ok)}
#ctx .runrow.gone .runn,#ctx .runrow.gone .runc,#ctx .runrow.gone .runz,#ctx .runrow.gone .runp,#ctx .runrow.gone .runt{color:var(--muted);font-weight:400}
/* строка плана — выбор: нажимается целиком; выбранный план — подсвечен (он один на «Игру» и «Редактор») */
#ctx .planrow.pick{cursor:pointer;margin:0 -8px;padding:6px 8px;border-radius:6px}
#ctx .planrow.pick:hover{background:var(--tile)}
#ctx .planrow.cur,#ctx .planrow.cur + .planrow{border-top-color:transparent}
#ctx .planrow.cur{background:var(--ok-bg)}
#ctx .planrow.pick:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
#ctx .cxq{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;
  border:1px solid var(--due);border-radius:8px;color:var(--due-text)}
#ctx .cxadd{display:flex;justify-content:flex-end;margin-top:10px}
#ctx .cxmsg{margin:10px 0 0;color:var(--over-text)}
#ctx .cxmsg.ok{color:var(--ok)}
/* «Новый план» — окно поверх страницы: название, основа, что взять. Выбор «что взять» — одним рядом. */
#ctxnew{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:80px 16px 16px}
#ctxnew .nwbox{width:min(540px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px}
#ctxnew h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text)}
#ctxnew .nwrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
#ctxnew .lab{color:var(--muted);font-size:13px}
#ctxnew input,#ctxnew select{width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#ctxnew input:focus,#ctxnew select:focus{outline:none;border-color:var(--accent)}
#ctxnew .nwtake{display:flex;gap:6px;flex-wrap:wrap}
#ctxnew .mini{padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;line-height:18px;cursor:pointer}
#ctxnew .mini:hover{color:var(--text);filter:none}
#ctxnew .mini.on{border-color:var(--accent);color:var(--text);background:#1c2a40}
#ctxnew .mini.go{border-color:var(--accent);color:var(--text)}
#ctxnew .mini:disabled{opacity:.5;cursor:default}
#ctxnew .nwfix{color:var(--muted)}
#ctxnew .nwnote{margin:6px 0 0;color:var(--due-text)}
#ctxnew .nwhint{margin:6px 0 0;color:var(--muted)}
#ctxnew .nwbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#ctxnew .cxmsg{margin:8px 0 0;color:var(--over-text)}
#ctx .cxadd{gap:8px}
/* «Каталог» (только в «Редакторе»): строки — та же сетка, что у планов (название · класс · автор · действие); под строкой
   — для какой игры, версия и день, и что изменилось (у плана, который можно обновить) или о чём план */
#ctx .catr{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
#ctx .catst{font-size:12px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx .catst.bad{color:var(--over-text)}
#ctx .catrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 160px;column-gap:10px;row-gap:2px;
  align-items:center;margin:0 -8px;padding:7px 8px;border-top:1px solid var(--line);border-radius:6px;transition:background .4s}
#ctx .catrow > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx .catrow .cata{font-size:12px;color:var(--muted)}
#ctx .catrow .cata a{color:var(--accent);text-decoration:none}
#ctx .catrow .cata a:hover{text-decoration:underline}
#ctx .catd{grid-column:1 / 4;min-width:0;font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
#ctx .catd .catg{color:var(--due-text)}
#ctx .catd .catc{color:var(--text)}
#ctx .catrow.flash{background:rgba(230,169,63,.14)}
#ctx .mini.upd{border-color:var(--due);color:var(--due-text)}
/* узкое окно: место — именам; где герой, его план и класс плана уходят, кнопки берут сколько им нужно */
@media (max-width:640px){#ctx{padding:2px 10px 10px}#ctx .runrow,#ctx .runrow.lib{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 52px auto}
  #ctx .runz,#ctx .runp{display:none}#ctx .planrow{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto}#ctx .plc{display:none}
  #ctx .catrow{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto}#ctx .catd{grid-column:1 / 3}}
</style>

<body>
<div class="hbar" id="hbar"><div class="abar"><span class="aname"></span></div><div class="in"><nav class="tabs"></nav></div></div>
<div id="ctxbg" hidden></div><div id="ctx" role="dialog" tabindex="-1" hidden></div>
<div id="app"><div class="lab" data-t>Загрузка…</div></div>
<div class="bar"><div class="in">
  <button class="go" id="save" disabled data-t>Сохранить</button>
  <button id="reset" disabled data-t>Отменить правки</button>
  <span class="msg" id="msg"></span>
  <button id="msgact" hidden></button>
</div></div>
<script>
'use strict';
// Шапка программы с первого кадра: её прошлый вид браузер помнит (appBar ниже) — он ставится сразу, ещё до словаря
// языка и данных, и при смене режима шапка не мигает.
try {
  const c = JSON.parse(localStorage.getItem('appBar') || 'null');
  const was = localStorage.getItem('lang') || localStorage.getItem('langAuto') || 'en';
  if (c && c.lang === was && c.edit) document.querySelector('#hbar .abar').innerHTML = c.edit;
} catch (err) { /* без памяти браузера шапка появится с данными */ }
// --- Язык страницы -------------------------------------------------------------------------------------
// Тексты записаны в коде по-русски и обёрнуты вызовом T('…'); перевод — словарь языка, который страница берёт
// у программы (/api/lang, файлы planner/lang/<язык>.json; ключ — русский текст из кода). Язык выбирает
// пользователь переключателем; выбор помнит браузер, он общий для страницы забега и редактора плана. Пока
// выбора нет — язык клиента игры, если на него есть перевод (иначе английский): его называет программа в ответе на
// lang=auto, а браузер помнит его отдельно (langAuto) — только для шапки с первого кадра.
// Язык называется программе в каждом запросе (?lang=…): сама она языка не помнит,
// поэтому вкладки на разных языках друг другу не мешают.
// Весь остальной код страницы стоит в функции startPage и запускается, когда словарь получен: подписи,
// собранные один раз при запуске, тоже выходят на выбранном языке.
const I18N = {lang: 'ru', source: 'ru', name: 'ru', plural: 'slavic', quotes: '', locale: 'ru-RU', texts: {}, patterns: [], langs: []};
const LANG_KEY = 'lang', LANG_AUTO = 'auto';
function langChoice() {
  try { return localStorage.getItem(LANG_KEY) || LANG_AUTO; } catch (err) { return LANG_AUTO; }
}
// Текст на языке страницы: T('взято {0} из', n). Пометка после «##» различает одинаковые русские тексты
// с разным переводом (T('цель##время')); в сам текст она не входит. Нет перевода — текст как в коде.
function T(key, ...args) {
  let s = I18N.texts[key];
  if (s === undefined) { const cut = key.indexOf('##'); s = cut < 0 ? key : key.slice(0, cut); }
  return args.length ? s.replace(/\{(\d)\}/g, (m, i) => (args[+i] === undefined ? m : args[+i])) : s;
}
// Ключ, который переведут позже (TN или T от переменной): так его видит проверка слоя языка.
const TK = key => key;
// Уровень зоны словами игрока. Путевой камень уровня N открывает зону 64 + N (данные игры: T1…T16 = 65…80): на картах
// игрок говорит уровнем камня — «T13», а не «зона 77»; в кампании — уровнем зоны.
const mapTier = lv => (lv >= 65 && lv <= 80 ? lv - 64 : 0);
const fromZone = lv => (mapTier(lv) ? T('с T{0}', mapTier(lv)) : T('с зоны {0}', lv));
const dropWords = lv => (mapTier(lv) ? T('· падает с T{0}', mapTier(lv)) : T('· падает с уровня зоны') + ' ' + lv);
const PLURALS = {
  slavic: n => { const a = Math.abs(n) % 100, b = Math.abs(n) % 10; return a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2; },
  one_other: n => (Math.abs(n) === 1 ? 0 : 1),
  french: n => (Math.abs(n) <= 1 ? 0 : 1),
  polish: n => { const a = Math.abs(n) % 100, b = Math.abs(n) % 10; return Math.abs(n) === 1 ? 0 : b >= 2 && b <= 4 && !(a >= 12 && a <= 14) ? 1 : 2; },
  czech: n => (Math.abs(n) === 1 ? 0 : Math.abs(n) >= 2 && Math.abs(n) <= 4 ? 1 : 2),
  none: () => 0,
};
// Форма слова для числа: TN(3, 'шаг|шага|шагов') — «шага», по-английски «steps». Само число в текст не входит.
function TN(n, key) {
  const own = I18N.texts[key];
  const forms = (own === undefined ? key.split('##')[0] : own).split('|');
  const rule = PLURALS[own === undefined ? 'slavic' : I18N.plural] || PLURALS.one_other;
  return forms[Math.min(rule(n), forms.length - 1)];
}
// Кавычки языка: по-английски «ёлочки» вокруг названий заменяются на “лапки” — одним местом, перед выводом.
const Q = s => (I18N.quotes && I18N.quotes !== '«»' ? String(s).replace(/«/g, I18N.quotes[0]).replace(/»/g, I18N.quotes[1]) : s);
// Адрес запроса к программе с языком страницы.
const langUrl = url => url + (url.includes('?') ? '&' : '?') + 'lang=' + encodeURIComponent(I18N.lang);
function loadLang() {
  // Программа ещё не запущена (страницу открыли раньше) — спрашиваем, пока не ответит: без неё странице всё равно
  // нечего показать. Ответ «такого адреса нет» — программа прежней версии, языков не знает: страница русская.
  const ask = () => fetch('/api/lang?lang=' + encodeURIComponent(langChoice()))
    .then(r => (r.ok ? r.json() : null), () => new Promise(done => setTimeout(() => done(ask()), 2000)));
  return ask()
    .then(d => {
      if (d && d.lang && d.texts) Object.assign(I18N, d);
      if (langChoice() === LANG_AUTO) {
        try { localStorage.setItem('langAuto', I18N.lang); } catch (err) { /* без памяти браузера шапка появится с данными */ }
      }
    })
    .catch(() => { /* ответ не разобран: страница остаётся русской */ })
    .then(() => {
      document.documentElement.lang = I18N.lang;
      for (const el of document.querySelectorAll('[data-t]')) el.textContent = T(el.textContent.trim());
    });
}
function setLang(code) {
  const go = () => {
    try { localStorage.setItem(LANG_KEY, code); } catch (err) { /* без памяти браузера выбор живёт до перезагрузки */ }
    location.reload();
  };
  // смена языка перезагружает страницу: несохранённые правки редактора пропали бы — сначала вопрос (leaveTo)
  if (window.leaveGuard) window.leaveGuard(go); else go();
}
// Переключатель: кнопка с кодом языка страницы, по нажатию под ней — список языков, каждый своим названием (их
// девять — по языкам игры). Какие языки есть, говорит программа (по файлам перевода). Открыт ли список, помнит
// langOpen: шапку перерисовывают, а список остаётся открытым, пока его не закроют.
let langOpen = false;
function langSwitch(open) {
  const safe = s => String(s).replace(/[&<>"']/g, '');
  if (I18N.langs.length < 2) return '';
  const cur = I18N.langs.find(l => l.code === I18N.lang);
  const menu = open ? '<div class="lgm" role="menu">' + I18N.langs.map(l => `<button class="lgi${l.code === I18N.lang ? ' on' : ''}" ` +
    `role="menuitemradio" aria-checked="${l.code === I18N.lang}" data-lang="${safe(l.code)}" lang="${safe(l.code)}">` +
    `<b>${safe(l.code).toUpperCase()}</b>${safe(l.name)}</button>`).join('') + '</div>' : '';
  return `<span class="lang"><button class="lg${open ? ' on' : ''}" data-lgt aria-haspopup="menu" aria-expanded="${!!open}" ` +
    `title="${safe(T('Язык'))}${cur ? ': ' + safe(cur.name) : ''}">${safe(I18N.lang).toUpperCase()}<span class="lgc" aria-hidden="true">▾</span></button>` +
    menu + '</span>';
}
function langShow(open) {
  if (langOpen === open) return;
  langOpen = open;
  if (typeof ctxBar === 'function') ctxBar();
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-lgt]')) { langShow(!langOpen); return; }
  const b = e.target.closest('[data-lang]');
  if (b) {
    if (b.dataset.lang !== I18N.lang) setLang(b.dataset.lang); else langShow(false);
    return;
  }
  if (langOpen && !e.target.closest('.lang')) langShow(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && langOpen) langShow(false); });
// Режим программы: «Игра» — страница, по которой играют (текущий шаг, цели, время, предметы); «Разбор» — куда ушло
// время героя, после игры (и у погибшего героя); «Редактор» — правка плана. Программа одна, и любой в ней и играет, и
// правит план: переключатель стоит на одном месте всех страниц, режим меняется в этой же вкладке.
function modeSwitch(cur) {
  const safe = s => String(s).replace(/[&<>"']/g, '');
  const one = (id, href, name, tip) => (id === cur

// Первый ряд шапки — одинаковый на обеих страницах: слева — с чем сейчас работает программа (переключатель героя и

// --- Обновление программы -------------------------------------------------------------------------------------------
// О новой версии программа узнаёт сама (update.py: при запуске и раз в 6 часов; выключается в «Настройках»). Есть версия
// новее — это видно без единого нажатия: в первом ряду шапки, у правого угла, «есть версия 0.5.5.19» и кнопка «Обновить»
// (что изменилось — в подсказке). Без нажатия «Обновить» ничего не качается и не ставится; после нажатия — «загрузка
// …%», затем окно закрывается, а установщик открывает уже новую программу. Не вышло — почему (красным) и та же кнопка.
// Объявление автора программы для всех — своей строкой под первым рядом шапки (updLine). Данные — GET /api/update: при
// открытии страницы, потом раз в минуту, во время загрузки — каждую секунду; «Игре» о перемене программа говорит сразу

const UPD = {data: null, timer: 0, seen: null};

function updMemo() {
  try {
    const m = JSON.parse(localStorage.getItem(UPD_KEY) || 'null');
    return m && m.lang === I18N.lang && typeof m.text === 'string' ? m.text : '';
  } catch (err) { return ''; }
}
function updLoad() {
  clearTimeout(UPD.timer);
  return fetch(langUrl('/api/update')).then(r => (r.ok ? r.json() : null)).catch(() => null).then(d => {
    const was = JSON.stringify(UPD.data), line = updLine();
    if (d) {                       // нет ответа (программа закрывается) — остаётся то, что было
      UPD.data = d;
      try { localStorage.setItem(UPD_KEY, JSON.stringify({lang: I18N.lang, text: (d.can && d.notice) || ''})); } catch (err) { /* без памяти браузера */ }
    }
    if (JSON.stringify(UPD.data) !== was) {
      ctxBar();
      if (ABOUT.open) abtPaint();
      if (updLine() !== line) dispatchEvent(new Event('resize'));    // высота шапки сменилась — отступы страниц под неё
    }
    const busy = UPD.data && (UPD.data.state === 'load' || UPD.data.state === 'run');
    UPD.timer = setTimeout(updLoad, busy ? 1000 : 60000);
  });
}
// «есть версия …» и «Обновить» — в первый ряд шапки, перед правым углом
function updParts() {
  const d = UPD.data;
  if (!d || !d.can) return '';
  const go = `<button class="updb" data-upd="go">${ctxEsc(T('Обновить'))}</button>`;
  const pct = d.total ? Math.min(100, Math.floor(100 * d.done / d.total)) : 0;
  const tip = d.notes ? ` title="${ctxEsc(T('Что изменилось: {0}', d.notes))}"` : '';
  const what = d.state === 'offer' ? `<span class="updv"${tip}>${ctxEsc(T('есть версия {0}', d.version))}</span>${go}`
    : d.state === 'fail' ? `<span class="updv bad" title="${ctxEsc(T('есть версия {0}', d.version))}">${ctxEsc(d.error || '')}</span>${go}`
      : d.state === 'load' ? `<span class="updv">${ctxEsc(T('загрузка версии {0}: {1}%', d.version, pct))}</span>`
        : d.state === 'run' ? `<span class="updv">${ctxEsc(T('ставится версия {0}…', d.version))}</span>` : '';
  return what ? `<span class="updw">${what}</span>` : '';
}
// объявление для всех — строкой под первым рядом шапки; пока программа не ответила — то, что видели в прошлый раз
function updLine() {
  const text = UPD.data ? (UPD.data.can && UPD.data.notice) || '' : updMemo();

// угол окна «Настройки» (у него top: 100% + 6px от кнопки и правый край — по кнопке): правый край — у кнопки «Настройки»,

function abtPlace() {
