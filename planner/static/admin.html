// --- свои статы билда: из свойств игры ---
const propOf = key => (D.props || []).find(r => r.key === key);
// Кто ссылается на стат: статы этапов, цели по стату, «даёт герою» у целей шага. Пока ссылки есть, стат не убрать.
function statUsers(id) {
  const out = [];
  for (const st of S.stages) if ((st.stats || []).includes(id)) out.push(T('этап «') + st.name + '»');
  for (const g of S.goals || []) if (g.stat === id) out.push(T('цель «') + (goalLabel(g.id) || g.id) + '»');
  for (const g of (S.route ? S.route.goals : [])) if (g.gives && id in g.gives) out.push(T('награда «') + (g.title || g.id) + '»');
  return out;
}
// Название своего стата по строке свойства: «#% увеличение урона хаосом» -> «Увеличение урона хаосом».
function propName(text) {
  const t = text.replace((' ' + T('· на самом предмете')), '').replace(/[+#%]/g, ' ').replace(/\s+/g, ' ').trim();
  return (t.charAt(0).toUpperCase() + t.slice(1)).slice(0, 60);
}
// Свой стат из одного свойства игры: уже есть такой — он и возвращается, иначе заводится новый.
function ownStat(prop) {
  const have = S.statDefs.find(d => d.lines.length === 1 && d.lines[0] === prop.key);
  if (have) return have;
  const used = new Set(D.catalog.filter(c => !c.own).map(c => c.id).concat(S.statDefs.map(d => d.id)));
  let base = prop.key.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 34);
  if (!/^[a-z]/.test(base)) base = 'x_' + base;
  let id = base, n = 2;
  while (used.has(id)) id = base + '_' + n++;
  const d = {id, name: propName(prop.text), lines: [prop.key]};
  S.statDefs.push(d);
  return d;
}
// Свои статы билда — раздел вкладки «Билд», только когда они есть: заводят их в поле «Добавить стат» этапа (свойство
// игры, которого нет ни в одном стате). Здесь стат называют, добавляют ему свойства и убирают его; одно
// определение — на весь билд: им пользуются списки статов этапов, цели по стату и награды шагов.
function ownStatsSection() {
  if (!S.statDefs || !S.statDefs.length) return '';
  const rows = S.statDefs.map((d, k) => {
    const users = statUsers(d.id), ask = asked === 'stat:' + d.id;
    const where = users.length ? users.slice(0, 2).join(', ') + (users.length > 2 ? ' ' + T('и ещё {0}', users.length - 2) : '') : T('нигде не стоит');
    return '<div class="holder own"><div class="grow">' +
      `<input class="t" data-sdn="${k}" data-pk="sd:${esc(d.id)}" value="${esc(d.name || '')}" placeholder="${T('название стата')}" maxlength="60">` +
      `<span class="how" title="${esc(users.join(', '))}">${esc(where)}</span>` +
      `<button class="${ask ? 'ask' : ''}" data-sdx="${k}"${users.length ? ` title="${esc((T('Сначала уберите его:') + ' ') + users.slice(0, 4).join(', '))}"` : ''}>${ask ? T('точно удалить?') : T('Удалить')}</button></div>` +
      d.lines.map(key => `<div class="pline" title="${esc(key)}"><span>${esc((propOf(key) || {text: key}).text)}</span>` +
        (d.lines.length > 1 ? `<button data-sdlx="${k}:${esc(key)}" title="${T('Убрать свойство из стата')}">×</button>` : '') + '</div>').join('') +
      pickField('def', k, T('Добавить свойство игры — сложится в этот же стат')) + '</div>';
  }).join('');
  return ('<section><h2>' + T('Свои статы') + '</h2>') + rows +
    '<div class="row">' + pickField('new', 0, T('Добавить свой стат: свойство игры…')) + '</div></section>';
}
function stagesTab() {
  return ('<section><h2>' + T('Этапы билда') + '</h2>') + S.stages.map(stageHtml).join('') +
    ('<div class="adds"><button class="add" data-add="stage">' + T('Добавить этап') + '</button></div></section>');
}

function addStage() {
  // новый этап — с первого свободного шага после последнего этапа; сам он пока ничего не меняет
  const last = S.stages[S.stages.length - 1];
  const used = new Set(S.stages.map(x => x.from));
  let n = 2;
  while (S.stages.some(x => x.id === 's' + n)) n++;
  const rec = {id: 's' + n, name: T('Новый этап'), from: null, tree: null, atlas: null, kind: null, attrs: null, stats: null};
  if (last) {
    const next = STEPLIST.slice(stepAt(last.from) + 1).find(s => !used.has(s.id)) || STEPLIST.find(s => !used.has(s.id));
    if (!next) { msg = {ok: false, text: T('в маршруте не осталось свободных шагов')}; return; }
    rec.from = next.id;
  }
  S.stages.push(rec);
  sortStages();
}

// ============================ цели ============================
const goal = id => S.goals.find(g => g.id === id);
const routeGoal = id => (S.route ? S.route.goals.find(g => g.id === id) : undefined);
const kids = id => S.goals.filter(g => g.for === id);
const isLevel = g => g.kind === 'gem' && g.part === 'level';
const tail = sk => (sk.id.startsWith('skill-') ? sk.id.slice(6) : sk.id);
const levelId = (sk, n) => 'gem' + n + '-' + tail(sk);
const slug = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
// английское имя из названия вида «Русское (English)» — по нему называется id новой цели
const engOf = title => { const m = /\(([^()]*)\)[^()]*$/.exec(title || ''); return m ? m[1] : ''; };
const lastOf = pred => { let last = null; for (const g of S.goals) if (pred(g)) last = g; return last; };

// На какой вкладке цель: вещи — у слота, камни — у умения (само умение и всё, что при нём), прочее — остальное.
function tabOf(g) {
  if (g.slot && slotOf(g.slot)) return 'items';
  if (g.kind === 'skill' || (g.for && (goal(g.for) || {}).kind === 'skill')) return 'gems';
  return 'other';
}

function freeId(base, self) {
  const used = new Set(S.goals.concat(S.route ? S.route.goals : []).filter(g => g !== self).map(g => g.id).concat(S.route ? [] : D.taken || []));
  base = (base || 'goal').slice(0, 56);
  let id = base, n = 2;
  while (used.has(id)) id = base + '-' + n++;
  return id;
}
// Id новой цели — по её имени, как у целей, записанных раньше: skill-kelari, support-heft-kelari, helmet-es-300.
function niceId(g) {
  const en = slug(engOf(g.title));
  if (g.kind === 'skill') return freeId('skill-' + (en || 'new'), g);
  if (isLevel(g) && goal(g.for)) return levelId(goal(g.for), g.title);
  if (g.kind === 'support' && goal(g.for)) return freeId('support-' + (en || 'new') + '-' + tail(goal(g.for)), g);
  if (g.slot && g.part) return freeId(g.slot + '-' + slug(g.stat) + '-' + slug(String(g.min)), g);
  if (g.slot) return freeId(g.slot + '-' + (en || 'new'), g);
  return freeId('goal-' + (en || 'new'), g);
}
// Сменить id цели, пока она не записана: ссылки на неё и id её ступеней уровня идут следом.
function rename(g, id) {
  if (!id || id === g.id) return;
  const old = g.id;
  g.id = id;
  moved[old] = id;
  for (const x of S.goals.concat(S.route ? S.route.goals : [])) { if (x.for === old) x.for = id; if (x.grantedBy === old) x.grantedBy = id; }
  for (const set of [open, fresh]) if (set.delete(old)) set.add(id);
  if (asked === old) asked = id;
  if (g.kind === 'skill') for (const k of kids(id)) if (fresh.has(k.id)) rename(k, niceId(k));
}
// Поставить цели на места, которые они вместе занимают в общем списке, в новом порядке: остальные цели
// файла при этом не двигаются.
function place(now, next) {
  const idx = now.map(g => S.goals.indexOf(g)).sort((a, b) => a - b);
  next.forEach((g, k) => { S.goals[idx[k]] = g; });
}
function insertAfter(anchor, g) {
  S.goals.splice(anchor ? S.goals.indexOf(anchor) + 1 : S.goals.length, 0, g);
  fresh.add(g.id);
  open.add(g.id);
  return g;
}
// запись новой цели: поля в привычном порядке, пустые (кроме названия — его сейчас наберут) не пишутся
const mk = rec => { for (const k in rec) if (k !== 'title' && (rec[k] == null || rec[k] === '')) delete rec[k]; return rec; };

// Подпись цели по стату: «от 120», «от 75%». Пока название цели совпадает с подписью, оно идёт за числом само.
function unitOf(stat) {
  const d = (S.statDefs || []).find(x => x.id === stat);
  if (d) return d.lines.length && d.lines.every(key => ((propOf(key) || {}).text || '').includes('#%')) ? '%' : '';
  return (D.units || {})[stat] || '';
}
const autoTitle = g => /*raw*/'от ' + g.min + unitOf(g.stat);      // пишется в план: всегда так; показ — по языку
// Часть слота, в которой живёт цель по стату: у целей одного стата на одной вещи она общая (это ступени).
function statPart(g) {
  const same = S.goals.find(x => x !== g && x.slot === g.slot && x.part && x.stat === g.stat && (x.use || '') === (g.use || ''));
  if (same) return same.part;
  const used = new Set(S.goals.filter(x => x !== g && x.slot === g.slot && x.part).map(x => x.part));
  let p = g.stat, n = 2;
  while (used.has(p)) p = g.stat + '-' + n++;
  return p;
}

function addSkill() {
  const like = lastOf(g => g.kind === 'skill');
  insertAfter(lastOf(g => tabOf(g) === 'gems') || lastOf(g => tabOf(g) === 'items'),
    mk({id: freeId('skill-new'), kind: 'skill', group: like && like.group, title: ''}));
}
// Поддержка умения: в новое гнездо или следующей ступенью в гнездо поддержки rung («Приказание I» → «II»).
function addSupport(sk, rung) {
  let part = null, after = lastOf(g => g.for === sk.id && !isLevel(g)) || sk;
  if (rung) {
    if (!rung.part) {
      const used = new Set(kids(sk.id).map(g => g.part));
      let p = slug(engOf(rung.title).replace(/\s+[IVX]+$/, '')) || 'socket', n = 2;
      const base = p;
      while (used.has(p)) p = base + '-' + n++;
      rung.part = p;
    }
    part = rung.part;
    after = lastOf(g => g.for === sk.id && g.part === part);
  }
  // шаги камня поддержки — от умения: ждут его с его собственного шага, снимают вместе с умением (копировать их не нужно)
  const g = mk({id: 'new', kind: 'support', group: sk.group, part, title: '', for: sk.id});
  g.id = niceId(g);
  insertAfter(after, g);
  open.delete(g.id);        // поддержку называют прямо в строке: её подробности сами не раскрываются
}
function freeLevels(sk, self) {
  const used = new Set(kids(sk.id).filter(g => isLevel(g) && g !== self).map(g => +g.title));
  const out = [];
  for (let n = (gemStart(sk) || 1) + 1; n <= (D.gemLevels || 20); n++) if (!used.has(n)) out.push(n);
  return out;
}
function addLevel(sk) {
  const mine = kids(sk.id).filter(isLevel), top = Math.max(gemStart(sk) || 1, ...mine.map(g => +g.title || 0));
  const free = freeLevels(sk), n = free.find(x => x > top) || free[0];
  if (!n) { msg = {ok: false, text: T('все уровни камня уже названы')}; return; }
  open.delete(insertAfter(mine[mine.length - 1] || lastOf(g => g.for === sk.id) || sk,
    mk({id: levelId(sk, n), kind: 'gem', group: sk.group, part: 'level', title: String(n), for: sk.id})).id);
}
// Новая цель слота встаёт за последней целью своего периода (use — шаг его начала, пусто — с начала забега), а нет
// их — за последней целью слота; вещей в билде ещё нет — в начало списка, перед камнями.
function intoSlot(slot, use, g, basesOnly) {
  const here = x => x.slot === slot && (x.use || '') === (use || '');
  const anchor = (basesOnly && lastOf(x => here(x) && !x.part)) || lastOf(here) || lastOf(x => x.slot === slot) || lastOf(x => tabOf(x) === 'items');
  if (anchor) return insertAfter(anchor, g);
  S.goals.unshift(g);
  fresh.add(g.id);
  open.add(g.id);
  return g;
}
// Новый предмет и новый стат заводят в периоде слота: шаги «используется» и класс они берут у него (use — шаг его начала).
function addBase(slot, use) {
  // предмет называют прямо в строке: его подробности сами не раскрываются
  open.delete(intoSlot(slot, use, mk({id: freeId(slot + '-new'), use: use || null, slot, title: ''}), true).id);
}
function addStat(slot, use) {
  const have = new Set(S.goals.filter(g => g.slot === slot && g.part && (g.use || '') === (use || '')).map(g => g.stat));
  const stat = (statList().find(c => !have.has(c.id)) || statList()[0] || {}).id;
  if (!stat) return;
  const g = mk({id: 'new', use: use || null, slot, part: 'new', stat, min: 1, title: ''});
  g.part = statPart(g);
  g.title = autoTitle(g);
  g.id = niceId(g);
  open.delete(intoSlot(slot, use, g, false).id);
}
function addOther() {
  insertAfter(null, {id: freeId('goal-new'), title: ''});
}
function removeGoal(g) {
  const drop = new Set([g.id]);
  if (g.kind === 'skill') for (const k of kids(g.id)) drop.add(k.id);
  S.goals = S.goals.filter(x => !drop.has(x.id));
  // цель, которую давала удалённая («умение даёт скипетр»), остаётся — но уже сама по себе
  for (const x of S.goals) if (drop.has(x.grantedBy)) delete x.grantedBy;
  for (const id of drop) { open.delete(id); fresh.delete(id); }
  asked = null;
}
function moveSkill(sk, dir) {
  const skills = S.goals.filter(g => g.kind === 'skill'), other = skills[skills.indexOf(sk) + dir];
  if (!other) return;
  const block = s => [s].concat(kids(s.id));
  const a = block(dir < 0 ? other : sk), b = block(dir < 0 ? sk : other);       // сейчас a стоит раньше b
  place(a.concat(b), b.concat(a));
}
function moveBase(g, dir) {
  const bases = S.goals.filter(x => x.slot === g.slot && !x.part && (x.use || '') === (g.use || '')), other = bases[bases.indexOf(g) + dir];
  if (other) place([g, other], dir < 0 ? [g, other] : [other, g]);
}

// Название выбрано или набрано: у базы предмета из данных игры берётся рисунок (что это за предмет — класс и род
// базы — говорит период слота); id ещё не
// записанной цели называется по её имени. Справку игры — с какого уровня камня умение делают, с какого уровня
// зоны падает база, рисунок базы у общего названия («Ростовой щит») — страница в план не пишет: программа берёт
// её из данных игры сама (gamedata.with_facts). То, что было записано под прежним названием, с новым названием
// не остаётся — и рисунок тоже.
function titled(g) {
  if (g.kind === 'skill') { const f = gemFact(g); if (f && f.level >= 1) delete g.gemFrom; }
  if (g.slot && !g.part) {
    delete g.opens;
    delete g.gear;
    const hit = slotBases(slotOf(g.slot)).find(x => x.name === g.title);
    if (hit && hit.icon) g.icon = hit.icon; else delete g.icon;
  }
  if (fresh.has(g.id)) rename(g, niceId(g));
}

// Что видно в строке помимо названия и срока: с какого шага и уровня героя ищут (предмет) и на каком шаге
// снимают — у камня поддержки, только если шаг не как у самого умения. С какого шага ждут умение и его камни
// поддержки, считает программа: это их собственный шаг, отдельного поля у них нет.
function spanText(g, base) {
  const out = [];
  if (g.from && !g.for) out.push(T('искать с «') + stepName(g.from) + '»');
  if (g.until && !(base && base.until === g.until)) out.push(T('снять «') + stepName(g.until) + '»');
  if (g.hero && !g.for) out.push(T('с {0} ур. героя', g.hero));
  return out.join(' · ');
}
const fld = (label, html, wide) => `<div class="fld${wide ? ' wide' : ''}"><span class="lab">${label}</span>${html}</div>`;
const inp = (g, f, o = {}) => `<input data-id="${g.id}" data-f="${f}"${o.num ? ' type="number" class="num"' : o.cls ? ` class="${o.cls}"` : ''}` +
  `${o.ph ? ` placeholder="${esc(o.ph)}"` : ''} value="${esc(g[f] == null ? '' : g[f])}">`;
const stepSel = (g, f, none, cls) => `<select data-step data-id="${g.id}" data-f="${f}"${cls ? ` class="${cls}"` : ''}><option value="">${esc(none)}</option>${STEPS}</select>`;
const flagBtn = (g, f, label, hint) => `<button class="kind${g[f] ? ' on' : ''}" data-flag="${g.id}:${f}" title="${esc(hint)}">${label}</button>`;
// Цель шага стоит в карточке своего шага, поэтому шаг у неё не поле, а перенос — тем же списком, каким переносят
// сам шаг. (Раньше тут было поле «На шаге» с названием этого же шага: что оно значит, было не понять.)
const goalMove = g => `<select data-gmove="${g.id}" title="${T('Перенести цель на другой шаг маршрута')}"><option value="">${T('перенести на шаг…')}</option>${STEPS}</select>`;

// Замечания проверки, которые относятся к цели: чего не хватает камню или вещи, срок на удачу. Строка под целью.
// подробность замечания — в подсказке: у нехватки атрибута это «есть = …», у остальных — сама подробность
const fndTip = f => f.detail ? (f.kind === 'attr' ? T('есть =') + ' ' : '') + f.detail : '';
const fndText = id => F.filter(f => f.goal === id).map(f =>
  `<div${f.level === 'bad' ? '' : ' class="soft"'} title="${esc(fndTip(f))}">${esc((f.later ? T('с этапа «') + f.later + '» — ' : '') + f.text)}</div>`).join('');
const fndBox = id => `<div class="fnd" data-fnd="${esc(id)}">${fndText(id)}</div>`;
// Замечания проверки о самом шаге маршрута (зона шага повторяется): строкой под шагом; «к сведению» — тише.
const fndStep = id => F.filter(f => f.kind === 'route' && f.step === id).map(f =>
  `<div${f.level === 'bad' ? '' : ' class="soft"'}>${esc(f.text)}</div>`).join('');
const fndStepBox = id => `<div class="fnd" data-fndr="${esc(id)}">${fndStep(id)}</div>`;
// Строка цели: [место] [что] [не позже] [⋯]; под ней мелко — с какого шага. o.what — своё поле
// «что» (уровень камня, стат и число); o.names — название выбирают из вещей игры (nameField: nb, nu); o.base — умение, при котором
// цель живёт; o.due — подпись перед списком шага («не позже»); o.detail — подробности цели (у каждого вида свои).
function goalRow(g, o = {}) {
  const isOpen = open.has(g.id), sub = spanText(g, o.base);
  const what = o.what || (o.names ? nameField(o.names, g, o.ph || T('название')) : inp(g, 'title', {cls: 't', ph: o.ph || T('название')}));
  return `<div class="g${isOpen ? ' open' : ''}${o.head ? ' head' : ''}${o.lead != null ? ' led' : ''}"><div class="grow">` +
    (o.lead != null ? `<span class="lead"${o.leadTip ? ` title="${esc(o.leadTip)}"` : ''}>${o.lead}</span>` : '') + what +
    (o.due ? `<span class="lab due">${o.due}</span>` : '') +
    stepSel(g, 'need', T('без срока'), 'need') + (o.tools != null ? `<span class="tools">${o.tools}</span>` : '') +
    `<button data-more="${g.id}" title="${T('Подробности')}">${isOpen ? '▾' : '⋯'}</button>` +
    '</div>' + (sub && !isOpen ? `<div class="gsub" title="${esc(sub)}">${esc(sub)}</div>` : '') + fndBox(g.id) +
    (isOpen ? o.detail(g, o) : '') + '</div>';
}

// --- умения: умение — строка, как шаг маршрута; раскрытое — карточка блоками-строками ---
// Справка игры о вещи, которую план называет по имени, — её автор не выбирает: страница только показывает,
// а программа при чтении плана подставляет сама (gamedata.with_facts). Вещь узнаётся по английскому имени
// из названия вида «Русское (English)»; название другого вида («любой», с припиской после скобок) — не из игры.
const engExact = t => { const m = /^[^()]*\(([^()]*)\)\s*$/.exec(t || ''); return (m ? m[1] : t || '').trim(); };
// умение: {level — с какого уровня камня его делают (0 — камня не делают), bases — базы, которые дают его сами}
const gemFact = sk => (D.gemFacts || {})[engExact(sk.title)] || null;
// предмет плана, база которого даёт это умение сама (скипетр — приспешника)
function giverOf(sk) {
  const f = gemFact(sk), bases = new Set(((f && f.bases) || []).map(engExact));
  return bases.size ? S.goals.find(g => g.slot && !g.part && bases.has(engExact(g.title))) || null : null;
}
// С какого уровня камня умение начинается: из данных игры; игра не знает — что назвал автор.
const gemStart = sk => { const f = gemFact(sk); return f && f.level >= 1 ? f.level : sk.gemFrom || null; };
// база предмета слота: {name, gear — класс и род базы, level — с какого уровня зоны падает}
const baseFact = (g, sl) => { const en = engExact(g.title); return (sl && slotBases(sl).find(x => engExact(x.name) === en)) || null; };
// Название, которое входит в названия нескольких баз («Ростовой щит»): базы слота, которые оно называет. Так же их
// находит программа (gamedata.named_bases): по ним она узнаёт скопированный предмет, берёт рисунок цели и образец
// для проверки фильтра. Вариант, который делают, а не находят (made), не в счёт, пока есть обычные.
const localName = t => String(t || '').split(' (')[0].split(':')[0].trim().toLowerCase();
function familyOf(g, sl) {
  const local = localName(g.title);
  if (local.length < 3 || g.any || !sl || baseFact(g, sl)) return [];
  // название базы на любом языке: русская часть «Русское (English)» или английская
  const both = x => [localName(x.name), engExact(x.name).toLowerCase()];
  const rows = slotBases(sl).filter(x => both(x).some(n => n.includes(local)));
  const found = rows.filter(x => !x.made);
  return found.length ? found : rows;
}
const familyText = rows => rows.length + ' ' + plural(rows.length, 'база', 'базы', 'баз');
// класс и род базы названы, когда они у всех этих баз одни
function familyFact(rows) {
  const [cls, kind] = gearParts(rows[0].gear);
  const oneClass = rows.every(x => gearParts(x.gear)[0] === cls), oneKind = rows.every(x => x.gear === rows[0].gear);
  const kindName = oneKind && kind ? (((classOf(cls) || {}).kinds || []).find(k => k.id === kind) || {label: kind}).label : '';
  return (oneClass ? className(cls) + ' · ' : '') + (kindName ? kindName + ' · ' : '') + T('{0} с таким названием — подойдёт любая', familyText(rows));
}
// Что об умении записано — одной строкой у его названия, в порядке карточки: на каком шаге его надеть,
// на каком снять, сколько при нём поддержек и уровней камня.
function skillHow(sk) {
  const ch = kids(sk.id), lv = ch.filter(isLevel).length, sup = ch.length - lv;
  return [sk.need ? T('надеть «') + stepName(sk.need) + '»' : T('без срока'),
    sk.until ? T('снять «') + stepName(sk.until) + '»' : '',
    giverOf(sk) ? T('даёт предмет') : '',
    sup ? sup + ' ' + plural(sup, 'камень поддержки', 'камня поддержки', 'камней поддержки') : '',
    lv ? lv + ' ' + plural(lv, 'уровень камня', 'уровня камня', 'уровней камня') : ''].filter(Boolean).join(' · ');
}
// Замечания проверки об умении и обо всём, что при нём, — под его строкой, пока карточка свёрнута: что не так,
// видно, не раскрывая её. В раскрытой карточке каждое замечание стоит у своей цели.
function fndSkill(id) {
  const mine = new Map([[id, '']].concat(kids(id).map(g => [g.id, isLevel(g) ? (T('уровень камня') + ' ') + g.title : g.title || T('камень поддержки')])));
  return F.filter(f => mine.has(f.goal)).map(f => `<div${f.level === 'bad' ? '' : ' class="soft"'} title="${esc(fndTip(f))}">` +
    esc((mine.get(f.goal) ? mine.get(f.goal) + ' — ' : '') + (f.later ? T('с этапа «') + f.later + '» — ' : '') + f.text) + '</div>').join('');
}
// Блок карточки — строка: слева его имя (что это за блок — в подсказке), справа содержимое.
const cardRow = (name, tip, body) => `<div class="rpar"><span class="lab" title="${esc(tip)}">${name}</span><div class="rval">${body}</div></div>`;
// «Искать»: раньше этого шага или уровня героя цель не ищут — на странице забега она помечена «позже».
const SEEK_TIP = T('Раньше этого шага и этого уровня героя цель не ищут: на странице «Игра» она помечена «позже»');
const seekRow = g => `<div class="rline"><span class="lab">${T('с')}</span>${stepSel(g, 'from', '—', 'need')}` +
  `<span class="lab">${T('с уровня героя')}</span>${inp(g, 'hero', {num: true})}</div>`;

// --- слоты: носители вещей ---
const slotOf = id => (S.slots || D.slots || []).find(x => x.id === id);
const classOf = id => (D.classes || []).find(c => c.id === id);
// Класс предмета, как он назван в игре: по-русски, английское имя — в скобках.
const className = id => { const c = classOf(id); return c && c.name ? c.name + ' (' + id + ')' : id; };
// Описание базы: «Helmet int_armour» -> ['Helmet', 'int_armour'], «Ring» -> ['Ring', ''] — как читает программа.
const gearParts = v => { const m = /^(.+) ([a-z]+(?:_[a-z]+)+)$/.exec(v || ''); return m ? [m[1], m[2]] : [v || '', '']; };
// Период слота — что в нём носят с шага from (нет поля — с начала забега): классы предметов (classes) и род базы
// (kind; нет — как у этапа). Периоды лежат в слоте (wear) по порядку шагов; период длится, пока не начался
// следующий. Предмет и стат слота стоят в своём периоде полем use — шаг его начала.
const wearOf = sl => (sl && sl.wear) || [];
const perKey = (sl, p) => sl.id + '|' + (p.from || '');
const perAt = key => { const k = key.indexOf('|'), sl = slotOf(key.slice(0, k)); return [sl, wearOf(sl).find(p => (p.from || '') === key.slice(k + 1))]; };
const perOf = (sl, use) => wearOf(sl).find(p => (p.from || '') === (use || ''));
const inPer = (sl, p) => g => g.slot === sl.id && (g.use || '') === (p.from || '');
const slotClasses = sl => (sl && sl.wear ? [...new Set(sl.wear.flatMap(p => p.classes || []))] : (sl && sl.classes) || []);
const sortWear = sl => sl.wear.sort((a, b) => stepAt(a.from || null) - stepAt(b.from || null));
const perName = p => (p.from ? T('с шага «') + stepName(p.from) + '»' : T('с самого начала'));
// По какой шаг период длится: записанный срок, иначе шаг перед началом следующего периода; последний — до конца.
// Стоит после тире за списком начала периода — поэтому без «по».
function perEnd(sl, p) {
  if (p.until) return stepName(p.until);
  const w = wearOf(sl), nxt = w[w.indexOf(p) + 1], at = nxt ? stepAt(nxt.from) : -1;
  return !nxt ? T('до конца плана') : at > 0 ? STEPLIST[at - 1].name : '';
}
// Базы вещей из данных игры по классам, по порядку классов и уровня: у слота — базы классов всех его периодов.
function basesOf(classes) {
  const rows = [], seen = new Set();
  for (const c of classes || []) for (const r of (D.classBases || {})[c] || []) if (!seen.has(r.name)) { seen.add(r.name); rows.push(r); }
  return rows;
}
function slotBases(sl) {
  if (!D.classBases) return (sl && (D.bases || {})[sl.id]) || [];
  return basesOf(slotClasses(sl));
}
function freeSlotId(base, self) {
  const used = new Set(S.slots.filter(x => x !== self).map(x => x.id));
  base = (base || 'slot').slice(0, 36);
  let id = base, n = 2;
  while (used.has(id)) id = base + '-' + n++;
  return id;
}
// Сменить id слота, пока он не записан: цели, которые в нём успели появиться, идут следом.
function renameSlot(sl, id) {
  if (!id || id === sl.id) return;
  const old = sl.id;
  sl.id = id;
  for (const g of S.goals) if (g.slot === old) g.slot = id;
  for (const set of [openSlots, freshSlots]) if (set.delete(old)) set.add(id);
  if (asked === 'slot:' + old) asked = 'slot:' + id;
}
function addSlot() {
  const sl = {id: freeSlotId('slot'), name: '', wear: [{classes: []}]};
  S.slots.push(sl);
  freshSlots.add(sl.id);
  openSlots.add(sl.id);
  focusKey = 's:' + sl.id;
}
// Класс предметов в период: у нового слота по первому классу называются он сам и его id.
function addPerClass(sl, p, cls) {
  if (!sl || !p || (p.classes || []).includes(cls)) return;
  p.classes = (p.classes || []).concat([cls]);
  const c = classOf(cls);
  if (!sl.name && c && c.name) sl.name = c.name;
  if (freshSlots.has(sl.id) && slotClasses(sl).length === 1) renameSlot(sl, freeSlotId(slug(cls), sl));
}
// Последний класс периода не убрать; класс, базой которого назван предмет периода, — тоже. Род базы, которого
// у оставшихся классов не бывает, уходит вместе с классом.
function dropPerClass(sl, p, cls) {
  if (!sl || !p) return;
  if ((p.classes || []).length < 2) { msg = {ok: false, text: T('у периода должен остаться хотя бы один класс предметов')}; return; }
  const named = S.goals.find(g => inPer(sl, p)(g) && !g.part && ((D.classBases || {})[cls] || []).some(r => r.name === g.title));
  if (named) { msg = {ok: false, text: T('класс не убрать — его называет предмет «') + named.title + '»'}; return; }
  p.classes = p.classes.filter(c => c !== cls);
  if (p.kind && !p.classes.some(c => ((classOf(c) || {}).kinds || []).some(k => k.id === p.kind))) delete p.kind;

// Новый период — с выбранного шага (пусто — с начала забега); классы ему называют следом.
function addPeriod(sl, from) {
  if (!sl || perOf(sl, from)) return;
  sl.wear = wearOf(sl).concat([from ? {from, classes: []} : {classes: []}]);
  sortWear(sl);

// Период начинается с другого шага: его предметы и статы идут за ним.
function movePeriod(sl, p, to) {
  if (!sl || !p || (p.from || '') === to) return;
  if (perOf(sl, to)) { msg = {ok: false, text: T('у слота «') + (sl.name || sl.id) + (T('» уже есть период') + ' ') + (to ? T('с шага «') + stepName(to) + '»' : T('с самого начала'))}; return; }
  for (const g of S.goals.filter(inPer(sl, p))) { if (to) g.use = to; else delete g.use; }
  if (to) p.from = to; else delete p.from;

// Период, в котором есть предметы или статы, не убрать: сначала убирают или переносят их; последний период — тоже.
function removePeriod(sl, p) {

  if (wearOf(sl).length < 2) { msg = {ok: false, text: T('у слота должен остаться хотя бы один период')}; return; }

// --- предметы: слот — строка, как умение и шаг маршрута; раскрытый — карточка блоками-строками ---
// Замечания проверки о целях из списка — под свёрнутой строкой их носителя: pairs — [id цели, как её назвать].

const fndSlot = id => fndList(S.goals.filter(g => g.slot === id).map(g => [g.id, g.part ? (g.label || statName(g.stat)) + ' ' + (g.title || '') : shortName(g.title) || T('предмет')]));
// Что о слоте записано — одной строкой у его названия: предметы по порядку (каждый следующий сменяет прежний)

function slotHow(sl) {
  // предметы — по порядку периодов слота, внутри периода — как стоят

// ============================ целевое время шага ============================

// ============================ уход из редактора ============================
// Уйти из редактора — в «Игру» или сменить язык (страница перезагружается) — с несохранёнными правками значит их
// потерять. Поэтому сначала вопрос поверх страницы: сохранить и уйти, отменить правки и уйти, или остаться. Закрыть
// вкладку молча не даст сам браузер: его собственный вопрос (beforeunload).
let leaving = false;          // уход уже решён: вопрос браузера не нужен
function leaveTo(go) {
  if (!dirty()) { leaving = true; return go(); }
  const parts = [...new Set(Object.keys(changedSections()).map(k => (k === 'route' ? T('маршрут') : T('билд'))))].join(', ');
  const box = document.createElement('div');
  box.className = 'leave';
  box.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="leave-h">' +
    `<h3 id="leave-h">${T('Есть несохранённые правки')}</h3>` +
    `<p>${esc(T('Изменено: {0}. Сохранить их перед уходом?', parts))}</p>` +
    `<div class="btns"><button class="go" data-leave="save">${T('Сохранить')}</button>` +
    `<button class="drop" data-leave="drop">${T('Отменить правки')}</button>` +
    `<button data-leave="stay">${T('Остаться')}</button></div></div>`;
  const key = e => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  const close = () => { box.remove(); document.removeEventListener('keydown', key, true); };
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-leave]');
    if (!b) { if (e.target === box) close(); return; }        // нажатие мимо окна — остаться
    if (b.dataset.leave === 'stay') return close();
    if (b.dataset.leave === 'drop') { close(); leaving = true; return go(); }
    // сохранить: уйти, только если записалось; не записалось — остаёмся, причина — в полосе снизу
    for (const x of box.querySelectorAll('button')) x.disabled = true;
    save().then(ok => { close(); if (ok) { leaving = true; go(); } });
  });
  document.addEventListener('keydown', key, true);
  document.body.appendChild(box);
  box.querySelector('[data-leave="save"]').focus();
}
// «Игра» в переключателе режима: с правками на странице — сначала вопрос (нажатие колёсиком открывает «Игру» в
// новой вкладке — редактор остаётся, спрашивать нечего)
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-mode]');
  if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  leaveTo(() => { location.href = a.getAttribute('href'); });
});
window.leaveGuard = leaveTo;

// План целиком (вкладка «Билд»): «Сделать копию» (у присланного — «Сделать свой план на его основе») открывает окно
// «Новый план» с этим планом в основе; кнопка у сообщения внизу — свой план на основе присланного или «Перейти к нему»
// (выбранный план сменили на другой странице, а здесь несохранённые правки).
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-plancopy], #msgact, [data-planfile]');
  if (!t || !S) return;
  const post = body => fetch(langUrl('/api/plans'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json()).catch(() => ({ok: false, problems: [T('нет связи с программой')]}));
  const fail = j => { msg = {ok: false, text: (j.problems || []).join('; ') || T('программа отказала')}; render(); };
  if (t.dataset.planfile !== undefined) {
    const note = dirty() ? ' · ' + T('в файле — план, как он записан: несохранённых правок в нём нет') : '';
    // встроенный браузер приложения Claude файлы не скачивает: файл плана пишет программа — в папку export проекта
    if (NO_NEW_TABS) {
      e.preventDefault();
      post({save: PLAN}).then(j => {
        if (!j.ok) return fail(j);
        msg = {ok: true, text: T('файл плана сохранён: {0}', j.path) + note};
        render();
      });
    } else if (note) { msg = {ok: false, text: note.slice(3)}; bar(); }
    return;
  }
  if (t.dataset.plancopy !== undefined) { ctxNewOpen(PLAN, 'all'); return; }     // окно «Новый план»: основа — этот план
  if (t.id === 'msgact' && barAct) {
    const act = barAct;
    if (act.mine) { ctxNewOpen(PLAN, 'all'); return; }      // присланный план: свой план на его основе
    if (act.go) leaveTo(() => CTX.picked());       // к выбранному плану
  }
});

// ============================ дерево и атлас ============================
// Версии дерева героя и дерева атласа — своя библиотека билда (S.tree, S.atlas): версия — название и полный
// порядок узлов от старта класса. Какая версия действует, говорит этап (вкладка «Этапы»); здесь версии
// создают копией, называют, удаляют и правят на карте. Карта — настоящее дерево по координатам из данных
// игры (/tree.json, /atlas.json). Нажатие на свободный узел берёт его вместе с кратчайшим путём от уже
// взятых (узлы встают в конец порядка — как их брали бы в игре); нажатие на взятый узел убирает его и всё,
// что без него повисает; у узла «Характеристика» нажатие открывает выбор атрибута. Под курсором — что узел
// даёт (текст из данных игры). Правки живут на странице, как и остальные, до общего «Сохранить».
const MAP_SCALE = 0.085, MAP_MIN = 0.03, MAP_MAX = 0.2;   // 0.085 — между соседними узлами около 22 px
const MAP_R = [50, 50, 82, 120, 86, 150];                  // радиус узла по виду, в единицах дерева
const ATTR_GAIN = 5;                                       // узел «Характеристика» даёт +5 к выбранному атрибуту
const ATTR_WORD = {str: T('сила'), dex: T('ловк'), int: T('инт')};
const ATTR_ID = {'сила': 'str', 'сил': 'str', 'ловк': 'dex', 'ловкость': 'dex', 'инт': 'int', 'интеллект': 'int'};
const ATTR_FULL = {str: T('сила'), dex: T('ловкость'), int: T('интеллект')};
const attrId = a => (a && (ATTR_WORD[a] ? a : ATTR_ID[String(a).toLowerCase()])) || null;
// Запись узла версии: атрибут («Характеристика» дерева героя) и номер варианта (узел атласа с выбором) пишутся,
// только если выбраны.
const tnode = (id, attr, opt) => { const n = {id}; if (attr) n.attr = attr; if (opt) n.opt = opt; return n; };
const TG = {tree: null, atlas: null};         // геометрия деревьев: {nodes, edges, at, near, roots, …}
const TGBAD = {tree: false, atlas: false};    // файла геометрии нет
const TSTATS = {tree: null, atlas: null};     // что даёт каждый узел: {id: [строки]} — файл берётся при первом показе
let RUN = null;                               // что герой текущего забега уже взял: {tree: {have, free}, atlas: {have}}
const mapView = {x: 0, y: 0, s: MAP_SCALE};   // окно карты: центр в единицах дерева и масштаб
// что сейчас открыто на вкладке: какое дерево, какая версия, узел под курсором, путь к нему (pre) или то, что нажатие
// уберёт (cut), меню атрибута
const TE = {kind: 'tree', ver: null, hover: -1, pre: null, cut: null, route: null, menu: null, msg: null, fit: true, copy: false};
let treesAsked = false;

function geoIndex(g) {
  // на другом языке страницы названия деревьев атласа и условия узлов — строками игры этого языка (treesLang,
  // condsLang; названия, которого игра не даёт, — английское слово дерева)
  if (g.trees && I18N.lang !== I18N.source) {
    const here = (g.treesLang || {})[I18N.lang];
    g.trees.forEach((t, k) => { t.name = (here && here[k]) || t.key || t.name; });
  }
  if (g.conds && I18N.lang !== I18N.source && g.condsLang && g.condsLang[I18N.lang]) g.conds = g.condsLang[I18N.lang];
  g.at = new Map(g.nodes.map((n, i) => [n[0], i]));
  g.near = new Map();
  for (const e of g.edges) {
    for (const [a, b] of [[e[0], e[1]], [e[1], e[0]]]) {
      if (!g.near.has(a)) g.near.set(a, []);
      g.near.get(a).push(b);
    }
  }
  g.roots = g.nodes.map((n, i) => (n[3] === 5 ? i : -1)).filter(i => i >= 0);
  return g;
}
// Геометрия обоих деревьев и то, что герой уже взял, — один раз, когда вкладку открыли впервые.
function loadTrees() {
  if (treesAsked) return;
  treesAsked = true;
  const get = (url, key, ok) => fetch(url).then(r => (r.ok ? r.json() : null))
    .then(g => { if (g && ok(g)) TG[key] = geoIndex(g); else TGBAD[key] = true; if (tab === 'tree') render(); })
    .catch(() => { TGBAD[key] = true; if (tab === 'tree') render(); });
  get(langUrl('/tree.json'), 'tree', g => g.nodes);
  get(langUrl('/atlas.json'), 'atlas', g => g.nodes && g.trees);
  fetch(langUrl('/api/view')).then(r => r.json()).then(v => {
    RUN = {tree: v.tree ? {have: v.tree.have || [], free: v.tree.free || 0} : null, atlas: v.atlas ? {have: v.atlas.have || []} : null};
    // правится план, по которому герой не идёт: взятое героем к нему не относится
    if (D && D.plans && D.plans.library && D.planId !== D.plans.current) RUN = null;
    if (tab === 'tree') render();
  }).catch(() => { /* без забега правка работает так же: взятое героем просто не показано */ });
}
function loadNodeTexts(kind) {
  if (TSTATS[kind]) return;
  TSTATS[kind] = {};
  // строки узлов — на языке страницы (treestats.<язык>.json, atlasstats.<язык>.json; нет файла — общий), как на «Игре»
  const get = url => fetch(url).then(r => (r.ok ? r.json() : null), () => null);
  const want = kind === 'atlas' ? get('/atlasstats.' + I18N.lang + '.json').then(d => d || get('/atlasstats.json'))
    : I18N.lang === 'en' ? get('/treestats.json') : get('/treestats.' + I18N.lang + '.json').then(d => d || get('/treestats.json'));
  want.then(d => { TSTATS[kind] = d || {}; if (tab === 'tree' && TE.menu) render(); })
    .catch(() => { /* без текстов узлов правка работает: подсказка короче */ });
}
const tePlan = () => S[TE.kind];
const teGeo = () => TG[TE.kind];
const teCur = () => tePlan().versions.find(v => v.id === TE.ver) || null;
const teHave = () => ((RUN && RUN[TE.kind]) || {}).have || [];
// Этапы, которые назвали версию: с них она действует; ни одного — это черновик.
const teStages = id => S.stages.filter(st => st[TE.kind] === id).map(st => st.name || st.id);
// название узла: по-русски — слой ru файла, на другом языке игры — here (программа добавляет его к файлу), иначе английское
const geoName = (g, i) => { const n = g.nodes[i]; return (I18N.lang === I18N.source && g.ru && g.ru[n[4]]) || (g.here && g.here[n[0]]) || n[4]; };
// Условия узла атласа словами клиента; пустой список — условий нет; null — данных нет.
const atlasWhen = (g, i) => { const c = g.nodes[i][6]; return c === null ? null : (c || []).map(k => g.conds[k]); };
// Название узла: как в игре, если оно известно (из плана или из лога), иначе английское из данных дерева.
function teName(i) {
  const g = teGeo(), id = g.nodes[i][0];
  if (g.trees && g.nodes[i][3] === 5) return g.trees[g.nodes[i][5]].name;   // корень дерева атласа — его именем
  return (I18N.lang === I18N.source && (((D.treePlan || {})[TE.kind] || {}).names || {})[id]) || geoName(g, i) || id;
}
// Узел, в котором автор что-то выбирает: в дереве героя — «Характеристика» (атрибут), в атласе — узел с выбором
// (один из вариантов). Пока не выбрано, узел на карте пустой.
const teAsks = i => teGeo().nodes[i][3] === (TE.kind === 'atlas' ? 3 : 1);
// Порядок больших узлов версии — значимых, ключевых, узлов с выбором, гнёзд: тех, что подписаны на карте:
// {номер узла в данных дерева: каким по счёту из больших его берут}. Малые узлы и «Характеристики» в счёт
// не идут: на развилке видно, к какому большому узлу план идёт сначала. Атлас — несколько независимых
// деревьев: очки у каждого свои, поэтому и счёт свой — в каждом дереве с единицы; между деревьями порядка нет.
// per — сколько больших узлов в каждом дереве: {номер дерева: число} (у дерева героя дерево одно — 0).
function teOrd(cur) {
  const g = teGeo(), out = new Map(), per = new Map();
  for (const n of cur.nodes) {
    const i = g.at.get(n.id);
    if (i === undefined || g.nodes[i][3] < 2) continue;
    const k = teTreeOf(i);
    per.set(k, (per.get(k) || 0) + 1);
    out.set(i, per.get(k));
  }
  out.per = per;
  return out;
}
// Номер дерева узла i: в атласе — дерево из данных атласа, у дерева героя — 0 (дерево одно).
const teTreeOf = i => (TE.kind === 'atlas' && teGeo().trees ? teGeo().nodes[i][5] : 0);
// Атлас: узлы версии лежат по деревьям — в порядке деревьев атласа, внутри дерева в порядке взятия. Порядок
// важен только внутри дерева; так версия и записывается в файл — дерево за деревом.
function atlasGroup(nodes) {
  const g = teGeo(), tree = x => { const i = g.at.get(x.id); return i === undefined ? 1e9 : g.nodes[i][5]; };
  return nodes.map((x, k) => [tree(x), k, x]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(e => e[2]);
}
// Открытая версия должна существовать: версию убрали или дерево сменили — открывается первая.
function teSync() {
  if (!S[TE.kind]) TE.kind = 'tree';
  const vers = tePlan().versions;
  if (!vers.some(v => v.id === TE.ver)) Object.assign(TE, {ver: vers.length ? vers[0].id : null, fit: true, menu: null, pre: null, cut: null, route: null, hover: -1});
}
// Новая версия — копия открытой, встаёт последней. Пока её не назвал ни один этап, она нигде не действует:
// это черновик. Самая первая версия дерева (у билда его ещё не было) сразу назначается первому этапу.
function teAddVersion() {
  const plan = tePlan(), cur = teCur(), first = !plan.versions.length;
  let id = TE.kind === 'atlas' ? 'atlas' : 'start', n = 2;
  if (!first) { while (plan.versions.some(v => v.id === 'v' + n)) n++; id = 'v' + n; }
  plan.versions.push({id, name: first ? (TE.kind === 'atlas' ? T('Атлас') : T('Дерево')) : T('Новая версия'), nodes: cur ? cur.nodes.map(x => tnode(x.id, x.attr, x.opt)) : [],
    items: cur ? (cur.items || []).map(x => ({id: x.id, slot: x.slot})) : [], without: ''});
  // атлас есть только на картах: его первую версию получает первый этап, который начинается на картах
  const to = TE.kind === 'atlas' ? S.stages.find((st, i) => stageOnMaps(st, i)) : S.stages[0];
  const bound = first && !!to && !S.stages.some(st => st[TE.kind]);
  if (bound) to[TE.kind] = id;
  Object.assign(TE, {ver: id, menu: null, pre: null, cut: null, route: null, copy: false, fit: true, hover: -1,
    msg: {ok: true, text: bound ? T('первая версия — назначена этапу «') + (to.name || to.id) + '»'
      : first && TE.kind === 'atlas' && !to ? T('этапа на картах нет — заведите его на вкладке «Этапы»: атлас есть только на картах')
        : T('создана копией · этап ей назначают на вкладке «Этапы»')}});
  focusKey = 'tv:' + id;
}

// Старт класса, от которого растёт версия: сосед её первого узла; у пустой версии — старт класса героя,
// а если класс не назван — как у другой версии.
function teRoot(nodes) {
  const g = teGeo(), first = nodes.length ? g.at.get(nodes[0].id) : undefined;
  const startOf = i => (g.near.get(i) || []).find(j => g.nodes[j][3] === 5);
  if (first !== undefined && startOf(first) !== undefined) return startOf(first);
  const cls = (g.classes || []).find(c => c.id === (S.hero || {}).class);
  if (cls && g.at.has(cls.start)) return g.at.get(cls.start);
  for (const v of tePlan().versions) {
    if (v.nodes.length && v.nodes !== nodes) {
      const r = startOf(g.at.get(v.nodes[0].id));
      if (r !== undefined) return r;
    }
  }
  return undefined;
}
// Узлы, от которых версия растёт: у дерева героя — один старт класса, у атласа — корни всех его деревьев.
function teRoots(nodes) {
  if (TE.kind === 'atlas') return new Set(teGeo().roots);
  const r = teRoot(nodes);
  return new Set(r === undefined ? [] : [r]);
}
// Что возьмёт нажатие на свободный узел i: {path, mids, free, block}. path — номера узлов, которые войдут
// в версию, от дерева к узлу (null — взять нельзя); mids — значимые узлы на этом пути, кроме самого узла;
// free — сколько узлов пути герой уже взял; block — узел, который нужно отметить сначала (−1 — такого нет).
function teRoute(i) {
  if (TE.kind === 'atlas') return atlasRoute(i);
  return {path: tePath(i), mids: [], free: 0, block: -1};
}
// Путь к узлу атласа. Отмечают ключевые узлы — путь к ним в версию дописывается сам:
//   · кратчайший по очкам, от узлов версии или от корня дерева — откуда ближе; то, что герой уже взял,
//     по пути бесплатно;
//   · через узел с выбором не идёт никогда (кроме уже взятого героем): такой узел отмечают сами — он и назван
//     в ответе как block;
//   · значимые узлы по пути берутся наравне с малыми и названы (mids). Из путей равной длины выбирается тот,
//     где значимых меньше.
// Цена узла на пути: малый 1000, значимый 1001, взятый героем 0, узел с выбором — миллиард: путь с такой
// ценой и есть «нельзя».
const ROUTE_STEP = 1000, ROUTE_BIG = 1e9;
function atlasRoute(i) {
  const g = teGeo(), cur = teCur();
  const none = {path: null, mids: [], free: 0, block: -1};
  const mine = new Set(cur.nodes.map(n => g.at.get(n.id)));
  if (mine.has(i) || g.nodes[i][3] === 5) return none;
  const have = new Set(teHave().map(id => g.at.get(id)));
  const roots = new Set(g.roots);
  const cost = b => (have.has(b) ? 0 : g.nodes[b][3] === 3 ? ROUTE_BIG : g.nodes[b][3] === 2 ? ROUTE_STEP + 1 : ROUTE_STEP);
  const dist = new Map([[i, 0]]), prev = new Map([[i, -1]]), done = new Set();
  for (;;) {
    let a = -1;
    for (const [n, d] of dist) if (!done.has(n) && (a < 0 || d < dist.get(a))) a = n;
    if (a < 0) return none;
    done.add(a);
    const near = g.near.get(a) || [];
    if (near.some(b => mine.has(b) || roots.has(b))) {
      const path = [];
      for (let x = a; x !== -1; x = prev.get(x)) path.push(x);
      const between = path.filter(x => x !== i && !have.has(x));   // что на пути нужно взять, кроме самого узла
      if (dist.get(a) >= ROUTE_BIG) {
        const stop = between.find(x => g.nodes[x][3] === 3);
        return Object.assign(none, {block: stop === undefined ? -1 : stop});
      }
      return {path, mids: between.filter(x => g.nodes[x][3] === 2), free: path.filter(x => have.has(x)).length, block: -1};
    }
    for (const b of near) {

// Что освободит узел версии, если его даёт амулет, а не очко: он сам и малые узлы пути, который вёл только к нему
// (так же считает страница забега — anoint.spare). Узел, без которого путь к другим узлам версии обрывается, — null:
// ведёт ли путь от узла с амулета, в игре не проверено.
function teFrees(cur, id) {
  const g = teGeo(), a = g.at.get(id);
  const want = new Set(cur.nodes.map(n => g.at.get(n.id)).filter(i => i !== undefined));
  if (a === undefined || !want.has(a)) return null;
  const starts = g.nodes.map((n, i) => (n[3] === 5 ? i : -1)).filter(i => i >= 0);
  const keep = new Set([...want, ...starts]);
  keep.delete(a);
  const seen = new Set(starts), stack = [...starts];
  while (stack.length) {
    for (const y of g.near.get(stack.pop()) || []) if (keep.has(y) && !seen.has(y)) { seen.add(y); stack.push(y); }
  }
  for (const i of want) if (i !== a && !seen.has(i)) return null;
  const cut = new Set([a]), edge = new Set(g.near.get(a) || []);
  let changed = true;
  while (changed) {

      if ((g.near.get(x) || []).filter(j => keep.has(j) && !cut.has(j)).length <= 1) {

        for (const j of g.near.get(x) || []) edge.add(j);

    ('<button class="mini" data-tattr="del">' + del(T('убрать')) + '</button></div>');
}
function teAct(k) {
  const plan = tePlan(), cur = teCur();
  if (k !== 'vdel' && k !== 'clear') asked = null;
  if (k === 'vadd') return teAddVersion();
  if (!cur) return;
  if (k === 'vdel') {
    // версию убирают целиком; та, которую назвал этап, и единственная остаются. Записанную версию — со второго
    // нажатия («точно удалить?»), как цели и слоты; созданную на странице и ещё не записанную — сразу
    if (!teStages(cur.id).length && plan.versions.length > 1 && !plan.versions.some(v => v.without === cur.id)) {
      const key = 'tver:' + cur.id, written = (savedS()[TE.kind] || {versions: []}).versions.some(v => v.id === cur.id);
      if (written && asked !== key) { asked = key; return; }
      asked = null;
      const at = plan.versions.indexOf(cur);
      plan.versions.splice(at, 1);
      Object.assign(TE, {ver: plan.versions[Math.max(0, at - 1)].id, menu: null, pre: null, cut: null, route: null, fit: true, hover: -1,
        msg: {ok: true, text: `${T('версия «{0}» убрана', cur.name)}` + (written ? (' ' + T('— исчезнет из файла после «Сохранить»')) : '')}});
    }
  } else if (k.startsWith('fill:')) {
    // всем узлам «Характеристика» версии, где атрибут ещё не выбран, — один атрибут
    const a = k.slice(5), g = teGeo(), empty = x => g.nodes[g.at.get(x.id)][3] === 1 && !x.attr;
    const n = cur.nodes.filter(empty).length;
    if (n && ATTR_WORD[a]) teSet(cur.nodes.map(x => (empty(x) ? tnode(x.id, a, x.opt) : x)),
      (a === 'str' ? T('{0} записана {1} {2} «Характеристика»', ATTR_WORD[a], n, plural(n, 'узлу', 'узлам', 'узлам'))
        : T('{0} записан {1} {2} «Характеристика»', ATTR_WORD[a], n, plural(n, 'узлу', 'узлам', 'узлам'))));
  } else if (k.startsWith('anodel:')) {
    const id = k.slice(7), r = ((D.anoint || {}).nodes || []).find(x => x[0] === id);
    cur.items = (cur.items || []).filter(x => x.id !== id);
    if (!cur.items.length) cur.without = '';        // запасная версия нужна только версии с узлом с амулета
    TE.msg = {ok: true, text: T('узел «{0}» убран с амулета', r ? r[1] : id)};
  } else if (k === 'clear') {
    const key = 'tclear:' + TE.kind + ':' + cur.id;
    if (asked !== key) { asked = key; return; }
    asked = null;
    teSet([], T('версия очищена'));
  }
  else if (k === 'copyon') TE.copy = true;
  else if (k === 'copyoff') TE.copy = false;
  else if (k.startsWith('copy:')) {
    const from = plan.versions.find(v => v.id === k.slice(5));
    if (k === 'copy:@hero') {
      // Дерево героя из лога, в порядке взятия. Выбранные раньше атрибуты узлов остаются; порядок
      // выправляется так, чтобы его можно было пройти (после перекачек лог помнит узлы вперемешку).
      const kept = new Map(cur.nodes.map(n => [n.id, n]));
      const taken = teHave().filter(id => teGeo().at.get(id) !== undefined).map(id => tnode(id, (kept.get(id) || {}).attr, (kept.get(id) || {}).opt));
      const fixed = teRepair(taken, teRoots(taken));
      teSet(fixed.nodes, `${TE.kind === 'atlas' ? T('атлас') : T('дерево')} ${T('героя:')} ${fixed.nodes.length} ${plural(fixed.nodes.length, 'узел', 'узла', 'узлов')}` +
        (fixed.dropped ? ` ${T('· не вошло')} ${fixed.dropped}` : ''));
    } else if (from) teSet(from.nodes.map(n => tnode(n.id, n.attr, n.opt)), T('скопировано'));
    TE.copy = false;
    TE.fit = true;
  }
}

// ============================ вкладка «Билд»: проверка всего плана ============================
// Замечания считает программа — по плану, какой сейчас на странице, со всеми несохранёнными правками:
// после каждой правки страница присылает изменённые разделы (как при записи, но ничего не пишется).
const CHECK_GROUPS = [['plan', T('План записан не так')], ['choice', T('Выбор не сделан')], ['route', T('Маршрут')], ['hero', T('Герой')], ['tree', T('Дерево')],
  ['attr', T('Атрибуты · не хватает камню или предмету')], ['game', T('Раньше, чем бывает в игре')], ['luck', T('Срок на удачу')], ['data', T('Нет данных игры')]];
// Замечания одного вида строками, как они стоят в списке: одна и та же нехватка у нескольких целей — одна
// строка, цели под ней.
function checkRows(kind) {
  const rows = [];
  for (const f of F) {
    if (f.kind !== kind) continue;
    const sub = [f.where, f.detail ? (f.kind === 'attr' ? (T('есть =') + ' ') : '') + f.detail : ''].filter(Boolean).join(' · ');
    const at = f.goal || (f.kind === 'route' ? f.step : '');      // о чём замечание: цель или шаг маршрута
    let r = at ? rows.find(x => x.goals.length && x.text === f.text && x.sub === sub) : null;
    if (!r) rows.push(r = {text: f.text, sub, level: f.level, tab: f.tab, goals: []});
    if (at) r.goals.push(f);
  }
  return rows;
}
// Сколько замечаний нужно править — счёт на вкладке «Билд»: столько же строк выделено в списке.
const badCount = () => CHECK_GROUPS.reduce((n, g) => n + checkRows(g[0]).filter(r => r.level === 'bad').length, 0);
function checkBody() {
  if (!F.length) return ('<div class="okline">' + T('замечаний нет') + '</div>');
  let h = '';
  for (const [kind, title] of CHECK_GROUPS) {
    const rows = checkRows(kind);
    if (!rows.length) continue;
    h += `<h3>${title}</h3>` + rows.map(r => `<div class="crow${r.level === 'bad' ? '' : ' note'}"><div>` +
      `<div class="tx">${esc(r.text)}</div>` + (r.sub ? `<div class="sub">${esc(r.sub)}</div>` : '') +
      (r.goals.length ? '<div class="chips">' + r.goals.map(f => (f.kind === 'route'
        ? `<button data-goto="route" data-gostep="${esc(f.step)}" title="${T('Открыть шаг')}">${esc(f.what || f.step)}</button>`
        : `<button data-goto="${esc((f.tab || 'gems') + ':' + f.goal)}" title="${T('Открыть цель')}">${esc(f.what || f.goal)}</button>`)).join('') + '</div>' : '') +
      '</div>' + (!r.goals.length && r.tab && r.tab !== 'build' ? `<button data-goto="${esc(r.tab)}">${T('открыть')}</button>` : '<span></span>') + '</div>').join('');
  }
  return h;
}
function checkSection() {
  return ('<section><h2>' + T('Проверка билда') + '</h2>') +
    ('<div class="lab">' + T('по плану, какой он сейчас на странице · атрибуты героя на шаге = класс + дерево этапа целиком +') + ' ') +
    (T('атрибуты, запланированные на предметах к концу этого шага («Добавить стат на предмете» со сроком)') + '</div>') +
    `<div id="checkbody" style="margin-top:8px">${checkBody()}</div></section>`;
}
// Вкладка «Билд» — то, что относится к билду целиком, ни к шагу, ни к этапу: название и герой, свои статы и
// проверка. Замечание о названном здесь (класс, вознесение) кнопки «открыть» не имеет: поля — тут же, выше.
const buildTab = () => heroSection() + ownStatsSection() + checkSection();
// Что стоит на вкладке после её названия: сколько замечаний нужно править — словами; править нечего — галочка.
const checkBadge = n => (n ? n + ' ' + plural(n, 'замечание', 'замечания', 'замечаний') : '✓');
const checkTip = n => (T('Проверка билда:') + ' ') + (n ? (T('надо править —') + ' ') + checkBadge(n) : T('править нечего'));
// Переход к строке и курсор в поле не должны уходить под закреплённую шапку: отступ прокрутки — по её высоте
// (снизу, под полосу сохранения, — в стилях). Высота меняется с шириной окна: в узком режим и язык уходят под название.
const headPad = () => { document.documentElement.style.scrollPaddingTop = ($('.hbar').offsetHeight + 8) + 'px'; };
window.addEventListener('resize', headPad);
// значок «откроется в отдельной вкладке»: рамка и стрелка из неё наружу
const OUT_ICON = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M6.5 3.5H3v9.5h9.5V9.5M9.5 2.5h4v4M13.5 2.5l-6 6" ' +
  'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Новые замечания — на страницу без перерисовки: поле, в котором сейчас печатают, остаётся на месте.
function paintFindings() {
  for (const el of document.querySelectorAll('[data-fnd]')) el.innerHTML = fndText(el.dataset.fnd);
  for (const el of document.querySelectorAll('[data-fnds]')) el.innerHTML = fndSkill(el.dataset.fnds);
  for (const el of document.querySelectorAll('[data-fndl]')) el.innerHTML = fndSlot(el.dataset.fndl);
  for (const el of document.querySelectorAll('[data-fndr]')) el.innerHTML = fndStep(el.dataset.fndr);
  const body = $('#checkbody');
  if (body) body.innerHTML = checkBody();
  const t = document.querySelector('[data-tab="build"]');
  if (t) { const n = badCount(); t.classList.toggle('warn', n > 0); t.title = checkTip(n); t.querySelector('.cnt').textContent = checkBadge(n); }
}
function changedSections() {
  const was = savedS(), body = {};
  for (const k of Object.keys(S)) if (JSON.stringify(S[k]) !== JSON.stringify(was[k])) body[k] = S[k];
  return body;
}
function queueCheck() {
  if (!S || !S.goals || snap() === checked) return;
  clearTimeout(checkTimer);
  checkTimer = setTimeout(() => {
    const now = snap(), seq = ++checkSeq;
    fetch(planUrl('/api/check'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(changedSections())})
      .then(r => r.json())
      .then(j => {
        if (seq !== checkSeq || !j || !Array.isArray(j.findings)) return;
        F = j.findings;
        checked = now;
        paintFindings();
        if (j.rare && JSON.stringify(j.rare) !== JSON.stringify(R)) { R = j.rare; paintOrder(); }
        if (j.treeAttrs) TA = j.treeAttrs;
        paintTreeAttrs();
        queueCheck();
      })
      .catch(() => { /* без связи замечания остаются прежними */ });
  }, 400);
}

// ============================ страница ============================
// Присланный план — только для просмотра: поля заперты, кнопок правки нет. Остаётся то, чем план смотрят: раскрыть шаг,
// цель, слот, состав стата, перейти к цели из проверки, другая версия дерева, атлас, масштаб карты — и действия с планом
// целиком (свой план на его основе, файл, убрать из библиотеки).
const VIEW_ONLY = '[data-more],[data-rmore],[data-smore],[data-stopen],[data-goto],[data-gostep],[data-treeopen],[data-tver],' +
  '[data-tkind],[data-tmap],[data-plancopy]';
function lockView() {
  for (const el of document.querySelectorAll('#app input, #app select, #app textarea')) el.disabled = true;
  for (const b of document.querySelectorAll('#app button')) if (!b.matches(VIEW_ONLY)) b.disabled = true;
}
function render() {
  if (!D) return;
  if (D.error && !S) { $('#app').innerHTML = `<div class="alert">${esc(D.error)}</div>`; return; }
  if (!S.goals && tab !== 'stages') tab = 'stages';
  // поле, в котором сейчас курсор, после перерисовки остаётся в работе
  const a = document.activeElement;
  const at = a && a.dataset && a.dataset.f ? [moved[a.dataset.id] || a.dataset.id, a.dataset.f, a.selectionStart] : null;
  // поле шага маршрута: шаг мог сменить id (новый шаг называется по зоне)
  const ats = a && a.dataset && a.dataset.rf ? [moved[a.dataset.rs] || a.dataset.rs, a.dataset.rf, a.selectionStart] : null;
  // время шага и задачи: выделение сохраняется целиком — время шагов вписывают подряд, поверх прежнего
  const atp = a && a.dataset && a.dataset.pk ? [a.dataset.pk, a.selectionStart, a.selectionEnd] : null;
  moved = {};
  if (!S.route && tab === 'route') tab = 'build';
  if (!S.tree && tab === 'tree') tab = 'build';
  try { sessionStorage.setItem(TAB_KEY, tab); } catch (err) { /* без памяти браузера редактор откроется на «Билде» */ }
  STEPLIST = stepList();
  STEPS = stepOptions();
  // вкладки — одним рядом; у «Билда» — счёт проверки: сколько замечаний нужно править
  const bad = badCount();
  const tabs = S.goals ? '<nav class="tabs" aria-label="' + T('Части плана') + '">' + TABS.filter(t => (t[0] !== 'route' || S.route) && (t[0] !== 'tree' || S.tree)).map(([id, name]) =>
    `<button class="${id === tab ? 'on' : ''}${id === 'build' && bad ? ' warn' : ''}" data-tab="${id}"${id === 'build' ? ` title="${checkTip(bad)}"` : ''}>` +
    `${name}${id === 'build' ? `<span class="cnt">${checkBadge(bad)}</span>` : ''}</button>`).join('') + '</nav>' : '';
  // Шапка программы (.hbar) — одна на обеих страницах: название плана, режим («Игра · Редактор») и язык, под ними —
  // вкладки. Режим меняется в этой же вкладке, а с несохранёнными правками редактор сначала спрашивает, что с ними
  // сделать (leaveTo).
  CTX.editTitle = S.title != null ? S.title : D.title;
  $('#hbar').innerHTML = Q(appBar()) + `<div class="in">${tabs || '<nav class="tabs"></nav>'}</div>`;
  headPad();
  $('#app').innerHTML =
    (D.problems && D.problems.length ? `<div class="alert">${D.problems.map(esc).join('<br>')}</div>` : '') +
    (tab === 'gems' ? gemsTab() : tab === 'items' ? itemsTab() : tab === 'other' ? otherTab()
      : tab === 'route' ? routeTab() : tab === 'build' ? buildTab() : tab === 'tree' ? treeTab() : stagesTab());
  if (tab === 'tree') teDraw();
  for (const el of document.querySelectorAll('select[data-wfrom]')) el.value = el.dataset.cur;
  // выбор шага у всех списков один и тот же: нужное значение ставится после сборки страницы
  for (const el of document.querySelectorAll('select[data-step]')) {
    const g = goal(el.dataset.id) || routeGoal(el.dataset.id);
    el.value = (g && g[el.dataset.f]) || '';
    el.classList.toggle('same', !el.value);
  }
  if (ats) {
    const el = document.querySelector(`[data-rs="${ats[0]}"][data-rf="${ats[1]}"]`);
    if (el) { el.focus(); if (ats[2] != null) { try { el.setSelectionRange(ats[2], ats[2]); } catch (e) { /* у списка курсора нет */ } } }
  }
  if (at) {
    const el = document.querySelector(`[data-id="${at[0]}"][data-f="${at[1]}"]`);
    if (el) { el.focus(); if (at[2] != null) { try { el.setSelectionRange(at[2], at[2]); } catch (e) { /* у списка курсора нет */ } } }
  }
  const key = focusKey || (atp && atp[0]);
  if (key) {
    const el = [...document.querySelectorAll('[data-pk]')].find(x => x.dataset.pk === key);
    if (el) {
      el.focus();
      if (!focusKey && atp[1] != null) { try { el.setSelectionRange(atp[1], atp[2]); } catch (e) { /* у списка курсора нет */ } }
      else if (focusKey && /^tv:/.test(key)) el.select();      // название новой версии — под замену
    }
  }
  focusKey = null;
  $('#app').classList.toggle('ro', received());
  if (received()) lockView();
  if (jump) {
    // переход из проверки билда к цели или к шагу маршрута («step:<id>»): строка — на экран
    const el = document.querySelector(jump.startsWith('step:') ? `[data-rmore="${jump.slice(5)}"]` : `[data-more="${jump}"], [data-anchor="${jump}"]`);
    jump = null;
    if (el) el.scrollIntoView({block: 'center'});
  }
  bar();
}
let barAct = null;     // кнопка рядом с сообщением внизу: {label, tip, mine — свой план на основе этого, go — к выбранному плану}
function bar() {
  const bad = Object.keys(badTime);
  // присланный план — только для просмотра: записывать нечего; внизу — что это за план и как сделать свой на его основе
  const ro = received();
  $('#save').hidden = $('#reset').hidden = ro;
  $('#save').disabled = !dirty();
  barAct = (msg && msg.act) || (ro ? {label: T('Сделать свой план на его основе'), mine: true,
    tip: T('«Новый план» на основе этого: целиком, уже ваш — его можно править')} : null);
  $('#msgact').hidden = !barAct;
  if (barAct) { $('#msgact').textContent = barAct.label; $('#msgact').title = barAct.tip || ''; }
  $('#reset').disabled = !dirty() && !bad.length;
  $('#msg').className = 'msg' + ((msg && !msg.ok) || (!msg && bad.length) ? ' bad' : '');
  const pi = (D && D.planInfo) || {};
  $('#msg').textContent = msg ? msg.text : ro ? (pi.catalog ? T('План из каталога — только просмотр')
    : pi.received && pi.received.by === 'program' ? T('План пришёл с программой — только просмотр') : T('Присланный план — только просмотр'))
    : bad.length ? T('время шага «') + stepName(bad[0]) + T('» не понято: нужно 5:30, 1:05:00 или одни цифры (минуты)')
      : dirty() ? T('есть несохранённые правки') : '';

  const d = e.target.dataset;
  if (!S) return;
  if (d.btitle !== undefined) { S.title = e.target.value; CTX.editTitle = S.title; ctxBar(); return bar(); }      // в шапке — название, как его набирают
  if (d.tname !== undefined) {
    const v = teCur(), chip = document.querySelector('.vtab.on');
    if (v) { v.name = e.target.value; if (chip) chip.innerHTML = teChip(v); }
    return bar();
  }
  if (d.sdn !== undefined) { const def = S.statDefs[+d.sdn]; if (def) def.name = e.target.value; return bar(); }
  if (d.pick !== undefined) {
    // поле выбора: набранное — запрос, выдача под полем обновляется без перерисовки страницы. У поля названия
    // цели набранное — ещё и само название: своё название цели так и пишут
    const name = NK.has(d.pick.slice(0, d.pick.indexOf(':')));
    if (name) { edit(e.target, false); bar(); }
    if (PK) { PK.q = e.target.value; PK.hi = name ? -1 : 0; paintPicker(); }
    return;
  }
  if (d.f && d.id) {
    if (e.target.tagName === 'SELECT') return;
    edit(e.target, false);
    bar();
    return;
  }
  if (d.rf !== undefined) {
    if (e.target.tagName === 'SELECT') return;
    // зона, выбранная из списка зон игры, срабатывает сразу
    const picked = d.rf === 'zone' && !!areaOf(e.target.value.trim());
    if (editStep(e.target, picked) && picked) later(); else bar();
    return;
  }
  if (d.sl !== undefined) { const sl = slotOf(d.sl); if (sl) sl.name = e.target.value; return bar(); }
  if (d.gn !== undefined) { editGives(e.target, false); return bar(); }
  // --- маршрут: целевое время шага; личное ---
  if (d.pt !== undefined) return editTarget(e.target, false);
  if (d.name === undefined) return;
  S.stages[+d.name].name = e.target.value;
  bar();
});

// Запись правок. Ответ — записалось ли (true / false): уход из редактора ждёт его (leaveTo).
function save() {
  const bad = Object.keys(badTime);
  if (bad.length) {
    msg = {ok: false, text: T('не сохранено: у шага «') + stepName(bad[0]) + T('» вписано «') + badTime[bad[0]] + T('» — это не время (нужно 5:30, 1:05:00 или одни цифры — минуты)')};
    render();
    return Promise.resolve(false);
  }
  $('#save').disabled = true;
  // уходят только разделы, в которых что-то изменилось: файл, которого правка не коснулась, остаётся как был
  const body = changedSections();
  return fetch(planUrl('/api/build'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({stamp: STAMP}, body))})
    .then(r => r.json())
    .then(j => {
      if (!j.ok) { msg = {ok: false, text: (T('не сохранено:') + ' ') + ((j.problems || []).join('; ') || T('программа отказала'))}; render(); return false; }
      // что записано — по файлам плана: билд, маршрут
      const where = [...new Set(Object.keys(body).map(k => (k === 'route' ? T('маршрут') : T('билд'))))].join(', ');
      return load().then(() => { msg = {ok: true, text: (T('сохранено:') + ' ') + where}; render(); return true; });
    })
    .catch(() => { msg = {ok: false, text: T('не сохранено: нет связи с программой')}; render(); return false; });
}
// В столбце времени Enter и стрелки вверх-вниз переводят к соседнему шагу: цели вписывают подряд.
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.dataset || el.dataset.pt === undefined || !['Enter', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
  const all = [...document.querySelectorAll('input[data-pt]')], to = all[all.indexOf(el) + (e.key === 'ArrowUp' ? -1 : 1)];
  if (!to) return;
  e.preventDefault();
  to.focus();
  to.select();
});
// Карту дерева таскают мышью; при движении перерисовывается только карта, не вся страница. Нажатие без
// сдвига — по узлу под курсором.
let mapDrag = null;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !e.target.closest || !e.target.closest('.mbox')) return;
  mapDrag = {x: e.clientX, y: e.clientY, moved: false};
});
document.addEventListener('pointermove', e => {
  if (!mapDrag) {
    if (tab === 'tree' && S && S.tree && e.target.closest) {
      const box = e.target.closest('.mbox');
      if (box) {
        const r = box.getBoundingClientRect();
        teHover(e.clientX - r.left, e.clientY - r.top, box.clientWidth, box.clientHeight);
      } else if (TE.hover >= 0) teHover(null);
    }
    return;
  }
  const dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
  if (!mapDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  mapDrag.moved = true;
  mapDrag.x = e.clientX;
  mapDrag.y = e.clientY;
  mapView.x -= dx / mapView.s;
  mapView.y -= dy / mapView.s;
  teDraw();
});
document.addEventListener('pointerup', e => {
  const drag = mapDrag;
  mapDrag = null;
  if (!drag || drag.moved || tab !== 'tree') return;
  const box = $('#tmap .mbox');
  if (box) {
    const r = box.getBoundingClientRect();
    msg = null;
    teClick(e.clientX - r.left, e.clientY - r.top, box.clientWidth, box.clientHeight);
  }
});
document.addEventListener('keydown', e => {
  // вкладка «Дерево»: Esc — закрыть меню узла. Отмены (Ctrl+Z) нет: ошибку правят нажатием на карте, всё сразу —
  // «Отменить правки» (их решение 2026-11-25)
  if (tab !== 'tree' || !S || !S.tree) return;
  if (e.key === 'Escape' && TE.menu) { TE.menu = null; render(); }
});
// Поле выбора стата: выдача открыта, пока курсор в поле. Стрелки ходят по выдаче, Enter берёт выделенную
// строку, Esc закрывает. Нажатие мышью в выдаче не уводит курсор из поля.
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!S || !el.dataset || el.dataset.pick === undefined) return;
  const k = el.dataset.pick.indexOf(':'), kind = el.dataset.pick.slice(0, k), ref = el.dataset.pick.slice(k + 1);
  if (ZK.has(kind)) {
    // Поле зоны показывает название выбранной зоны: оно выделяется целиком, набранное его заменит. Где герой
    // сейчас, программа говорит заново при каждом входе в поле — эта зона стоит в выдаче первой.
    const typing = PK && PK.kind === kind && PK.i === ref;
    PK = {kind, i: ref, q: typing ? PK.q : '', hi: 0};
    if (!typing) el.select();
    fetch('/api/zone').then(r => r.json()).then(z => {
      NOWZONE = z && z.code ? z : null;
      if (PK && PK.kind === kind && PK.i === ref && !PK.q.trim()) paintPicker();
    }).catch(() => { /* без связи выдача остаётся без этой подсказки */ });
  } else if (kind === 'lm') PK = {kind, i: ref, q: el.value, hi: 0};      // чьё поле — шаг
  else if (kind === 'say') PK = {kind, i: ref, q: el.value, hi: 0};     // чьё поле — цель шага
  else if (kind === 'rw') PK = {kind, i: ref, q: el.value, hi: 0};      // чьё поле — цель шага
  else if (kind === 'an') PK = {kind, i: ref, q: el.value, hi: 0};      // чьё поле — версия дерева
  else if (NK.has(kind)) {
    // Поле названия показывает название цели: оно выделяется целиком — набранное его заменит; выдача без запроса
    // показывает всё, из чего можно выбрать (базы слота, камни), а не одну нынешнюю вещь
    const typing = PK && PK.kind === kind && PK.i === ref;
    PK = {kind, i: ref, q: typing ? PK.q : '', hi: -1};
    if (!typing) el.select();
  }
  else PK = {kind, i: +ref, q: el.value, hi: 0};
  paintPicker();
});
document.addEventListener('focusout', e => {
  if (!e.target.dataset || e.target.dataset.pick === undefined) return;
  // в поле зоны недописанный запрос не остаётся: возвращается название выбранной зоны
  if (e.target.dataset.idle !== undefined) e.target.value = e.target.dataset.idle;
  PK = null;
  paintPicker();
});
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('.spanel')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!PK || !el.dataset || el.dataset.pick === undefined) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    PK.hi = Math.max(0, Math.min(PKITEMS.length - 1, PK.hi + (e.key === 'ArrowDown' ? 1 : -1)));
    paintPicker();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // поле названия без выделенной строки: Enter оставляет набранное название
    if (NK.has(PK.kind) && PK.hi < 0) el.blur();
    else if (PKITEMS.length) { msg = null; pickCommit(PK.hi); render(); }
  } else if (e.key === 'Escape') el.blur();
});
window.addEventListener('beforeunload', e => { if (dirty() && !leaving) { e.preventDefault(); e.returnValue = ''; } });
// Адрес страницы назвал другую вкладку (ссылка вида /admin#tree при уже открытой странице) — открыть её.
window.addEventListener('hashchange', () => {
  if (OLD_TABS[location.hash.slice(1)]) history.replaceState(null, '', '#' + hashTab());
  const t = hashTab();
  if (S && t !== tab && TABS.some(x => x[0] === t)) { tab = t; window.scrollTo(0, 0); render(); }
});
// язык сменили на другой странице: редактор с несохранёнными правками остаётся как есть
window.langHold = () => dirty();
// список героев и планов в шапке: здесь правится выбранный план. Выбор другого плана сперва спрашивает о несохранённых
// правках (список на это время закрыт), потом редактор открывает выбранный план заново. После действия в списке — данные
// заново; выбранный план сменился (другой герой, выбор на другой странице) — редактор идёт за ним (follow).
CTX.page = 'edit';
CTX.edit = PLAN;
CTX.before = go => { ctxShow(false); leaveTo(go); };
// открыть выбранный план: страница заново (адрес — тот же /admin#вкладка, поэтому не переход по адресу, а перезагрузка)
CTX.picked = () => { leaving = true; location.reload(); };
// Выбранный план сменился не здесь: без правок — открыть его; с правками — сказать внизу и дать «Перейти к нему»
// (уход к нему спросит о правках). Пока правки не решены, страница остаётся на своём плане: правки — его.
function follow(plans) {
  if (!plans || !plans.library || !S || !PLAN || plans.current === PLAN || leaving) return;
  if (!dirty()) { CTX.picked(); return; }
  const title = (ctxPlan(plans.current) || {}).title || plans.current;
  msg = {ok: false, text: T('Герой идёт теперь по «{0}»: правки этого плана ещё не сохранены', title),
    act: {label: T('Перейти к нему'), go: true, tip: T('Открыть выбранный план — редактор сперва спросит о правках')}};
  bar();
}
const syncPlans = () => fetch(langUrl('/api/plans')).then(r => r.json()).then(j => {
  if (j && j.plans) { CTX.data = {plans: j.plans, heroes: j.runs}; ctxBar(); ctxPaint(); follow(j.plans); }
}).catch(() => { /* без связи список остаётся прежним */ });
CTX.after = syncPlans;
// вернулись к вкладке (выбор могли сменить на «Игре» в другой вкладке) — свериться
window.addEventListener('focus', () => { if (S) syncPlans(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) syncPlans(); });
$('#hbar').innerHTML = Q(appBar()) + '<div class="in"><nav class="tabs"></nav></div>';
// план только что создан окном «Новый план» (?from=<основа>): на основе чего он (он уже выбран — герой идёт по нему)
load().then(() => {
  if (!urlFrom || !D || !D.plans) return;
  const base = (D.plans.list || []).find(x => x.id === urlFrom);
  msg = {ok: true, text: base ? T('создан план «{0}» на основе «{1}»', S.title || '', base.title) : T('создан план «{0}»', S.title || '')};
  render();
});
}
loadLang().then(startPage).then(updLoad);
</script>
