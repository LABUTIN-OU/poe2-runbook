<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE2 Runbook</title>
<style>
:root{
  --bg:#111316;--card:#1a1d22;--tile:#20242a;--line:#2d323a;
  --text:#eceae6;--muted:#98a0aa;--accent:#7fb2ff;
  --due:#e6a93f;--due-bg:#33290f;--due-text:#f4d08a;
  --over:#f0604f;--over-bg:#3a1915;--over-text:#ffc1b8;
  --ok:#5cbd88;--ok-bg:#14291d;
  --col:900px;   /* колонка программы: шапка и страница — одной ширины, в «Игре» и в «Редакторе» одной */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
#app{max-width:var(--col);margin:0 auto;padding:12px 14px 40px}
/* Шапка программы — одна на обеих страницах, закреплена сверху. Её полоса и черта под ней — на всю ширину окна, а сама
   шапка — в колонке программы (--col), вровень со страницей: первый ряд — герой и план слева, режим («Игра · Редактор»)
   и язык справа; второй — навигация самой страницы (вкладки редактора, разделы «Игры»). Колонка и высота рядов в обоих
   режимах одни: при смене режима шапка не сдвигается и верх не прыгает. Она выше всплывающих списков (.spanel):
   прокрученный список уходит под неё. */
.hbar{position:sticky;top:0;z-index:7;background:var(--bg);border-bottom:1px solid var(--line)}
.abar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;max-width:var(--col);margin:0 auto;padding:0 14px}
.abar .aname{min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .in{max-width:var(--col);margin:0 auto;padding:0 14px}
html{scrollbar-gutter:stable}   /* место полосы прокрутки — всегда за страницей: колонка и шапка в ней не сдвигаются, есть прокрутка или нет */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;min-height:42px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-size:14px;line-height:20px;white-space:nowrap;cursor:pointer}
.tabs button:hover{filter:brightness(1.15)}
.tabs button.on{border-color:var(--accent);background:#1c2a40;font-weight:700}
.tabs .cnt{color:var(--muted);font-weight:400;margin-left:6px}
.tabs button.warn .cnt{color:var(--due-text);font-weight:700}
@media (max-width:780px){.abar,.hbar .in{padding-left:8px;padding-right:8px}.tabs{gap:4px;min-height:38px}.tabs button{padding:5px 8px;font-size:13px}}
@media (max-width:780px){#app{padding-left:8px;padding-right:8px}}   /* узкое окно: страница вровень с шапкой */

.wait{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.zname{font-size:30px;font-weight:600;line-height:1.1}
.zmeta{color:var(--muted);margin-top:4px}
.zmeta b{color:var(--text);font-weight:600}
/* вид зоны (город или её уровень) — при названии зоны, тихо */
.zkind{margin-left:10px;font-size:14px;font-weight:400;color:var(--muted);white-space:nowrap}
.zxp{color:var(--muted);font-size:13px;margin-top:2px}
.zxp b{color:var(--text)}
.zxp.out{color:var(--due-text)}
/* правый край шапки зоны: часы — внизу, вровень со строкой опыта (режим и язык — в шапке программы) */
.timers{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-run{font-size:24px;font-weight:600}
.t-run.held{color:var(--due-text)}           /* пауза игрока: часы стоят */
/* под часами — «Пауза»; настройки (окна поверх игры, скрыть время) — в окне «Настройки» шапки программы */
.tctl{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
/* клавиши программы в игре и как нажимать по окнам поверх игры: одна тихая строка под кнопками — клавиша, потом слово */
.tkeys{display:flex;gap:14px;justify-content:flex-end;margin-top:5px;font-size:12px;line-height:17px;color:var(--muted);white-space:nowrap}
.tkeys span{display:inline-flex;align-items:center;gap:5px}
.tkeys .kk.off{border-color:var(--over);color:var(--over-text)}
.t-zone{color:var(--muted);font-size:13px}
/* строка состояния под плитками времени: слева — фильтр игры, справа — читается ли лог */
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:8px 0 12px;font-size:13px;color:var(--muted)}
.srow b{color:var(--text);font-weight:600}
.status{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-left:auto;font-size:12px;min-width:0;
  text-align:right;overflow-wrap:anywhere}
.status.bad{color:var(--over-text)}
.status .sver{white-space:nowrap}     /* «программа 0.5.5.4 · игра 0.5.5h» — версии не рвутся посреди */
.dot{width:8px;height:8px;border-radius:50%;background:var(--over);flex:none}
.dot.live{background:var(--ok)}
/* фильтр не тот, что нужен шагу: плашкой цвета цели — жёлтой на шаге смены, красной, когда этот шаг позади */
.fwant{padding:1px 8px;border-radius:6px;border:1px solid}
.fwant.u-due,.fwant.u-due b{color:var(--due-text)}
.fwant.u-overdue,.fwant.u-overdue b{color:var(--over-text)}
.flink{padding:0;border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.flink:hover{text-decoration:underline}
.flink .ar{display:inline-block;margin-left:5px;font-size:11px}
.flink.open .ar{transform:rotate(90deg)}
a.flink{display:inline-flex;align-items:center;gap:5px;text-decoration:none}
a.flink:hover{text-decoration:underline}
button.fwant{font:inherit;font-size:13px;background:var(--over-bg);cursor:pointer}
button.fwant:hover{filter:brightness(1.15)}
.fbody{font-size:13px;color:var(--muted);margin:-6px 0 12px}
/* цели плана, которые фильтр скрывает, — первыми в списке, каждая своей строкой */
.fgoals{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.fghead{color:var(--over-text);font-weight:600}
.alert{background:var(--over-bg);color:var(--over-text);border:1px solid var(--over);border-radius:8px;padding:10px 12px;font-weight:600;margin-bottom:12px}
.alert.ready{background:var(--due-bg);color:var(--due-text);border-color:var(--due)}
.chip.auto{cursor:default}
/* Цель, которую отмечают нажатием, — с квадратиком слева: пустой — не сделано, зелёный с галочкой — сделано. Так видно
   и состояние, и что плашка нажимается. У целей, которые закрывает лог, квадратика нет: нажатием их не правят. */
.chip.tick{position:relative;padding-left:34px}
.chip.tick::before{content:"";position:absolute;left:11px;top:50%;width:15px;height:15px;margin-top:-8px;box-sizing:border-box;
  border:1.5px solid var(--muted);border-radius:4px}
.chip.tick.u-due::before,.chip.tick.u-seek::before{border-color:var(--due-text)}
.chip.tick.u-overdue::before{border-color:var(--over-text)}
.chip.tick.on::before{content:"✓";border-color:var(--ok);background:var(--ok);color:var(--bg);font-size:11px;font-weight:700;
  line-height:12px;text-align:center}
.chip.auto:hover{filter:none}
.gh{display:block;font-size:12px;color:var(--over-text);font-weight:600}
.fh{color:var(--over-text)}
/* пропущенное на пройденных картах: заголовок того же красного, что и плашки под ним */
.missed h2,.lateb h2{margin-bottom:8px}
.lateb h2 > span:first-child{color:var(--over-text)}
.missed h2 > span:first-child{color:var(--over-text)}
/* карта, на которую возвращаться, — главное в такой плашке: крупнее и цветом состояния */
.missed .kd{font-size:12px;font-weight:700;color:var(--over-text)}
.tdone{color:var(--ok)}
.rules{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.rules summary{cursor:pointer;color:var(--muted);font-weight:600}
.mini.arm{border-color:var(--due);color:var(--due-text)}
.rules ul{margin-top:8px}
.sub.ways{margin-top:10px}
.sub.ways b{color:var(--text);font-weight:600}
.warn{background:var(--due-bg);color:var(--due-text);border:1px solid var(--due);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.panel{border:1px solid var(--accent);border-radius:12px;background:var(--card);padding:10px 14px 12px;margin-bottom:6px}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}
.ptitle span:last-child{font-weight:400;color:var(--muted);letter-spacing:0}
/* Время против цели — три одинаковые плитки: отрезок, акт, шаг (от большого к малому, слева направо).
   Сетка жёсткая, чтобы взгляд знал, куда смотреть: подпись, время, полоса с целью у правого края
   (как в плеере), слово о запасе. Читается в этом порядке: время, полоса, цель. Цвет плитки — ответ:
   серая — в графике, жёлтая — времени мало или отстаю, красная — цель пройдена. Сверх цели поверх
   красной полосы идёт вторая, ярче (вдвое дольше цели), и третья (втрое). */
/* Блоки «Дерево» и «Атлас» — после умений, всегда открыты, как «Надето» и «Умения». Сверху карта, под ней —
   подблок «Брать дальше по плану» (над картой та же строка читалась как хлебные крошки): плитка — сколько
   очков свободно (жёлтая — есть что взять), за ней путь до ближайшего большого узла плашками по порядку
   плана и ещё два больших узла через многоточие. Обычный узел приглушён, большой — ярче и жирнее (по ним
   ориентируются на дереве), то, на что очков уже хватает, — жёлтым. */
.tsub{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.tsubb{flex:1;min-width:0}
.tsubh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:1px 0 6px}
.tpts{flex:none;min-width:70px;padding:5px 10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--tile);
  text-align:center;color:var(--muted);font-size:11px}
.tpts b{display:block;font-size:22px;line-height:1.15;color:var(--text);font-variant-numeric:tabular-nums}
.tpts.free{border-color:var(--due);background:var(--due-bg);color:var(--due-text)}
.tpts.free b{color:var(--due-text)}
.tpts.drop{border-color:var(--over);background:var(--over-bg);color:var(--over-text)}
.tpts.drop b{color:var(--over-text)}
.tnext{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tnode{padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);font-size:14px;color:var(--muted)}
.tnode.big{color:var(--text);font-weight:600}
.tnode.now{border-color:var(--due);background:var(--due-bg);color:var(--due-text)}
.tnode.drop{border-color:var(--over);background:var(--over-bg);color:var(--over-text);font-weight:700}
.tnode.done{color:var(--ok)}
.tnode.late{border-color:var(--over);background:var(--over-bg);color:var(--over-text)}   /* атлас: опаздывает */
.tsec h2 .side .late{color:var(--over-text)}
/* узел, который ждёт условия своей цели: его берут не по порядку очков — пунктиром, как и на карте */
.tnode.hold{border-style:dashed}
.tnode.amu{border-style:dashed;border-color:var(--ok);color:var(--ok)}      /* узел с надетого предмета (зачарование) */
.tnode.amu.want{border-color:var(--accent);color:var(--text)}             /* по плану с предмета, на предмете ещё нет */
.tamu{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.tamu .tamul{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tamu .twhen{font-size:12px;color:var(--muted)}
.mn.hold{stroke-dasharray:3 2.5}
.tnode .tnn{opacity:.8;font-variant-numeric:tabular-nums}
/* без чего следующий узел атласа не взять («Требует активации большого зеркала») — следом за узлом, тише */
.tnode .twhen{margin-left:7px;font-size:12px;font-weight:400;color:var(--muted)}
.tnode .tpick{margin-left:7px;font-size:12px;font-weight:600;color:var(--text)}      /* какой вариант взять в узле с выбором */
.tnext .tarr{flex:none;color:var(--muted)}
/* многоточие — между большими узлами: путь между ними не назван (сколько в нём узлов — в подсказке) */
.tnext .tgap{flex:none;color:var(--muted);font-size:16px;letter-spacing:.15em;padding:0 1px;cursor:default}
/* знак перед узлом и сам узел — одно целое: при переносе строки знак не повисает в её конце */
.tnext .tstep{display:inline-flex;align-items:center;gap:6px}
.tnext .tmore,.apool .tmore{flex:none;color:var(--muted);font-size:12px}
/* атлас: деревьев несколько, у каждого свои очки — по строке на дерево: чьё оно и его следующий узел */
.apool{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.apool:last-child{margin-bottom:0}
.tlab{flex:none;width:96px;padding-top:8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* название дерева атласа — кнопка: показать это дерево на карте; дерево, которое карта сейчас держит, — светлее */
button.tlab{background:none;border:0;padding:8px 0 0;margin:0;text-align:left;font-family:inherit;cursor:pointer}
button.tlab:hover{color:var(--accent)}
button.tlab.on{color:var(--text)}
/* Карта дерева — в его блоке. Высота постоянная. Схема: серое — дерево, синяя обводка — план этапа,
   зелёное — взято, жёлтое с номером — брать сейчас, красное — лишнее после перекачки. */
.tmap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.mbox{height:420px;cursor:grab;touch-action:none;user-select:none}
.mbox:active{cursor:grabbing}
.msvg{display:block}
.mctl{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.mctl .mini{background:var(--card)}
.mctl .mini.on{border-color:var(--accent);color:var(--text)}
.me{fill:none;stroke:#2c323b;stroke-width:1.2}
.me.plan{stroke:#4a6a96;stroke-width:1.8}
.me.have{stroke:var(--ok);stroke-width:2.4}
.mn{stroke-width:1.2}
.mn.rest{fill:#262b33;stroke:#39404b}
.mn.plan{fill:var(--bg);stroke:var(--accent);stroke-width:1.6}
.mn.now{fill:var(--due);stroke:#fff3d6;stroke-width:1.6}
.mn.have{fill:var(--ok);stroke:#1d3a2b}
.mn.extra{fill:var(--over-bg);stroke:var(--over);stroke-width:1.8}
/* атлас: узел опаздывает — был в версии атласа прошлого этапа и не взят: обводка красная, как опоздание целей */
.mn.late{stroke:var(--over);stroke-width:2.4}
/* атлас: узел, который игрок отметил взятым до лога, — пунктирная обводка: это его слово, не лог */
.mn.have.hand{stroke:#eafff1;stroke-width:1.8;stroke-dasharray:2.4 1.8}
.mn.amu{fill:var(--ok);stroke:#eafff1;stroke-width:1.8;stroke-dasharray:2.4 1.8}
.mn.amu.want{fill:var(--bg);stroke:var(--accent)}
.mnum,.mlab{font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mnum{font-weight:700;fill:var(--accent);text-anchor:middle}
.mnum.now{fill:var(--due-text)}
.mlab{fill:var(--text)}
.mlab.have{fill:var(--muted)}
/* Меню взятого узла «Характеристика» — у самого узла на карте: каким атрибутом его считать. */
.mwrap{position:relative}
.mmenu .mini{background:var(--card)}
.mmenu{position:absolute;z-index:2;display:flex;gap:4px;padding:4px;border:1px solid var(--accent);border-radius:8px;background:var(--bg)}
.mmenu .mini.on{border-color:var(--text);font-weight:700}
.mmenu .a-str{color:#e58c84}
.mmenu .a-dex{color:#8fd092}
.mmenu .a-int{color:#8fb4f0}
/* атлас: корни его деревьев подписаны названиями деревьев */
.mlab.root{fill:var(--muted);font-weight:700;letter-spacing:.05em}
.mattr{font-size:8px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}
.mopt{font-weight:700;fill:#fff;paint-order:stroke;stroke:#10131a;stroke-width:2.5px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}   /* номер варианта, который план называет в узле атласа с выбором */
/* Атрибуты героя под картой дерева: числа по плану дерева; красным — атрибут, которого по счёту меньше,
   чем требует надетое (в узлах взято не то, что в плане), и узлы без атрибута. */
/* взятый узел «Характеристика» на карте героя — цветом атрибута, которым он посчитан: сила красным,
   ловкость зелёным, интеллект синим; непосчитанный (вне плана, игрок не назвал) — пустой с красной обводкой */
.mn.have.a-str,.mn.extra.a-str{fill:#d2584f;stroke:#ffd9d4;stroke-width:1}
.mn.have.a-dex,.mn.extra.a-dex{fill:#55a95a;stroke:#d9f5da;stroke-width:1}
.mn.have.a-int,.mn.extra.a-int{fill:#4a80dc;stroke:#d6e4ff;stroke-width:1}
/* ближайшие узлы «Характеристика» по плану (те, что с номером) — внутри цвет атрибута, который им назначил
   план: что брать, видно без чтения подписи. Обводка говорит прежнее: синяя — узел плана, жёлтая — брать сейчас. */
.mn.plan.a-str,.mn.now.a-str{fill:#d2584f}
.mn.plan.a-dex,.mn.now.a-dex{fill:#55a95a}
.mn.plan.a-int,.mn.now.a-int{fill:#4a80dc}
.mn.now.a-str,.mn.now.a-dex,.mn.now.a-int{stroke:var(--due);stroke-width:2.6}
/* та же метка — у плашки такого узла под картой: кружок цвета атрибута перед словами */
.tnode.a-str::before,.tnode.a-dex::before,.tnode.a-int::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tnode.a-str::before{background:#d2584f}
.tnode.a-dex::before{background:#55a95a}
.tnode.a-int::before{background:#4a80dc}
.mhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding:6px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.mhero b{color:var(--text);font-variant-numeric:tabular-nums}
.mhero .low,.mhero .low b{color:var(--over-text)}
.mhero .amber{color:var(--due-text)}
.mhero .how{flex:1 1 100%}
.ttime{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 2px}
.tt{display:grid;grid-template-rows:15px 28px 8px 16px;row-gap:4px;min-width:0;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--tile)}
.tt > *{min-width:0;white-space:nowrap;overflow:hidden}
/* строка названия: слева — чья плитка, справа — какая доля её времени прошла не в зонах шагов (город и вне маршрута);
   число всегда в одном углу, названию оно места не уступает */
.ttl{display:flex;align-items:baseline;gap:8px;font-size:10.5px;line-height:15px;color:var(--muted)}
.ttl b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.tta{flex:none;font-size:11px;font-variant-numeric:tabular-nums}
/* по наведению плитка раскрывает своё время: где оно шло и как менялось отставание (окно — как в «Разборе») */
.tt[data-tk]:hover{filter:brightness(1.14)}
/* строка времени: потрачено — крупно слева, цель — мелко и серым у правого края, над концом полосы */
.ttr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttv{font-size:22px;font-weight:600;line-height:28px;font-variant-numeric:tabular-nums}
.ttv small{font-size:13px;font-weight:400;color:var(--muted)}
.tbar{position:relative;height:8px;border-radius:4px;background:#3a414c;overflow:hidden}
.tbar.none{background:transparent}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:#8b95a3}
.ttg{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tts{font-size:12px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.tt.s-warn{border-color:var(--due);background:var(--due-bg)}
.tt.s-warn .tbar i{background:var(--due)}
.tt.s-warn .tts{color:var(--due-text)}
.tt.s-over{border-color:var(--over);background:var(--over-bg)}
.tt.s-over .tbar i{background:#8a3a30}
.tt.s-over .tbar i.o2{background:#d8523f}
.tt.s-over .tbar i.o3{background:#ff3a1e}
.tt.s-over .tts{color:var(--over-text)}
@media (max-width:560px){.ttime{grid-template-columns:minmax(0,1fr)}}
.pstep{padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.pstep.peeking{border:1px dashed var(--muted);border-radius:8px;padding:10px 12px}
/* Заход на карту следующего шага: её карточка показана сразу — рамка сплошная, цвета акцента (это не
   просмотр чужого шага, игрок уже стоит здесь). Кнопка смены шага с отсчётом заметнее прочих мелких. */
.pstep.peeking.here{border-style:solid;border-color:var(--accent)}
.mini.go{padding:3px 10px;border-color:var(--accent);color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.mini.go:hover{background:var(--accent);color:var(--bg)}
/* «☐ Шаг пройден → Замок Огам» справа от названия шага: действие — жирным, куда оно переведёт — тише; длинное имя
   следующего шага обрезается, целиком — в подсказке. Квадратик — как у целей, которые отмечают нажатием: пустой —
   шаг не закрыт; при наведении в нём галочка — нажатие закроет шаг. Галочка в самой надписи читалась как уже
   отмеченное, которое нажатие снимет (их замечание 2026-11-24). */
.mini.go.nx{max-width:min(55vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.mini.go.nx .nxn{font-weight:400;color:var(--muted)}
.mini.go.nx:hover .nxn{color:inherit}
/* Галочка в квадратике есть всегда и при наведении только становится видна: появись она лишь при наведении, квадратик
   сменил бы свою базовую линию, строка кнопки стала бы выше и вся вёрстка ниже сдвинулась бы (их замечание 2026-11-24). */
.mini.go.nx .nxb{display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;box-sizing:border-box;
  border:1.5px solid var(--muted);border-radius:3px;overflow:hidden;font-size:10px;font-weight:700;line-height:10px;text-align:center}
.mini.go.nx .nxb::after{content:"✓";color:transparent}
.mini.go.nx:hover .nxb{border-color:var(--bg)}
.mini.go.nx:hover .nxb::after{color:inherit}
/* На шаге отмечено всё, что программа знает (точки, боссы, цели, смена фильтра, «снять»): кнопка — главная на странице,
   залита цветом акцента, и рамка трижды мягко вспыхивает, чтобы взгляд нашёл её сразу (их просьба 2026-11-24: «кнопку
   как-то сделать более заметной… постоянно как будто долго ищу где она»). Размер прежний — ничего вокруг не сдвигается. */
.mini.go.nx.all{background:var(--accent);border-color:var(--accent);color:var(--bg);animation:nxglow 1.8s ease-in-out 3}
.mini.go.nx.all .nxn{color:var(--bg);font-weight:600}
.mini.go.nx.all .nxb{border-color:var(--bg)}
.mini.go.nx.all:hover{filter:brightness(1.12)}
@keyframes nxglow{0%,100%{box-shadow:0 0 0 0 rgba(127,178,255,0)}50%{box-shadow:0 0 0 6px rgba(127,178,255,.38)}}
/* Шаг сменился — кнопка проявляется не сразу: второй клик двойного нажатия не должен закрыть и следующий шаг (их просьба
   2026-11-24). Первые доли секунды её не видно и она не нажимается (NX_WAIT), потом проступает. */
.stmeta.fresh{animation:nxin .9s ease-out both}
@keyframes nxin{0%,45%{opacity:0}100%{opacity:1}}
.sub.pend .mini{margin-left:4px}
/* Карточка шага. Имя шага — крупно и одно; справа мелко — справка про фильтр (сверились один раз и
   забыли). Ниже — блоки с одинаковыми подписями: план (перечень дел, отделён чертой слева), что
   сменить, точки, боссы, цели. Всё, что надо сделать и отметить, — одинаковыми плашками. */
.sthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 2px}
.stname{font-size:20px;font-weight:600;line-height:1.2}
.stpre{font-size:13px;font-weight:600;color:var(--muted);margin-right:6px}
.stmeta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 12px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;font-size:12px}
.rs{padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
button.rs:hover{border-color:var(--muted)}
.r-behind{color:var(--muted)}
.r-current{border-color:var(--accent);color:var(--accent);font-weight:600}
.r-peek{border-style:dashed;border-color:var(--text);color:var(--text)}
.rarr,.rdots{color:var(--muted)}
/* многоточие в полоске шагов — кнопка: оно значит «там ещё есть» и листает полоску в свою сторону */
button.rdots{padding:3px 6px;border:0;border-radius:6px;background:none;font:inherit;cursor:pointer}
button.rdots:hover{color:var(--text);background:var(--tile)}
.ptitle .mini{margin-left:8px;font-weight:400;letter-spacing:0}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
h2 b{color:var(--text);font-size:16px;font-weight:600}
h2 .side{font-weight:400;font-size:12px;text-align:right}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0}
.empty{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* Свёрнутый блок карточки («План», «Как сделать»): строка — стрелка, название и сводка ровными колонками (взято из
   скольких · пропущено · впереди). */
.sec .ar{display:inline-block;color:var(--muted);font-size:11px}
.sec[open] > summary > .ar{transform:rotate(90deg)}
.sec .ag{white-space:nowrap}
.sec .ag.all{color:var(--ok)}
.sec .am{color:var(--over-text);font-weight:600;white-space:nowrap}
.sec .aa{color:var(--muted);white-space:nowrap}
.sec .aw{margin-left:10px;color:var(--due-text);font-weight:600}
.sec > summary{display:grid;grid-template-columns:12px 96px 84px 124px minmax(0,1fr) auto;gap:8px;align-items:baseline;
  padding:11px 16px;cursor:pointer;list-style:none;font-size:14px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary:hover{filter:brightness(1.25)}
.sec > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.sec .sh{font-size:13px;font-weight:600;color:var(--muted)}
.sec > summary .side{font-size:12px;color:var(--muted);text-align:right}
.sec:not([open]) > summary .side{display:none}
/* План носителя в его карточке — таблицей: столбцы — шаги маршрута под шапкой актов, строки — дорожки
   (умение, уровень, гнёзда; у слота — база и цели по статам). Ячейка: зелёная — сделано, жёлтая — к этому шагу,
   красная — опаздываю, в рамке — впереди, пунктир — пусто. Текущий шаг — цветом акцента или чертой. */
.sec.plan{margin-top:4px;border-top:1px solid var(--line)}
.sec.plan > summary{padding:6px 8px;font-size:13px}
/* «Как сделать» в карточке слота — путь крафта. Свёрнут; в его строке — где надетый предмет (красным — он не на
   этом пути, зелёным — готово). Раскрытый: шаги номерами — что за шаг, чем и на что, шанс и сколько в среднем баз
   и валюты; тише — что делать при промахе и план Б. Шаг, где сейчас надетый, обведён, под ним — ответ для него. */
.sec.how{margin-top:4px;border-top:1px solid var(--line)}
.sec.how > summary{display:flex;gap:10px;align-items:baseline;padding:6px 8px;font-size:13px}
.dopen .sec.how{margin-top:0}
.hwst{color:var(--muted)}
.hwst.bad{color:var(--over-text);font-weight:600}
.hwst.ok{color:var(--ok);font-weight:600}
.hwb{padding:2px 4px 8px;font-size:13px;line-height:1.45}
/* Крафт: карточка рецепта — шесть мест предмета (три префикса, три суффикса), шаг сейчас, дальше — и где искать базу */
.rcp0{padding:8px 10px 2px}
.rch{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.rcb{font-weight:600}
.rcm{color:var(--muted);font-size:13px}
.rcg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px 10px}
.rcs{font-size:12px;color:var(--muted)}
.rcl{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  font-size:13px;line-height:1.3}
.rcn{min-width:12px;font-weight:700;color:var(--muted)}
.rct{flex:1;min-width:0;overflow-wrap:anywhere}
.rcp{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rcl.free{border-style:dashed;color:var(--muted)}
.rcl.k-have{background:var(--ok-bg);border-color:#2f5a43;color:var(--ok)}
.rcl.k-have .rcn,.rcl.k-have .rcp{color:var(--ok)}
.rcl.k-now{border:2px solid var(--accent);background:#7fb2ff14}
.rcl.k-now .rcn,.rcl.k-now .rcp{color:var(--accent)}
.rcl.k-other,.rcl.k-low{color:var(--muted)}
.rcw{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.rch2{font-weight:600;color:var(--muted);margin-bottom:3px}
.rch2.now{color:var(--accent)}
.rcr{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;padding:2px 0}
.rcr.ok{color:var(--ok)}
.rcr .bad{color:var(--over-text)}
.rcq{color:var(--muted);font-weight:700}
.rcx{color:var(--muted)}
.rcx.k-ceiling,.rcx.k-small,.rcx.k-stop,.rcx.k-waste,.rcx.k-other{color:var(--over-text);font-weight:600}
.rcx.k-done{color:var(--ok);font-weight:600}
.hnt{margin:10px 10px 6px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.hans{font-size:15px;font-weight:700;margin:2px 0 10px}
.hst{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;align-items:flex-end;margin-bottom:6px}
.hg{display:flex;flex-direction:column;gap:3px;min-width:0}
.hgl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcs{display:flex;gap:2px}
.hc{flex:1;min-width:0;height:22px;border-radius:4px;background:var(--tile);border:1px solid var(--line);font-size:11px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.hc.mk{border-color:var(--text);color:var(--text);font-weight:700}
.hc.here{border:2px solid var(--accent);color:var(--accent);font-weight:700;background:#7fb2ff14}
.hhere{font-size:12px;color:var(--accent);margin-top:4px}
.hm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 8px;margin-top:8px;color:var(--muted);line-height:1.45}
.hm b{color:var(--text)}
.hmo{color:var(--text)}
.hmo i{font-style:normal;color:var(--muted)}
.pnext{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:2px 8px 8px;font-size:13px}
.pnext .nl{color:var(--muted)}
.nc{padding:2px 8px;border-radius:6px}
.nc.la{background:var(--over-bg);color:var(--over-text);font-weight:600}
.nc.du{background:var(--due-bg);color:var(--due-text);font-weight:600}
.nc.ah{border:1px solid var(--line)}
.nc.mu{color:var(--muted);padding-left:0}
.pgridw{overflow-x:auto;padding:0 8px 8px}
.pgrid{display:grid;gap:4px;align-items:stretch;font-size:13px}
.pgrid .pa{font-size:12px;font-weight:600;color:var(--muted);padding:2px 6px;border-bottom:1px solid var(--line)}
.pgrid .pa.now{color:var(--accent);border-bottom-color:var(--accent)}
.pgrid .pm{font-size:12px;color:var(--muted);padding:0 6px 3px}
.pgrid .pm.now{color:var(--accent);font-weight:600}
.pgrid .plb{font-size:12px;color:var(--muted);padding:0 8px 0 0;align-self:center;line-height:1.25}
.pc{display:flex;align-items:center;gap:5px;min-height:30px;padding:4px 6px;border-radius:6px;min-width:0;
  font-size:12.5px;line-height:1.25;overflow-wrap:break-word}
.pc > span{min-width:0}
.pc.e{border:1px dashed var(--line)}
.pc.ok{background:var(--ok-bg);color:var(--ok)}
.pc.du{background:var(--due-bg);color:var(--due-text);font-weight:600}
.pc.la{background:var(--over-bg);color:var(--over-text);font-weight:600}
.pc.ah{border:1px solid var(--line)}
.pc.ex{color:var(--muted);text-decoration:line-through}
.pc .gi{width:16px;height:16px;flex:none}
.pcs{display:flex;flex-direction:column;gap:3px;min-width:0}
.pnow{background:var(--accent);border-radius:1px}
/* Список боссов: строка — имя, свойства метками (чем важен · как отмечается) и что вышло в забеге.
   Нестыковка (ждали реплику или награду, а закрылось иначе) — жёлтая рамка и подпись. */
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:120px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--tile);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.ct{font-weight:600;overflow-wrap:anywhere}
.cs{font-size:12px;color:var(--muted)}
/* строка «позже: …» внутри плашки части */
.cl{font-size:12px;color:var(--muted)}
/* Строка карточки носителя (стат вещи, цель слота, поддержка, уровень камня) — с ровными колонками:
   узкая метка · подпись слева («редкий», «цель») · название · «моё» · с чем сравнивают · состояние. */
.pline{flex:1;min-width:0;display:grid;grid-template-columns:18px 64px minmax(0,1fr) 96px 124px 92px 10px;gap:8px;align-items:baseline;
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--tile);color:var(--text);font:inherit;font-size:14px;text-align:left}
button.pline{cursor:pointer}
button.pline:hover{filter:brightness(1.15)}
/* надетое в ногу с зоной — зелёная строка; ступеней ещё не бывает — приглушённая */
.pline.in-step{border-color:#2f5a43;background:var(--ok-bg)}
.pline.not-yet{opacity:.6}
/* Вещь из буфера обмена против своего слота. Сверху карточки — готовый ответ крупно (лучше / хуже /
   так же / надето), имя вещи и кнопка «Надеть»; ниже строки статов: «моё», число на вещи, стрелка
   с разницей. Плитка слота обведена цветом ответа. */
.cph{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--tile)}
/* сравнение само уходит со страницы через минуту после копии: полоска по нижнему краю убывает всё это
   время — как у окна путевого камня */
.cpt{position:absolute;left:0;bottom:0;height:3px;background:var(--muted);animation:cpgo linear forwards}
@keyframes cpgo{to{width:0}}
/* рисунок скопированной вещи: место под него одно на все вещи — высокие (оружие, доспех) вписаны по высоте */
.cpi{flex:none;width:44px;height:48px;object-fit:contain;filter:brightness(1.35)}
.cpv{flex:none;min-width:88px;font-size:20px;font-weight:700;letter-spacing:.02em}
.cph.v-better{border-color:var(--ok);background:var(--ok-bg)}
.cph.v-better .cpv{color:var(--ok)}
.cph.v-worse{border-color:var(--over);background:var(--over-bg)}
.cph.v-worse .cpv{color:var(--over-text)}
.cph.v-same .cpv,.cph.v-unknown .cpv{color:var(--muted)}
.cpc{display:flex;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ответ считается без вставок в гнёздах; «как есть» — ответ с тем, что вставлено сейчас, и только когда
   он другой: небольшой меткой цвета этого ответа */
.cpr{flex:none;padding:1px 8px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.cpr.v-better{color:var(--ok)}
.cpr.v-worse{color:var(--over-text)}
.cpr.v-same{color:var(--muted)}
.cpe{color:var(--muted)}
.cpn{flex:1;min-width:120px;font-weight:600;overflow-wrap:anywhere}
.cpnote{display:block;font-size:12px;font-weight:400;color:var(--due-text)}
/* паспорт вещи: её статы суммой, одной строкой под шапкой копии */
.cpp{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-2px 0 8px;padding:0 10px;font-size:13px;color:var(--muted)}
.cpp b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.cpp.cpan.lose,.cpp.cpan.lose b{color:var(--due-text)}
.cpb{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);
  font:inherit;font-weight:700;cursor:pointer}
.cpb:hover{filter:brightness(1.1)}
.cpb:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.cpb.busy{opacity:.6}
.mini.cps.on{border-color:var(--accent);color:var(--text)}
.d-up{color:var(--ok);font-weight:700}
.d-dn{color:var(--over-text);font-weight:700}
.pline.c-up{border-color:#2f5a43;background:var(--ok-bg)}
.pline.c-dn{border-color:#6b2a22;background:var(--over-bg)}
.plist.cmp .pline{min-height:34px}
.plist.cmp .pgap{font-size:16px;text-align:center}
.dt.cp-better,.dt.open.cp-better{box-shadow:0 0 0 2px var(--ok)}
.dt.cp-worse,.dt.open.cp-worse{box-shadow:0 0 0 2px var(--over)}
.dt.cp-same,.dt.cp-unknown,.dt.open.cp-same,.dt.open.cp-unknown{box-shadow:0 0 0 2px var(--muted)}
/* Сравнение по статам: «моё», число на вещи, стрелка с разницей.
   Редкий стат (сами его несут два-три слота — больше его взять негде) подписан слева; строка,
   которая решила ответ, обведена; стат, который и так сверх порога, приглушён. Под названием стата
   с порогом — что станет с героем. */
.cph.v-worn .cpv{color:var(--accent)}
.dt.cp-worn,.dt.open.cp-worn{box-shadow:0 0 0 2px var(--accent)}
/* Надеть нельзя (уровень, атрибуты) или после замены перестанет работать надетое: шапка красная, что бы
   ни говорили статы, плитка слота обведена красным; под шапкой — строка с числами. «Может не хватить» —
   той же строкой, но спокойным цветом и без смены ответа. */
.cph.w-no,.cph.w-drop{border-color:var(--over);background:var(--over-bg)}
.cph.w-no .cpv,.cph.w-drop .cpv{color:var(--over-text)}
.cpw{display:flex;flex-wrap:wrap;gap:2px 16px;margin:-2px 0 8px;padding:0 10px;font-size:13px;font-weight:600}
.cpw.w-no,.cpw.w-drop{color:var(--over-text)}
.cpw.w-check{color:var(--due-text)}
.dt.cp-stop,.dt.open.cp-stop{box-shadow:0 0 0 2px var(--over)}
.pline.st-over{opacity:.55}
/* редкий стат слота, которого на надетой вещи нет: искать его нужно именно здесь */
.pline.st-miss{border-color:var(--due)}
.pline.st-miss .pmine .gnone{color:var(--due-text)}
.pline.st-dec{box-shadow:0 0 0 1px currentColor inset}
.pline.st-dec.c-up{color:var(--ok)}
.pline.st-dec.c-dn{color:var(--over-text)}
.pline.st-dec > *{color:var(--text)}
.pline.st-dec > .ppos,.pline.st-dec .pact,.pline.st-dec .sth{color:var(--muted)}
.ppos.stk,.pline.st-dec > .ppos.stk{color:var(--accent)}
.sth{display:block;font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
/* вещь, запомненная надетой в слоте: имя и её статы суммой */
.wl{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:13px}
.wlk{flex:none;width:112px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.wln{flex:0 1 auto;min-width:0;font-weight:600;overflow-wrap:anywhere}
.cpp.wlp{margin:2px 0 6px;padding:0}
/* колонки состояния: моё · актуальное · разрыв */
.pmine,.pbest,.pgap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pact{font-size:11px;color:var(--muted)}
.gb{color:var(--accent);font-size:11px;letter-spacing:1px}
.g0{color:var(--ok);font-weight:700}
.gnone{color:var(--muted)}
.pline:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ppos{font-size:12px;color:var(--muted);white-space:nowrap}
.pname{font-weight:600;overflow-wrap:anywhere}
/* часть без уровней (камень поддержки): название занимает и пустые колонки «моё» и «актуальное» */
.pname.pwide{grid-column:3 / span 3}
.pval{overflow-wrap:anywhere}
.rk-none{visibility:hidden}
/* вид цели: оружие, умение, поддержка, уровень камня… */
.kd{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip:focus-visible,.mini:focus-visible,.rs:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mini{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.mini:hover{color:var(--text);border-color:var(--muted)}
/* Действие, которое убирает запомненное (снять предмет, «нет героя»), — словом и красной рамкой, как
   удаление в редакторе; крестиком на странице только скрывают. Второе нажатие, где оно нужно, — ярче. */
.mini.rm{border-color:#8a3a30;color:var(--over-text)}
.mini.rm:hover{border-color:var(--over);color:var(--over-text)}
.mini.rm.arm{border-color:var(--over);background:var(--over-bg);color:var(--over-text)}
/* Пять состояний — пять цветов, одинаково на всей странице. */
/* позже: ещё не найти или ещё не нужно */
.chip.u-early{opacity:.6}
/* ищу: жёлтая рамка; заливка — если нужно уже к этому шагу */
.u-seek{border-color:var(--due)}
.u-seek .cs{color:var(--due-text)}
.u-due{border-color:var(--due);background:var(--due-bg)}
.u-due .cs{color:var(--due-text)}
/* опаздываю */
.u-overdue{border-color:var(--over);background:var(--over-bg)}
.u-overdue .cs{color:var(--over-text)}
/* есть; пунктиром — камень найден на потом, ещё не вставлен */
.u-done,.u-closed,.u-found{border-color:#2f5a43;background:var(--ok-bg)}
.u-done .cs,.u-closed .cs,.u-found .cs{color:var(--ok)}
.u-found{border-style:dashed}
/* не взято: цель снята, но осталась для разбора */
.chip.u-expired{opacity:.6}
.chip.u-expired .ct{text-decoration:line-through;text-decoration-color:var(--muted)}
.busy{opacity:.55}
.chip:hover{filter:brightness(1.15)}
/* сетка: по умолчанию колонки по ширине окна; у таблицы плана носителя колонки задаёт она сама */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.hk{flex:none;width:96px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
/* уровень камня умения: выделен */
.tr{color:var(--accent);font-weight:700}
/* узкая первая колонка строки карточки */
.rk{display:inline-block;min-width:15px;padding:0 3px;border-radius:4px;background:var(--line);color:var(--text);font-weight:600;font-size:11px;text-align:center;letter-spacing:0}
/* строка носителя: слот или умение, его база и части */
.hrow{padding:8px 0;border-top:1px solid var(--line)}
h2 + .hrow{border-top:0;padding-top:0}
/* первая линия строки — слот и его база (что надето, что ищут); ниже — части на всю ширину */
.hbase{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.hbase > .hk{align-self:center;width:112px}
.hbase > .mini{align-self:center}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.prow{display:flex;align-items:center;gap:6px}
.side-btn{align-self:center}
/* Слоты схемой, как в окне снаряжения игры: оружие слева, вторая рука справа, между ними шлем,
   доспех и пояс, рядом амулет, кольца, перчатки и сапоги. Плитка всегда на своём месте; нажатие
   раскрывает под схемой только этот слот. На плитке — что надето, оценка вещи и срок плана. */
.doll{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  grid-template-areas:"weapon . helmet amulet offhand" "weapon ring1 body ring2 offhand" "weapon gloves belt boots offhand"}
/* Оружие и вторая рука — на всю высоту схемы; доспех выше прочих (он и в игре самый большой), кольца
   рядом с ним остаются своего размера и прижаты к его нижнему краю — полоски оценки у колец и доспеха
   стоят на одной линии; перчатки и сапоги стоят вплотную к поясу. */
.dt.s-body{min-height:112px}
.dt.s-ring1,.dt.s-ring2{align-self:end}
/* в запасе под схемой слотов сразу идут плитки умений — между ними тот же просвет, что между плитками */
.doll + .sgrid,.dopen + .sgrid{margin-top:8px}
.dt{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:64px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--tile);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.dt:hover{filter:brightness(1.15)}
.dt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Зелёная — в слоте что-то есть. Целиком зелёная — вещь в ногу с зоной, лучше сейчас не бывает;
   зелёная наполовину — надето, но можно улучшить. Серая — пусто. Раскрытая — в рамке акцента. */
.dt.lvl{border-color:#2f5a43;background:var(--ok-bg)}
.dt.has,.st.has{border-color:#2f5a43;background:linear-gradient(100deg,var(--ok-bg) 0%,var(--ok-bg) 30%,var(--tile) 78%)}
/* срок плана на плитке: к концу шага — жёлтая рамка; опаздываю — красная, а дольше трёх шагов — и заливка */
.dt.u-due{border-color:var(--due)}
.dt.u-overdue{border-color:var(--over)}
.dt.u-overdue.late2{background:var(--over-bg)}
.dt.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dt.none{cursor:default;opacity:.45}
/* пустой слот: пунктир и «пусто» серым — названия у «чего угодно» нет */
.dt.emp{border-style:dashed;background:transparent}
.dt.emp .dn{font-weight:400;color:var(--muted)}
.chip.emp{border-style:dashed;background:transparent}
.chip.emp .ct{font-weight:400;color:var(--muted)}
.dk{font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
/* имя вещи на плитке — своей строкой на всю ширину плитки: рядом с картинкой длинное слово рвалось бы */
.dn{display:block;margin-top:3px;font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:break-word;text-align:left}
.dn:empty{display:none}
.dl{font-size:11px;font-weight:600;line-height:1.25;color:var(--over-text)}
.dl.due{color:var(--due-text)}
.dg{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px;font-size:13px;white-space:nowrap}
/* Шапка плитки: картинка вещи слева, подписи справа — как у умений; полоска оценки ниже, на всю ширину. */
.dh{display:flex;align-items:flex-start;gap:8px;min-width:0}
.dx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
/* Рисунки вещей из игры тёмные — слегка высветлены, иначе на тёмной плитке не читаются. Рисунок в цвете —
   именно эта вещь; серый силуэт (.ty) — любая вещь такого типа; чего ещё нет (.off) — приглушено. */
.di{flex:none;width:32px;height:32px;object-fit:contain;filter:brightness(1.35)}
/* рисунок самой вещи крупнее силуэта типа: по нему вещь узнают */
.doll .di:not(.ty){width:40px;height:40px}
.di.off{filter:grayscale(1) brightness(1.2);opacity:.45}
.di.ty{filter:brightness(0) invert(.55)}
.di.ty.off{filter:brightness(0) invert(.3);opacity:1}
/* доспех выше прочих плиток — и рисунок у него крупнее */
.dt.s-body .di{width:44px;height:64px}
/* У оружия и второй руки плитка во всю высоту схемы: подписи сверху, рисунок крупно в свободной середине.
   Рисунок занимает то место, что осталось (не больше 120 px), и сам плитку не растягивает. */
.doll .dt.s-weapon .dh,.doll .dt.s-offhand .dh{flex-direction:column;align-items:stretch;flex:1;min-height:0}
.doll .dt.s-weapon .dx,.doll .dt.s-offhand .dx{flex:none}
.doll .dt.s-weapon .di,.doll .dt.s-offhand .di{order:1;flex:1 1 0;min-height:0;max-height:120px;width:64px;height:auto;margin:auto}
/* Оценка вещи: её аффиксы отрезками. Зелёный — аффикс работает на билд (закраска — насколько он силён),
   синий — несёт редкий стат слота, тёмный — билду не нужен, пунктирный — место под аффикс свободно. */
.rb{display:flex;gap:2px;flex:1;min-width:0;height:8px}
.rb i{display:block;flex:1;min-width:3px;height:100%;border-radius:2px;background:#3a414c;overflow:hidden}
.rb b{display:block;height:100%;background:var(--ok)}
.rb i.rare b{background:var(--accent)}
.rb i.free{background:transparent;box-shadow:0 0 0 1px #4a525e inset}
/* строка стата надетой вещи и уровень камня умения: доля от лучшего — полоской; срок плана — под названием */
.pb{display:inline-block;width:30px;height:7px;margin-right:6px;border-radius:2px;background:#3a414c;overflow:hidden;vertical-align:middle}
.pb b{display:block;height:100%;background:var(--ok)}
.plate{display:block;font-size:11px;font-weight:600;color:var(--over-text)}
.plate.due{color:var(--due-text)}
/* что о цели знает программа, рядом со сроком («опаздываю · с 31 уровня»): тише срока */
.plate .ph{font-weight:400;color:var(--muted)}
.plate.ahead{color:var(--muted);font-weight:400}
/* Раскрытый слот или умение — отдельная панель, а не продолжение страницы: рамка того же цвета, что
   у выбранной плитки (видно, чья она), свой, более тёмный фон и просвет до следующего блока. Так сразу
   видно, где тело блока начинается и где кончается. */
.dopen{position:relative;margin:10px 0 16px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--bg)}
/* Крестик карточки — в её правом верхнем углу, на одном месте при любом содержимом: пока в карточке
   сравнение с вещью из буфера, он убирает сравнение, без него — закрывает карточку. Второе нажатие туда же
   закрывает всё, искать кнопку не нужно. Первая строка карточки оставляет ему место с запасом: в конце
   строки бывает «Надеть», промах мимо крестика не должен попадать в него. */
.dclose{position:absolute;top:9px;right:11px;width:30px;height:26px;padding:0;font-size:15px;line-height:1}
.dopen > .hrow > :first-child,.dopen > .skc > :first-child{margin-right:58px}
.dopen > .hrow > .wl:first-child{margin-top:0}
.dopen .hrow{border-top:0;padding:0}
.dopen .skc{border:0;padding:0;margin-top:0}
.dopen .sec.plan{margin-top:8px}
/* Умения: карточка на умение. Первая строка — как строка части в слоте: название (как в игре
   и по-английски), уровень камня — мой, актуальный (какой герой уже может носить) и разрыв. Вторая —
   пять равных мест под камни поддержки; свободное место остаётся пустым, чтобы считывалось сразу. */
.skc{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:8px}
h2 + .skc{margin-top:0}
.pline.skl{grid-template-columns:minmax(0,1fr) 96px 124px 92px 10px}
.skl .ct{font-size:15px}
/* пока камня нет: вместо «актуального» и разрыва — что с ним (срок, опаздываю, позже) */
.skl .slab{grid-column:3 / span 2}
.sslots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ssl{display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0;min-height:44px;padding:4px 7px;
  border-radius:8px;border:1px solid var(--line);background:var(--tile);color:var(--text);font:inherit;text-align:left}
button.ssl{cursor:pointer}
button.ssl:hover{filter:brightness(1.15)}
.ssl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ssl .ct{font-size:13px}
/* вставленный камень — зелёное место (общее правило .u-done слабее фона .ssl, поэтому повторено) */
.ssl.u-done{border-color:#2f5a43;background:var(--ok-bg)}
/* слева картинка камня и под ней галочка, когда он стоит; справа название и, пока камня нет,
   что с ним: «нет», «заменить», «позже». Невставленный камень — картинка приглушена. */
.gcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:26px;font-size:12px;line-height:1}
.gi{display:block;width:26px;height:26px;border-radius:50%}
.ssl:not(.u-done) .gi{opacity:.5;filter:grayscale(.7)}
.ssl .sst{font-size:12px}
.ssl.empty{border-style:dashed;background:transparent}
.ssl.later{opacity:.6}
/* Список ступеней под плашкой части — уровни камня: «нет» и ступени от первой до
   актуальной, текущая в рамке акцента. Плашка с раскрытым списком — тоже в рамке акцента; стрелка
   в её конце (своя узкая колонка) говорит, что нажатие раскроет список. */
.lvc{font-size:11px;color:var(--muted);text-align:right}
.pline.open{border-color:var(--accent)}
.lvlist{display:flex;flex-wrap:wrap;gap:6px}
.plist > .lvlist{margin:2px 0 6px}
.lvi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;min-height:36px;padding:5px 10px;
  border-radius:8px;border:1px solid var(--line);background:var(--tile);color:var(--text);
  font:inherit;font-size:15px;font-weight:700;line-height:1.2;cursor:pointer}
.lvi:hover{filter:brightness(1.15)}
.lvi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lvi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.lvv{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
/* Умения плитками, как слоты в схеме: картинка умения, название, уровень камня с разрывом и пять
   точек — места под камни поддержки. Нажатие раскрывает под плитками карточку этого умения. */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:8px}
.st{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--tile);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.st:hover{filter:brightness(1.15)}
.st:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Взятое умение — зелёное: целиком, когда уровень камня лучший на сейчас и вся поддержка на месте;
   наполовину (.has, правило выше) — взято, но можно улучшить. Невзятое — серое или цветом срока.
   Срок (жёлтый, красный) важнее зелёного. Раскрытая плитка — в рамке акцента. */
.st.lvl{border-color:#2f5a43;background:var(--ok-bg)}
.st.u-seek{border-color:var(--due)}
.st.u-due{border-color:var(--due);background:var(--due-bg)}
.st.u-overdue{border-color:var(--over);background:var(--over-bg)}
.st.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.si{flex:none;width:40px;height:40px;border-radius:6px;background:var(--card)}
.st.off .si{opacity:.45;filter:grayscale(1)}
.stx{display:flex;flex-direction:column;gap:2px;min-width:0}
.stl{font-size:12.5px;white-space:nowrap}
/* умение снимают на этом шаге: на плитке одно слово */
.sdrop{color:var(--due-text);font-weight:600}
.pips{display:flex;gap:3px;margin-top:1px}
.pips i{width:9px;height:9px;border-radius:2px;border:1px solid #4a515c}
.pips i.on{border:1px solid #2f5a43;background:var(--ok)}
.pips i.want{border:1px solid var(--due);background:var(--due-bg)}
.pips i.plan{border:1px solid #5d6672;background:#3a4250}
/* английское имя — второй строкой, мельче */
.ce{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.sn{display:flex;flex-direction:column;min-width:0}
.k-mark span{color:var(--ok)}
.k-reward span,.k-filter span{color:var(--due-text)}
.k-death span{color:var(--over)}
.foot{color:var(--muted);font-size:12px;text-align:center}
@media (max-width:640px){
  /* на узком экране схема не помещается: плитки идут по две в ряд, умения — в одну колонку */
  .doll{grid-template-areas:none;grid-template-columns:repeat(2,minmax(0,1fr))}
  .dt{grid-area:auto !important}
  .sslots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pline.skl{grid-template-columns:minmax(0,1fr) auto auto auto 10px}
  .hrow,.pl{flex-wrap:wrap}
  .hk{width:100%}
  .hrow > .hk{padding-top:0}
}
@media (max-width:420px){.zname{font-size:24px}.t-run{font-size:20px}#app{padding:10px 8px 32px}section{padding:10px}}
/* Путевой камень из буфера обмена: окно поверх страницы с готовым ответом — насколько камень опасен.
   Появляется только на копию камня и само закрывается через 15 секунд (полоска внизу убывает); нажатие
   оставляет окно до крестика. Страницу оно не сдвигает: лежит поверх шапки.
   Ступеней четыре: легко (зелёное), сносно (белое), тяжело (жёлтое), смертельно (красное); синее — камень
   не прочитан. Ту же ступень показывают четыре деления рядом со словом. У каждого свойства — его очки
   точками: сумма очков и даёт ступень; свойство без точек на героя не влияет. */
/* Окна страницы (путевой камень, очки дерева, сравнение предмета) встают под первым рядом шапки программы (он 44px:
   top — 50px): герой и план, режим и язык остаются под рукой и при открытом окне. Друг под другом их ставит popPlace(). */
#way{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:60;width:min(560px,calc(100vw - 20px));
  background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 16px 0;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.65);cursor:pointer}
#way[hidden]{display:none}
#way.v-easy{border-color:var(--ok)}
#way.v-fair{border-color:var(--muted)}
#way.v-hard{border-color:var(--due)}
#way.v-deadly{border-color:var(--over)}
#way.v-unknown{border-color:var(--accent)}
.wyh{display:flex;align-items:center;gap:14px}
.wyh .pshut{margin-left:auto}
.wyv{font-size:38px;font-weight:700;line-height:1.05;letter-spacing:.02em}
#way.v-easy .wyv{color:var(--ok)}
#way.v-fair .wyv{color:var(--text)}
#way.v-hard .wyv{color:var(--due)}
#way.v-deadly .wyv{color:var(--over)}
#way.v-unknown .wyv{color:var(--accent)}
.wyl{display:flex;flex:none;gap:4px}
.wyl i{display:block;width:16px;height:28px;border-radius:3px;background:var(--line)}
#way.v-easy .wyl i.on{background:var(--ok)}
#way.v-fair .wyl i.on{background:var(--text)}
#way.v-hard .wyl i.on{background:var(--due)}
#way.v-deadly .wyl i.on{background:var(--over)}
.wyt{color:var(--muted);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.wyt b{color:var(--over-text);font-weight:700}
/* тир и опыт: справка, всегда тихо — штраф только уменьшает опыт и никуда не зовёт */
.wyx{margin:2px 0;color:var(--muted)}
.wyg{margin:2px 0;color:var(--muted)}
.wyg b{color:var(--text);font-weight:600}
.wyn{color:var(--accent);margin:2px 0}
.wyrs{margin-top:8px}
.wyr{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:30px;
  font-size:17px;color:var(--muted);overflow-wrap:anywhere}
.wyr i{font-style:normal;font-size:10px;letter-spacing:1px;white-space:nowrap}
.wyr b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wyr.c-p1{color:var(--text)}
.wyr.c-p2{color:var(--due-text);font-weight:600}
.wyr.c-p2 i{color:var(--due)}
.wyr.c-p3{color:var(--over-text);font-weight:600}
.wyr.c-p3 i{color:var(--over)}
.wyr.c-unknown{color:var(--accent);font-weight:600}
.wyr.c-unknown i{font-size:16px;font-weight:700;letter-spacing:0}
.wyr .wyoff{margin-left:6px;font-size:12px;font-weight:400;color:var(--muted)}
.wyb{height:4px;margin:10px -16px 0;background:var(--line)}
.wyb i{display:block;height:4px;width:100%;background:var(--muted)}
#way.pin .wyb i{visibility:hidden}
/* Новые очки дерева: окно поверх страницы — сколько очков свободно и какие узлы плана взять за них (по порядку плана,
   не больше трёх) и что каждый узел даёт; справа — кусок карты дерева вокруг этих узлов с теми же номерами. Появляется,
   когда герой получил очки (новый уровень, награда «+N очков»), само закрывается через 30 секунд (полоска внизу убывает),
   нажатие оставляет его до крестика или Esc, очки потрачены — уходит само. Плитка очков, подпись, номера и цвета —
   те же, что в блоке «Дерево». Стоит там же, где окно путевого камня; открыты оба — под ним. */
#pts{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:59;width:min(640px,calc(100vw - 20px));
  background:var(--card);border:2px solid var(--due);border-radius:12px;padding:8px 16px 0;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.65);cursor:pointer}
#pts[hidden]{display:none}
.pth{display:flex;align-items:center;gap:10px}
.pth .ptt{font-size:13px;font-weight:600;color:var(--muted)}
.pth .pshut{margin-left:auto}
.ptb{display:flex;align-items:flex-start;gap:12px;margin-top:4px}
.ptl{flex:1;min-width:0}
.ptn{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:6px;margin-bottom:7px}
.ptn:last-child{margin-bottom:0}
.ptn > i{font-style:normal;font-weight:700;font-size:15px;line-height:21px;color:var(--due-text);text-align:center;font-variant-numeric:tabular-nums}
.ptn b{display:block;font-size:16px;line-height:21px;font-weight:400;color:var(--text)}
.ptn b.big{font-weight:700}
.ptn span{display:block;font-size:13px;line-height:17px;color:var(--muted)}
.ptn b.a-str::before,.ptn b.a-dex::before,.ptn b.a-int::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ptn b.a-str::before{background:#d2584f}
.ptn b.a-dex::before{background:#55a95a}
.ptn b.a-int::before{background:#4a80dc}
.ptm{flex:none;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;line-height:0}
#pts.pin .wyb i{visibility:hidden}
/* узкий экран: плитка и кусок карты — первой строкой, узлы — под ними во всю ширину */
@media (max-width:640px){.ptb{flex-wrap:wrap}.ptm{order:1}.ptl{order:2;flex-basis:100%}}
/* Взятое, пока окно очков открыто: галочка вместо номера — свериться, туда ли поставили (их просьба 2026-11-24); узел
   не из плана — красным. Очки кончились — окно показывает взятое ещё PTS_CHECK_SECONDS. */
.ptn > i.ok{color:var(--ok)}
.ptn > i.bad{color:var(--over-text)}
.ptn.took b{color:var(--ok)}
.ptn.took.bad b{color:var(--over-text)}
/* раньше взятое — одной строкой с числом (ptsMore) */
.ptn.more span{font-size:14px;line-height:21px}
.ptn.more em{font-style:normal;color:var(--over-text)}
.ptl .tsubh + .tsubh,.ptn + .tsubh{margin-top:9px}
/* Окна поверх страницы (сравнение, путевой камень, очки дерева) стоят столбиком, новое сверху (popPlace). Клавиша в игре
   нарисована внутри кнопки, которую она нажимает, перед словом или знаком и по центру строки: «F2 Надеть», «F3 ✕» (их
   слова 2026-11-25: «кнопка должна рисоваться до текста действия»). Клавиша «Закрыть» убирает только верхнее окно: её
   имя — на крестике верхнего, у остальных крестик без него; ✕ при этом не сдвигается. */
.kk{display:inline-block;flex:none;min-width:22px;padding:0 5px;border:1px solid #4a525e;border-bottom-width:2px;border-radius:4px;
  font-size:11px;font-weight:700;font-style:normal;line-height:15px;letter-spacing:0;text-align:center;color:var(--muted)}
.cpb .kk{border-color:rgba(17,19,22,.45);color:var(--bg)}
.pshut{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;min-width:30px;height:26px;padding:0 9px;
  font-size:15px;line-height:1}
.pshut:hover .kk{color:var(--text);border-color:var(--muted)}
#cmp:not(.ontop) .pshut .kk,#way:not(.ontop) .pshut .kk,#pts:not(.ontop) .pshut .kk{display:none}
/* Окно сравнения: скопированная в игре вещь против надетой — ответ, «Надеть» и строки статов, больше ничего (их слова
   2026-11-24: «хочешь сравнить с надетой, и не хочешь думать о массе других вещей»). Страница при копии не прокручивается
   и карточку слота сама не раскрывает; подробности — в карточке, её раскрывают нажатием на плитку слота (тогда окно
   уходит: сравнение — там). Рамка — цветом ответа; полоска внизу — сколько сравнению осталось. */
#cmp{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:61;width:min(720px,calc(100vw - 20px));
  max-height:calc(100vh - 60px);overflow:hidden auto;background:var(--card);border:2px solid var(--muted);border-radius:12px;
  padding:10px 14px 0;box-shadow:0 10px 40px rgba(0,0,0,.65)}
#cmp[hidden]{display:none}
#cmp.v-better{border-color:var(--ok)}
#cmp.v-worse,#cmp.w-no,#cmp.w-drop{border-color:var(--over)}
#cmp.v-worn{border-color:var(--accent)}
#cmp .cph{margin:0 84px 6px 0;padding:0 0 4px;border:0;background:none}
#cmp .cpv{font-size:30px;line-height:1.1}
#cmp .cph.wore{margin-bottom:10px}
#cmp .cma{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 8px}
#cmp .cph.wore .cpv{color:var(--ok)}
#cmp .cpw{padding:0}
#cmp .plist.cmp{margin:0 0 2px}
#cmp .cpp{padding:0}
/* крестик окна — всегда в его правом верхнем углу, над «Надеть»: правый край у них общий */
#cmp > .pshut{position:absolute;top:10px;right:14px}
#cmp .wyb{margin:8px -14px 0}
/* Переключатель языка: кнопка с кодом текущего языка; под ней по нажатию — список языков, каждый своим названием. */
.lang{position:relative;display:inline-flex;margin-left:auto;flex:none}
.lg{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:600;letter-spacing:.04em;line-height:1.5;cursor:pointer}
.lg:hover,.lg.on{color:var(--text)}
.lgc{font-size:9px;color:var(--muted)}
.lgm{position:absolute;top:calc(100% + 6px);right:0;z-index:63;display:flex;flex-direction:column;min-width:200px;padding:4px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.lgi{display:flex;align-items:baseline;gap:10px;padding:5px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);
  font:inherit;font-size:14px;line-height:20px;text-align:left;white-space:nowrap;cursor:pointer}
.lgi b{min-width:22px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.lgi:hover{background:var(--tile)}
.lgi.on,.lgi.on b{color:var(--accent);cursor:default}
/* Японский, корейский, тайский: шрифты Windows для этих письменностей (латиница и цифры остаются Segoe UI). */
html:lang(ja) body{font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",Meiryo,system-ui,sans-serif}
html:lang(ko) body{font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif}
html:lang(th) body{font-family:"Segoe UI","Leelawadee UI",Tahoma,system-ui,sans-serif}
/* Режим программы — «Игра · Разбор · Редактор»: одна программа, три режима. Переключатель стоит на одном месте всех
   страниц, рядом с языком; текущий режим — цветом акцента, как выбранная вкладка. */
.corner{display:inline-flex;align-items:center;gap:12px;margin-left:auto;flex:none}
.corner .lang{margin-left:0}
/* Настройки программы: кнопка в первом ряду шапки (рядом с языком) и окно под ней. Строка — одна настройка: слева — что
   это, справа — выбор; выбранное — как выбранный режим в переключателе рядом. Настройка, которая сейчас ни на что не
   влияет (окна поверх игры выключены), — бледная. */
.setw{position:relative;display:inline-flex;flex:none}
.setb{padding:3px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;
  font-size:13px;cursor:pointer}
.setb:hover{color:var(--text);background:var(--tile)}
.setb.on{color:var(--text);background:#1c2a40}
.setp{position:absolute;top:calc(100% + 6px);right:0;z-index:63;width:max-content;max-width:calc(100vw - 16px);padding:4px 14px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--text);
  font-size:14px;line-height:20px;white-space:nowrap;cursor:default}
.seth{display:flex;align-items:center;justify-content:space-between;gap:24px;height:38px}
.seth b{font-size:15px}
.setx{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;
  cursor:pointer}
.setx:hover{color:var(--text);border-color:var(--muted)}
.setr{display:flex;align-items:center;justify-content:space-between;gap:28px;min-height:38px}
.setr.gap{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.setr.dim .setl{color:var(--muted)}
.setc{display:inline-flex;align-items:center;gap:10px;min-width:0}
.sets{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seto{padding:3px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;line-height:20px;cursor:pointer}
.seto + .seto{border-left:1px solid var(--line)}
.seto:hover:not(:disabled):not(.on){color:var(--text);background:var(--tile)}
.seto.on{color:var(--text);background:#1c2a40;cursor:default}
.seto:disabled{cursor:default}
.setr.dim .sets{opacity:.5}
.setd{color:var(--muted);font-size:13px}
.setd.bad{color:var(--over-text)}
/* О программе: окно встаёт на место окна «Настройки» — тот же угол, строка заголовка той же высоты, ✕ на том же месте;
   шириной до 620 px. Крутится только тело окна: заголовок с ✕ стоит, и полоса прокрутки ✕ не сдвигает. Текст файла
   (LICENSE…) — как есть, моноширинным. */
.abt{position:fixed;z-index:64;display:flex;flex-direction:column;width:min(620px,calc(100vw - 24px));box-sizing:border-box;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--text);
  font-size:14px;line-height:20px;cursor:default}
.abt[hidden]{display:none}
.abt .abh{flex:none;height:42px;padding:4px 14px 0}      /* как окно «Настройки»: 4 px сверху + строка 38 px */
.abt .abh b{font-size:15px}
.abt .abb{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 14px 12px}
.abt .abs{padding:10px 0 4px;border-top:1px solid var(--line)}
.abt .abs.abtop{padding-top:0;border-top:0}
.abt h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.abt p{margin:0 0 6px}
.abt .abn{font-size:18px;font-weight:700;line-height:24px}
.abt .abm{color:var(--muted)}
.abt .abc{margin:2px 0 6px}
.abt .abr{margin-bottom:4px}
.abt a{color:var(--accent);text-decoration:none}
.abt a:hover{text-decoration:underline}
.abt .abq{padding:5px 10px;border-left:2px solid var(--line);background:var(--tile);font:13px/19px Consolas,"Cascadia Mono",monospace;
  overflow-wrap:anywhere}
.abt .aba{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.abt .abl{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.abt .abl td{padding:1px 0;vertical-align:top}
.abt .abl td + td{padding-left:14px;color:var(--muted)}
.abt .abl td:nth-child(2){white-space:nowrap}
.abt .abl tr.sub td:first-child{padding-left:16px;color:var(--muted)}
.abt .abx{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/17px Consolas,"Cascadia Mono",monospace}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode a{padding:3px 12px;font-size:13px;color:var(--muted);text-decoration:none}
.mode a + a{border-left:1px solid var(--line)}
.mode a[href]:hover{color:var(--text);background:var(--tile)}
.mode a.on{color:var(--text);background:#1c2a40;cursor:default}   /* без жирного: ширина переключателя одна в обоих режимах */
/* Герой и план — переключатель слева в первом ряду шапки (одинаковый на обеих страницах). Длинное название обрезается
   «…»; новый герой, которого спрашивают о плане, — жёлтым, как цель на своём шаге. */
.ctxb{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:min(60%,560px);padding:3px 10px;border-radius:7px;
  border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;line-height:18px;cursor:pointer}
.ctxb:hover{background:var(--tile);filter:none}
.ctxb .ctxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxb .ctxc{flex:none;color:var(--muted);font-size:11px}
.ctxb.on{border-color:var(--accent)}
.ctxb.need{border-color:var(--due);background:#33290f;color:var(--due-text)}
.ctxb.need .ctxc{color:var(--due-text)}
/* Список под ним: шириной в колонку страницы (место и размер ставит ctxPlace), до низа окна, крутится целиком; подложка
   ниже первого ряда шапки ловит нажатие мимо и колесо — страница под списком стоит. Список — над всплывающими окнами
   «Игры» (путевой камень, очки дерева): его открыл сам игрок, а окна никуда не денутся, когда он его закроет. */
#ctxbg{position:fixed;left:0;right:0;bottom:0;top:44px;z-index:61;background:rgba(0,0,0,.45)}
#ctx{position:fixed;z-index:62;overflow:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:2px 14px 12px;box-shadow:0 12px 32px rgba(0,0,0,.55);font-size:13px;outline:none}
#ctx .cxs{padding-top:10px}
#ctx .cxs + .cxs{margin-top:10px;border-top:1px solid var(--line)}
#ctx .cxh{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:26px;margin-bottom:2px}
#ctx h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#ctx h3.need{color:var(--due-text)}
#ctx .ctxw{color:var(--muted);margin:8px 0}
#ctx .mini{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;
  font-size:12px;line-height:18px;cursor:pointer;white-space:nowrap}
#ctx .mini:hover{color:var(--text);filter:none}
#ctx .mini.arm{border-color:var(--due);color:var(--due-text)}
#ctx .mini.go{border-color:var(--accent);color:var(--text)}
#ctx .mini.rm{border-color:#8a3a30;color:var(--over-text)}
#ctx .mini.rm.arm{border-color:var(--over);background:var(--over-bg)}
#ctx .mini.add{border-color:#2f6e4c;color:#a9e2c2}
/* таблицы героев и планов: столбцы одной ширины во всех строках, ничего не съезжает; текст длиннее столбца — «…» */
#ctx .runrow,#ctx .planrow{display:grid;column-gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#ctx .runrow{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 74px 160px}
#ctx .runrow.lib{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.2fr) 74px 160px}
#ctx .planrow{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 160px}
#ctx .runrow > span,#ctx .planrow > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx .runhead{border-top:0;padding:2px 0;font-size:11px;color:var(--muted)}
#ctx .runn,#ctx .pln{font-weight:600}
#ctx .runt{text-align:right;font-variant-numeric:tabular-nums}
#ctx .runa{display:flex;justify-content:flex-end;align-items:center;gap:6px}
#ctx .runl,#ctx .plt,#ctx .plc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#ctx .runnow{color:var(--ok);font-weight:600}
#ctx .tdone{color:var(--ok)}
#ctx .runrow.cur .runn,#ctx .planrow.cur .pln{color:var(--ok)}
#ctx .runrow.gone .runn,#ctx .runrow.gone .runc,#ctx .runrow.gone .runz,#ctx .runrow.gone .runp,#ctx .runrow.gone .runt{color:var(--muted);font-weight:400}
/* строка плана — выбор: нажимается целиком; выбранный план — подсвечен (он один на «Игру» и «Редактор») */
#ctx .planrow.pick{cursor:pointer;margin:0 -8px;padding:6px 8px;border-radius:6px}
#ctx .planrow.pick:hover{background:var(--tile)}
#ctx .planrow.cur,#ctx .planrow.cur + .planrow{border-top-color:transparent}
#ctx .planrow.cur{background:var(--ok-bg)}
#ctx .planrow.pick:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
#ctx .cxq{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;
  border:1px solid var(--due);border-radius:8px;color:var(--due-text)}
#ctx .cxadd{display:flex;justify-content:flex-end;margin-top:10px}
#ctx .cxmsg{margin:10px 0 0;color:var(--over-text)}
#ctx .cxmsg.ok{color:var(--ok)}
/* «Новый план» — окно поверх страницы: название, основа, что взять. Выбор «что взять» — одним рядом. */
#ctxnew{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:80px 16px 16px}
#ctxnew .nwbox{width:min(540px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px}
#ctxnew h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text)}
#ctxnew .nwrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
#ctxnew .lab{color:var(--muted);font-size:13px}
#ctxnew input,#ctxnew select{width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#ctxnew input:focus,#ctxnew select:focus{outline:none;border-color:var(--accent)}
#ctxnew .nwtake{display:flex;gap:6px;flex-wrap:wrap}
#ctxnew .mini{padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;line-height:18px;cursor:pointer}
#ctxnew .mini:hover{color:var(--text);filter:none}
#ctxnew .mini.on{border-color:var(--accent);color:var(--text);background:#1c2a40}
#ctxnew .mini.go{border-color:var(--accent);color:var(--text)}
#ctxnew .mini:disabled{opacity:.5;cursor:default}
#ctxnew .nwfix{color:var(--muted)}
#ctxnew .nwnote{margin:6px 0 0;color:var(--due-text)}
#ctxnew .nwhint{margin:6px 0 0;color:var(--muted)}
#ctxnew .nwbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#ctxnew .cxmsg{margin:8px 0 0;color:var(--over-text)}
#ctx .cxadd{gap:8px}
/* узкое окно: место — именам; где герой, его план и класс плана уходят, кнопки берут сколько им нужно */
@media (max-width:640px){#ctx{padding:2px 10px 10px}#ctx .runrow,#ctx .runrow.lib{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 52px auto}
  #ctx .runz,#ctx .runp{display:none}#ctx .planrow{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto}#ctx .plc{display:none}}

/* Окна поверх игры (planner/overlay.py): та же страница в режиме ?ov=list — список шага — и ?ov=answer — ответ на копию
   (сравнение предмета, путевой камень). Окно — ровно по содержимому, без полей: его место, размер и скругление ставит
   программа; мышь окно не принимает вовсе — нажатия с зажатым Alt ловит программа и передаёт сюда (ovClick).
   Список: строка шага — внизу и не двигается; над ней всё, что осталось, в порядке выполнения: сверху долги (красные),
   потом дела героя (фильтр, снять, дерево, камни, предметы), ниже дела зоны (награды, боссы), последними — точки одной
   строкой. Сделанное зеленеет на 12 секунд (полоска под строкой убывает) и уходит. Квадратик — отмечает игрок, точка —
   отметит программа, ромб — точка перехода. Цвета — те же пять состояний, что на всей странице. */
html.ov,html.ov body{overflow:hidden;background:var(--bg)}
html.ov{scrollbar-gutter:auto}           /* полосы прокрутки у окна нет — и места под неё не оставляем */
html.ov .hbar,html.ov #ctxbg,html.ov #ctx{display:none}
html.ov #app{max-width:none;margin:0;padding:0}
/* окно списка — постоянной высоты, видна его нижняя часть по содержимому: список прижат к низу, строка шага не двигается */
html.ov-list #app{position:fixed;left:0;right:0;bottom:0}
html.ov-list #cmp,html.ov-list #way,html.ov-list #pts{display:none}
html.ov-answer #app,html.ov-answer #pts{display:none}
/* Окно дерева (?ov=tree): то же окно очков дерева, что на странице, — что брать дальше и кусок карты. Мышь оно не
   ловит (под ним дерево игры), поэтому крестика у него нет: появляется только по Alt. */
html.ov-tree #app,html.ov-tree #cmp,html.ov-tree #way{display:none}
html.ov-tree body{background:#08090b}
html.ov-tree #pts{position:static;transform:none;width:100%;max-height:none;margin:0;box-shadow:none;border-radius:0;cursor:default}
html.ov-tree #pts .pshut{display:none}
html.ov-answer body{display:flex;flex-direction:column;gap:6px;background:#08090b}
html.ov-answer #cmp,html.ov-answer #way{position:static;transform:none;width:100%;max-height:none;margin:0;box-shadow:none;
  border-radius:0;overflow:hidden}
html.ov-answer #cmp .cpn{flex-basis:100%}      /* имя предмета — своей строкой под ответом, а не узким столбиком рядом */
/* сравнение в узком окне: название стата — во всю оставшуюся ширину, подпись («редкий», «цель», «база») — над ним;
   справа три ровные колонки: моё · на предмете · разница */
html.ov-answer .plist.cmp .pline{grid-template-columns:minmax(0,1fr) 54px 98px 70px;column-gap:8px;row-gap:0;align-items:center;padding:4px 9px}
html.ov-answer .plist.cmp .pline > .rk{display:none}
html.ov-answer .plist.cmp .pline > .ppos{grid-column:1;grid-row:1;font-size:11px;line-height:13px}
html.ov-answer .plist.cmp .pline > .ppos:empty{display:none}
html.ov-answer .plist.cmp .pline > .pname{grid-column:1;grid-row:2}
html.ov-answer .plist.cmp .pline > .pname.pwide{grid-column:1 / span 3}
html.ov-answer .plist.cmp .pline > .pmine{grid-column:2;grid-row:1 / span 2;text-align:right}
html.ov-answer .plist.cmp .pline > .pbest{grid-column:3;grid-row:1 / span 2;text-align:right}
html.ov-answer .plist.cmp .pline > .pgap{grid-column:4;grid-row:1 / span 2;text-align:right}
/* Alt зажат над окном ответа: по нему можно нажимать — рамка ответа (её цвет — сам ответ) остаётся, внутри — вторая */
html.ov-answer.ov-armed #cmp,html.ov-answer.ov-armed #way{box-shadow:inset 0 0 0 2px var(--accent)}
html.ov .ov-hov{filter:brightness(1.35)}
.ovl{padding:5px 8px 4px;border:1px solid #414854;background:var(--bg);font-size:15px;line-height:1.35}
.ovl.armed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ovr{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:26px;margin-top:3px;padding:0 9px 0 7px;
  border:0;border-left:3px solid var(--due);border-radius:4px;background:var(--due-bg);color:var(--text);font:inherit;
  text-align:left;white-space:nowrap;cursor:default}
.ovl > .ovr:first-child{margin-top:0}
.ovr.z0{margin-top:9px}                  /* дела зоны отделены от дел героя небольшим зазором */
.ovr .ovb,.ovr .ovd{flex:none;width:14px;height:14px;text-align:center;font:700 12px/14px "Segoe UI",system-ui,sans-serif}
