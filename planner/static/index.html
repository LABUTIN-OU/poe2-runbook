      const hint = p.have ? `${T('Сейчас стоит: {0}. Нажмите, когда замените', p.have.title)}` : T('Нажмите, когда вставите');
      return `<button class="ssl" data-goal="${esc(g.id)}" data-status="2" ${sk} title="${esc(hint)}">` +
        `${place(g, '', p.have ? T('заменить') : T('нет'))}</button>`;
    }
    if (p.have) {
      const inner = place(p.have, '<span class="g0">✓</span>', '');
      return byHand(p.have)
        ? `<button class="ssl u-done" data-goal="${esc(p.have.id)}" data-status="0" ${sk} title="${T('Стоит. Нажмите, чтобы снять отметку')}">${inner}</button>`
        : `<div class="ssl u-done">${inner}</div>`;
    }
    // шаг камня впереди: «позже», но нажимается — игрок может вставить его раньше плана
    return p.later ? `<button class="ssl later" data-goal="${esc(p.later.id)}" data-status="2" ${sk} title="${T('Нажмите, когда вставите')}">` +
      `${place(p.later, '', T('позже'))}</button>` : '';
  }).filter(Boolean);
  while (slots.length < SUPPORT_SLOTS) slots.push('<div class="ssl empty"></div>');
  // План снимает умение на этом шаге: «Снять» — словом и красной рамкой, как у предмета: умение уйдёт со страницы
  const off = r.drop && b.have
    ? `<div class="wl"><span class="wlk">${T('снять##камень')}</span><span class="wln">${T('на этом шаге')}</span>` +
      `<button class="mini rm" data-off="${esc(b.have.id)}" data-on="1" data-k="${k}:off" title="${T('Умение уйдёт со страницы')}">${T('Снять')}</button></div>`
    : '';
  return `<div class="skc"><div class="prow">${row}</div>${off}${list}<div class="sslots">${slots.join('')}</div>${planBlock(r)}</div>`;
}

// Умения плитками, как слоты в схеме: картинка, название, уровень камня и разрыв до актуального,
// пять точек — места под камни поддержки (зелёная — стоит, жёлтая — пора вставить или заменить,
// серая — камень в плане, но срок ещё впереди).
// Нажатие раскрывает под плитками карточку умения с управлением; повторное нажатие закрывает.
function skillTiles(rows) {
  let h = '<div class="sgrid">';
  for (const r of rows) {
    const b = r.base || {}, g = b.have || b.next || b.later;
    if (!g) continue;
    const level = r.parts.find(p => p.key === 'level');
    const sups = r.parts.filter(p => p !== level);
    const behind = b.have && level && level.top && level.gap ? level.gap : 0;
    const open = r.id === openSkill;
    let cls = 'st' + (open ? ' open' : ''), state;
    if (b.have) {
      // Взятое умение зелёное всегда: целиком — уровень камня лучший на сейчас и поддержка вся на месте,
      // наполовину — взято, но уже можно улучшить (иначе серая плитка читалась как «не взял»).
      cls += !behind && !sups.some(p => p.next) ? ' lvl' : ' has';
      // Срок плана виден и на взятом умении: уровень камня или камень поддержки нужны к этому шагу —
      // жёлтая плитка, срок прошёл — красная, как у невзятого умения и у слотов.
      if (r.state === 'overdue' || r.state === 'due') cls += ' u-' + r.state;
      state = level && level.have
        ? `<span class="pact">${T('ур.')}</span> <b class="tr">${esc(level.have.title)}</b> ${behind ? gapBars(behind) : '<span class="g0">✓</span>'}`
        : '<span class="g0">✓</span>';
      // План снимает умение на этом шаге: плитка говорит только это — уровень и поддержка ему уже ни к чему.
      // Сняли («Снять» в карточке или плашка шага) — плитка уходит.
      if (r.drop) {
        cls = 'st has u-due' + (open ? ' open' : '');
        state = `<span class="sdrop">${T('снять##камень')}</span>`;
      }
    } else {
      cls += ' off' + (b.next ? ' u-' + b.next.urgency : '');
      state = `<span class="gnone">${b.next ? T('нет') : T('позже')}</span>`;
    }
    // жёлтая точка — камень нужен к этому шагу или срок прошёл; серая — он в плане, но срок впереди
    const hot = p => !p.next.soft && (p.next.urgency === 'due' || p.next.urgency === 'overdue');
    const pips = sups.map(p => p.next ? (hot(p) ? 'want' : 'plan') : p.have ? 'on' : p.later ? 'plan' : '');
    while (pips.length < SUPPORT_SLOTS) pips.push('');
    // Картинка умения лежит рядом со страницей: «skill-» и английское имя строчными через дефисы — так её
    // называет каталог данных игры, и картинки всех камней скачаны по нему заранее (catalog/fetch_icons.py).
    // У названия без английского имени — под именем цели. Нет файла — плитка остаётся без картинки.
    const slug = (splitName(g.title)[1] || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const icon = slug ? 'skill-' + slug : r.id.startsWith('skill:') ? r.id.slice(6) : r.id;
    h += `<button class="${cls}" data-skill="${esc(r.id)}" aria-expanded="${open}">` +
      `<img class="si" src="/icons/${esc(icon)}.webp" alt="" width="40" height="40" onerror="this.style.visibility='hidden'">` +
      `<span class="stx"><span class="dn">${esc(tileName(g.title))}</span><span class="stl">${state}</span>` +
      `<span class="pips">${pips.map(c => `<i${c ? ` class="${c}"` : ''}></i>`).join('')}</span></span></button>`;
  }
  h += '</div>';
  const row = rows.find(r => r.id === openSkill);
  return h + (row ? `<div class="dopen" data-card="skill">${cardShut('skill')}${skillRow(row)}</div>` : '');
}

// Дерево пассивных умений — блоком после умений: карта, под ней — сколько очков свободно и что брать дальше
// по плану. Взятое страница знает из лога (игра пишет каждый клик по дереву), отмечать ничего не нужно.
// «Брать дальше» — не вся очередь, а путь до ближайшего большого узла (значимого, ключевого, гнезда) и ещё
// два больших узла за ним через многоточие: видно, что брать сейчас и куда ведёт план, без ряда плашек.
// Подряд идущие одинаковые узлы пути свёрнуты в один с числом узлов словами («+5 к силе · 4 узла»); число
// пишется именно словами: «×4» читалось как множитель самой характеристики. Сколько узлов можно взять прямо
// сейчас — столько первых жёлтые. После смены этапа (перекачка) впереди стоит, сколько взятых узлов в новый
// этап не входит.
const NEXT_BIG = 3;    // сколько больших узлов впереди назвать: ближайший (путь до него — весь) и два за ним
const NEXT_PATH = 6;   // сколько плашек пути до ближайшего большого узла рисовать; путь длиннее — многоточие
// --- карта дерева -----------------------------------------------------------------------------
// Настоящее дерево по координатам из данных GGG (файл /tree.json, его собирает planner/treegeo.py):
// узлы стоят там же, где в игре, связи идут теми же дугами. Рисуется схемой, без картинок игры:
// зелёные — взятые, жёлтые с номерами — что брать сейчас и в каком порядке, с синей обводкой — план
// этапа дальше, красные — лишние после перекачки, серые — остальное дерево. Карта стоит в блоке «Дерево»
// (у атласа своя — в блоке «Атлас») и сама держит в кадре следующие узлы, пока её не сдвинут рукой.
let treeGeo = null;      // {nodes: [[id, x, y, вид, название]], edges: [[a, b] | [a, b, cx, cy]], at: id -> номер}
// Дерево атласа (файл /atlas.json, его собирает planner/atlasgeo.py) — того же вида, поэтому карта
// у двух деревьев общая. Сверх того: trees — деревья атласа (основное и по механикам, у каждого свои очки),
// у узла шестым полем номер его дерева; ru — названия узлов как в клиенте; roots — номера корневых узлов.
let atlasGeo = null;
// Карт две — дерева героя и атласа, каждая в своём блоке страницы. Код у них общий: с какой из них он сейчас
// работает, говорит mapKind, её окно — mapView; переключает их useMap — перед рисованием и в обработчиках.
let mapKind = 'tree';    // 'tree' — дерево героя, 'atlas' — атлас
const mapGeo = () => (mapKind === 'atlas' ? atlasGeo : treeGeo);
const mapTree = v => { const x = v || V; return x ? (mapKind === 'atlas' ? x.atlas : x.tree) : null; };
// Название узла из данных дерева: как в клиенте, если данные его знают (атлас), иначе английское.
// название узла: по-русски — слой ru файла, на другом языке игры — here (программа добавляет его к файлу), иначе английское
const geoName = (g, i) => { const n = g.nodes[i]; return (I18N.lang === I18N.source && g.ru && g.ru[n[4]]) || (g.here && g.here[n[0]]) || n[4]; };
// Условия узла атласа словами клиента: когда он действует («Действует на области 70+ уровня») и что нужно,
// чтобы его взять («Требует активации большого зеркала»). Пустой список — условий нет; null — данных нет:
// у малого узла основного дерева условие зависит от раздела, и для части таких узлов его взять неоткуда.
const atlasWhen = (g, i) => { const c = g.nodes[i][6]; return c === null ? null : (c || []).map(k => g.conds[k]); };
// Из них — только то, без чего узел не взять.
const atlasNeeds = (g, i) => (g.nodes[i][6] || []).filter(k => g.need && g.need[k]).map(k => g.conds[k]);
// Окно карты: центр в единицах дерева и масштаб (пикселей на единицу). follow — окно само следует
// за следующими узлами; fit — показан весь этап целиком.
// У атласа ещё tree — дерево, которое игрок выбрал нажатием на его строку под картой (null — не выбирал).
const mapViews = {tree: {x: 0, y: 0, s: 0.085, follow: true, fit: false}, atlas: {x: 0, y: 0, s: 0.085, follow: true, fit: false, tree: null}};
let mapView = mapViews.tree;
const useMap = kind => { mapKind = kind === 'atlas' ? 'atlas' : 'tree'; mapView = mapViews[mapKind]; };
const MAP_SCALE = 0.085, MAP_MIN = 0.03, MAP_MAX = 0.2;   // 0.085 — между соседними узлами около 22 px
const MAP_R = [50, 50, 82, 120, 86, 150];                  // радиус узла по виду, в единицах дерева
const KIND_NUM = {small: 0, attribute: 1, notable: 2, keystone: 3, socket: 4};
function geoIndex(g) {
  // на другом языке страницы названия деревьев атласа и условия узлов — строками игры этого языка (treesLang,
  // condsLang; названия, которого игра не даёт, — английское слово дерева); какие условия «требуют», помнит
  // русский текст (need)
  if (g.conds) g.need = g.conds.map(t => t.startsWith('Требует'));
  if (g.trees && I18N.lang !== I18N.source) {
    const here = (g.treesLang || {})[I18N.lang];
    g.trees.forEach((t, k) => { t.name = (here && here[k]) || t.key || t.name; });
  }
  if (g.conds && I18N.lang !== I18N.source && g.condsLang && g.condsLang[I18N.lang]) g.conds = g.condsLang[I18N.lang];
  g.at = new Map(g.nodes.map((n, i) => [n[0], i]));
  // соседи узла — чтобы найти старт класса, от которого идёт план
  g.near = new Map();
  for (const e of g.edges) {
    for (const [a, b] of [[e[0], e[1]], [e[1], e[0]]]) {
      if (!g.near.has(a)) g.near.set(a, []);
      g.near.get(a).push(b);
    }
  }
  g.roots = g.nodes.map((n, i) => (n[3] === 5 ? i : -1)).filter(i => i >= 0);
  return g;
}
fetch(langUrl('/tree.json')).then(r => r.ok ? r.json() : null).then(g => {
  if (!g || !g.nodes) return;
  treeGeo = geoIndex(g);
  render();
}).catch(() => { /* без файла геометрии карты нет, строка «Дерево» работает */ });
fetch(langUrl('/atlas.json')).then(r => r.ok ? r.json() : null).then(g => {
  if (!g || !g.nodes || !g.trees) return;
  atlasGeo = geoIndex(g);
  render();
}).catch(() => { /* без файла геометрии карты атласа нет, строка «Атлас» работает */ });

// Как назвать узел плана. У «Характеристики» с выбранным атрибутом пишется то, что она даёт, — «+5 инт»:
// так узел и выглядит в игре после выбора. Остальные — по названию.
const ATTR_GAIN = 5;   // узел «Характеристика» даёт +5 к выбранному атрибуту (данные дерева GGG)
// Атрибут узла в плане — str / dex / int (так его пишет правка дерева); в старых записях — слово («инт»).
const ATTR_WORD = {str: T('сила'), dex: T('ловк'), int: T('инт')};
const ATTR_ID = {'сила': 'str', 'сил': 'str', 'ловк': 'dex', 'ловкость': 'dex', 'инт': 'int', 'интеллект': 'int'};
const attrId = a => (a && (ATTR_WORD[a] ? a : ATTR_ID[String(a).toLowerCase()])) || null;
const attrWord = a => ATTR_WORD[a] || a;
const nodeLabel = n => n.kind === 'attribute' && n.attr ? `+${ATTR_GAIN} ${attrWord(n.attr)}` : n.name;
// То же полными словами — для блока «Дерево», где места хватает: «+5 к ловкости».
const ATTR_TO = {str: T('к силе'), dex: T('к ловкости'), int: T('к интеллекту')};
const nodeFull = n => n.kind === 'attribute' && n.attr ? `+${ATTR_GAIN} ${ATTR_TO[attrId(n.attr)] || attrWord(n.attr)}` : n.name;

// Очередь этапа: узлы плана, которых ещё нет, по порядку. Узел, который ждёт условия своей цели (t.held:
// «Иммунитет к хаосу — при 6 тысячах энергощита»), в очередь не идёт: его берут не по порядку очков.
// Не идут и узлы, которые брать очком не нужно (t.skip): узел с надетого предмета и путь только к нему.
const treeQueue = t => {
  const have = new Set(t.have), held = new Set((t.held || []).map(h => h.id)), skip = new Set(t.skip || []);
  return t.plan.filter(n => !have.has(n.id) && !held.has(n.id) && !skip.has(n.id));
};
// Такие узлы в блоке дерева: названием цели и её условием, после очереди, пунктиром и не жёлтым — сколько
// бы очков ни было свободно, блок не предлагает взять их «сейчас».
// Название — без английского в скобках (оно длинное); целиком — в подсказке.
const heldNodes = t => (t.held || []).map(h =>
  `<span class="tnode big hold" title="${esc(h.name + (' ' + T('— не по очереди очков:') + ' ') + T('по условию цели'))}">` +
  esc(h.name.replace(/\s*\([^)]*\)\s*$/, '')) + '</span>').join('');
// Атлас — несколько деревьев, у каждого свои очки, поэтому «что брать дальше» там своё у каждого дерева.
// Номер дерева узла (или −1) и очереди по деревьям: номер дерева -> его узлы плана, которых ещё нет.
const atlasTreeOf = id => { const i = atlasGeo ? atlasGeo.at.get(id) : undefined; return i === undefined ? -1 : atlasGeo.nodes[i][5]; };
// Варианты узлов атласа с выбором словами игры: {id узла: {opts: [варианты]}} — файл берётся, когда план
// называет вариант хотя бы у одного узла. До тех пор (и если файла нет) страница говорит только номер.
let atlasOpts = null, atlasOptsAsked = false;
function needAtlasOpts(t) {
  if (atlasOptsAsked || !t || !(t.plan || []).some(n => n.opt)) return;
  atlasOptsAsked = true;
  // файл своего языка (atlasstats.<язык>.json), нет его — общий
  const get = url => fetch(url).then(r => (r.ok ? r.json() : null), () => null);
  get('/atlasstats.' + I18N.lang + '.json').then(d => d || get('/atlasstats.json'))
    .then(d => { atlasOpts = d; if (V) render(); }).catch(() => { /* останется номер */ });
}
// Какой вариант взять в узле с выбором: «вариант 2: текст варианта».
function optLabel(n) {
  const opts = atlasOpts && atlasOpts[n.id] && atlasOpts[n.id].opts;
  return (T('вариант') + ' ') + n.opt + (opts && opts[n.opt - 1] ? ': ' + opts[n.opt - 1] : '');
}
function atlasNext(t) {
  const out = new Map();
  for (const n of treeQueue(t)) {
    const k = atlasTreeOf(n.id);
    if (k < 0) continue;
    if (!out.has(k)) out.set(k, []);
    out.get(k).push(n);
  }
  return out;
}
// Какое дерево атласа держит окно карты, когда оно следует за планом. Деревья независимы: очки у каждого свои,
// порядок узлов — тоже свой, общего «следующего узла» у атласа нет. Поэтому: дерево, выбранное нажатием на его
// строку под картой; иначе то, где в атласе брали узел последним, пока по плану в нём есть что брать; иначе
// первое дерево, где по плану есть что брать; план собран — дерево последнего взятого узла. −1 — ни плана,
// ни взятого.
function atlasFocusTree(t) {
  if (!atlasGeo || !t) return -1;
  if (mapViews.atlas.tree !== null) return mapViews.atlas.tree;
  const next = atlasNext(t);
  const last = t.have.slice().reverse().find(id => atlasGeo.at.has(id));
  const k = last !== undefined ? atlasTreeOf(last) : -1;
  return next.has(k) ? k : next.size ? Math.min(...next.keys()) : k;
}

// Куда смотрит окно, когда оно следует за игроком: на ближайшие узлы очереди (сколько свободных очков,
// но не меньше трёх и не больше двенадцати) вместе с последними взятыми — чтобы было видно, откуда идти.
// pop — узлы окна «куда вложить очки» (его кусок карты): тогда окно держит их и последние взятые.
function mapFocus(t, W, H, pop) {
  const g = mapGeo(), pts = [];
  const add = id => { const i = g.at.get(id); if (i !== undefined) pts.push(g.nodes[i]); };
  const queue = treeQueue(t);
  if (mapKind === 'atlas') {
    // Атлас: окно держит одно дерево (какое — atlasFocusTree) — его ближайшие узлы плана, последние взятые
    // и корень. «Весь план» — план и всё взятое; нет ни того, ни другого — атлас целиком.
    const k = atlasFocusTree(t);
    if (mapView.fit || k < 0) {
      t.plan.forEach(n => add(n.id));
      t.have.forEach(add);
      if (!pts.length) g.nodes.forEach(n => pts.push(n));
    } else {
      queue.filter(n => atlasTreeOf(n.id) === k).slice(0, 3).forEach(n => add(n.id));
      t.have.filter(id => atlasTreeOf(id) === k).slice(-4).forEach(add);
      const root = g.roots.find(r => g.nodes[r][5] === k);
      if (root !== undefined) pts.push(g.nodes[root]);
    }
  } else if (pop) {
    pop.forEach(id => add(id));
    t.plan.filter(n => t.have.includes(n.id)).slice(-3).forEach(n => add(n.id));
  } else if (mapView.fit || !queue.length) t.plan.forEach(n => add(n.id));
  else {
    queue.slice(0, Math.min(12, Math.max(3, t.free))).forEach(n => add(n.id));
    t.plan.filter(n => t.have.includes(n.id)).slice(-3).forEach(n => add(n.id));
  }
  if (!pts.length) return;
  const xs = pts.map(n => n[1]), ys = pts.map(n => n[2]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  mapView.x = (x0 + x1) / 2;
  mapView.y = (y0 + y1) / 2;
  // всё нужное должно влезть с полями; крупнее обычного масштаба не делаем
  const fit = Math.min((W - (pop ? 40 : 120)) / Math.max(1, x1 - x0), (H - (pop ? 56 : 90)) / Math.max(1, y1 - y0));
  mapView.s = Math.max(MAP_MIN, Math.min(mapView.fit ? MAP_MAX : MAP_SCALE, fit));
}

// Ширина подписи на карте в пикселях — меряется тем же шрифтом, каким она будет нарисована.
const textWidth = (() => {
  const seen = new Map();
  let ctx = null;
  return text => {
    if (!seen.has(text)) {
      if (!ctx) {
        ctx = document.createElement('canvas').getContext('2d');
        ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
      }
      seen.set(text, ctx.measureText(text).width);
    }
    return seen.get(text);
  };
})();

// Подписи узлов не должны ложиться ни друг на друга, ни на узлы плана. Каждой подбирается место вокруг
// её узла — справа, слева, снизу, сверху, потом по диагоналям — первое свободное. Места раздаются
// по очереди: сначала ближайшим узлам очереди. Свободного места нет — подпись не рисуется вовсе:
// наложенные друг на друга названия не читаются оба, а название узла остаётся в его подсказке.
function placeLabels(want, solid) {
  const hit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  const placed = [];
  let out = '';
  for (const w of want.sort((a, b) => a.rank - b.rank)) {
    const tw = textWidth(w.text), r = w.r, d = r * 0.72;
    const spots = [                      // [привязка текста, x, базовая линия]
      ['start', w.x + r + 5, w.y + 4], ['end', w.x - r - 5, w.y + 4],
      ['middle', w.x, w.y + r + 13], ['middle', w.x, w.y - r - 5],
      ['start', w.x + d + 4, w.y - d - 3], ['start', w.x + d + 4, w.y + d + 11],
      ['end', w.x - d - 4, w.y - d - 3], ['end', w.x - d - 4, w.y + d + 11],
    ];
    for (const [anchor, x, y] of spots) {
      const x0 = anchor === 'start' ? x : anchor === 'end' ? x - tw : x - tw / 2;
      const box = [x0 - 3, y - 10, x0 + tw + 3, y + 3];
      if (placed.some(b => hit(box, b)) || solid.some(b => b[4] !== w.i && hit(box, b))) continue;
      placed.push(box);
      out += `<text class="${w.cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"` +
        `${anchor === 'start' ? '' : ` text-anchor="${anchor}"`}>${esc(w.text)}</text>`;
      break;
    }
  }
  return out;
}

// pop — узлы окна «куда вложить очки»: карта для него маленькая — номера только у этих узлов, подписей нет
// (названия — в строках окна рядом).
function treeMapSvg(v, W, H, pop, popNums) {
  const g = mapGeo(), t = mapTree(v), atlas = mapKind === 'atlas';
  if (mapView.follow || mapView.fit) mapFocus(t, W, H, pop);
  const s = mapView.s, ox = W / 2 - mapView.x * s, oy = H / 2 - mapView.y * s;
  const X = x => (x * s + ox), Y = y => (y * s + oy);
  const f = n => n.toFixed(1);
  const plan = new Map(t.plan.map((n, i) => [n.id, n]));
  const have = new Set(t.have);
  const queue = treeQueue(t);
  const order = new Map(queue.map((n, i) => [n.id, i]));      // место узла в очереди
  const held = new Map((t.held || []).map(h => [h.id, h]));   // узлы, которые ждут условия своей цели
  // узлы с надетых предметов (зачарование амулета): зелёные, обведены пунктиром; путь, ставший ненужным (skip), —
  // как узлы вне плана. Узел, через который идёт путь, остаётся узлом очереди: очко на него нужно
  const amu = new Map(atlas ? [] : (t.anoint || []).filter(a => a.id && a.state !== 'path').map(a => [a.id, a]));
  const skip = new Set(t.skip || []);
  // Что брать сейчас (жёлтые узлы). У дерева героя — столько первых узлов очереди, сколько свободных очков.
  // У атласа очки у каждого дерева свои, и сколько их свободно, игра не пишет: там это первый узел очереди
  // в каждом дереве, без номеров.
  // Пока не сказано, чей атлас продолжает герой (вопрос «Атлас уже открыт?»), жёлтого нет: очередь звала бы брать
  // то, что, может быть, уже взято до героя.
  const free = atlas ? 0 : t.free;
  // в окне «куда вложить очки» жёлтые — только его узлы (с номерами), остальной план — обычной обводкой
  const nowIds = new Set(atlas ? (t.ask || atlasAsk ? [] : [...atlasNext(t).values()].map(q => q[0].id)) : pop || queue.slice(0, free).map(n => n.id));
  // атлас: узлы, которые опаздывают (были в версии атласа прошлого этапа и не взяты), — красной обводкой;
  // пока не сказано, чей атлас продолжает герой, опоздания нет: неизвестно, что уже взято
  const late = new Set(atlas && !(t.ask || atlasAsk) ? t.late || [] : []);
  // скольким ближайшим узлам пишем номер; окно очков после траты очков (popNums = 0) номеров не пишет — оно показывает взятое
  const numbered = atlas ? 0 : pop ? (popNums === undefined ? pop.length : popNums) : Math.min(9, Math.max(3, free));
  const pad = 160 * s + 40;
  const seen = n => { const x = X(n[1]), y = Y(n[2]); return x > -pad && x < W + pad && y > -pad && y < H + pad; };
  // старт класса, от которого идёт план: подписан только он (на карте видны и старты соседних классов);
  // у атласа подписаны корни всех его деревьев — их названиями
  const first = t.plan.length ? g.at.get(t.plan[0].id) : undefined;
  const home = atlas || first === undefined ? undefined : (g.near.get(first) || []).find(j => g.nodes[j][3] === 5);
  // связи: обычные, по плану этапа (оба конца в плане) и взятые (оба конца взяты). В атласе взятое зелёное
  // и вне плана (перекачки там нет), а корень дерева считается своим концом связи.
  const got = n => (atlas ? have.has(n[0]) || n[3] === 5 : have.has(n[0]) && plan.has(n[0]));
  const planned = n => (plan.has(n[0]) && !skip.has(n[0])) || (atlas && (n[3] === 5 || have.has(n[0])));
  const lines = ['', '', ''];
  for (const e of g.edges) {
    const a = g.nodes[e[0]], b = g.nodes[e[1]];
    if (!seen(a) && !seen(b)) continue;
    const k = got(a) && got(b) ? 2 : planned(a) && planned(b) ? 1 : 0;
    let d = `M${f(X(a[1]))} ${f(Y(a[2]))}`;
    if (e.length === 4) {
      // дуга вокруг центра группы: короткая из двух; направление — по знаку векторного произведения
      const r = Math.hypot(a[1] - e[2], a[2] - e[3]) * s;
      const cw = (a[1] - e[2]) * (b[2] - e[3]) - (a[2] - e[3]) * (b[1] - e[2]) > 0 ? 1 : 0;
      d += `A${f(r)} ${f(r)} 0 0 ${cw} ${f(X(b[1]))} ${f(Y(b[2]))}`;
    } else d += `L${f(X(b[1]))} ${f(Y(b[2]))}`;
    lines[k] += d;
  }
  let dots = '', marks = '';
  const label = (x, y, text, cls) => `<text class="${cls}" x="${f(x)}" y="${f(y)}">${esc(text)}</text>`;
  const solid = [];   // что подписи не должны закрывать: узлы плана и взятые, номера очереди — [x0, y0, x1, y1, узел]
  const want = [];    // подписи, которым ещё предстоит найти место (см. placeLabels)
  for (let i = 0; i < g.nodes.length; i++) {
    const n = g.nodes[i];
    if (!seen(n)) continue;
    const p = plan.get(n[0]), pos = order.get(n[0]);
    const mine = have.has(n[0]);
    const wait = !mine ? held.get(n[0]) : undefined;
    const gift = !mine ? amu.get(n[0]) : undefined;
    const cls = (mine ? (p || atlas ? 'have' : 'extra') : gift ? (gift.state === 'todo' ? 'amu want' : 'amu') : pos !== undefined ? (nowIds.has(n[0]) ? 'now' : 'plan')
      : wait ? 'plan hold' : 'rest') + (!mine && late.has(n[0]) ? ' late' : '');
    const kind = p ? KIND_NUM[p.kind] || 0 : n[3];
    const r = Math.max(cls === 'rest' ? 1.6 : 2.6, MAP_R[kind] * s);
    const x = X(n[1]), y = Y(n[2]);
    const name = wait ? wait.name : gift ? gift.name : p ? nodeLabel(p) : atlas && n[3] === 5 ? g.trees[n[5]].name : geoName(g, i);
    // взятый узел «Характеристика» дерева героя — цветом атрибута, которым он посчитан (выбор игрока или план);
    // «?» — не посчитан: узла нет в плане и игрок его не назвал
    const took = !atlas && mine && n[3] === 1 ? heroAttrOf(v, n[0], p) || '?' : null;
    // ближайший узел «Характеристика» по плану (тот, что с номером) — внутри цвет атрибута, который ему назначил
    // план: что брать, видно без чтения подписи; узел без назначенного атрибута и не атрибут остаются пустыми
    const soon = !atlas && !mine && pos !== undefined && pos < numbered && p && p.kind === 'attribute' ? attrId(p.attr) : null;
    // узел атласа с выбором, которому план назвал вариант: номер варианта — в кружке, словами — в подсказке
    const opt = atlas && p && p.opt ? p.opt : 0;
    // атлас: откуда взятое не этим героем — клик героя того же атласа или отметка игрока (пунктиром)
    const src = atlas && mine ? (t.before || {})[n[0]] : undefined;
    // в подсказке узла атласа — ещё и его условия
    const tip = `<title>${esc([name].concat(!mine && late.has(n[0]) ? [T('опаздывает: был в плане атласа прошлого этапа')] : [],
      gift ? [amuFrom(gift)] : [], opt ? [optLabel(p)] : [],
      src ? [src === 'hand' ? T('отмечено вами: взят до героя') : T('взят до героя — {0}', runHero(v, src))] : [],
      atlas && n[3] !== 5 ? atlasWhen(g, i) || [] : []).join('\n'))}</title>`;
    dots += kind === 4
      ? `<rect class="mn ${cls}" x="${f(x - r)}" y="${f(y - r)}" width="${f(2 * r)}" height="${f(2 * r)}" rx="2" transform="rotate(45 ${f(x)} ${f(y)})">${tip}</rect>`
      : `<circle class="mn ${cls}${kind >= 2 ? ' big' : ''}${src === 'hand' ? ' hand' : ''}${took && took !== '?' ? ' a-' + took : soon ? ' a-' + soon : ''}" cx="${f(x)}" cy="${f(y)}" r="${f(took || soon ? Math.max(r, 4.5) : r)}">${tip}</circle>`;
    if (cls !== 'rest') solid.push([x - r, y - r, x + r, y + r, i]);
    if (took === '?' && s >= 0.07) marks += `<text class="mattr" x="${f(x)}" y="${f(y + 3)}">?</text>`;
    if (opt && r >= 5) { const fs = Math.min(11, r * 1.15); marks += `<text class="mopt" x="${f(x)}" y="${f(y + fs * 0.36)}" font-size="${f(fs)}">${opt}</text>`; }
    // подписи: номер у ближайших узлов очереди; название — у значимых узлов плана (при читаемом масштабе)
    if (pos !== undefined && pos < numbered) {
      marks += label(x, y - r - 4, pos + 1, 'mnum' + (pos < free ? ' now' : ''));
      solid.push([x - 8, y - r - 15, x + 8, y - r - 2, -1]);
    }
    // очередь мест: сначала ближайшие узлы очереди, потом остальной план, взятое — последним
    if (p && kind >= 2 && s >= 0.055) {
      // узел, который ждёт своей цели, подписан её названием — как в строке дерева
      want.push({i, x, y, r, text: wait ? wait.name.replace(/\s*\([^)]*\)\s*$/, '') : p.name,
        cls: 'mlab' + (mine ? ' have' : ''), rank: pos !== undefined ? pos : mine ? 2e6 + i : 1e6 + i});
    } else if (i === home) want.push({i, x, y, r, text: T('старт'), cls: 'mlab', rank: 3e6});
    else if (atlas && n[3] === 5) want.push({i, x, y, r, text: g.trees[n[5]].name, cls: 'mlab root', rank: -1});
    else if (atlas && mine && kind >= 2 && s >= 0.055) want.push({i, x, y, r, text: name, cls: 'mlab have', rank: 2e6 + i});
    else if (gift && kind >= 2 && s >= 0.055) want.push({i, x, y, r, text: name, cls: 'mlab have', rank: 2e6 + i});
  }
  if (!pop) marks += placeLabels(want, solid);
  return `<svg class="msvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
    `<path class="me" d="${lines[0]}"/><path class="me plan" d="${lines[1]}"/><path class="me have" d="${lines[2]}"/>` +
    dots + marks + '</svg>';
}

// Рисует карту в её блок. Отдельно от остальной страницы: при перетаскивании перерисовывается только она.
function drawMap(only) {
  if (!V) return;
  for (const el of document.querySelectorAll('.tmap[data-kind]')) {
    if (only && el.dataset.kind !== only) continue;
    useMap(el.dataset.kind);
    if (!mapTree() || !mapGeo()) continue;
    const box = el.querySelector('.mbox');
    box.innerHTML = Q(treeMapSvg(V, box.clientWidth, box.clientHeight));
  }
}

// --- что герой взял на самом деле ----------------------------------------------------------------
// Карта здесь — только просмотр: план дерева (версии и узлы) правят на странице «Билд», вкладка «Дерево».
// К забегу относится одно: какой атрибут взят в узле «Характеристика» у героя. Игра этого в лог не пишет,
// поэтому счёт идёт по плану: узел из версии дерева считается назначенным ему атрибутом, узел вне плана
// не считается. Когда прокачка разошлась с планом, игрок называет атрибут сам — нажатием на взятый узел
// на карте: выбор хранится в забеге (не в билде) и важнее плана.
let heroPick = null;      // узел, для которого открыт выбор: {i — номер узла на карте, x, y — где нажали}
const heroAttrOf = (v, id, p) => ((v.heroAttrs || {}).picks || {})[id] || (p ? attrId(p.attr) : null);
function heroPickClick(px, py, W, H) {
  useMap('tree');
  const g = treeGeo, t = V && V.tree;
  const i = g && t ? mapNodeAt(px, py, W, H) : -1;
  heroPick = i >= 0 && g.nodes[i][3] === 1 && (t.have || []).includes(g.nodes[i][0]) ? {i, x: px, y: py} : null;
  render();
}
function heroPickMenu(v) {
  if (!heroPick || mapKind !== 'tree' || !treeGeo || !v.tree) return '';
  const id = treeGeo.nodes[heroPick.i][0], p = (v.tree.plan || []).find(n => n.id === id);
  const own = ((v.heroAttrs || {}).picks || {})[id], planned = p ? attrId(p.attr) : null, now = own || planned;
  return `<div class="mmenu" style="left:${Math.round(heroPick.x) + 10}px;top:${Math.round(heroPick.y) - 14}px">` +
    ['str', 'dex', 'int'].map(a => `<button class="mini a-${a}${a === now ? ' on' : ''}" data-hattr="${a}" data-k="pick">+${ATTR_GAIN} ${ATTR_WORD[a]}</button>`).join('') +
    (own ? `<button class="mini" data-hattr="" data-k="pick">${planned ? (T('как в плане ·') + ' ') + ATTR_WORD[planned] : T('не считать')}</button>` : '') + '</div>';
}
// Счёт атрибутов героя разошёлся с тем, что на герое уже работает, или взяты узлы «Характеристика» без
// атрибута — под картой дерева сказано, что не сходится и что с этим делать (правят это тут же, нажатием на
// узел). Пока всё сходится, строки нет: свои атрибуты игрок видит в игре, а счёт программы (класс героя,
// дерево по плану, запомненные вещи) нужен только ответу по вещи — в её карточке он и показан.
function heroAttrLine(v) {
  const h = v.heroAttrs;
  if (!h || mapKind !== 'tree') return '';
  const low = h.attrs.filter(a => a.low);
  if (!low.length && !h.unset.length) return '';
  return `<div class="mhero" title="${esc([T('Счёт программы: класс героя, дерево по плану, запомненные надетые предметы.')].concat(h.notes || []).join(' · '))}">` +
    low.map(a => `<span class="low">${esc(a.name)} ${T('по счёту')} <b>${a.value}</b> ${T('— «{0}» требует', esc(a.by))} ${a.need}</span>`).join('') +
    `<span class="how low">${low.length ? (T('В узлах взято не то, что в плане.') + ' ') : ''}` +
    `${h.unset.length ? `${T('Взято, но не посчитано:')} ${h.unset.length} ${plural(h.unset.length, 'узел', 'узла', 'узлов')} ${T('«Характеристика» без атрибута (на карте — «?»).')} ` : ''}` +
    (T('Нажмите на взятый узел «Характеристика» и назовите его атрибут.') + '</span></div>');
}

// Ближайший к точке узел дерева на карте (не дальше 14 px) — номер в его списке nodes или −1.
function mapNodeAt(px, py, W, H) {
  const g = mapGeo(), s = mapView.s;
  const tx = (px - W / 2) / s + mapView.x, ty = (py - H / 2) / s + mapView.y;
  let best = -1, bd = (14 / s) * (14 / s);
  for (let i = 0; i < g.nodes.length; i++) {
    const n = g.nodes[i], d = (n[1] - tx) * (n[1] - tx) + (n[2] - ty) * (n[2] - ty);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Что брать дальше по плану. queue — узлы плана, которых ещё нет, по порядку; free — сколько из них можно
// взять прямо сейчас (в атласе счёта очков нет — 0); extra(n) — приписка к самому первому узлу (в атласе:
// какой вариант взять и без чего узел не взять). Рисуется путь до ближайшего большого узла — плашками,
// одинаковые соседние узлы одной плашкой с числом узлов словами, — сам этот узел и через многоточие ещё два
// больших; что осталось за последним названным — числом «ещё N». Жёлтое — на что очков уже хватает.
// late — id узлов, которые опаздывают (атлас: были в версии прошлого этапа): такая плашка красная.
const bigNode = n => n.kind !== 'small' && n.kind !== 'attribute';
function nextChips(queue, free, extra, late) {
  if (!queue.length) return '';
  // узел «Характеристика» с назначенным атрибутом — с кружком его цвета: тем же, что у этого узла на карте
  const attr = n => (n.kind === 'attribute' && attrId(n.attr) ? ' a-' + attrId(n.attr) : '');
  // плашка опаздывает, если опаздывает хоть один из узлов, которые она называет
  const behind = (at, count) => (late && queue.slice(at, at + count).some(x => late.has(x.id)) ? ' late' : '');
  const chip = (n, at, count) => `<span class="tnode${bigNode(n) ? ' big' : ''}${at < free ? ' now' : ''}${behind(at, count)}${attr(n)}">${esc(nodeFull(n))}` +
    (count > 1 ? ` <span class="tnn">· ${count} ${plural(count, 'узел', 'узла', 'узлов')}</span>` : '') +
    (at === 0 && extra ? extra(n) : '') + '</span>';
  const arr = '<span class="tarr">→</span>';
  const gap = n => `<span class="tgap" title="${esc(`${T('между ними')} ${n} ${plural(n, 'узел', 'узла', 'узлов')}`)}">…</span>`;
  const step = (sign, body) => (sign ? `<span class="tstep">${sign}${body}</span>` : body);
  // путь до ближайшего большого узла: [0, end)
  const b1 = queue.findIndex(bigNode), end = b1 < 0 ? queue.length : b1;
  const groups = [];
  for (let i = 0; i < end; i++) {
    const g = groups[groups.length - 1];
    if (g && nodeFull(queue[g.at]) === nodeFull(queue[i]) && queue[g.at].kind === queue[i].kind) g.n++;
    else groups.push({at: i, n: 1});
  }
  let html = '', last = -1;       // last — номер последнего названного узла очереди
  for (const g of groups.slice(0, NEXT_PATH)) {
    html += step(last < 0 ? '' : arr, chip(queue[g.at], g.at, g.n));
    last = g.at + g.n - 1;
  }
  // большие узлы: ближайший — следом за своим путём, два за ним — через многоточие
  for (let k = 0, bi = b1; k < NEXT_BIG && bi >= 0; k++) {
    html += step(last < 0 ? '' : bi - last > 1 ? gap(bi - last - 1) : arr, chip(queue[bi], bi, 1));
    last = bi;
    bi = queue.findIndex((n, i) => i > last && bigNode(n));
  }
  const rest = queue.length - last - 1;
  return html + (rest > 0 ? `<span class="tmore">${T('ещё')} ${rest}</span>` : '');
}

// Узлы дерева с надетых предметов (зачарование амулета; лог о них молчит — их знает память надетого): строкой
// под очередью — откуда узел, он сам и что он значит для плана. Очко на такой узел не тратится.
// Узел, который план берёт с предмета, а на предмете его ещё нет (todo), — «на амулет» и чем зачаровать; срока у него
// нет, жёлтым и красным он не горит: эмоции падают по удаче.
const amuFrom = a => (a.state === 'todo' ? (a.amulet ? T('на амулет') : T('на предмет «{0}»', a.slot))
  : a.amulet ? T('с амулета') : T('с предмета «{0}»', a.slot));
function amuRows(t) {
  return (t.anoint || []).map(a => {
    const note = a.state === 'item' ? T('по плану')
      : a.state === 'todo' ? (a.recipe.length ? `${T('зачаровать:')} ${a.recipe.join(' → ')}` : '') +
        // раньше этого уровня зоны эмоций рецепта не найти: когда узел станет доступен
        (a.from ? ` · ${T('эмоции {0}', fromZone(a.from))}` : '') +
        // пока узла нет, действует запасная версия; узел на предмете — дерево переходит на версию этапа само
        (a.then ? ` · ${T('потом дерево «{0}»', a.then)}` : '')
      : a.state === 'plan' ? `${T('сберегает')} ${a.saves} ${plural(a.saves, 'очко', 'очка', 'очков')}`
      : a.state === 'path' ? T('путь идёт через него — взять очком')
      : a.state === 'took' ? T('уже взят очком') : T('не в плане дерева');
    return `<div class="tamu"><span class="tamul">${esc(amuFrom(a))}</span>` +
      `<span class="tnode big amu${a.state === 'todo' ? ' want' : ''}">${esc(a.name)}</span><span class="twhen">${esc(note)}</span></div>`;
  }).join('');
}

// Блок «Дерево» — после умений, всегда открыт: карта, под ней — подблок «Брать дальше по плану» с плиткой
// свободных очков. Над картой эта строка читалась как хлебные крошки, поэтому она под картой и подписана.
function treeBlock(v) {
  const t = v.tree;
  if (!t) return '';
  const q = nextChips(treeQueue(t), t.free), held = heldNodes(t);
  // очередь кончилась, а узлы с условием ещё ждут — блок называет их, а не «дерево собрано»;
  // ни один этап билда версии дерева не назвал — плана на этом шаге нет
  const queue = !t.now ? ('<span class="tmore">' + T('плана нет') + '</span>')
    : !q ? (held || ('<span class="tnode big done">' + T('✓ дерево собрано') + '</span>'))
    : q + held;
  // после смены этапа (перекачка): сколько взятых узлов в новый этап не входит
  const drop = t.extra ? `<div class="tpts drop"><b>${t.extra}</b>${T('снять')}</div>` : '';
  return ('<section class="tsec" id="s-tree"><h2><span>' + T('Дерево') + '</span>') +
    `<span class="side">${t.phase ? '«' + esc(t.phase) + '» · ' : ''}${T('взято {0} из', t.taken)} ${t.total}</span></h2>` +
    mapPanel(v, 'tree') +
    `<div class="tsub">${drop}<div class="tpts${t.free ? ' free' : ''}"><b>${t.free}</b>${plural(t.free, 'очко', 'очка', 'очков')}</div>` +
    `<div class="tsubb"><div class="tsubh">${T('Брать дальше по плану')}</div><div class="tnext">${queue}</div>${amuRows(t)}</div></div></section>`;
}

// Блок «Атлас» — под деревом, когда у этапа билда названа версия атласа: карта и тот же подблок «Брать дальше
// по плану». Деревьев в атласе несколько (основное и по механикам), очки у каждого свои, поэтому в подблоке
// по строке на дерево: чьё оно и его путь. Сколько очков свободно, игра в лог не пишет — счёта очков здесь
// нет. Взятое страница знает из лога, как и у дерева героя.
// Атлас общий у героев одной лиги: новый герой получает его открытым, а лог пишет только клики и лигу не
// называет. Поэтому взятое — клики этого героя и героев того же атласа (по слову игрока) и узлы, которые
// игрок отметил сам. Когда герой на картах, а слова ещё нет и в логе есть атласы других героев, на месте
// «Брать дальше по плану» — вопрос «Атлас уже открыт?»: без ответа очередь звала бы брать уже взятое.
// Ответ меняется кнопкой у карты (atlasAsk — вопрос открыт ею).
let atlasAsk = false;
// Герой забега словами списка забегов: имя, а до второго уровня (лог героя ещё не назвал) — когда начат.
const runHero = (v, id) => {
  const r = (v.runs || []).find(x => x.id === id);
  return !r ? id : r.name || (T('герой') + ' ' + dayTime(r.started));
};
function atlasQuestion(v) {
  const t = v.atlas;
  const opts = (t.offers || []).map(o => `<button class="mini${o.on ? ' on' : ''}" data-afrom="${esc(o.run)}" data-k="afrom"` +
    ` title="${esc(T('последний клик по атласу — {0}', dayTime(o.last)))}">${esc(T('как у героя {0}', runHero(v, o.run)))} · ${o.nodes} ${plural(o.nodes, 'узел', 'узла', 'узлов')}</button>`);
  opts.push(`<button class="mini${t.from === '' ? ' on' : ''}" data-afrom="" data-k="afrom" title="${esc(T('Атласа ещё не было: новая лига или первый герой в ней'))}">${T('новый')}</button>`);
  return `<div class="tsubb"><div class="tsubh" title="${esc(T('Атлас общий у героев одной лиги, а лига в лог не пишется. Чей атлас продолжает этот герой?'))}">${T('Атлас уже открыт?')}</div>` +
    `<div class="tnext">${opts.join('')}</div></div>`;
}
// Клики по атласу идут не от взятого — в атласе есть взятое, которого программа не знает (лог начат позже,
// чем взяты узлы, или ответ «новый» неверен). Под картой — янтарная строка: что не сходится и что делать.
function atlasGapLine(v) {
  const t = v.atlas, gaps = (t && t.gaps) || [];
  if (!gaps.length || t.ask || atlasAsk || mapKind !== 'atlas') return '';
  const head = gaps.length === 1 ? T('Узел «{0}» взят не рядом со взятым: в атласе есть взятое, которого нет в логе.', gaps[0].name)
    : T('Узлы «{0}» и ещё {1} взяты не рядом со взятым: в атласе есть взятое, которого нет в логе.', gaps[0].name, gaps.length - 1);
  return `<div class="mhero"><span class="amber">${esc(head)}</span>` +
    `<span class="how">${esc(T('Отметьте на карте узлы, взятые в игре: нажмите на узел и «взят до героя».'))}</span></div>`;
}
// Нажатие на узел атласа: невзятый можно отметить взятым до героя, отмеченный — снять отметку. Взятое по
// логу не трогается: это факт лога. atlasMark — узел, для которого открыто меню.
let atlasMark = null;
function atlasMarkClick(px, py, W, H) {
  useMap('atlas');
  const g = atlasGeo, t = V && V.atlas;
  const i = g && t ? mapNodeAt(px, py, W, H) : -1;
  const id = i >= 0 ? g.nodes[i][0] : null;
  const hand = id !== null && (t.before || {})[id] === 'hand';
  atlasMark = i >= 0 && g.nodes[i][3] !== 5 && (hand || !(t.have || []).includes(id)) ? {i, x: px, y: py} : null;
  render();
}
function atlasMarkMenu(v) {
  if (!atlasMark || mapKind !== 'atlas' || !atlasGeo || !v.atlas) return '';
  const id = atlasGeo.nodes[atlasMark.i][0], hand = (v.atlas.before || {})[id] === 'hand';
  return `<div class="mmenu" style="left:${Math.round(atlasMark.x) + 10}px;top:${Math.round(atlasMark.y) - 14}px">` +
    `<button class="mini" data-amark="${hand ? 'off' : 'on'}" data-k="amark">${hand ? T('снять отметку') : T('взят до героя')}</button></div>`;
}
function atlasBlock(v) {
  const t = v.atlas, g = atlasGeo;
  needAtlasOpts(t);
  if (!t || !(t.plan || []).length) return '';
  // взятое по плану — чьё оно: этого героя, до него (клики героев того же атласа), отмеченное игроком
  const before = t.taken - (t.own || 0) - (t.hand || 0);
  const split = before || t.hand ? [T('этим героем {0}', t.own || 0)].concat(before ? [T('до него {0}', before)] : [],
    t.hand ? [T('отмечено вами {0}', t.hand)] : []).join(' · ') : '';
  if (t.ask || atlasAsk) {
    return ('<section class="tsec" id="s-atlas"><h2><span>' + T('Атлас') + '</span>') +
      `<span class="side"${split ? ` title="${esc(split)}"` : ''}>${t.phase ? '«' + esc(t.phase) + '» · ' : ''}${T('взято {0} из', t.taken)} ${t.total}</span></h2>` +
      mapPanel(v, 'atlas') + `<div class="tsub">${atlasQuestion(v)}</div></section>`;
  }
  let rows = '';
  if (g) {
    // у самого первого узла дерева — какой вариант взять (узел с выбором, план назвал вариант) и без чего
    // узел не взять (игра не даст, пока условие не выполнено), словами клиента
    const first = n => (n.opt ? `<span class="tpick">${esc(optLabel(n))}</span>` : '') +
      atlasNeeds(g, g.at.get(n.id)).map(x => `<span class="twhen">${esc(x)}</span>`).join('');
    // По строке на каждое дерево, где у версии есть узлы: деревья независимы (очки и порядок у каждого свои),
    // поэтому и ответ у каждого свой — его путь или «✓ собрано». Дерево, где осталось только то, что ждёт
    // условия своей цели, отдельной строки не получает: эти узлы — в строке «по условию». Название дерева —
    // кнопка: карта показывает это дерево; дерево, которое карта держит сейчас, светлее.
    const next = atlasNext(t), held = heldNodes(t);
    const waits = new Set((t.held || []).map(h => atlasTreeOf(h.id)));
    const trees = [...new Set(t.plan.map(n => atlasTreeOf(n.id)).filter(k => k >= 0))].sort((a, b) => a - b);
    const focus = mapViews.atlas.follow && !mapViews.atlas.fit ? atlasFocusTree(t) : -1;
    const lab = k => `<button class="tlab${k === focus ? ' on' : ''}" data-atree="${k}" title="${esc(T('Показать это дерево на карте'))}">${esc(g.trees[k].name)}</button>`;
    // красные — узлы, которые опаздывают: были в версии атласа прошлого этапа и до сих пор не взяты
    const late = new Set(t.late || []);
    if (next.size || held) {
      rows = trees.filter(k => next.has(k) || !waits.has(k)).map(k => `<div class="apool">${lab(k)}<div class="tnext">` +
        (next.has(k) ? nextChips(next.get(k), 0, first, late) : ('<span class="tnode big done">' + T('✓ собрано') + '</span>')) + '</div></div>').join('');
      // узлы, которые ждут условия своей цели, — после очередей, как в блоке дерева
      if (held) rows += `<div class="apool"><span class="tlab">${T('по условию')}</span><div class="tnext">${held}</div></div>`;
    } else rows = ('<div class="apool"><span class="tnode big done">' + T('✓ план собран') + '</span></div>');
  }
  // сколько узлов опаздывает — в заголовке красным: статус блока виден, не читая строк
  const nl = (t.late || []).length;
  const behind = nl ? ` · <span class="late">${T('отстаёт на {0}', nl + ' ' + plural(nl, 'узел', 'узла', 'узлов'))}</span>` : '';
  return ('<section class="tsec" id="s-atlas"><h2><span>' + T('Атлас') + '</span>') +
    `<span class="side"${split ? ` title="${esc(split)}"` : ''}>${t.phase ? '«' + esc(t.phase) + '» · ' : ''}${T('взято {0} из', t.taken)} ${t.total}${behind}</span></h2>` +
    mapPanel(v, 'atlas') +
    (rows ? `<div class="tsub"><div class="tsubb"><div class="tsubh">${T('Брать дальше по плану')}</div>${rows}</div></div>` : '') + '</section>';
}

// Карта дерева — в его блоке; у дерева героя и у атласа карты свои (kind). План здесь не правят, и ссылки
// в редактор на карте нет: игрок план не пишет.
function mapPanel(v, kind) {
  useMap(kind);
  const t = mapTree(v), g = mapGeo(), atlas = kind === 'atlas';
  if (!t || !g || !t.plan) return '';
  const on = k => (k === 'follow' ? mapView.follow && !mapView.fit : mapView.fit) ? ' on' : '';
  // атлас: чей он — слово игрока; нажатие снова открывает вопрос «Атлас уже открыт?»
  const whose = atlas && t.from != null && !t.ask
    ? `<button class="mini${atlasAsk ? ' on' : ''}" data-atlasask title="${esc(T('Чей атлас продолжает этот герой — сменить ответ'))}">` +
      `${esc(t.from ? T('атлас как у героя {0}', runHero(v, t.from)) : T('атлас новый'))}</button>` : '';
  return `<div class="tmap" data-kind="${kind}"><div class="mwrap"><div class="mbox"></div>` + heroPickMenu(v) + atlasMarkMenu(v) + '<div class="mctl">' + whose +
    `<button class="mini${on('follow')}" data-map="follow">${T('к следующим')}</button>` +
    `<button class="mini${on('fit')}" data-map="fit">${atlas ? T('весь план') : T('всё дерево')}</button>` +
    `<button class="mini" data-map="out" aria-label="${T('Мельче')}">−</button>` +
    `<button class="mini" data-map="in" aria-label="${T('Крупнее')}">+</button>` +
    '</div></div>' + heroAttrLine(v) + atlasGapLine(v) + '</div>';
}

// Статус программы — цвет и одна фраза. Зелёный — лог читается. Красный — одно из четырёх, и сказано что:
// страница потеряла программу, программа не нашла лог игры, проход чтения лога падает, игра новее программы. Жёлтого
// нет. Перед фразой, пока всё в порядке, — две версии рядом: «программа 0.5.5.4 · игра 0.5.5h» (v.version): первые три
// числа программы — версия игры, под которую она сделана, и глазом видно, что они те же, что у игры.
// Когда пришла последняя запись лога — в подсказке: на глаз это не нужно. Стоит справа в строке состояния, слева — фильтр.
// Точка — после слов, у самого правого края: блок прижат вправо, и так она всегда на одном месте, какой бы длины ни
// был текст (красная причина длиннее зелёного «лог читается»); взгляд ищет цвет, а не слова.
// Игру программа ищет сама (Steam, клиент с сайта, запущенная игра); не нашла — просит её запустить. У окна программы
// есть выбор папки: тогда рядом с причиной — кнопка «указать папку игры»; указали не ту — причина говорит это.
function statusLine(v) {
  const L = v.log, ver = v.version || {};
  const bad = !live ? T('нет связи с программой, жду…')
    : L.problem ? L.problem
      : L.found === false ? T('игра не найдена — запустите её')
        : !L.ok ? (T('лог игры не найден:') + ' ') + L.path
          : L.error ? (T('лог не читается — ошибка программы:') + ' ') + L.error
            : ver.newer ? T('игра {0} — программа для {1}: нужна новая версия программы', ver.game, ver.made) : '';
  const vtext = bad || !ver.program ? '' : T('программа {0}', ver.program) + (ver.game ? ' · ' + T('игра {0}', ver.game) : '');
  const pick = live && L.pick === true && (L.problem || !L.ok)
    ? `<button class="mini" data-game="pick">${T('указать папку игры')}</button>` : '';
  const tip = bad || !L.lastTs ? '' : ` title="${esc((T('последняя запись лога —') + ' ') + clock(L.lastTs))}"`;
  const vspan = vtext ? `<span class="sver" title="${esc(T('Первые три числа — версия игры, под которую сделана программа, последнее — номер сборки. Свою версию игра называет в логе при каждом запуске'))}">${esc(vtext)}</span><span class="sver">·</span>` : '';
  return `<span class="status${bad ? ' bad' : ''}"${tip}>${vspan}<span>${esc(bad || T('лог читается'))}</span>${pick}<span class="dot${bad ? '' : ' live'}"></span></span>`;
}
// «указать папку игры»: окно выбора папки открывает программа; выбрали — страница обновится сама, когда программа
// прочтёт лог (или скажет, что в папке игры нет)
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-game="pick"]');
  if (!b || b.disabled) return;
  b.disabled = true;
  fetch('/api/game', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pick: true})})
    .catch(() => {}).finally(() => { b.disabled = false; });
});
// Герой в шапке: имя, класс и вознесение — словами лога (до второго уровня лог героя не называет), уровень —
// всегда. Которого числа начат забег — в подсказке строки.
const heroLine = h => [h.name, h.cls, h.asc].filter(Boolean).map(esc).concat(`${T('уровень')} <b>${h.level}</b>`).join(' · ');

// Фильтр игры — одной строкой, слева в строке состояния. Тот, что нужен шагу по плану, — «Фильтр ✓ название».
// Не тот или выключен — там же, плашкой, что нужно вместо него; цвет — как у цели: жёлтая на шаге, где план меняет
// фильтр, красная, когда этот шаг позади (опаздываю). Название — из шапки файла фильтра, его пишет сама игра; время
// загрузки версии — в подсказке: на глаз оно не нужно. Скрывает цели плана (ближайшую ступень вещи или аффикса, которую ищут) — красная
// плашка «скрывает N целей» в той же строке: счётом, названия — по нажатию, в списке под строкой (у самих целей —
// пометка «скрыт фильтром»). Своих образцов «что фильтр показывает» у страницы нет: они были зашиты под один билд.
// Фильтр не загрузился (в нём ошибка) — красная плашка первой в строке.
// Нужного фильтра нет в игре (игрок плана на него ещё не подписан) — так и сказано, а рядом ссылка «подписаться» на
// его страницу на сайте игры: там нажимают Follow, и игра скачивает фильтр сама.
// Возвращает [строка, список под ней].
function filterLine(v) {
  const f = v.filter;
  if (!f || (!f.id && !f.off && !f.failed)) return ['', ''];
  // фильтр не загрузился: в нём ошибка — красной плашкой первой в строке
  const bad = f.failed ? `<span class="fwant u-overdue" title="${esc(T('Игра не смогла прочитать фильтр — откройте его там, где правите (FilterBlade или сайт игры), и исправьте ошибку'))}">` +
    `${T('Фильтр «{0}» не загрузился — в нём ошибка', esc(f.failed))}</span>` : '';
  if (!f.id && !f.off) return [bad, ''];
  const lost = [];
  for (const r of (v.holders || []).concat((v.stash || []).flatMap(st => st.rows || []))) {
    for (const lad of (r.base ? [r.base] : []).concat(r.parts)) if (lad.next && hidden(lad.next)) lost.push(fullName(lad.next));
  }
  const about = f.since ? [T('версия загружена в {0}', clock(f.since))] : [];
  const name = `<b>${f.off ? T('выключен') : esc(f.name)}</b>`;
  let row;
  if (f.match === false) {
    const want = (v.step && v.step.filter) || {};
    // шаг, с которого план велит этот фильтр: на нём фильтр меняют
    let from = '';
    for (let i = v.pos; i >= 0 && !from; i--) { const c = (v.cards || [])[i]; if (c && c.filter && c.filter.switch) from = c.name; }
    const tip = (from ? [T('по плану с шага «{0}»', esc(from))] : [])
      .concat(f.expectedMissing ? [esc(T('Нужного фильтра нет в игре: подпишитесь на него на странице фильтра — игра скачает его сама, потом выберите его в настройках игры'))] : [])
      .concat(about.map(esc)).join(' · ');
    row = `<span class="fwant ${want.switch ? 'u-due' : 'u-overdue'}"${tip ? ` title="${tip}"` : ''}>${T('Фильтр')} ${name} · ` +
      `${want.none ? T('нужно выключить') : T('нужен {0}', `<b>${esc(f.expectedName)}</b>`) + (f.expectedMissing ? ' — ' + T('нет в игре') : '')}</span>`;
    if (f.expectedMissing && f.expectedPage) row += subLink(f.expected);
  } else {
    row = `<span${about.length ? ` title="${esc(about.join(' · '))}"` : ''}>${T('Фильтр')} ${f.match ? '<span class="tdone">✓</span> ' : ''}${name}</span>`;
  }
  row = bad + row;
  if (lost.length) {
    row += `<button class="fwant u-overdue flost" data-toggle="facts" title="${esc(lost.join(' · '))}">` +
      `${T('скрывает {0}', `${lost.length} ${plural(lost.length, 'цель', 'цели', 'целей')}`)}</button>`;
  }
  // какие цели плана фильтр скрывает — списком по нажатию на плашку «скрывает N целей»
  if (!lost.length || !factsOpen) return [row, ''];
  return [row, '<div class="fbody">' +
    `<div class="fgoals"><span class="fghead">${T('Скрывает цели плана:')}</span>${lost.map(n => `<span class="fh">✗ ${esc(n)}</span>`).join('')}</div></div>`];
}

// Страница фильтра на сайте игры (как core.FILTER_PAGE): там на фильтр подписываются (Follow). Во встроенном браузере
// приложения Claude отдельной вкладки нет — ссылка открылась бы вместо этой страницы, поэтому там страницу фильтра
// открывает программа, в браузере системы (POST /api/open); не вышло — открывается здесь же.
const FILTER_PAGE = 'https://pathofexile2.com/item-filter/';
const NO_NEW_TABS = /\bClaude\/\d/.test(navigator.userAgent);
// значок «откроется в отдельной вкладке»: рамка и стрелка из неё наружу
const OUT_ICON = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6.5 3.5H3v9.5h9.5V9.5M9.5 2.5h4v4M13.5 2.5l-6 6" ' +
  'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const subLink = fid => `<a class="flink" href="${FILTER_PAGE + encodeURIComponent(fid)}" target="_blank" rel="noopener" data-fpage="${esc(fid)}" ` +
  `title="${esc(T('Страница фильтра на сайте игры: нажмите там Follow — игра скачает фильтр сама, и его можно будет выбрать в настройках игры'))}">${T('подписаться')}${OUT_ICON}</a>`;
let pageAt = 0;      // когда страницу фильтра открывали в последний раз: двойное нажатие — не два окна
function openFilterPage(e) {
  const a = e.target.closest && e.target.closest('a[data-fpage]');
  if (!a || !NO_NEW_TABS) return;
  e.preventDefault();
  if (Date.now() - pageAt < 1500) return;
  pageAt = Date.now();
  fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({page: 'filter', id: a.dataset.fpage})})
    .then(r => r.json())
    .then(d => { if (!d.ok) location.href = a.href; })
    .catch(() => { location.href = a.href; });
}
document.addEventListener('click', openFilterPage);
document.addEventListener('auxclick', openFilterPage);      // нажатие колёсиком — то же самое

// Быстрая навигация по разделам. «Игра» — одна страница: самое нужное всегда на своём месте, за вкладкой ничего не
// спрятано (опоздание или пропуск видны, где бы ни стоял взгляд). Кнопки в закреплённой шапке переносят к разделу
// сразу, без прокрутки; кнопка есть только у раздела, который сейчас на странице, и горит та, чей раздел вверху
// экрана. «Маршрут» — сам верх страницы: зона, время, строка состояния и шаг.
const NAV = [['s-route', T('Маршрут')], ['s-gear', T('Надето')], ['s-skills', T('Умения')], ['s-tree', T('Дерево')],
  ['s-atlas', T('Атлас')]];
let navOn = 's-route';
function sectionNav() {
  return `<nav class="tabs" aria-label="${T('Разделы страницы')}">` + NAV.filter(([id]) => document.getElementById(id))
    .map(([id, name]) => `<button data-jump="${id}"${id === navOn ? ' class="on"' : ''}>${name}</button>`).join('') + '</nav>';
}
// Отступ прокрутки — по высоте шапки: раздел, к которому перешли, не уходит под неё.
const headPad = () => { const b = $('.hbar'); if (b) document.documentElement.style.scrollPaddingTop = (b.offsetHeight + 8) + 'px'; };
window.addEventListener('resize', headPad);
// Какой раздел сейчас вверху экрана: последний, чьё начало уже ушло под шапку; долистали до конца — последний.
function navSpy() {
  const b = $('.hbar'), y = (b ? b.getBoundingClientRect().bottom : 0) + 16;
  const here = NAV.map(([id]) => document.getElementById(id)).filter(Boolean);
  if (!here.length) return;
  let on = here[0].id;
  for (const el of here) if (el.getBoundingClientRect().top <= y) on = el.id;
  if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) on = here[here.length - 1].id;
  if (on === navOn) return;
  navOn = on;
  for (const x of document.querySelectorAll('[data-jump]')) x.classList.toggle('on', x.dataset.jump === on);
}
let spyFrame = 0;
window.addEventListener('scroll', () => { if (!spyFrame) spyFrame = requestAnimationFrame(() => { spyFrame = 0; navSpy(); }); }, {passive: true});
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-jump]');
  if (!b) return;
  const el = document.getElementById(b.dataset.jump);
  if (!el) return;
  if (b.dataset.jump === 's-route') window.scrollTo(0, 0); else el.scrollIntoView({block: 'start'});
  navSpy();
});

// Полоска шагов: семь шагов маршрута — у текущего шага это два пройденных, он сам и четыре впереди. «…» по краям листает
// её в свою сторону (stripFrom): так достать можно любой шаг маршрута — посмотреть его карточку или сделать его текущим,
// если страница ошиблась с шагом. Списка всего маршрута на этой странице нет: план целиком — в редакторе, время по
// шагам — в «Разборе» (их замечание 2026-11-25: список остался с тех пор, когда страница была всей программой).
const STRIP = 7;
const stripHome = v => Math.max(0, (v.pos == null ? 0 : v.pos) - 2);
function routeStrip(v) {
  const r = v.route;
  if (!r.length) return '';
  const from = stripFrom == null ? stripHome(v) : Math.max(0, Math.min(stripFrom, r.length - 1));
  const to = Math.min(r.length, from + STRIP);
  const dots = (at, tip) => `<button class="rdots" data-strip="${at}" title="${tip}">…</button>`;
  let h = '<div class="route">';
  if (from > 0) h += dots(Math.max(0, from - STRIP), T('Шаги раньше')) + '<span class="rarr">›</span>';
  for (let i = from; i < to; i++) {
    const s = r[i];
    // дальняя веха: между ней и предыдущим шагом в плане есть ещё не записанные зоны — многоточие тут не кнопка
    if (s.far && i > from) h += '<span class="rdots">…</span><span class="rarr">›</span>';
    // Нажатие на шаг только показывает его карточку; позицию забега оно не меняет.
    h += `<button class="rs r-${s.state}${showId === s.id ? ' r-peek' : ''}" data-peek="${esc(s.id)}" title="${T('Посмотреть шаг')}">${esc(s.name)}</button>`;
    if (i < to - 1) h += '<span class="rarr">›</span>';
  }
  if (to < r.length) h += '<span class="rarr">›</span>' + dots(to, T('Шаги дальше'));
  return h + '</div>';
}


// Шаг по событию наступает сам. Испытание даёт два очка Восхождения, поэтому первое восхождение —
// первый взятый узел, второе (после испытания Хаоса) — третий, дальше пятый и седьмой.
const ascNode = ev => ({ascend: T('первый'), ascend2: T('третий'), ascend3: T('пятый'), ascend4: T('седьмой')}[ev] || T('новый'));

// Плашка без нажатия — как у цели, которую отмечает сам лог: вид (подпись сверху), название, состояние.
// Так выглядят точка перехода, смена фильтра и смена вещей: всё, что на шаге надо сделать,
// нарисовано одинаково и стоит в одинаковых блоках.
const infoChip = (kind, title, label, state) =>
  `<div class="chip auto${state ? ' u-' + state : ''}"><span class="kd">${esc(kind)}</span>` +
  `<span class="ct">${esc(title)}</span>${csSpan(label)}</div>`;
// Фильтр шага — справка: загружен нужный — мелкая серая строка (в заголовке шага справа). Действием
// он становится, только когда его надо сменить: тогда это плашка в блоке «Сменить».
const filterOk = (c, viewing) => c.filter && (viewing || c.filter.loaded);
// Что план на шаге снимает: умение или камень поддержки. На текущем шаге, пока оно стоит, — жёлтая плашка: нажатие
// значит «снято» (игра этого в лог не пишет), снятое уходит со страницы сразу. Снятое — зелёное «снято», нажатие
// возвращает. На других шагах и когда снимать нечего (умение не взято) — справка без нажатия.
function dropChip(d, c) {
  const here = !!(V.step && c.id === V.step.id && !V.beyond);
  if (here && (d.done || d.have)) {
    return `<button class="chip u-${d.done ? 'done' : 'due'} tick${d.done ? ' on' : ''}" data-off="${esc(d.id)}" data-on="${d.done ? 0 : 1}" data-k="off:${esc(d.id)}"` +
      ` title="${d.done ? T('Нажмите, если камень остаётся') : T('Нажмите, когда снимете')}"><span class="kd">${esc(d.kind)}</span>` +
      `<span class="ct">${esc(d.title)}</span>${csSpan(d.done ? T('снято') : T('снять на этом шаге'))}</button>`;
  }
  return infoChip(d.kind, d.title, d.done ? T('снято') : T('снять на этом шаге'), d.done ? 'done' : '');
}

// Что на шаге ещё не отмечено: нужный фильтр, «снять», точки, боссы, цели (в том числе перекачка дерева на смене этапа). Шаг не держат: обязательный босс без строки в логе (без него дальше не пройти, и
// программа отметит его сама при переходе на следующий шаг) и то, что сроком не горит, — босс по желанию, «надеть что
// угодно». marks — сколько на шаге того, что отмечается; open — сколько из этого не сделано.
const DONE_URG = ['done', 'closed', 'found', 'expired'];
function stepLeft(c) {
  let marks = 0, open = 0;
  const count = ok => { marks++; if (!ok) open++; };
  if (c.filter && !filterOk(c, false)) count(false);
  for (const d of c.drop || []) if (d.have || d.done) count(d.done);
  for (const t of c.touch || []) count(t.done);
  for (const g of c.bosses || []) if (!g.soft && !(g.must && g.expect === 'pass')) count(DONE_URG.includes(g.urgency));
  for (const g of c.goals || []) if (!g.soft) count(DONE_URG.includes(g.urgency));
  return {marks, open};
}

function stepBody(c, viewing) {
  let h = '';
  const swap = [];
  // Фильтр не тот. Жёлтая плашка — пока игрок на шаге, где план меняет фильтр (карточка новой карты, пока шаг не
  // сменился, судит по текущему шагу: игрок ещё на нём); шаг смены позади — красная, как опаздывающая цель. Так же
  // окрашена строка фильтра над маршрутом.
  if (c.filter && !filterOk(c, viewing)) {
    const st = c.filter.switch || (V.step && V.step.filter && V.step.filter.switch) ? 'due' : 'overdue';
    swap.push(c.filter.none ? infoChip(T('фильтр'), T('без фильтра'), T('выключить'), st)
      : infoChip(T('фильтр'), c.filter.name, c.filter.missing ? T('нет в игре — подписаться') : T('включить'), st));
  }
  // умение (камень поддержки), которое план здесь снимает: камень умения стоит в своём гнезде, новое умение его не
  // вытесняет — снимают отдельно
  for (const d of c.drop || []) swap.push(dropChip(d, c));
  if (swap.length) h += `<h3>${T('Сменить')}</h3><div class="chips">${swap.join('')}</div>`;
  if (c.touch.length) {
    // Точка перехода: отметится сама, когда лог покажет вход в её зону. На текущем шаге она нужна
    // сейчас, на пройденном неактивированная — пропущена, на шаге впереди — позже. Активированная — зелёная, без слова.
    const st = t => t.done ? ['done', ''] : c.state === 'behind' ? ['overdue', T('пропущено')]
      : c.state === 'ahead' ? ['early', T('позже')] : ['due', T('активировать')];
    h += `<h3>${T('Точки')}</h3><div class="chips">${c.touch.map(t => infoChip(T('точка'), t.name, st(t)[1], st(t)[0])).join('')}</div>`;
  }
  const goals = c.goals || [], bosses = c.bosses || [];
  if (!goals.length && !bosses.length && !c.touch.length && !swap.length) {
    h += ('<p class="empty">' + T('Целей на этом шаге нет') + '</p>');
  }
  // Боссы карты — своё место, как у точек. Обязательный закроется сам, когда шаг останется позади;
  // у необязательного в названии сказано, что он даёт: пропущенный будет гореть на следующих шагах.
  if (bosses.length) h += `<h3>${T('Боссы')}</h3><div class="chips">${bosses.map(g => chip(g, true)).join('')}</div>`;
  // Цели шага — всё, что нужно закрыть на нём: программа собирает их сама по срокам целей, списков руками
  // никто не составляет. Незакрытая цель после шага горит дальше. Босс — выше, своим блоком: он проверка
  // билда и игрока, а что сделать до него и что после, решает игрок. Название полное: камень поддержки
  // и уровень камня называют своё умение.
  if (goals.length) h += `<h3>${T('Цели')}</h3><div class="chips">${goals.map(g => chip(g, 'step')).join('')}</div>`;
  // Справки — мелко и в самом низу: когда шаг наступит сам и какой у шага фильтр (при просмотре чужого
  // шага; у текущего он в заголовке справа).
  if (c.event && c.state === 'ahead') h += `<p class="sub">${T('Шаг наступит сам, когда возьмёте {0} узел восхождения', ascNode(c.event))}</p>`;
  if (viewing && c.filter) h += `<p class="sub">${T('Фильтр шага:')} ${esc(c.filter.name)}${c.filter.missing ? ' — ' + T('нет в игре') : ''}</p>`;
  return h;
}

// Цели одного блока (уровень героя, награды, ресурсы, боссы) по актам, сворачиваемыми списками. Цели
// стоят в порядке маршрута, поэтому и акты идут по порядку. В строке акта — сводка: сколько взято из
// скольких, сколько пропущено (у уровня — «опаздываю») и сколько впереди; нули не пишутся. У боссов
// там же число нестыковок — где отметка сработала не так, как ждал план.
// Все акты свёрнуты, любой раскрывается нажатием на его строку; название текущего — цветом акцента.
// body(goals) рисует цели акта: по умолчанию плашками; у боссов — строками со свойствами.
// Сводка по целям одной строкой, три ячейки: взято из скольких · пропущено (у уровня — «опаздываю») ·
// впереди, и у боссов число нестыковок. Нули не пишутся. Одна и та же в строке акта и в строке раздела.
function tally(goals) {
  const total = goals.length;
  const got = goals.filter(g => g.urgency === 'done' || g.urgency === 'closed').length;
  const late = goals.filter(g => g.urgency === 'overdue');
  // снятая цель (необязательный босс, оставшийся позади) уже не впереди
  const ahead = goals.filter(g => !['done', 'closed', 'overdue', 'expired'].includes(g.urgency)).length;
  const bad = goals.filter(g => g.mismatch).length;
  return `<span class="ag${got === total ? ' all' : ''}">${got === total ? '✓ ' : ''}${got} ${T('из')} ${total}</span>` +
    `<span class="am">${late.length ? (late.some(g => g.place) ? (T('пропущено') + ' ') : (T('опаздываю') + ' ')) + late.length : ''}</span>` +
    `<span class="aa">${ahead ? (T('впереди') + ' ') + ahead : ''}${bad ? `<b class="aw">${T('⚠ нестыковок:')} ${bad}</b>` : ''}</span>`;
}

// Босс — сущность со свойствами (подпись на плашке босса) словами, понятными без подсказки (их замечание 2026-11-24:
// «сам» читалось как «нажать самому», «рукой» — непонятно). Чем важен — факт игры: «босс акта», «обязательный» (без
// него дальше не пройти), «можно обойти» (план его хочет: пропущенный горит красным), «по желанию». Кто ставит
// галочку: «отметит программа» — по реплике в логе, по строке награды, вместе с другой целью или, у обязательного,
// при переходе на следующий шаг; иначе «отметьте сами». У отмеченного босса — только чем он важен.
const bossNeed = g => g.final ? T('босс акта') : g.must ? T('обязательный') : g.soft ? T('по желанию') : T('можно обойти');
const BOSS_MARK_SHORT = {phrase: T('отметит программа'), reward: T('отметит программа'), goal: T('отметит программа'),
  pass: T('отметит программа'), hand: T('отметьте сами')};
const bossHead = g => [bossNeed(g), g.urgency === 'done' || g.urgency === 'closed' ? '' : BOSS_MARK_SHORT[g.expect]]
  .filter(Boolean).join(' · ');
// Подсказка у неотмеченного босса — когда галочку поставит программа и что делать, если не поставила.
const BOSS_MARK_TIP = {
  phrase: T('Программа отметит сама, когда в логе будет реплика после победы. Не отметила — нажмите'),
  reward: T('Программа отметит сама, когда в логе будет строка награды. Не отметила — нажмите'),
  goal: T('Программа отметит сама вместе с целью, которая доказывает победу. Не отметила — нажмите'),
  pass: T('Программа отметит сама, когда начнётся следующий шаг: без этого босса дальше не пройти'),
  hand: T('Нажмите, когда победите')};
// Опаздываю: цели, чей шаг уже позади, а они не закрыты и к карте не привязаны — умение, поддержка, уровень
// камня, предмет, стат на предмете, запас: сделать их можно где угодно. Видно на любом шаге, сразу после целей
// текущего шага. Плашки те же, что у целей шага, и отмечаются так же — нажатием: закрытая цель из блока уходит.
// (Раньше это была красная строка сверху, текстом через запятую, без предметов и статов: закрыть цель можно
// было только на карточке её собственного шага.) Привязанное к карте — ниже, в блоке «Пропущено».
function lateBlock(v) {
  const late = (v.overdue || []).filter(g => !g.place), atl = atlasLateChips(v);
  if (!late.length && !atl) return '';
  return ('<div class="pstep lateb"><h2><span>' + T('Опаздываю') + '</span></h2>') +
    `<div class="chips">${late.map(g => chip(g, 'late')).join('')}${atl}</div></div>`;
}
// Атлас в «Опаздываю»: плашка на каждое дерево, где есть узлы из версии атласа прошлого этапа, которые до сих пор
// не взяты, — какое дерево и сколько узлов. Нажатием не закрыть: закроет лог, когда узлы взяты в игре. Нажатие
// ведёт к блоку «Атлас» и ставит это дерево на карту: какие узлы брать, видно там (они красные).
// Пока не сказано, чей атлас продолжает герой, плашек нет: неизвестно, что уже взято.
function atlasLateChips(v) {
  const t = v.atlas;
  if (!t || !atlasGeo || t.ask || atlasAsk || !(t.late || []).length) return '';
  const per = new Map();
  for (const id of t.late) { const k = atlasTreeOf(id); if (k >= 0) per.set(k, (per.get(k) || 0) + 1); }
  return [...per.keys()].sort((a, b) => a - b).map(k => {
    const n = per.get(k);
    return `<button class="chip u-overdue" data-atree="${k}" data-ago title="${esc(T('Узлы были в плане атласа прошлого этапа и не взяты. Закроется само, когда они будут взяты в игре; нажмите — покажу их в блоке «Атлас»'))}">` +
      `<span class="kd">${T('дерево атласа')}</span><span class="ct">${esc(atlasGeo.trees[k].name)}</span>` +
      `<span class="cs">${T('опаздываю')} · ${n} ${plural(n, 'узел', 'узла', 'узлов')}</span></button>`;
  }).join('');
}

// Пропущенное на пройденных картах: босс с наградой, награда, неактивированная точка перехода.
// Видно на любом шаге — сверху у плашки карта, на которую возвращаться. Нажатие — «взял»
// (награду отметит и сам лог); точку отмечает только лог — вход в её зону.
function missedBlock(v) {
  const m = v.missed || [];
  if (!m.length) return '';
  return `<div class="pstep missed"><h2><span>${T('Пропущено')}</span></h2>` +
    `<div class="chips">${m.map(g => chip(g, 'where')).join('')}</div></div>`;
}

// Запас по опыту — только от уровня героя, с каждым новым уровнем пересчитывается сам: считать в уме
// не нужно. На картах — языком путевых камней (зона карты — 64 + тир): какой тир вровень с героем
// и до какого опыт идёт без штрафа. Где герой был в прошлый раз, строка не говорит.
// В кампании — зоны; зона вне запаса красит строку жёлтым (сама зона — строкой выше).
function xpLine(v) {
  const x = v.xp;
  if (!x) return '';
  if (v.act !== T('Карты'))
    return `<div class="zxp${x.out ? ' out' : ''}">${T('Опыт без штрафа: зоны {0}–', x.lo)}${x.hi}</div>`;
  const L = v.hero.level, lo = x.lo - 64, hi = Math.min(16, x.hi - 64);
  const eq = L < 65 ? `${T('— на {0} ниже T1', 65 - L)}` : L > 80 ? `${T('— на {0} выше T16', L - 80)}` : `= <b>T${L - 64}</b>`;
  const free = hi < 1 ? `${T('до зоны {0}, на T1 штраф', x.hi)}`
    : lo > 16 ? `${T('с зоны {0}, на T16 штраф', x.lo)}`
      : lo === hi ? `${T('только')} <b>T${hi}</b>`
        : lo > 1 ? `<b>T${lo}–T${hi}</b>`
          : `${T('до')} <b>T${hi}</b>`;
  return `<div class="zxp">${T('Уровень')} ${L} ${eq} ${T('· опыт без штрафа')} ${free}</div>`;
}

// Путевой камень из буфера обмена (V.way): игрок навёл на камень в игре и скопировал его — поверх
// страницы встаёт окно с готовым ответом: насколько камень опасен — легко, сносно, тяжело, смертельно.
// Куда какой камень потратить (лёгкий — на босса, тяжёлый — на простую карту), решает игрок. Окно живёт
// WAY_SECONDS с момента копии и закрывается само; нажатие оставляет его до крестика или Esc. Вне карт
// его нет: оно появляется только на копию камня.
const WAY_SECONDS = 15;
const WAY_WORD = {easy: T('ЛЕГКО'), fair: T('СНОСНО'), hard: T('ТЯЖЕЛО'), deadly: T('СМЕРТЕЛЬНО'), unknown: T('ПРОВЕРИТЬ')};
const WAY_LEVEL = {easy: 1, fair: 2, hard: 3, deadly: 4};   // сколько из четырёх делений закрашено
const GEM_SHARE = ['', (T('реже') + ' '), (T('редко') + ' ')];                  // уровни камней умений в зоне: частый, реже, редко
let waySeen = null;    // копия камня (её время), на которую окно уже отозвалось
let wayOpen = false;
let wayPin = false;    // окно оставлено нажатием: само не закроется
let wayTimer = null;
let wayDrawn = '';     // что сейчас нарисовано: без изменений окно не трогаем — полоска времени идёт дальше

function wayClose() {
  wayOpen = wayPin = false;
  wayDrawn = '';
  clearTimeout(wayTimer);
  wayTimer = null;
  const box = $('#way');
  if (box) { box.hidden = true; box.innerHTML = ''; }
}
function wayHtml(w) {
  const lv = WAY_LEVEL[w.verdict] || 0;
  const blocks = lv ? `<span class="wyl">${[1, 2, 3, 4].map(k => `<i${k <= lv ? ' class="on"' : ''}></i>`).join('')}</span>` : '';
  const hero = !w.hero ? '' : w.over ? ` · <b>${T('выше героя на')} ${w.over}</b>` : ` ${T('· уровень героя')} ${w.hero}`;
  const score = w.rows.length ? ` ${T('· опасность')} ${w.score}` : '';
  // Тир и опыт — всегда тихо, справкой. Штраф только уменьшает получаемый опыт: в минус он не уходит,
  // на добычу и очки атласа не влияет. Пока герой не одет, опыт не цель, и звать его на камень выше
  // незачем (слова игрока: «какой смысл в опыте? чтобы быстрее умереть?»).
  const x = w.xp;
  const xp = !x ? '' : x.state === 'low'
    ? `<div class="wyx">${T('Опыт неполный')}${x.from ? (' ' + T('· полный с камня') + ' ') + x.from : (' ' + T('на любом камне'))}</div>`
    : x.state === 'high' ? ('<div class="wyx">' + T('Опыт неполный · зона выше полосы героя') + '</div>')
      : `<div class="wyx">${T('С {0} уровня героя полный опыт —', x.at)} ${x.from ? (T('с камня') + ' ') + x.from : T('только выше')}</div>`;
  // Неогранённые камни умений: какого уровня они падают в зоне этого камня, частый первым. У уровня,
  // которым герой ещё не может пользоваться, — с какого уровня героя. Интеллект — в подсказке.
  const need = w.gemNeed || {};
  const gems = w.gems && w.gems.length
    ? `<div class="wyg" title="${esc(w.gems.map(g => `${g}${T(': уровень героя {0}, интеллект', (need[g] || [])[0] || '?')} ${(need[g] || [])[1] || '?'}`).join(' · '))}">` +
      (T('Камни умений:') + ' ') + w.gems.map((g, i) => `${GEM_SHARE[i] || ''}<b>${g}</b>` +
        (w.hero && need[g] && need[g][0] > w.hero ? ` ${T('(с {0} ур. героя)', need[g][0])}` : '')).join(' · ') + '</div>' : '';
  // очки свойства точками (сумма точек — «опасность» в строке выше); неопознанная строка — знаком вопроса
  const dots = r => r.cls === 'unknown' ? '?' : '●'.repeat(Math.min(6, r.pts || 0));
  return `<div class="wyh"><span class="wyv">${WAY_WORD[w.verdict] || '?'}</span>${blocks}${shutBtn('data-wayclose', T('Закрыть'))}</div>` +
    `<div class="wyt">${T('Камень {0} · зона', w.tier)} ${w.area}${hero}${score}</div>` + xp + gems +
    (w.note ? `<div class="wyn">${esc(w.note)}</div>` : '') +
    `<div class="wyrs">` + w.rows.map(r => `<div class="wyr c-${esc(r.cls)}" title="${esc(r.why)}"><i>${dots(r)}</i>` +
      `<span>${esc(r.label)}${r.off ? ('<span class="wyoff">' + T('не действует') + '</span>') : ''}</span><b>${esc(r.val)}</b></div>`).join('') + '</div>' +
    `<div class="wyb"><i></i></div>`;
}
function wayUpdate(v) {
  const w = v.way, box = $('#way');
  if (!box) return;
  if (!w) { if (wayOpen) wayClose(); return; }
  const left = () => WAY_SECONDS - (Date.now() / 1000 + skew - w.at);
  if (w.at !== waySeen) {
    waySeen = w.at;
    wayClose();
    // страницу могли открыть позже копии: окно показывается только на остаток своего времени
    if (left() > 0) {
      wayOpen = true;
      popOpen.way = Date.now();
      wayTimer = setTimeout(() => { wayClose(); popPlace(); }, left() * 1000);
    }
  }
  if (!wayOpen) return;
  box.className = 'v-' + w.verdict + (wayPin ? ' pin' : '');
  box.hidden = false;
  const html = wayHtml(w);
  if (html === wayDrawn) return;
  wayDrawn = html;
  box.innerHTML = Q(html);
  const bar = box.querySelector('.wyb i'), rest = left();
  if (bar && bar.animate && !wayPin && rest > 0)
    bar.animate([{width: rest / WAY_SECONDS * 100 + '%'}, {width: '0%'}], {duration: rest * 1000, fill: 'forwards'});
}

// Новые очки дерева (V.tree.gainAt — когда герой их получил: новый уровень, награда «+N очков»): поверх страницы окно —
// сколько очков свободно и какие узлы плана взять за них: первые узлы очереди, на сколько хватает очков, но не больше
// PTS_MAX, — название и что узел даёт; рядом кусок карты дерева вокруг них с теми же номерами. Само окно не уходит, пока
// очки не потрачены: уровень обычно берут в бою, отвлечься некогда (их слова 2026-11-24 — прежние 30 секунд истекали
// раньше, чем бой кончался). Взятое за окно встаёт в нём строками с галочкой (узел не из плана — красным; по именам —
// последние PTS_MAX, раньше взятое — строкой с числом); очки кончились — окно показывает взятое ещё PTS_CHECK_SECONDS
// («очень часто хочу свериться что поставил куда нужно») и уходит; нажатие оставляет его до крестика. Сверка шла
// 12 секунд — их слова из игры 2026-11-26: «12 секунд все равно это много, давай поставим 5 секунд, после взятия
// последнего свободного очка». Та же сверка — в окне дерева поверх игры и в строке «Дерево · Взято» списка. Крестик, Esc
// и клавиша «Закрыть» в игре убирают окно; убранное окно этих очков не возвращается и после перезагрузки страницы
// (ptsShut). Плана на шаге нет или брать по нему нечего — окна нет. Возврат очка за снятый узел окна не открывает.
const PTS_CHECK_SECONDS = 5, PTS_MAX = 3;
