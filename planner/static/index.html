  // --- таблица -------------------------------------------------------------------------------------------------------------
  // общая шкала полос: до самого долгого шага с целью, шагом в 10 минут, не дольше часа — дольше полоса обрывается знаком «›»
  function axisOf(h) {
    const b = B();
    const most = Math.max(...h.steps.map(s => (s.g ? Math.max(all(s), s.g, b && twin(s) ? all(twin(s)) : 0) : 0)), 600);
    return Math.min(3600, Math.ceil(most / 600) * 600);
  }
  // деления шкалы: через 10 минут, а у короткой шкалы (10 минут) — через 5
  const gridOf = axis => (axis <= 600 ? 300 : 600);
  function segs(s, axis, cls) {
    const box = el('div', 'rv-segs' + cls);
    box.style.width = Math.min(100, 100 * all(s) / axis) + '%';
    return RV.strip(box, s);
  }
  function barCell(s, axis) {
    const td = el('td', 'rv-bc'), x = twin(s), line = el('div', 'rv-bar' + (B() ? ' rv-two' : ''));
    line.style.backgroundSize = (100 * gridOf(axis) / axis) + '% 100%';
    line.append(segs(s, axis, ''));
    if (x) line.append(segs(x, axis, ' rv-b'));
    if (s.g && s.g <= axis) { const t = el('i', 'rv-tick'); t.style.left = (100 * s.g / axis) + '%'; line.append(t); }
    if (all(s) > axis) line.append(el('span', 'rv-more', '›'));
    line.addEventListener('pointermove', e => tipShow(e, s));
    line.addEventListener('pointerleave', tipHide);
    td.append(line);
    return td;
  }
  // ячейка: число героя и, при сравнении, под ним число второго героя
  function cell(a, b, cls) {
    const td = el('td', 'rv-n' + (cls ? ' ' + cls : ''));
    if (!B()) { td.textContent = a; return td; }
    td.append(el('div', '', a), el('div', 'rv-b', b));
    return td;
  }
  const t0 = v => (v ? clock(v) : '');
  // шаг, на котором время героя кончилось: чем — говорит плашка у названия
  function cutTag(h, s) {
    return h.fate === 'dead' ? el('span', 'rv-cut rv-dead', T('гибель на {0}', clock(s.c)))
      : el('span', 'rv-cut', h.fate === 'now' ? T('сейчас') : T('не пройден'));
  }
  // карту шага начинали заново: сколько раз — плашкой у названия, со штриховкой, как эта часть в полосе
  // (в порядке «Карты заново» строки стоят по времени в прерванных попытках — там оно названо и на плашке)
  function againTag(s, withTime) {
    const t = el('span', 'rv-cut rv-re');
    t.append(el('i', 'rv-sw rv-' + (s.qz || !s.qo ? 'zq' : 'oq')),
             withTime ? T('заново {0} · {1}', times(s.q), clock(lost(s))) : T('заново {0}', times(s.q)));
    t.title = T('Карта начата заново: {0} · в прерванных попытках {1}', times(s.q), clock(lost(s)));
    return t;
  }
  function stepRow(s, axis, withAct) {
    const tr = el('tr', 'rv-st' + (S.open.has(s.id) ? ' rv-open' : '')), th = el('th'), x = twin(s), b = B();
    th.scope = 'row';
    const name = el('div');
    name.append(s.n);
    if (withAct) name.append(el('span', 'rv-acth', s.a));
    if (s.q) name.append(againTag(s, S.order === 'again'));
    if (s.c != null) name.append(cutTag(H(), s));
    th.append(name);
    if (b) th.append(el('div', 'rv-b', tag(b) + (x ? (x.c != null ? ' · ' + (b.fate === 'dead' ? T('погиб на этом шаге') : T('шаг не пройден')) : '')
      + (x.q ? ' · ' + T('заново {0}', times(x.q)) : '') : ' · ' + T('не дошёл'))));
    const d = delta(s);
    tr.append(th, barCell(s, axis), cell(t0(s.z), x ? t0(x.z) : ''), cell(t0(s.t), x ? t0(x.t) : ''), cell(t0(s.o), x ? t0(x.o) : ''),
              cell(clock(all(s)), x ? clock(all(x)) : '—'), cell(s.g ? clock(s.g) : '—', '', 'rv-g'),
              el('td', 'rv-n rv-d' + tone(d, ref(s)), d == null ? '' : signed(d)));
    tr.tabIndex = 0;
    tr.setAttribute('aria-expanded', String(S.open.has(s.id)));
    const flip = () => { if (S.open.has(s.id)) S.open.delete(s.id); else S.open.add(s.id); drawRows(); };
    tr.addEventListener('click', flip);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    return tr;
  }
  // метки ленты: вышел из игры, страницу перевели на другой шаг, гибель; пометки у захода: заглянул, город, вне маршрута
  // (карта начата заново — перед первым заходом в новую её копию; заход в брошенную копию — со штриховкой и словом)
  const MARK = {l: () => T('вышел из игры — время не идёт'), b: n => T('страница переведена на шаг «{0}»', n), d: () => T('гибель'),
    a: () => T('карта начата заново')};
  const TAG = {x: T('заглянул'), t: T('город'), o: T('вне маршрута')};
  function tape(s, title) {
    const box = el('div'), head = el('div', 'rv-tph');
    head.append(el('b', '', title), el('span', '', [s.at != null ? T('занялся шагом на {0} от старта', clock(s.at)) : '', s.l ? T('выходов из игры: {0}', s.l) : '',
      s.q ? T('в прерванных попытках {0}', clock(lost(s))) : ''].filter(Boolean).join(' · ')));
    box.append(head);
    for (const [t, kind, name, dur, drop] of s.p) {
      const k = KIND[kind], mark = MARK[k], r = el('div', 'rv-tr' + (mark ? ' rv-mk' + (k === 'd' ? ' rv-death' : '') : ''));
      const nm = el('span', 'rv-nm', mark ? Q(mark(name)) : name);
      if (TAG[k]) nm.append(el('small', '', TAG[k]));
      if (drop) nm.append(el('small', '', T('попытка прервана')));
      r.append(el('span', 'rv-at', clock(t)), mark ? el('span') : el('i', 'rv-sw rv-' + (k === 'x' ? 'z' : k) + (drop ? 'q' : '')), nm, el('span', 'rv-du', mark ? '' : clock(dur)));
      box.append(r);
    }
    return box;
  }
  function tapeRow(s) {
    const tr = el('tr', 'rv-tape'), td = el('td'), b = B(), x = twin(s), box = el('div', 'rv-tp' + (b ? ' rv-two' : ''));
    td.colSpan = 8;
    box.append(tape(s, b ? T('Заходы') + ' · ' + tag(H()) : T('Заходы по порядку')));
    if (b && x) box.append(tape(x, T('Заходы') + ' · ' + tag(b)));
    if (b && !x) {
      const none = el('div'), head = el('div', 'rv-tph');
      head.append(el('b', '', T('Заходы') + ' · ' + tag(b)));
      none.append(head, el('div', 'rv-tpn', T('До этого шага герой не дошёл.')));
      box.append(none);
    }
    td.append(box);
    tr.append(td);
    return tr;
  }
  function sumRow(cls, label, list, note) {
    const tr = el('tr', cls), th = el('th'), b = B(), other = b ? list.map(twin).filter(Boolean) : [];
    th.scope = 'row';
    const name = el('span');
    name.append(label);
    if (note) name.append(el('span', 'rv-acth', note));
    th.append(name);
    if (b) th.append(el('div', 'rv-b', tag(b) + (other.length < list.length ? ' · ' + T('шагов: {0} из {1}', other.length, list.length) : '')));
    const sum = (ss, k) => ss.reduce((a, s) => a + s[k], 0), tot = ss => sum(ss, 'z') + sum(ss, 't') + sum(ss, 'o');
    const cmp = list.filter(s => delta(s) != null), base = cmp.reduce((a, s) => a + ref(s), 0);
    const goal = list.filter(s => s.g && s.c == null).reduce((a, s) => a + s.g, 0);
    const d = cmp.length ? cmp.reduce((a, s) => a + delta(s), 0) : null;
    const graph = el('td', 'rv-sp');
    tr.append(th, graph, cell(t0(sum(list, 'z')), t0(sum(other, 'z'))), cell(t0(sum(list, 't')), t0(sum(other, 't'))),
              cell(t0(sum(list, 'o')), t0(sum(other, 'o'))), cell(clock(tot(list)), other.length ? clock(tot(other)) : '—'),
              cell(goal ? clock(goal) : '—', '', 'rv-g'), el('td', 'rv-n rv-d' + tone(d, base), d == null ? '' : signed(d)));
    return [tr, graph];
  }
  const stepsWord = n => n + ' ' + TN(n, 'шаг|шага|шагов');
  function drawRows() {
    const h = H(), axis = axisOf(h), body = $('rv-rows'), foot = $('rv-foot');
    $('rv-pop').hidden = true;
    tipHide();
    body.textContent = '';
    foot.textContent = '';
    $('rv-dh').textContent = B() ? T('К {0}', tag(B())) : T('К цели##время');
    const ax = $('rv-axis');
    ax.textContent = '';
    const every = gridOf(axis) / 60;
    for (let m = 0; m < axis / 60; m += every) {
      const s = el('span', '', m + (m + every >= axis / 60 ? ' ' + T('мин') : ''));
      s.style.left = (100 * m * 60 / axis) + '%';
      ax.append(s);
    }
    if (S.order === 'route') {
      let act = null;
      for (const s of h.steps) {
        if (s.a !== act) {
          act = s.a;
          const a = act, mine = h.steps.filter(x => x.a === a);
          const [r, graph] = sumRow('rv-act' + (S.shut.has(a) ? ' rv-shut' : ''), a, mine, stepsWord(mine.length));
          const pts = track(mine);
          if (pts.some(p => p.d != null)) {
            // ход отставания по акту — значком в строке акта; крупно — по наведению
            const m = spark(pts, 220, 24);
            m.style.cssText = 'display:block;width:100%;height:24px';
            graph.append(m);
            const show = () => popAct(graph, a), hide = () => { $('rv-pop').hidden = true; };
            graph.addEventListener('pointerenter', show);
            graph.addEventListener('pointerleave', hide);
            r.addEventListener('focus', show);
            r.addEventListener('blur', hide);
          }
          r.tabIndex = 0;
          r.setAttribute('aria-expanded', String(!S.shut.has(a)));
          const flip = () => { if (S.shut.has(a)) S.shut.delete(a); else S.shut.add(a); drawRows(); };
          r.addEventListener('click', flip);
          r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
          body.append(r);
        }
        if (S.shut.has(act)) continue;
        body.append(stepRow(s, axis, false));
        if (S.open.has(s.id)) body.append(tapeRow(s));
      }
      foot.append(sumRow('', h.dead ? T('Всего до гибели') : T('Всего'), h.steps)[0]);
      return;
    }
    const want = {late: s => delta(s) > 0, town: s => s.t > 0, off: s => s.o > 0, again: s => s.q > 0}[S.order];
    // «заново» — по времени в брошенных копиях, при равном — по числу раз
    const key = {late: s => delta(s), town: s => s.t, off: s => s.o, again: s => lost(s) + s.q / 1000}[S.order];
    const list = h.steps.filter(want).sort((a, b) => key(b) - key(a));
    if (!list.length) {
      const none = S.order === 'late' ? (B() ? T('Ни на одном общем шаге герой не медленнее героя {0}.', tag(B())) : T('Ни один пройденный шаг не дольше своей цели.'))
        : S.order === 'town' ? T('В города герой не заходил.') : S.order === 'off' ? T('С маршрута герой не уходил.') : T('Ни одну карту герой не начинал заново.');
      const tr = el('tr', 'rv-none'), td = el('td', '', none);
      td.colSpan = 8;
      tr.append(td);
      body.append(tr);
      return;
    }
    for (const s of list) {
      body.append(stepRow(s, axis, true));
      if (S.open.has(s.id)) body.append(tapeRow(s));
    }
    foot.append(sumRow('', T('Всего на этих шагах'), list, stepsWord(list.length))[0]);
  }

  // --- подсказка у полосы: те же числа, что в строке ------------------------------------------------------------
  function tipShow(e, s) {
    const tip = $('rv-tip'), b = B(), x = twin(s), tb = el('table'), head = el('tr');
    tip.textContent = '';
    for (const [k, t] of [['', ''], ['z', T('в зоне')], ['t', T('город')], ['o', T('вне маршрута')], ['', T('всего')]]) {
      const th = el('th');
      if (k) th.append(el('i', 'rv-sw rv-' + k));
      th.append(t);
      head.append(th);
    }
    tb.append(head);
    const line = (name, v) => {
      const tr = el('tr');
      tr.append(el('td', '', name), el('td', 'rv-v', v.z ? clock(v.z) : ''), el('td', 'rv-v', v.t ? clock(v.t) : ''), el('td', 'rv-v', v.o ? clock(v.o) : ''), el('td', 'rv-v', clock(v.z + v.t + v.o)));
      tb.append(tr);
    };
    line(b ? tag(H()) : T('герой'), s);
    if (x) line(tag(b), x);
    if (s.g) { const tr = el('tr'); tr.append(el('td', '', T('цель##время')), el('td'), el('td'), el('td'), el('td', 'rv-v', clock(s.g))); tb.append(tr); }
    tip.append(tb);
    // карту начинали заново: сколько из времени шага осталось в брошенных копиях (в полосе — штриховкой)
    for (const [who, v] of [[b ? tag(H()) : '', s], [b ? tag(b) : '', x]]) {
      if (!v || !v.q) continue;
      const ln = el('div', 'rv-tq');
      ln.append(el('i', 'rv-sw rv-' + (v.qz || !v.qo ? 'zq' : 'oq')), (who ? who + ' · ' : '') + T('Карта начата заново: {0} · в прерванных попытках {1}', times(v.q), clock(lost(v))));
      tip.append(ln);
    }
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - r.width - 8)) + 'px';
    tip.style.top = Math.max(8, e.clientY - r.height - 12) + 'px';
  }
  function tipHide() { const t = $('rv-tip'); if (t) t.hidden = true; }

  // --- страница целиком ----------------------------------------------------------------------------------------------
  // Слово о состоянии над таблицей: расчёт не удался, у героя нет времени на шагах плана, связь с программой пропала
  function drawState() {
    const st = $('rv-state'), h = D.hero;
    const text = D.error ? T('Разбор не посчитан: {0}', D.error) : !h || !h.steps.length ? T('У этого героя нет времени на шагах плана')
      : S.lost ? T('нет связи с программой') : '';
    st.hidden = !text;
    st.textContent = text;
    st.className = 'rv-wait' + (D.error || S.lost ? ' rv-bad' : '');
    $('rv-body').hidden = !h || !h.steps.length;
  }
  function draw() {
    document.title = T('Разбор') + ' — PoE2 Runbook';
    if (D.pick == null) {
      $('app').textContent = '';
      $('app').append(el('p', 'rv-wait', T('Героев пока нет: лог не начинал забег')));
      bar();
      return;
    }
    if (!$('rv-body')) frame();
    drawHero();
    drawState();
    bar();
    if (!D.hero || !D.hero.steps.length) return;
    drawCompare();
    drawTiles();
    drawRows();
  }
  document.addEventListener('click', e => {
    const tab = e.target.closest && e.target.closest('[data-rvo]');
    if (tab) {
      if (tab.dataset.rvo === S.order || !D || !D.hero) return;
      S.order = tab.dataset.rvo;
      bar();
      drawRows();
      // строки стали другими: таблица — с начала (если её верх уже ушёл под шапку)
      const tb = $('rv-tb'), head = document.querySelector('.hbar');
      if (tb && head && tb.getBoundingClientRect().top < head.getBoundingClientRect().bottom) tb.scrollIntoView({block: 'start'});
      return;
    }
    if (!S.list || !D) return;
    const l = S.list === 'hero' ? $('rv-hlist') : $('rv-blist');
    if (l && l.contains(e.target)) return;
    S.list = null;
    drawHero();
    drawCompare();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !S.list || !D) return;
    const back = S.list === 'hero' ? 'rv-hpick' : 'rv-cmph';
    S.list = null;
    drawHero();
    drawCompare();
    if ($(back)) $(back).focus();
  });
  window.addEventListener('scroll', () => { const p = $('rv-pop'); if (p) p.hidden = true; tipHide(); }, {passive: true});
  window.addEventListener('resize', pad);
  // Вернулись к окну программы (из игры): время героя, которым играют, шло — разбор берётся заново (героя страница
  // сама не меняет: кого открыли, тот и остаётся).
  // (окно получает и «в фокусе», и «видно» разом — спрашиваем один раз)
  let againAt = 0;
  const again = () => {
    if (document.visibilityState !== 'visible' || S.list || Date.now() - Math.max(loadedAt, againAt) < 3000) return;
    againAt = Date.now();
    load();
  };
  window.addEventListener('focus', again);
  document.addEventListener('visibilitychange', again);
  // Пока героем играют, его разбор обновляется сам: страница может стоять на втором экране, а окно игры — в фокусе.
  // Открытый список героев, окно графика и подсказку обновление не сбивает: оно ждёт, пока их закроют.
  setInterval(() => {
    const pop = $('rv-pop'), tip = $('rv-tip');
    if (!D || !D.hero || D.hero.fate !== 'now' || document.visibilityState !== 'visible' || S.list) return;
    if (!pop || !pop.hidden || !tip.hidden || Date.now() - loadedAt < LIVE_EVERY - 500) return;
    load();
  }, LIVE_EVERY);
  // после дела в списке героев и планов шапки (выбрали план, сказали «нет героя») — данные заново
  CTX.after = () => { load(); };
  document.title = T('Разбор') + ' — PoE2 Runbook';
  $('app').textContent = '';
  $('app').append(el('p', 'rv-wait', T('Загрузка…')));
  bar();
  load();
}

function startPage() {
if (PAGE_MODE === 'review') { reviewPage(); return; }      // режим «Разбор»: своя страница под той же шапкой
const $ = s => document.querySelector(s);
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
// Пять состояний на всю страницу, у каждого свой цвет:
// позже (серое) · ищу (жёлтое; заливкой — если нужно к этому шагу) · опаздываю (красное) ·
// есть (зелёное; пунктиром — камень найден на потом) · не взято (серое, зачёркнуто).
const LIVE = {seek: 1, due: 2, overdue: 3};   // цель ищут прямо сейчас; число — насколько срочно

let V = null;      // последнее состояние с сервера

function dur(sec) {

  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');

// Акт и отрезок: цель — сумма целей шагов. Отставание — потрачено минус то, что план отводил на уже
// сделанное (пройденные шаги и текущий — пока он в своей цели). Жёлтый — отстаю, красный — сумма пройдена.

// нажали раньше, чем дошли до новой карты, или вернулись на прежнюю. Тогда время шага страницы стоит (live: false) и
// плитка говорит, какому шагу оно идёт (busy). У отрезка и акта так же: их время идёт, если занятый шаг — из них.
function timeTile(kind, t, more, stepName) {
  const stepSpent = t.step.spent + (t.step.live === false ? 0 : more);
  let label, spent, target, state = 'none', word = '', g;
  if (kind === 'step') {

    g = t.step;

    if (target) {
      state = spent > target ? 'over' : spent >= t.warn * target ? 'warn' : 'ok';
      word = state === 'over' ? (T('сверх цели') + ' ') + ttext(spent - target) : state === 'warn' ? (T('осталось') + ' ') + ttext(target - spent) : '';
    }
    if (t.step.busy) word = esc(T('время идёт шагу «{0}»', t.step.busy));
  } else {
    g = kind === 'act' ? t.act : t.stretch;
    if (!g) return '<div class="tt s-none"></div>';
    label = g.name; spent = g.spent + (g.live === false ? 0 : more); target = g.target;
    if (target) {
      const lag = spent - (g.passed + (t.step.target ? Math.min(stepSpent, t.step.target) : stepSpent));
      state = spent > target ? 'over' : lag > 0 ? 'warn' : 'ok';
      word = state === 'over' ? (T('сверх цели') + ' ') + ttext(spent - target) : lag > 0 ? (T('отстаю') + ' ') + ttext(lag) : (T('запас') + ' ') + ttext(-lag);
    }
  }
  // Справа в строке названия — какая доля времени плитки прошла не в зонах шагов: в городе и в зонах вне маршрута
  // (g.away; набегающие секунды идут в неё, пока герой там, — t.out). Прежняя программа поля не присылает — доли нет.
  const away = (g.away || 0) + (g.live !== false && t.out ? more : 0);
  const share = g.away != null && spent >= 1
    ? `<span class="tta">${T('не в зоне {0}%', Math.round(100 * Math.min(1, away / spent)))}</span>` : '';
  const part = n => Math.round(100 * Math.max(0, Math.min(1, n)));
  const k = target ? spent / target : 0;
  const bar = target ? `<div class="tbar"><i style="width:${part(k)}%"></i>` +
    `${k > 1 ? `<i class="o2" style="width:${part(k - 1)}%"></i>` : ''}` +
    `${k > 2 ? `<i class="o3" style="width:${part(k - 2)}%"></i>` : ''}</div>` : '<div class="tbar none"></div>';
  return `<div class="tt s-${state}" data-tk="${kind}"><div class="ttl"><b title="${esc(label)}">${esc(label)}</b>${share}</div>` +
    `<div class="ttr"><span class="ttv">${tbig(spent)}</span><span class="ttg">${target ? ttext(target) : ''}</span></div>` +
    `${bar}<div class="tts">${word}</div></div>`;
}

// Подпись состояния под названием цели. Слово получает только то, что цвет плашки не говорит сам. Обычное
// состояние — цель ищут или она просто нужна — слова не получает («ищу», «нужно» стояли у всех целей); закрытая
// цель — тоже: она зелёная («есть», «надето» повторяли цвет). Строка называет срок, а на карточке шага цели
// (inStep) нет и его — срок цели и есть этот шаг.
function goalLabel(g, inStep, onCard = inStep) {
  if (g.urgency === 'done' || g.urgency === 'closed' || g.urgency === 'found') return '';
  // Снятая цель остаётся для разбора: видно, чем она кончилась.
  if (g.urgency === 'expired') return (g.status === 1 ? T('найдено, не надето') : T('не взято')) + (g.fact ? ' · ' + g.fact : '');
  let s;

  // (умение, камень поддержки), и шаг назван им самим — кроме карточки этого шага, где он и так виден. Цель карты
  // (босс, задание, механика, тайник) ждут с её же шага: на карточке этого шага (onCard) он второй раз не называется
  const since = g.since && !(onCard && g.place) ? g.since : '';
  if (g.urgency === 'early') s = T('позже') + (since ? ' · ' + since : g.needName && !onCard ? ' · ' + T('к концу «{0}»', g.needName) : '');
  // босс и награда привязаны к карте: не «опаздываю», а «пропущено» — и видно, куда вернуться
  else if (g.urgency === 'overdue') s = g.place ? T('пропущено') + (g.needName && !onCard ? ' · ' + g.needName : '') : T('опаздываю');
  // необязательный босс без награды: сроком не горит
  else if (g.boss && g.soft) s = T('необязателен');

  else if (g.soft || inStep) s = '';
  else s = g.urgency === 'due' ? T('к концу шага') : g.needName ? T('к концу «{0}»', g.needName) : '';
  // такая вещь уже надета в другом слоте (скипетр во второй руке, а план ждёт его в оружии) — откуда её переложить
  const held = g.heldIn && g.urgency !== 'early' ? T('сейчас:') + ' ' + g.heldIn.toLowerCase() : '';
  return [s, held, g.fact].filter(Boolean).join(' · ');

// short: плашка стоит рядом со своим умением, поэтому называть его второй раз не нужно.
// Сверху у каждой плашки подписано, что это: оружие, умение, поддержка, уровень камня, награда…

  let name = short === true ? g.title : fullName(g);

  const lateLab = short === 'late' && g.urgency === 'overdue' ? lateText(g.late) + (g.fact ? ' · ' + g.fact : '') : null;

  const kd = where ? (g.needName ? `<span class="kd">${esc(g.needName)}</span>` : '')
    : g.boss && g.expect && short === true ? `<span class="kd">${bossHead(g)}</span>`
      : g.kind && short !== true ? `<span class="kd">${esc(g.kind)}</span>` : '';
  // подпись вида уже сказала «уровень камня» — второй раз в названии не повторяем
  if (kd && !where && g.label === g.kind && name.startsWith(g.label + ': ')) name = name.slice(g.label.length + 2);
  // и слот сверху уже назван: у цели по стату в слоте «какой угодно» («шлем — уровень умений…») —
  // второй раз в названии его не пишем
  if (kd && !where && g.kind && name.startsWith(g.kind + ' — ')) name = name.slice(g.kind.length + 3);
  // locked: отметку поставил лог (уровень героя, награда) или сам маршрут (обязательный босс
  // остался позади) — нажимать нечего. Старый сервер такого поля не знает: тогда как раньше, по auto.
  if (g.locked === undefined ? g.auto : g.locked) {
    // в блоке «Пропущено» так стоит неактивированная точка пройденной карты: она погаснет сама по логу
    // Цель по стату считает сама программа (по запомненной вещи), но подписана она как любая цель
    // носителя: срок и чем её добыть («к концу шага · …»), подробности по наведению, а скрытая
    // фильтром база отмечена. Обычное состояние («нужно») и закрытое («есть» — плашка зелёная) слова не получают —
    // как и у прочих целей.
    const lab = g.urgency === 'done' ? '' : where && g.urgency === 'overdue' ? T('пропущено') + (g.fact ? ' · ' + g.fact : '')
      : [cur, lateLab || (g.stat ? goalLabel(g, short === 'step')
        : [{overdue: T('опаздываю'), early: T('позже')}[g.urgency] || '', g.urgency === 'expired' ? T('не взято') : '', g.fact]
          .filter(Boolean).join(' · '))].filter(Boolean).join(' · ');
    // цель по стату, которую программа считает по запомненному предмету, нажатием не закрыть: чем закрыть — в подсказке
    const how = lateLab && g.stat ? T('Считается по предмету, который отмечен надетым. Сделали стат — скопируйте предмет в игре (Ctrl+Alt+C) и нажмите «Надеть»') : '';
    return `<div class="${cls} auto"${g.note || how ? ` title="${esc(g.note || how)}"` : ''}>${kd}<span class="ct">${esc(name)}</span>` +
      `${csSpan(lab)}${g.stat ? hiddenMark(g) : ''}</div>`;
  }
  // Ступень, которую закрыла ступень выше (по плану уровень камня 11, выбран 13): сделано — квадратик с галочкой, как у
  // отмеченной нажатием (их замечание 2026-11-24: зелёная, но без галочки). Снять её нечем: меняют ступень выше — уровень
  // камня выбирают в карточке умения.
  if (g.urgency === 'closed') {
    return `<div class="${cls} tick on auto" title="${esc(g.note || T('Сделано: у вас уже есть лучше'))}">${kd}` +
      `<span class="ct">${esc(name)}</span>${hiddenMark(g)}</div>`;
  }
  const to = g.find ? (g.urgency === 'done' ? 0 : 1) : (g.status === 2 ? 0 : 2);
  // в блоке «Пропущено» карта уже названа сверху — в подписи её не повторяем; что о цели знает игра (где выдают
  // награду, падает ли случайно), говорит, как наверстать
  // босс на карточке своего шага (short === true) — тоже на своей карточке: свой шаг он не называет
  const lab = where && g.urgency === 'overdue' ? T('пропущено') + (g.fact ? ' · ' + g.fact : '')
    : [cur, lateLab || goalLabel(g, short === 'step', short === 'step' || (short === true && g.boss))].filter(Boolean).join(' · ');
  // у неотмеченного босса подсказка говорит, когда галочку поставит программа: «Нажмите, когда сделаете» спорило бы
  // с подписью «отметит программа»
  const tip = g.note || (to === 0 ? T('Нажмите, если ещё не сделано')
    : (g.boss && BOSS_MARK_TIP[g.expect]) || T('Нажмите, когда сделаете'));
  return `<button class="${cls} tick${to === 0 ? ' on' : ''}" data-goal="${esc(g.id)}" data-status="${to}" data-k="goal:${esc(g.id)}"` +
    ` title="${esc(tip)}">` +
    `${kd}<span class="ct">${esc(name)}</span>${csSpan(lab)}${hiddenMark(g)}</button>`;
}
// Полное имя для предупреждений: ступень аффикса называет и вещь, на которой его ищут.
const fullName = g => (g.holderName ? g.holderName + ' — ' : '') + (g.fullTitle || g.title);

// --- носители: слот или умение, у каждого база и части ----------------------------------
// Лесенка (база слота, цель по стату, уровень камня) знает: have — что уже есть, next — что ищут сейчас,
// later — что искать ещё рано.

// Отметка игрока, которую снимает нажатие на неё же: отдельной отмены на странице нет (их решение 2026-11-25), ошибку
// правят там, где её видно. То, что держит лог, маршрут или память надетого (locked), нажатием не изменить.
const byHand = g => !!(g && g.status && !g.locked);
// База носителя: что надето и что ищут. Нажатие на «ищут» значит «надел» (у камня умения на потом — «нашёл»), на
// надетое, отмеченное рукой, — «не надето». Ключ data-k у обоих один: двойной клик не отметит и тут же не снимет.
function baseChips(r, k) {
  const b = r.base;
  let h = '';
  // Слот, где вещь может быть какой угодно: названия у неё нет, есть только состояние слота —
  // «пусто» или «надето». Нажатие на «пусто» отмечает, что слот занят.
  if (b.have) {
    const face = b.have.any ? `<span class="ct">${T('надето')}</span>`
      : `<span class="ct">${esc(b.have.title)}</span>${csSpan(goalLabel(b.have))}`;
    h += byHand(b.have)
      ? `<button class="chip u-done" data-goal="${esc(b.have.id)}" data-status="0" data-k="${k}" title="${T('Нажмите, если ещё не сделано')}">${face}</button>`
      : `<div class="chip u-done auto">${face}</div>`;
  }
  if (b.next && b.next.any) {
    h += `<button class="chip emp" data-goal="${esc(b.next.id)}" data-status="2" data-k="${k}" title="${T('Отметить, что слот занят')}">` +
      `<span class="ct">${T('пусто')}</span></button>`;
    return h;
  }
  if (b.next) {
    const n = b.next, soft = n.soft && n.urgency === 'due';
    h += `<button class="chip u-${soft ? 'seek' : n.urgency}" data-goal="${esc(n.id)}" data-status="${n.find ? 1 : 2}" data-k="${k}">` +
      `<span class="ct">${esc(n.title)}</span>${csSpan(goalLabel(n))}${hiddenMark(n)}</button>`;
  }
  if (b.later && !b.next) {
    h += `<div class="chip u-early auto"><span class="ct">${esc(b.later.title)}</span>` +
      `${csSpan(goalLabel(b.later))}</div>`;
  }
  return h;
}

// Список ступеней под плашкой части: уровень камня выбирают из него, а не шагают
// по одному. В нём «нет» (o.none — если «нет» бывает) и ступени от первой до актуальной, но не короче
// текущей; текущая (o.cur — её id) выделена. Выбор уходит одним запросом: лесенка встаёт на ступень,
// отметки выше снимаются. o.take — цель, которую выбор ступени заодно отмечает (умение ещё не взято)
// со статусом o.status; o.drop — цель, которую снимает «нет» (само умение).
function rungList(lad, k, o) {
  const rungs = lad.rungs;
  let last = 0;
  rungs.forEach((x, i) => { if (x.open || x.id === o.cur) last = i; });
  const data = `data-chain="${esc(lad.chain.join(','))}" data-start="${rungs[0].start ? esc(rungs[0].id) : ''}"` +
    (o.take ? ` data-take="${esc(o.take)}" data-take-status="${o.status}"` : '') +
    (o.drop ? ` data-drop="${esc(o.drop)}"` : '');
  const item = (id, face, on) => `<button class="lvi${on ? ' on' : ''}" data-set="${esc(id)}" ${data} ` +
    `data-k="${k}:lv:${esc(id)}"${on ? ' aria-current="true"' : ''}>${face}</button>`;
  return '<div class="lvlist">' + (o.none ? item('', T('нет'), !o.cur) : '') +
    rungs.slice(0, last + 1).map(x => item(x.id, esc(x.title), x.id === o.cur)).join('') + '</div>';
}
// Стрелка в конце плашки: нажатие раскроет список, а не поменяет ступень.
const CARET = '<span class="lvc" aria-hidden="true">▾</span>';

// --- вещь из буфера обмена против своего слота -------------------------------------------------
// Строка сравнения, которая сейчас показана: слот, выбранный вручную (у кольца их два), иначе тот,
// что предложила программа (где вещь лучше; из двух таких — где надетое слабее).
function copyCur(v) {
  const cp = v && v.copy;
  if (!cp || !cp.rows || !cp.rows.length) return null;
  return (copyRow && copyRow.at === cp.at && cp.rows.find(r => r.row === copyRow.row)) ||
    cp.rows.find(r => r.row === cp.pick) || cp.rows[0];
}
// Готовый ответ — одним словом: решает первая строка, где есть заметная разница (база, потом редкие
// статы слота), а если такой нет — общий счёт остальных статов.
const VERDICT = {better: T('ЛУЧШЕ'), worse: T('ХУЖЕ'), same: T('ТАК ЖЕ'), worn: T('НАДЕТО'), unknown: '?'};
// Рисунок скопированной вещи — слева в шапке её карточки, как рисунок на плитке слота: по нему видно,
// что ответ — про вещь, которую только что скопировали в игре. Это рисунок базы вещи; его имя кладёт
// программа, когда файл есть. Надетая вещь нарисована на плитке слота — в карточке её не повторяем.
const copyArt = cp => cp.icon ? `<img class="cpi" src="/icons/${esc(cp.icon)}.webp" alt="">` : '';
// Сколько сравнению осталось жить: оно само уходит со страницы через минуту после копии, полоска
// по нижнему краю шапки убывает всё это время. Время ведёт программа (она и убирает сравнение).
// Продлить его нельзя: нужно ещё раз — вещь копируют в игре заново.
const COPY_BAR_SECONDS = 60;
function copyBar(cp) {
  if (!cp.until) return '';
  const rest = Math.min(COPY_BAR_SECONDS, cp.until - (Date.now() / 1000 + skew));
  if (rest <= 0) return '';
  return `<i class="cpt" style="width:${(rest / COPY_BAR_SECONDS * 100).toFixed(1)}%;animation-duration:${rest.toFixed(1)}s"></i>`;
}
// Шапка карточки слота, пока в буфере вещь для него: ответ, сколько строк заметно лучше и хуже, имя
// вещи, выбор слота (если их два) и «Надеть» — вещь запоминается надетой в этом слоте.
// Хватит ли герою уровня и атрибутов надеть вещь и не перестанет ли после замены работать надетое —
// строка под шапкой, только когда есть что сказать. Точных атрибутов героя программа не знает (какой
// атрибут взят в узле «Характеристика», игра в лог не пишет): отсюда «от … до …»; на чём стоят границы —
// в подсказке строки.
const wearStop = row => !!row.wear && (row.wear.state === 'no' || row.wear.state === 'drop');
function wearLine(row) {
  const w = row.wear;
  if (!w || !w.lines || !w.lines.length) return '';
  const span = x => (x.hi == null ? (T('от') + ' ') + x.lo : x.lo === x.hi ? String(x.lo) : x.lo + '–' + x.hi);
  const tip = (w.hero ? (T('У героя:') + ' ') + ['str', 'dex', 'int'].map(a => `${ATTR_WORD[a]} ${span(w.hero[a])}`).join(' · ') + '. ' : '') +
    T('Атрибуты — по плану дерева: узел «Характеристика» считается назначенным ему атрибутом; что взято на самом деле, называют на карте дерева.') +
    (w.notes && w.notes.length ? ' ' + w.notes.join('; ') + '.' : '');
  return `<div class="cpw w-${esc(w.state)}" title="${esc(tip)}">${w.lines.map(l => `<span>${esc(l)}</span>`).join('')}</div>`;
}
// Крафт: карточка рецепта предмета (craftplan.recipe) и где искать базу для слота (craftplan.hunt). Шесть мест
// предмета — три префикса и три суффикса: что стоит (зелёным — нужное плану), каким шагом место заполнится и цена в
// базах; шаг сейчас — чем, у очернения «+» переброс вариантов (две попытки по три), попал, промах; дальше — по строке. Почему шагов нет (другая база, у потолка, брак) —
// красным. Где искать базу: готовый ответ, полоса тиров по шагам плана с «вы здесь», под ней — следующие ступени
// ключа: какая база, где падает, шанс для трёх ступеней сфер.
const RC_RED = ['ceiling', 'small', 'stop', 'waste', 'other'];
function recipeCard(c) {
  if (!c) return '';
  const cell = x => x.kind === 'free' ? `<div class="rcl free">${T('свободно')}</div>`
    : `<div class="rcl k-${esc(x.kind)}"><span class="rcn">${x.n || (x.kind === 'have' ? '✓' : '')}</span>` +
      `<span class="rct">${esc(x.text)}</span>${x.price ? `<span class="rcp">${esc(x.price)}</span>` : ''}</div>`;
  const P = c.places.P || [], S = c.places.S || [];
  let grid = `<div class="rcs">${T('Префиксы')}</div><div class="rcs">${T('Суффиксы')}</div>`;
  for (let i = 0; i < 3; i++) grid += cell(P[i] || {kind: 'free'}) + cell(S[i] || {kind: 'free'});
  const n = c.now || {};
  const miss = n.miss ? `<div class="rcr"><span class="bad">✕</span><span>${esc(n.miss)}</span></div>` : '';
  const now = n.tool
    ? `<div class="rcw"><div class="rch2 now">${T('Сейчас · шаг {0}', n.n)}</div>` +
      `<div class="rcr"><span>→</span><span>${esc(n.tool)}</span></div>` +
      (n.echo ? `<div class="rcr"><span>+</span><span>${esc(n.echo)}</span></div>` : '') +
      (n.need ? `<div class="rcr"><span class="bad">!</span><span class="bad">${esc(n.need)}</span></div>` : '') +
      (n.hit ? `<div class="rcr ok"><span>✓</span><span>${esc(n.hit)}</span></div>` : '') + miss + '</div>'
    : `<div class="rcw"><div class="rcx k-${esc(n.kind || '')}">${esc(n.line || '')}</div>${miss}</div>`;
  const next = c.next && c.next.length ? `<div class="rcw"><div class="rch2">${T('Дальше')}</div>` +
    c.next.map(s => `<div class="rcr"><span class="rcq">${s.n}</span><span>${esc(s.tool)} — ${esc(s.aim)}` +
      (s.need ? ` <span class="bad">· ${esc(s.need)}</span>` : '') + '</span></div>').join('') +
    '</div>' : '';
  return `<div class="rcp0"><div class="rch"><span class="rcb">${esc(c.base)}</span>` +
    `<span class="rcm">${T('ур. предмета {0}', c.ilvl)} · ${esc(c.rarity)}</span></div>` +
    `<div class="rcg">${grid}</div>${now}${next}</div>`;
}
function huntBlock(h) {
  if (!h) return '';
  let here = '';
  const strip = (h.groups || []).map(g => `<div class="hg" style="flex:${g.cells.length > 1 ? g.cells.length : 1.6}">` +
    `<span class="hgl">${esc(g.name)}</span><div class="hcs">` + g.cells.map(x => {
      if (x.here) here = x.label && /^\d+$/.test(x.label) ? 'T' + x.label : g.name;
      return `<div class="hc${x.mark ? ' mk' : ''}${x.here ? ' here' : ''}">${esc(x.mark || x.label)}</div>`;
    }).join('') + '</div></div>').join('');
  const marks = (h.marks || []).map(m => `<div class="hm"><b>${esc(m.value)}</b><div>` +
    `<div>${esc(m.base)}: ${esc(m.where)}</div><div class="hmo">${m.odds.map(o => `${esc(o.grade)} ${esc(o.odds || '—')}`).join(' · ')}` +
    (m.now ? ` <i>· ${T('сейчас падают: {0}', m.now)}</i>` : '') + '</div></div></div>').join('');
  return `<div class="hnt"><div class="rch2">${T('Где искать базу')}</div><div class="hans">${esc(h.answer)}</div>` +
    `<div class="hst">${strip}</div>${here ? `<div class="hhere">${T('вы здесь: {0}', here)}</div>` : ''}${marks}</div>`;
}
const craftCard = c => (c ? recipeCard(c.recipe) + huntBlock(c.hunt) : '');
// Клавиши страницы в игре (V.keys, по умолчанию F2 и F3): имя клавиши, пока программа её слушает (игра впереди) или ждёт
// игру; клавишу держит другая программа — пусто, а keyBusy называет её.
const keyOf = name => { const k = V && V.keys && V.keys[name]; return k && k.key && k.state !== 'busy' ? k.key : ''; };
const keyBusy = name => { const k = V && V.keys && V.keys[name]; return k && k.key && k.state === 'busy' ? k.key : ''; };
// Крестик окна поверх страницы — одна кнопка: имя клавиши «Закрыть» в игре, за ним ✕. Имя видно только у верхнего окна:
// его клавиша и закроет (popPlace); ✕ при этом стоит на месте. attrs — что кнопка делает (data-…).
const shutBtn = (attrs, label) => `<button class="mini pshut" ${attrs} aria-label="${label}" title="${label}">` +
  (keyOf('close') ? `<kbd class="kk" title="${esc(T('Клавиша в игре'))}">${esc(keyOf('close'))}</kbd>` : '') + '✕</button>';
// Шапка сравнения с вещью из буфера: в окне сравнения (pop) — без полоски времени (у окна она своя, внизу) — и в
// карточке слота (copyHead: с полоской, рунами, свойствами вне билда).
function copyHead(cp, row) {
  return copyTop(cp, row, false) + copyMore(cp, row);
}
function copyMore(cp, row) {
  const st = row.st, blind = row.verdict === 'unknown';
  return wearLine(row) + (blind ? '' : runeLine(st)) + anointLine(cp, row) +
    // при сравнении по статам статы билда стоят строками ниже (одинаковые на обеих вещах не показаны
    // вовсе) — под шапкой остаётся только то, чего билд не ведёт
    statChips(cp.stats, st ? new Set(st.lines.map(l => l.id).concat(st.same || [])) : null);
}
function copyTop(cp, row, pop) {
  const st = row.st;
  const blind = row.verdict === 'unknown';
  // Надеть нельзя или замена выключит надетое: это и есть ответ, что бы ни говорили статы — их слово
  // остаётся рядом мелко.
  const stop = wearStop(row);
  const word = !stop ? VERDICT[row.verdict] || '?' : row.wear.state === 'no' ? T('НЕ НАДЕТЬ') : T('ОСТОРОЖНО');
  const byStats = stop && !blind && VERDICT[row.verdict] ? `<span class="cpe">${T('по статам')} ${VERDICT[row.verdict].toLowerCase()}</span>` : '';
  const b = row.base;
  // В слоте ничего нет: любая вещь лучше пустого места, счёт строк тут ни к чему — пишем, почему «лучше».
  const cnt = blind ? '' : row.empty ? `<span class="cpe">${T('слот пуст')}</span>`
    : (row.up ? `<b class="d-up">▲${row.up}</b>` : '') + (row.down ? `<b class="d-dn">▼${row.down}</b>` : '');
  // план называет базы слота по именам, а базы этой вещи среди них нет
  const base = b && b.named && !b.to ? ('<span class="cpe">' + T('база не из плана') + '</span>') : '';
  // слот отмечен занятым, а что в нём надето, программа не видела: сравнить не с чем, пока надетую
  // вещь не скопируют и не запомнят
  const lost = row.lost ? ('<span class="cpe">' + T('надетое не запомнено') + '</span>') : '';
  const name = cp.name && cp.base && cp.name !== cp.base ? `${cp.name} · ${cp.base}` : (cp.name || cp.base || T('предмет'));
  const many = cp.rows.length > 1 ? cp.rows.map(r =>
    `<button class="mini cps${r.row === row.row ? ' on' : ''}" data-copyrow="${esc(r.row)}">${esc(r.slotName)}</button>`).join('') : '';
  // «Надеть» есть, когда вещь можно запомнить или у неё есть база из плана; у вещи, которая и так
  // надета, кнопки нет. Клавиша в игре делает то же самое — её имя на кнопке перед словом, пока клавиша слушается.
  const wk = keyOf('wear');
  const act = row.verdict === 'worn' || !(row.keep || (b && b.to)) ? ''
    : `<button class="cpb" data-wear="${esc(row.row)}" data-k="wear"${wk ? ` title="${esc(T('Или {0} в игре', wk))}"` : ''}>` +
      `${wk ? `<kbd class="kk">${esc(wk)}</kbd>` : ''}${T('Надеть')}</button>`;
  // Клавиша «Надеть» в игре слушается, пока игра впереди; клавишу держит другая программа — сказано здесь
  const busy = act && keyBusy('wear') ? ('<span class="cpe">' + T('{0} занята другой программой', keyBusy('wear')) + '</span>') : '';
  // Ответ считается без вставок в гнёздах: руны в новую вещь ещё только предстоит вставить, и ответ нужен
  // до того, как их потратят. Если с тем, что вставлено сейчас, ответ другой — он сказан рядом («как
  // есть»); если тот же — о рунах в шапке ни слова.
  const rn = !blind && st && st.runes;
  const flip = rn && rn.verdict
    ? `<span class="cpr v-${esc(rn.verdict)}" title="${T('С тем, что вставлено в гнёзда сейчас')}">${T('как есть —')} ${VERDICT[rn.verdict] || '?'}</span>` : '';
  // Предмет проще надетого (белый, синий — против жёлтого): защита его базы аффиксов надетого не перевешивает,
  // и надевать его сейчас незачем, — но база у него лучше, её стоит оставить под крафт. Сказано рядом тем же
  // видом, что «как есть»; когда база ни при чём — ни слова.
  const basis = !blind && st && st.basis
    ? `<span class="cpr v-${esc(st.basis)}" title="${T('Защита базы лучше, но аффиксы надетого перевешивают: надевать незачем, оставить под крафт')}">${T('как база —')} ${VERDICT[st.basis] || '?'}</span>` : '';
  // Ответ решила одна строка (база или редкий стат), а остальное вместе говорит обратное: это тоже ответ —
  // «хуже, но только из-за духа». Сказано двумя словами рядом; когда остальное заодно с ответом — молчим.
  const lone = !blind && st && st.lines.some(l => l.decides) && Math.abs(st.score) >= 0.12 &&
    (st.score > 0) !== (row.verdict === 'better') && (row.verdict === 'better' || row.verdict === 'worse')
    ? `<span class="cpe">${T('остальное')} ${st.score > 0 ? T('лучше') : T('хуже')}</span>` : '';
  const head = `<div class="cph v-${esc(row.verdict)}${stop ? ' w-' + esc(row.wear.state) : ''}">${copyArt(cp)}<span class="cpv">${word}</span>` +
    (byStats || cnt || base || lost || lone || busy ? `<span class="cpc">${byStats}${cnt}${base}${lost}${lone}${busy}</span>` : '') + basis + flip +
    // крестик, убирающий сравнение, — не здесь, а в углу самой карточки (cardShut) или окна: там же потом и
    // «закрыть», одно место на оба нажатия
    `<span class="cpn">${esc(name)}${cp.note ? `<span class="cpnote">${esc(cp.note)}</span>` : ''}</span>`;
  // В окне сравнения «Надеть» и выбор кольца — всегда второй строкой, справа, как кнопки действий везде (их слова
  // 2026-11-25): место кнопки не зависит от длины ответа и имени, правый край — общий с крестиком окна
  if (pop) return head + '</div>' + (many || act ? `<div class="cma">${many}${act}</div>` : '');
  return head + `${many}${act}${copyBar(cp)}</div>`;
}
// Вставки в гнёздах (руны, сердцевины душ) — отдельной тихой строкой под шапкой: в ответ они не идут,
// но по ней видно, что придётся вставить в новую вещь и сколько у неё гнёзд. Строки нет, когда вставок
// нет ни на надетой вещи, ни на новой.
function runeLine(st) {
  const rn = st && st.runes;
  if (!rn) return '';
  const list = rows => rows.map(r =>
    `<span>${esc(r.short)} <b>${r.value > 0 ? '+' : ''}${esc(r.value)}${esc(r.unit)}</b></span>`).join('');
  return ('<div class="cpp cprn"><span>' + T('без рун') + '</span>') +
    (rn.now.length ? `<span>${T('руны надетой:')}</span>${list(rn.now)}` : '') +
    (rn['new'].length ? `<span>${T('руны предмета:')}</span>${list(rn['new'])}` : '') +
    `<span>${T('гнёзда')} <b>${esc(rn.sockets[0])} → ${esc(rn.sockets[1])}</b></span></div>`;
}
// Узел дерева на предмете (зачарование амулета): в ответ по статам он не идёт — тихой строкой под шапкой, как руны.
// Строки нет, когда узла нет ни на копии, ни на надетом в этом слоте. Узел надетого, которого на копии нет,
// при замене теряется: строка жёлтая, с рецептом — какими эмоциями зачаровать заново.
function anointLine(cp, row) {
  const mine = cp.anoint || [], worn = row.anoint || [];
  const names = new Set(mine.map(a => a.name)), lost = worn.filter(a => !names.has(a.name));
  if (!mine.length && !lost.length) return '';
  return `<div class="cpp cpan${lost.length ? ' lose' : ''}">` +
    (mine.length ? `<span>${T('зачарование:')} ${mine.map(a => `<b>${esc(a.name)}</b>`).join(', ')}</span>` : '') +
    lost.map(a => `<span>${T('теряется:')} <b>${esc(a.name)}</b></span>` +
      (a.recipe.length ? `<span>${T('заново:')} ${a.recipe.map(esc).join(' → ')}</span>` : '')).join('') + '</div>';
}
// Паспорт вещи: всё, что на ней есть, суммой по статам героя — чистые аффиксы, гибриды, руны,
// собственные свойства и свойства самой вещи (броня, дух). Из чего стат сложился — по наведению.
// skip — статы, которые уже показаны строками сравнения: тогда строка начинается словом «ещё».
const PASS_SRC = {prefix: T('префикс'), suffix: T('суффикс'), implicit: T('собственное свойство'), rune: T('руны'),
  enchant: T('улучшение'), unique: T('уникальное свойство'), property: T('свойство предмета'), affix: T('аффиксы'),
  base: T('сама база')};
function statChips(st, skip, cls) {
  const rows = st && st.rows ? st.rows.filter(r => !skip || !skip.has(r.id)) : [];
  if (!rows.length) return '';
  // источник, которого страница не знает, не пишется словом программы — только число
  const tip = r => r.name + ': ' + r.parts.map(p => `${p.v}${r.unit}${PASS_SRC[p.src] ? ' ' + PASS_SRC[p.src] : ''}`).join(' + ');
  return `<div class="cpp${cls || ''}">${skip ? ('<span>' + T('ещё') + '</span>') : ''}${rows.map(r =>
    `<span title="${esc(tip(r))}">${esc(r.short)} <b>${esc(r.value)}${esc(r.unit)}</b></span>`).join('')}</div>`;
}
const passLine = cp => statChips(cp.stats);
// Строка сравнения вещи из буфера с надетой — по стату билда. Колонки у всех строк карточки слота одни:
// слева «редкий» (сами этот стат несут два-три слота билда — больше его взять негде, поэтому такой стат
// решает первым), название, «моё», число на вещи, стрелка с разницей. У стата с порогом под названием —
// что станет с героем; если герой и так сверх порога, строка приглушена и в ответ не идёт. Строка,
// которая решила ответ, обведена. Первая строка — база, если план называет базы по именам
// (самострелы): база получше решает раньше любого стата. Строка «база» рода (kind) — когда базы надетой
// и новой вещи по-разному отвечают роду, который план ждёт в слоте (AR/ES, ES…): она решает, только если
// вещи по статам почти равны, а до тех пор тихая.
function statLine(ln) {
  if (ln.cls === 'kind') {
    const name = t => t ? esc(t) : ('<span class="gnone">' + T('без защиты') + '</span>');
    const mark = ln.decides ? (ln.delta > 0 ? '<b class="d-up">▲</b>' : '<b class="d-dn">▼</b>')
      : `<span class="gnone">${ln.delta > 0 ? '▲' : '▼'}</span>`;
    const tip = ln.decides ? T('Предметы по статам почти равны — решила база, которую план ждёт в слоте')
      : T('База предмета и база, которую план ждёт в слоте. Решает, только когда предметы по статам почти равны');
    return `<div class="prow"><div class="pline${ln.decides ? (ln.delta > 0 ? ' c-up' : ' c-dn') + ' st-dec' : ''}" title="${esc(tip)}">` +
      ('<b class="rk rk-none"></b><span class="ppos stk">' + T('база') + '</span>') +
      `<span class="pname pwide">${name(ln.nowName)} → ${name(ln.newName)}<span class="sth">${T('по плану')} ${esc(ln.wantName || '')}</span></span>` +
      `<span class="pgap">${mark}</span></div></div>`;
  }
  if (ln.cls === 'base') {
    const name = t => t ? esc(splitName(t)[0]) : ('<span class="gnone">' + T('нет') + '</span>');
    return `<div class="prow"><div class="pline ${ln.delta > 0 ? 'c-up' : 'c-dn'}${ln.decides ? ' st-dec' : ''}">` +
      ('<b class="rk rk-none"></b><span class="ppos stk">' + T('база') + '</span>') +
      `<span class="pname pwide">${name(ln.now)} → ${name(ln['new'])}</span>` +
      `<span class="pgap">${ln.delta > 0 ? '<b class="d-up">▲</b>' : '<b class="d-dn">▼</b>'}</span></div></div>`;
  }
  const u = esc(ln.unit || '');
  const val = x => x ? `${x}${u}` : ('<span class="gnone">' + T('нет') + '</span>');
  const diff = Math.round((ln['new'] - ln.now) * 10) / 10;
  // мелкая разница (меньше восьмой доли аффикса) не горит: серая стрелка, строка без цвета
  const mark = ln.cls === 'over' ? ('<span class="gnone">' + T('сверх') + '</span>')
    : !ln.delta ? (ln.now || ln['new'] ? '<span class="gnone">=</span>' : '')
      : ln.minor ? `<span class="gnone">${ln.delta > 0 ? '▲ +' : '▼ '}${diff}</span>`
        : ln.delta > 0 ? `<b class="d-up">▲ +${diff}</b>` : `<b class="d-dn">▼ ${diff}</b>`;
  // noRunes: руны этого слота дают тот же стат, а сравнение идёт без них — число героя здесь меньше,
  // чем в его окне, и это сказано
  const hero = ln.cap != null && ln.hero !== undefined
    ? `<span class="sth">${T('герой')}${ln.noRunes ? (' ' + T('без рун слота')) : ''} ${ln.hero} ${T('→ {0} из', ln.heroNew)} ${ln.cap}</span>` : '';
  const rare = ln.cls === 'scarce';
  // порог цели плана («дух скипетра от 120») берёт только один из двух предметов: слева «цель», под названием —
  // сам порог; строка решает раньше обычных статов
  const floor = ln.cls === 'floor';
  const cells = '<b class="rk rk-none"></b>' +
    `<span class="ppos${rare || floor ? ' stk' : ''}">${rare ? T('редкий') : floor ? T('цель') : ''}</span>` +
    `<span class="pname">${esc(ln.short)}${hero}${floor ? `<span class="sth">${T('от')} ${esc(ln.floor)}${u}</span>` : ''}</span>` +
    `<span class="pmine">${val(ln.now)}</span><span class="pbest"><span class="pact">${T('предмет')}</span> ${val(ln['new'])}</span>` +
    `<span class="pgap">${mark}</span>`;
  const cls = 'pline' + (ln.cls === 'over' ? ' st-over' : ln.minor ? '' : ln.delta > 0 ? ' c-up' : ln.delta < 0 ? ' c-dn' : '') +
    (ln.decides ? ' st-dec' : '');
  const tip = floor ? `${ln.name}: ${T('цель плана — от {0}. Её берёт только один из предметов: это решает раньше обычных статов', ln.floor + (ln.unit || ''))}`
    : ln.name;
  return `<div class="prow"><div class="${cls}" title="${esc(tip)}">${cells}</div></div>`;
}
// Строка стата надетой вещи в карточке слота — в тех же колонках: «редкий», название, число на вещи,
// лучшее, что сейчас бывает аффиксом на таком слоте («сейчас до 35»), и полоска — доля от него.
// Редкий стат слота, которого на вещи нет, подсвечен: искать его нужно именно здесь. У стата с порогом
// под названием — сколько его у героя; без этой вещи порог всё равно набран — строка приглушена: её число сверх
// порога. Порог держит она сама (герой выше порога, без неё — ниже) — под названием и то, сколько станет без неё.
function itemLine(ln) {
  const u = esc(ln.unit || '');
  const rare = ln.cls === 'scarce';
  const hero = ln.cap != null && ln.hero !== undefined
    ? `<span class="sth">${T('герой {0} из', ln.hero)} ${ln.cap}${ln.without != null ? ' · ' + T('без предмета {0}', ln.without) : ''}</span>`
    : '';
  const cells = '<b class="rk rk-none"></b>' +
    `<span class="ppos${rare ? ' stk' : ''}">${rare ? T('редкий') : ''}</span>` +
    `<span class="pname">${esc(ln.short)}${hero}</span>` +
    `<span class="pmine">${ln.value ? ln.value + u : ('<span class="gnone">' + T('нет') + '</span>')}</span>` +
    `<span class="pbest">${ln.top ? `<span class="pact">${T('сейчас до')}</span> ${ln.top}${u}` : ''}</span>` +
    `<span class="pgap">${ln.q != null ? `<span class="pb"><b style="width:${Math.round(100 * ln.q)}%"></b></span>` : ''}</span>`;
  const cls = 'pline' + (ln.missing ? ' st-miss' : ln.cls === 'over' ? ' st-over' : '');
  return `<div class="prow"><div class="${cls}" title="${esc(ln.name)}">${cells}</div></div>`;
}
// Цель по стату у слота («уровень умений приспешников: от +1» к вознесению). Отмечается сама — по вещи,
// запомненной в слоте; пока вещь не запомнена, её отмечают нажатием. У цели бывают ступени («от +1»
// к вознесению, «от +3» к картам): строка называет ту, которую план ждёт сейчас — срок подошёл или
// прошёл, тогда самую высокую из таких (p.plan), иначе ближайшую. Под названием — срок и что ей
// мешает (fact). Ждать нечего — строка зелёная и называет то, что есть.
function goalLine(p, k) {
  const n = p.next;
  // старый сервер названия ступени в p.plan не кладёт — тогда строка называет ближайшую, как раньше
  const g = (n && n.aim && p.plan && p.plan.fullTitle ? p.plan : null) || n || p.have || p.later;
  if (!g) return '';
  const done = !n && !!p.have;
  const late = n && (n.urgency === 'overdue' || n.urgency === 'due');
  const how = n && g.fact ? esc(g.fact) : '';
  const sub = late ? `<span class="plate${n.urgency === 'due' ? ' due' : ''}">${n.urgency === 'due' ? T('к концу шага') : esc(lateText(n.late))}` +
      `${how ? `<span class="ph"> · ${how}</span>` : ''}</span>`
    : how ? `<span class="sth">${how}</span>` : '';
  const cells = ('<b class="rk rk-none"></b><span class="ppos">' + T('цель') + '</span>') +
    `<span class="pname pwide">${esc(g.fullTitle)}${sub}</span>` +
    `<span class="pgap">${done ? '<span class="g0">✓</span>' : ''}</span>`;
  const cls = 'pline' + (done ? ' in-step' : '');
  const tip = g.note ? ` title="${esc(g.note)}"` : '';
  if (n && !n.locked) {
    return `<div class="prow"><button class="${cls}"${tip} data-goal="${esc(n.id)}" data-status="2" data-k="${k}">${cells}</button></div>`;
  }
  // отметку, поставленную рукой, снимают нажатием на ту же строку; ту, что считает программа, нажатием не изменить
  if (done && byHand(p.have)) {
    return `<div class="prow"><button class="${cls}" title="${esc(g.note || T('Нажмите, если ещё не сделано'))}" ` +
      `data-goal="${esc(p.have.id)}" data-status="0" data-k="${k}">${cells}</button></div>`;
  }
  return `<div class="prow"><div class="${cls}"${tip}>${cells}</div></div>`;
}
// Вещь, которую программа запомнила надетой в этом слоте: имя, «Снять» (вещь снимают, а новую не
// надевают) и под ним — что на ней есть кроме статов билда (они стоят строками ниже). Это действие
// забывает вещь, поэтому оно словом и стоит сразу за именем — подальше от крестика карточки, которым
// только скрывают.
// how: 'name' — идёт сравнение с вещью из буфера: остаётся только имя («надето: …»). label — подпись слева:
// название слота, когда строка стоит вместо базы плана («любая вещь»), иначе «надето».
function wornLine(r, how, label) {
  const w = r.item;
  if (!w) return '';
  const name = w.name && w.base && w.name !== w.base ? `${w.name} · ${w.base}` : (w.name || w.base || T('предмет'));
  const forget = how === 'name' ? '' : `<button class="mini rm" data-forget="${esc(r.wornKey)}" data-k="forget" ` +
    `title="${T('Забыть предмет: слот останется пустым')}">${T('Снять')}</button>`;
  return `<div class="wl"><span class="wlk">${esc(label || T('надето'))}</span>` +
    `<span class="wln">${esc(name)}</span>${forget}</div>` +
    (how === 'name' ? '' : statChips(w.stats, new Set((w.lines || []).map(l => l.id)), ' wlp'));
}

// Карточка слота. Сверху — ответ на вещь из буфера (если она идёт в этот слот). Дальше — что в слоте: база плана
// (пока она что-то говорит: названа по имени или вещь не запомнена), запомненная вещь и строки: при сравнении — статы
// билда «моё против вещи», иначе — статы надетой вещи против лучшего, что сейчас бывает, и цели слота по статам. Внизу —
// свёрнутый план слота. Надел не то — копируют в игре то, что надето на деле, и снова «Надеть»: отмены нет.
function holderRow(r) {
  const k = 'row:' + esc(r.id);
  const cur = copyCur(V);
  const copy = cur && cur.row === r.id ? cur : null;
  const st = copy && copy.st ? copy.st : null;
  const head = copy ? copyHead(V.copy, copy) : '';
  const it = r.item, b = r.base;
  const anyBase = !b || [b.have, b.bag, b.next, b.later].filter(Boolean).every(x => x.any);
  const noBase = st || (it && anyBase);
  const lines = st ? st.lines.map(statLine).join('')
    : (it ? it.lines.map(itemLine).join('') : '') + r.parts.map(p => goalLine(p, k)).join('');
  return `<div class="hrow">${head}` + (noBase ? '' : `<div class="hbase"><span class="hk">${esc(r.kind)}</span>` +
    (b ? baseChips(r, k) : '') + '</div>') +
    wornLine(r, st ? 'name' : '', noBase && !st ? r.kind : '') +
    (lines ? `<div class="plist${st ? ' cmp' : ''}">${lines}</div>` : '') +
    (copy ? craftCard(copy.craft) : '') + planBlock(r) + howBlock(r, copy) + '</div>';
}

// «Как сделать» в карточке слота: та же карточка рецепта — для надетого предмета (ничего не надето — для белой базы
// в лучшем окне уровня) — и где искать базу (craftplan.slot_card). Свёрнут: его открывают в городе, а не в бою; в
// строке — готовый ответ, где искать базу.
function howBlock(r, copy) {
  const h = r.howto;
  if (!h || !(h.recipe || h.hunt)) return '';
  const bad = h.recipe && RC_RED.includes(h.recipe.kind);
  const word = h.hunt ? h.hunt.answer : (h.recipe && h.recipe.now ? h.recipe.now.line || '' : '');
  const head = `<details class="sec how" id="${esc('how:' + r.id)}"${howOpen ? ' open' : ''}>` +
    `<summary><span class="ar">▸</span><span class="sh">${T('Как сделать')}</span>` +
    (word ? `<span class="hwst${bad ? ' bad' : ''}">${esc(word)}</span>` : '') + '</summary>';
  if (!howOpen) return head + '</details>';
  // над блоком открыта копия с тем же «Где искать базу» — второй раз его не повторять
  const hunt = copy && copy.craft && copy.craft.hunt ? '' : huntBlock(h.hunt);
  return head + `<div class="hwb">${recipeCard(h.recipe)}${hunt}</div></details>`;
}

// План носителя (умения или слота) — таблицей: столбцы — шаги маршрута, на которых у него что-то
// происходит, под шапкой актов (акт назван один раз, ничего не свёрнуто); строки — дорожки: умение,
// уровень камня, гнёзда 1–5 (у слота — база и цели по статам). В ячейке — что на этом шаге происходит
// в этой дорожке, цветом — сделано, к этому шагу, опаздываю, впереди. Текущий шаг — столбец «сейчас»
// или черта между пройденным и будущим. Над таблицей — «Дальше»: самое срочное. За пять секунд видно,
// где мы и какой шаг следующий.
function planBlock(r) {
  const tl = r.timeline || [];
  if (!tl.length) return '';
  // свёрнут, пока не раскроют сами, и только пока открыта карточка — см. planOpen
  const card = r.slot ? 'item' : 'skill', open = planOpen[card];
  const head = `<details class="sec plan" data-card="${card}" id="${esc('plan:' + r.id)}"${open ? ' open' : ''}>` +
    `<summary><span class="ar">▸</span><span class="sh">${T('План')}</span>${tally(tl)}</summary>`;
  if (!open) return head + '</details>';
  const pos = V.pos == null ? -1 : V.pos;
  const isDone = t => t.urgency === 'done' || t.urgency === 'closed';
  const isHot = t => !t.soft && (t.urgency === 'overdue' || t.urgency === 'due');
  // столбцы — шаги по порядку маршрута; дорожки — части носителя по порядку (база первой)
  const cols = [], lanes = [];
  for (const t of tl) {
    if (!cols.some(c => c.i === t.needIdx)) cols.push({i: t.needIdx, name: t.needName || '', act: t.act || ''});
    if (!lanes.some(l => l.n === t.lane)) lanes.push({n: t.lane, name: t.where === T('уровень камня') ? T('уровень') : (t.where || '')});
  }
  cols.sort((a, b) => a.i - b.i);
  lanes.sort((a, b) => a.n - b.n);
  // «сейчас»: столбец текущего шага, а если его среди столбцов нет — черта между пройденным и будущим
  const nowCol = cols.findIndex(c => c.i === pos);
  const gapAt = nowCol >= 0 ? -1 : cols.filter(c => c.i < pos).length;
  const tracks = [];
  cols.forEach((c, k) => { if (gapAt === k) tracks.push(null); tracks.push(c); });
  if (gapAt === cols.length) tracks.push(null);
  const tpl = 'fit-content(118px) ' + tracks.map(c => c ? 'minmax(108px,1fr)' : '2px').join(' ');
  const line = '<div class="pnow"></div>';
  // шапка актов: акт назван один раз над своими картами
  let actRow = '<div></div>';
  for (let k = 0; k < tracks.length;) {
    if (!tracks[k]) { actRow += line; k++; continue; }
    let n = 1;
    while (tracks[k + n] && tracks[k + n].act === tracks[k].act) n++;
    const here = nowCol >= 0 && cols[nowCol].act === tracks[k].act && tracks.slice(k, k + n).includes(cols[nowCol]);
    actRow += `<div class="pa${here ? ' now' : ''}" style="grid-column:span ${n}">${esc(tracks[k].act)}</div>`;
    k += n;
  }
  const mapRow = '<div></div>' + tracks.map(c => !c ? line
    : `<div class="pm${c.i === pos ? ' now' : ''}">${esc(c.name)}${c.i === pos ? (' ' + T('· сейчас')) : ''}</div>`).join('');
  const level = r.parts.find(p => p.key === 'level');
  const mine = level && level.have ? level.have.title : null;
  const cell = t => {
    const cls = isDone(t) ? 'ok' : isHot(t) ? (t.urgency === 'due' ? 'du' : 'la') : t.urgency === 'expired' ? 'ex' : 'ah';
    const support = socketRe().test(t.where || '');
    // шаг «Снять» умения или камня поддержки — своей ячейкой: «снять»
    const text = t.drop ? (isDone(t) ? T('✓ снято') : T('снять##камень'))
      : t.isBase && !r.slot ? (isDone(t) ? T('✓ взято') : T('взять'))
      : splitName(t.title)[0] +
        (t.where === T('уровень камня') && cls === 'la' && mine ? (' ' + T('· у вас') + ' ') + mine : '');
    return `<div class="pc ${cls}">${support ? supIcon(t) : ''}<span>${esc(text)}</span></div>`;
  };
  const rows = lanes.map(l => `<div class="plb">${esc(l.name)}</div>` + tracks.map(c => {
    if (!c) return line;
    const items = tl.filter(t => t.lane === l.n && t.needIdx === c.i);
    return !items.length ? '<div class="pc e"></div>'
      : items.length === 1 ? cell(items[0]) : `<div class="pcs">${items.map(cell).join('')}</div>`;
  }).join('')).join('');
  // «Дальше»: самое срочное — что опаздывает и что нужно к этому шагу; иначе ближайшее по плану
  const what = t => (t.drop ? T('снять##камень') : t.where || '') + (t.isBase && !r.slot ? '' : ': ' + splitName(t.title)[0]);
  const late = tl.filter(t => isHot(t) && t.urgency === 'overdue'), due = tl.filter(t => isHot(t) && t.urgency === 'due');
  let next = late.map(t => `<span class="nc la">${esc(what(t))} · ${esc(lateText(t.late))}</span>`).join('');
  next += due.length > 2 ? `<span class="nc du">${T('к концу шага:')} ${due.length}</span>`
    : due.map(t => `<span class="nc du">${esc(what(t))} ${t.drop ? T('· на этом шаге') : T('· к концу шага')}</span>`).join('');
  if (!next) {
    const t = tl.find(x => !isDone(x) && x.urgency !== 'expired' && x.needIdx > pos);
    next = t ? `<span class="nc ah">${esc(what(t))} · ${esc((t.act ? t.act + ' · ' : '') + t.needName)}</span>`
      : ('<span class="nc mu">' + T('по плану всё сделано') + '</span>');
  }
  if (nowCol < 0 && V.step) next += `<span class="nc mu">${T('сейчас:')} ${esc(V.step.name)}</span>`;
  return head + `<div class="pnext"><span class="nl">${T('Дальше')}</span>${next}</div>` +
    `<div class="pgridw"><div class="pgrid" style="grid-template-columns:${tpl}">${actRow}${mapRow}${rows}</div></div></details>`;
}

// Место камня поддержки в плане умения программа называет «гнездо 2» — на языке страницы.
let socketRx = null;
const socketRe = () => socketRx || (socketRx = new RegExp('^' + T('гнездо %d').replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace('%d', '\\d+') + '$'));
// «Русское (English): хвост» -> ['Русское: хвост', 'English']: английское имя идёт второй строкой.
function splitName(t) {
  const m = /^(.*?) \(([^()]*)\)(.*)$/.exec(t || '');
  return m ? [m[1] + m[3], m[2]] : [t || '', ''];
}
// На плитке умения — имя без рода камня: «Призрак: Заряженный подвижник» → «Заряженный подвижник»,
// иначе длинное имя раздувает плитку. Полное имя остаётся в раскрытой карточке и в целях шага.
const tileName = t => splitName(t)[0].replace(/^[^:()]+: /, '');
const twoLine = t => {
  const [ru, en] = splitName(t);
  return `<span class="ct">${esc(ru)}</span>${en ? `<span class="ce">${esc(en)}</span>` : ''}`;
};
// У умения разрыв — только полоской: число рядом с уровнем читается как вычитание («10 −1» — будто 9).
// Сколько прямоугольников, на столько уровней камень отстаёт от актуального (больше шести не рисуем).
const gapBars = n => `<span class="gb" title="${T('отстаёт на')} ${n}">${'▮'.repeat(Math.min(n, 6))}</span>`;

// Склонение: 1 шаг, 2 шага, 5 шагов — на языке страницы (по-английски 1 step, 2 steps).
const plural = (n, one, few, many) => TN(n, one + '|' + few + '|' + many);
// «опаздываю · 42 шага»: срок цели был столько шагов назад. Старая программа числа не присылает.
// Число и «шагов» не разрываются: на узкой плитке строка переносится после «опаздываю ·», а не внутри.
const lateText = n => T('опаздываю') + (n ? ` · ${n} ${plural(n, 'шаг', 'шага', 'шагов')}` : '');

// Оценка вещи — её аффиксы отрезками: сколько из них работает на билд. Отрезок — аффикс: зелёный —
// нужен билду (закраска — насколько он силён против лучшего, какой сейчас бывает), синий — несёт
// редкий стат слота, тёмный — билду не нужен, пунктирный — место под аффикс свободно. Слева редкие,
// дальше по силе. У вещи без видимых аффиксов (простая копия, уникальная) полоски нет.
function itemBar(cells, names) {
  const what = c => c.free ? T('свободно') : !c.stat ? T('аффикс не для билда')
    : `${names[c.stat] || c.stat}${T(': {0}% от лучшего сейчас', Math.round(100 * c.q))}`;
  return `<span class="rb" title="${esc(cells.map(what).join('\n'))}">` +
    cells.map(c => `<i class="${c.free ? 'free' : c.rare ? 'rare' : ''}"><b style="width:${Math.round(100 * c.q)}%"></b></i>`).join('') +
    '</span>';
}

// Слоты схемой, как в окне снаряжения игры. Плитка: слот, что в нём надето (имя запомненной вещи)
// и оценка вещи — её аффиксы отрезками. Срок плана виден и здесь: жёлтая рамка — что-то нужно к этому
// шагу, красная — опаздываю, и подписано, на сколько шагов; опоздание больше трёх шагов заливает
// плитку красным. Нажатие раскрывает под схемой карточку слота.
const DOLL = ['weapon', 'offhand', 'helmet', 'body', 'gloves', 'boots', 'belt', 'amulet', 'ring1', 'ring2'];
// Плитка вещи в схеме надетого. Носитель — вещь, а не слот: слот лишь место, где она надета. label —
// подпись сверху («Шлем»); o.cls и o.area ставят плитку на место в схеме.
// Вещь, которая может быть какой угодно, названия не имеет: у занятого слота его нет вовсе, у пустого
// написано «пусто», и сама плитка пунктирная. Слово «любой» нигде не пишется.
// Картинка вещи на плитке — как у умений. Надетая (запомненная) вещь — её рисунок из игры (у уникальной —
// свой, у прочих — рисунок базы), в цвете. Пока вещь не запомнена: названная в плане база (у цели поле
// icon: item-…) — её рисунок; вещь «какая угодно» — силуэт типа (type-…): цвет значит «именно эта вещь»,
// силуэт — «любая такого типа». Чего ещё нет (не надето) — приглушено, как невзятое умение.
// Какие файлы есть в /icons, говорит программа (v.icons): без файла плитка остаётся без картинки —
// ни запроса за несуществующим файлом, ни пустого места.
const SLOT_ART = {helmet: 'helmet', body: 'body', gloves: 'gloves', boots: 'boots', belt: 'belt',
  amulet: 'amulet', ring1: 'ring', ring2: 'ring'};
function itemArt(r, shown, owned) {
  // Вещь, запомненная в слоте, нарисована рисунком своей базы (его имя кладёт программа, когда файл
  // есть); иначе — картинка базы из плана или силуэт типа.
  const mine = r.item && r.item.icon;
  const name = mine || (shown && shown.icon) || (SLOT_ART[r.slot] ? 'type-' + SLOT_ART[r.slot] : '');
  // рисунок базы из данных игры (art-…) цель получает на странице «Билд» вместе с названием базы: такие
  // файлы программа в общий список не кладёт (их сотни), поэтому пропавший просто не показывается
  if (!name || !(mine || name.startsWith('art-') || (V.icons || []).includes(name))) return '';
  return `<img class="di${name.startsWith('type-') ? ' ty' : ''}${owned ? '' : ' off'}" src="/icons/${esc(name)}.webp" alt="" onerror="this.style.visibility='hidden'">`;
}

function itemTile(r, label, o = {}) {
  const b = r.base || {}, shown = b.have || b.next || b.later;
  // такая вещь уже надета в другом слоте — её пора переложить сюда (план с этого шага ждёт её здесь)
  const note = !b.have && b.next && b.next.heldIn ? (T('сейчас:') + ' ') + b.next.heldIn.toLowerCase() : '';
  // Вещь, которую программа запомнила надетой в слоте, названа на плитке своим именем: по нему видно,
  // какие слоты запомнены. Иначе — база из плана, если она названа.
  const mem = r.item;
  const named = mem ? (mem.name || mem.base || '') : shown && !shown.any ? splitName(shown.title)[0] : '';
  // Вещь в слоте есть — запомнена или отмечена база. «Можно лучше» — когда план прямо сейчас чего-то
  // ждёт от слота: базу получше или цель по стату. Зелёная целиком — есть, и план ничего не ждёт;
  // зелёная наполовину — есть, но план ждёт большего.
  const worn = !!(b.have || mem);
  const better = !!(b.next || r.parts.some(p => p.next));
  const level = worn && !better, has = worn && better;
  const empty = !worn && !named;
  const open = r.id === openHolder;
  // срок плана: «к концу шага» или «опаздываю · N шагов»; больше трёх шагов — плитка залита
  const urg = r.state === 'overdue' ? ' u-overdue' + (r.late > 3 ? ' late2' : '') : r.state === 'due' ? ' u-due' : '';
  const when = r.state === 'overdue' ? `<span class="dl">${esc(lateText(r.late))}</span>`
    : r.state === 'due' ? ('<span class="dl due">' + T('к концу шага') + '</span>') : '';
  const names = {};
  for (const ln of (mem && mem.lines) || []) names[ln.id] = ln.short;
  const mark = mem && mem.bar ? itemBar(mem.bar, names) : level ? '<span class="g0">✓</span>' : '';
  // есть ли сама вещь: надета (отмечена или запомнена)
  const art = itemArt(r, shown, !!(b.have || mem));
  // вещь из буфера идёт в этот слот: плитка обведена цветом ответа (лучше — зелёным, хуже — красным)
  const cur = copyCur(V);
  const cp = cur && cur.row === r.id ? ' cp-' + (wearStop(cur) ? 'stop' : cur.verdict) : '';
  // шапка плитки — картинка и подписи рядом, как у умения; полоска оценки ниже, на всю ширину плитки
  return `<button class="dt${o.cls || ''}${level ? ' lvl' : has ? ' has' : empty ? ' emp' : ''}${urg}${open ? ' open' : ''}${cp}"${o.area || ''} ` +
    `data-open="${esc(r.id)}" aria-expanded="${open}"><span class="dh">${art}<span class="dx"><span class="dk">${esc(label)}</span>` +
    `${note ? `<span class="cs">${esc(note)}</span>` : ''}${when}</span></span>` +
    `<span class="dn">${esc(named || (empty ? T('пусто') : ''))}</span>` +
    `<span class="dg">${mark}</span></button>`;
}

function doll(v, rows) {
  const bySlot = {};
  for (const r of rows) bySlot[r.slot] = r;
  let h = '<div class="doll">';
  for (const s of v.slots || []) {
    const r = bySlot[s.id];
    const area = DOLL.includes(s.id) ? ` style="grid-area:${s.id}"` : '';
    const cls = DOLL.includes(s.id) ? ' s-' + s.id : '';
    // слот, для которого у плана ничего нет (вторая рука при самостреле): место остаётся, плитка пустая
    h += r ? itemTile(r, s.name, {cls, area})
      : `<div class="dt none${cls}"${area}><span class="dk">${esc(s.name)}</span></div>`;
  }
  h += '</div>';
  const row = rows.find(r => r.id === openHolder);
  return h + (row ? itemCard(row) : '');
}
// Крестик в правом верхнем углу открытой карточки (вещи или умения) — всегда на одном месте. Пока в карточке
// сравнение с вещью из буфера, он убирает сравнение, и карточка остаётся; без сравнения — закрывает
// карточку, как повторное нажатие на её плитку. Так «ещё раз туда же» закрывает всё. Крестик только
// скрывает: действие с данными (снять предмет) названо словом.
function cardShut(card, copy) {
  return copy
    ? `<button class="mini dclose" data-copydrop data-k="copydrop" aria-label="${T('Убрать сравнение')}" title="${T('Убрать сравнение')}">✕</button>`
    : `<button class="mini dclose" data-shut="${card}" aria-label="${T('Закрыть')}" title="${T('Закрыть')}">✕</button>`;
}
// Открытая карточка надетой вещи (слота)
function itemCard(r) {
  const cur = copyCur(V);
  return `<div class="dopen" data-card="item">${cardShut('item', !!cur && cur.row === r.id)}${holderRow(r)}</div>`;
}

// Умение — карточкой. Первая строка как строка части в слоте: название (как в игре и по-английски),
// уровень камня — мой, актуальный (какой герой уже может носить) и разрыв между ними. Уровень выбирают
// из списка: нажатие по плашке раскрывает под ней уровни от стартового до актуального, текущий выделен,
// «нет» значит, что камня нет. У умения без уровня (встроенного) нажатие по плашке — «взял», по взятому рукой — «не взял».
// Вторая строка — пять равных мест под камни поддержки: зелёное — стоит (нажатие снимает отметку),
// обычное — ещё нет (нажатие — «вставил»), свободное место остаётся пустым.
const SUPPORT_SLOTS = 5;
// План части (лесенка присылает его полем plan): когда она потребуется. Срок подошёл — «к концу шага»,
// прошёл — «опаздываю · N шагов», впереди — акт и карта шага. Мягкая цель сроком не горит.
function planWhen(pl) {
  if (!pl) return null;
  const hot = pl.urgency === 'overdue' || pl.urgency === 'due';
  if (hot && pl.soft) return null;
  if (pl.urgency === 'overdue') return {cls: '', text: lateText(pl.late)};
  if (pl.urgency === 'due') return {cls: ' due', text: T('к концу шага')};
  return pl.needName ? {cls: ' ahead', text: (pl.act ? pl.act + ' · ' : '') + pl.needName} : null;
}
// Картинка камня поддержки лежит рядом со страницей: «sup-» и английское имя без ранга (I, II…),
// строчными, пробелы — дефисы. У рангов одного камня картинка общая. Нет файла — место без картинки.
function supIcon(g) {
  const slug = (splitName(g.title)[1] || '').replace(/\s+[IVX]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return slug
    ? `<img class="gi" src="/icons/sup-${esc(slug)}.webp" alt="" width="26" height="26" onerror="this.style.visibility='hidden'">`
    : '<span class="gi"></span>';
}
function skillRow(r) {
  const k = 'row:' + esc(r.id), b = r.base || {};
  const level = r.parts.find(p => p.key === 'level');   // лесенка уровня камня, если она у умения есть
  const name = g => `<span class="sn">${twoLine(g.title)}</span>`;
  const skill = b.have || b.next || b.later;
  if (!skill) return '';
  // Уровень выбирают из списка, когда лесенка прислала свои ступени. Тогда плашка умения не меняет
  // уровень сама, а раскрывает под собой список; у невзятого умения выбор уровня значит «взял».
  // Умение, чей шаг ещё впереди («позже»), нажимается так же: игрок может опередить план.
  const pick = level && level.rungs && level.rungs.length ? level : null;
  const lk = k + '|level', listOpen = !!pick && openList === lk;
  const caret = pick ? CARET : '';
  const opener = `data-list="${esc(lk)}" aria-expanded="${listOpen}"`;
  let row;
  if (b.have) {
    const has = level && level.have, top = level && level.top, up = level && level.next;
    const behind = top && level.gap ? level.gap : 0;
    // План уровня камня: какой уровень план требует и когда — к концу шага, на сколько шагов опаздываю
    // или к какому шагу впереди (тогда его можно взять с опережением).
    const lp = level && level.plan, lw = planWhen(lp);
    const plan = lw ? `<span class="plate${lw.cls}">${T('по плану {0} ·', esc(lp.level))} ${esc(lw.text)}</span>` : '';
    const cells = `<span class="sn">${twoLine(b.have.title)}${plan}</span>` +
      `<span class="pmine">${level ? `<span class="pact">${T('ур.')}</span> <b class="tr">${has ? esc(has.title) : '—'}</b>` : ''}</span>` +
      `<span class="pbest">${top ? `<span class="pact">${T('сейчас до')}</span> <b class="tr">${esc(top.title)}</b>` : ''}</span>` +
      `<span class="pgap">${behind ? gapBars(behind) : '<span class="g0">✓</span>'}</span>` + caret;
    // в ногу с уровнем героя — зелёная строка, как у части слота
    const cls = 'pline skl' + (behind ? '' : ' in-step') + (listOpen ? ' open' : '');
    row = pick
      ? `<button class="${cls}" ${opener}>${cells}</button>`
      : up
        ? `<button class="${cls}" data-goal="${esc(up.id)}" data-status="2" data-k="${k}">${cells}</button>`
        : byHand(b.have)
          ? `<button class="${cls}" data-goal="${esc(b.have.id)}" data-status="0" data-k="${k}" title="${T('Нажмите, если ещё не сделано')}">${cells}</button>`
          : `<div class="${cls}">${cells}</div>`;
  } else {
    const g = skill;
    // камня ещё нет: уровня тоже нет, а на месте «актуального» — что с ним (срок, опаздываю, позже).
    // «Нет» — тоже отставание от плана, и пишется так же, как у камня ниже плана: какой уровень план
    // уже требует и на сколько шагов опаздываю.
    const lp = level && level.plan && (level.plan.urgency === 'overdue' || level.plan.urgency === 'due') ? level.plan : null;
    const st = r.state === 'overdue' || r.state === 'due' ? r.state : '';
    const label = st
      ? (lp ? `${T('по плану {0} ·', lp.level)} ` : '') + (st === 'due' ? T('к концу шага') : lateText(r.late)) + (g.fact ? ' · ' + g.fact : '')
      : goalLabel(g);
    const cells = name(g) + ('<span class="pmine gnone">' + T('нет') + '</span>') + `<span class="slab cs">${esc(label)}</span>` + caret;
    // умение, чей шаг впереди, — серое, но нажимается: игрок может взять его раньше плана (отметка — «взял»)
    const ahead = !b.next ? ' not-yet' : '';
    row = pick
      ? `<button class="pline skl u-${g.urgency}${ahead}${listOpen ? ' open' : ''}" ${opener}>${cells}</button>`
      : `<button class="pline skl u-${g.urgency}${ahead}" data-goal="${esc(g.id)}" data-status="${b.next && g.find ? 1 : 2}" data-k="${k}">${cells}</button>`;
  }
  // Список уровней: от стартового до актуального (и не короче текущего), текущий выделен. «нет» —
  // камня нет; снять так можно только камень, который отмечали сами: умение от вещи или из дерева
  // восхождения «нет» не бывает. Стартовый уровень приходит вместе с камнем и своей отметки не требует.
  let list = '';
  if (listOpen) {
    const taken = !!b.have;
    list = rungList(pick, k + ':level', taken
      ? {cur: level.have ? level.have.id : null, none: byHand(b.have), drop: skill.id}
      : {cur: null, none: true, take: skill.id, status: b.next && skill.find ? 1 : 2});
  }
  // Место под камень поддержки — тоже лесенка, если камень в нём со временем меняют (Увеличенная
  // область I, с такого-то шага — II): в месте стоит то, что вставлять сейчас; «заменить» значит,
  // что прежний камень ещё на месте. Нажатие на стоящий камень, отмеченный рукой, снимает его отметку.
  // В месте: слева картинка камня (под ней галочка, когда он стоит), справа название и, пока камня
  // нет, что с ним — «нет», «заменить», «позже».
  // Гнездо остаётся коротким: камень и что с ним. Когда и на что его менять — в «Плане» под гнёздами.
  const place = (g, mark, state) => `<span class="gcol">${supIcon(g)}${mark}</span>` +
    `<span class="sn">${twoLine(g.title)}${state ? `<span class="gnone sst">${state}</span>` : ''}</span>`;
  const slots = r.parts.filter(p => p !== level).map(p => {
    const sk = `data-k="${k}:${esc(p.key)}"`;
    if (p.drop && p.have) {
      // камень поддержки со своим шагом «Снять»: на этом шаге его снимают, нажатие — «снято»
      return `<button class="ssl u-due" data-off="${esc(p.drop)}" data-on="1" ${sk} title="${T('Нажмите, когда снимете')}">` +
        `${place(p.have, '', T('снять##камень'))}</button>`;
    }
    if (p.next) {
      const g = p.next;
