const PTS_W = 220, PTS_H = 168;   // размер куска карты в окне, пикселей
let ptsSeen = null;    // время очков (gainAt), на которое окно уже отозвалось
let ptsOpen = false;
let ptsPin = false;    // окно оставлено нажатием: само не закроется
let ptsTimer = null;
let ptsDrawn = '';     // что сейчас нарисовано: без изменений окно не трогаем — полоска времени идёт дальше
let ptsBase = null;    // узлы, взятые до того, как окно открылось: взятое за окно — сверх них
let ptsDoneAt = null;  // когда очки кончились (время страницы, мс): окно доживает PTS_CHECK_SECONDS
let ptsShut = null;    // очки (gainAt), окно которых уже закрыто: после перезагрузки страницы его не открывать
try { ptsShut = Number(localStorage.getItem('ptsShut')) || null; } catch (err) { /* без памяти браузера — откроется снова */ }
const ptsView = {x: 0, y: 0, s: MAP_SCALE, follow: true, fit: false};   // окно его куска карты — своё, не карты блока
// Что даёт каждый узел ({id: [строки]}) на языке страницы: treestats.<язык>.json (строки без перевода в нём
// английские), для английского и при отсутствии файла — treestats.json. Берётся, когда окно открылось впервые.
let nodeLines = null, nodeLinesAsked = false;
function needNodeLines() {
  if (nodeLinesAsked) return;
  nodeLinesAsked = true;
  const get = url => fetch(url).then(r => (r.ok ? r.json() : null), () => null);
  (I18N.lang === 'en' ? get('/treestats.json') : get('/treestats.' + I18N.lang + '.json').then(d => d || get('/treestats.json')))
    .then(d => { nodeLines = d || {}; if (!V) return; if (OV) ovRender(V); else if (ptsOpen) ptsUpdate(V); })
    .catch(() => { nodeLines = {}; });
}
function ptsClose() {
  if (ptsOpen && ptsSeen) {
    // эти очки окно уже показало: после перезагрузки страницы оно не вернётся
    ptsShut = ptsSeen;
    try { localStorage.setItem('ptsShut', String(ptsSeen)); } catch (err) { /* без памяти браузера — до перезагрузки */ }
  }
  ptsOpen = ptsPin = false;
  ptsDrawn = '';

    wayUpdate(v);
    cmpUpdate(v);
    shutCheck(v);
    // окна ответа стоят столбиком, новое сверху; имя клавиши «Закрыть» — на крестике верхнего (popPlace)
    popPlace();
    popsShown().forEach((id, i) => { document.getElementById(id).style.order = i; });
  } else {
    // свёрнутый список: имена не вошли в свои строки — первые по порядку уходят в число, пока не войдут
    for (let drop = 0; ; drop++) {
      const html = Q(ovListHtml(v, drop));
      if ($('#app').innerHTML !== html) $('#app').innerHTML = html;
      const fold = $('#ovl .ovf');
      if (!fold || fold.scrollHeight <= fold.clientHeight + 1 || !fold.querySelector('.ovc')) break;
    }
    tick();
    // пока что-то доживает свои секунды — перерисовать, когда уйдёт первое (и вести полоски)
    clearTimeout(ovTimer);
    if (Object.keys(ovDone).length) ovTimer = setTimeout(() => { if (V) ovRender(V); }, 500);
  }
  ovReport();
}
if (OV) {
  // что зовёт программа: зажат ли Alt над окном, нажатие и движение мыши (точки окна, как у события мыши)
  let ovOver = null;       // кнопка ответа, над которой сейчас курсор (у окна нет своей мыши — подсветку ставим сами)
  const ovArmShow = () => document.documentElement.classList.toggle('ov-armed', ovKey);
  ovArmShow();
  // level: 0 — клавиша не зажата; 1 — зажата (рамка: окно слушает мышь); 2 — зажата и курсор над окном (список раскрыт
  // целиком, по строкам можно нажимать)
  window.ovArm = level => {
    level = level === true ? 2 : Number(level) || 0;
    const key = level >= 1, on = level >= 2;
    if (key === ovKey && on === ovArmed) return;
    ovKey = key;
    ovArmed = on;
    if (!on) { ovHot = null; if (ovOver) ovOver.classList.remove('ov-hov'); ovOver = null; }
    ovArmShow();
    if (V) ovRender(V);
  };
  // сколько строк имён входит в свёрнутый список под кнопками дерева игры: считает программа по высоте окна игры
  window.ovRoom = n => {
    n = Math.max(1, Math.min(2, Number(n) || 1));
    if (n === ovFoldRows) return;
    ovFoldRows = n;
    document.documentElement.style.setProperty('--ovk', n);
    if (V) ovRender(V); else ovReport();
  };
  window.ovClick = (x, y) => { const el = document.elementFromPoint(x, y); if (el) el.click(); return !!el; };
  window.ovHover = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (OV === 'answer') {
      const hit = el && el.closest('button,[data-k],summary,a');
      if (hit !== ovOver) { if (ovOver) ovOver.classList.remove('ov-hov'); ovOver = hit || null; if (ovOver) ovOver.classList.add('ov-hov'); }
      return;
    }
    const hit = el && el.closest('button[data-ov]'), id = hit ? hit.dataset.ov : null;
    if (id !== ovHot) { ovHot = id; if (V) ovRender(V); }
  };
  window.addEventListener('pywebviewready', () => { ovSent = ''; ovReport(); });
  // язык и «время скрыто» выбирают в окне программы — окно поверх игры берёт их при загрузке: сменили — загрузиться заново
  window.addEventListener('storage', e => { if (e.key === LANG_KEY || e.key === 'timeHidden') location.reload(); });
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => ovReport());
    for (const id of ['app', 'cmp', 'way', 'pts']) ro.observe(document.getElementById(id));
  }
}

function render() {
  const v = V;
  if (!v) return;
  if (OV) { ovRender(v); return; }
  // вкладка называется именем плана: «HC SSF · DoV — PoE2 Runbook» (в самом названии плана бывает « · »)
  const tabName = (v.planTitle ? v.planTitle + ' — ' : '') + TOOL;
  if (document.title !== tabName) document.title = tabName;
  const z = v.zone, s = v.step;
  // раскрытые блоки остаются раскрытыми после перерисовки
  const keepOpen = new Set([...document.querySelectorAll('details[data-keep][open]')].map(d => d.id));
  // Новая вещь из буфера страницу не трогает: ни прокрутки, ни раскрытой карточки (их просьба 2026-11-24 — после копии
  // приходилось закрывать сравнение, карточку и мотать наверх). Ответ — в окне сравнения поверх страницы (cmpUpdate).
  let h = '';
  // Шапка — только то, что сказал лог игры; из плана в ней ничего нет. Вид зоны (город или её уровень) — при
  // названии зоны; герой — своей строкой: имя, класс, вознесение (когда взято), уровень. Режим программы («Игра ·
  // Редактор») и язык — в шапке программы над ней (appBar), как в редакторе плана.
  const runTip = z && v.run && v.run.started ? ` title="${esc((T('в игре с') + ' ') + dayTime(v.run.started))}"` : '';
  // Окна поверх игры (есть только у окна программы): список шага и ответ на копию — прямо в игре. Включают и
  // настраивают их в окне «Настройки» (шапка программы); здесь от них — только подсказка, как по ним нажимать.
  const ovOn = !!(v.overlay && v.overlay.can && v.overlay.on);
  // Клавиши программы в игре, у которых нет своей кнопки: «Сравнить» (программа сама копирует предмет под курсором; та
  // же клавиша по тому же предмету ещё раз — «Надеть», она нарисована в кнопке окна сравнения) и «Программа ↔ игра»;
  // рядом — как нажимать по окнам поверх игры. Клавишу держит другая программа — она красная.
  const keyTip = name => { const k = v.keys && v.keys[name]; return !k || !k.key ? '' : k.state === 'busy' ? T('{0} занята другой программой', k.key) : ''; };
  const keyCap = name => { const k = v.keys && v.keys[name]; return `<i class="kk${k.state === 'busy' ? ' off' : ''}">${esc(k.key)}</i>`; };
  const keyHas = name => !!(v.keys && v.keys[name] && v.keys[name].key);
  const cmpKey = keyHas('wear') && v.keys.wear.copy;      // «Сравнить» — та же клавиша, что «Надеть» (F2)
  const ovKeys = (cmpKey || keyHas('app') || ovOn) ? '<div class="tkeys">' +
    (cmpKey ? `<span title="${esc(keyTip('wear') || T('Сравнить предмет под курсором с надетым: программа сама копирует его в игре и возвращает буфер обмена. Та же клавиша по тому же предмету ещё раз — «Надеть»'))}">${keyCap('wear')}${T('сравнить')}</span>` : '') +
    (keyHas('app') ? `<span title="${esc(keyTip('app') || T('Окно программы — вперёд, и обратно в игру'))}">${keyCap('app')}${T('программа ↔ игра')}</span>` : '') +
    (ovOn ? `<span title="${esc(T('Окна поверх игры мышь не ловят: нажатие проходит в игру. С зажатым Alt по ним можно нажимать'))}"><i class="kk">Alt</i>${T('+ нажатие — отметить')}</span>` : '') +
    '</div>' : '';
  h += `<div class="top"><div><div class="zname">${z ? esc(z.name) + `<span class="zkind">${z.town ? T('город') : zoneWord(z.level)}</span>` : T('Жду лог игры')}</div>` +
    `<div class="zmeta"${runTip}>${z ? heroLine(v.hero) : T('герой ещё не найден в логе')}</div>` +
    `${z ? xpLine(v) : ''}</div>` +
    // время скрыто (окно «Настройки») — под названием зоны только подсказки клавиш; иначе — часы и «Пауза» под ними
    `<div class="timers">` + (timeHidden ? ovKeys
      : `<div class="t-run${v.run.held ? ' held' : ''}" id="t-run" title="${T('Чистое время игры: без времени, когда героя нет в игре, и без пауз')}"></div>` +
        `<div class="t-zone" id="t-zone"></div>` +
        (v.run.started ? '<div class="tctl">' + (v.run.held
          ? `<button class="mini go" data-hold="0" data-k="hold" title="${T('Время снова пойдёт. Оно пойдёт и само, когда вы зайдёте в боевую зону')}">${T('Продолжить')}</button>`
          : `<button class="mini" data-hold="1" data-k="hold" title="${T('Пауза: время героя и шага стоит, пока вы не нажмёте «Продолжить» или не зайдёте в боевую зону. Город и убежище паузу не снимают')}">${T('Пауза')}</button>`) + '</div>' : '') +
        ovKeys) +
    '</div></div>';
  // Плитки времени — сразу под шапкой, всегда на одном месте: выше них ничего не появляется и не
  // пропадает. В блоке «Маршрут» они прилипали к полоске шагов и мешали её находить.
  if (v.time && !timeHidden) h += `<div class="ttime" id="ttime">${timeTiles(v, tickMore(v))}</div>`;
  // Под ними — одна строка состояния: слева фильтр игры, справа — читается ли лог.
  const [frow, fbody] = filterLine(v);
  h += `<div class="srow">${frow}${statusLine(v)}</div>${fbody}`;
  // Порядок сверху вниз: предупреждения, маршрут (цели карты — на них смотрят, входя в зону),
  // сразу за ним состояние забега — инвентарь (надето, умения): с ним работают постоянно,
  // поэтому между маршрутом и инвентарём ничего нет.
  // То, по чему опаздываем, — не здесь, а плашками в блоке «Опаздываю» панели маршрута (и на плитках слотов);
  // пропущенное на пройденных картах (боссы, награды) — в блоке «Пропущено».
  // Уровни одного героя идут подряд: скачок значит, что в этот забег пишутся события другого героя.
  if (v.stranger) {
    h += `<div class="alert">${T('Уровень {0} после {1} — играет другой герой?', v.stranger.level, v.stranger.after)} ` +
      `<button class="mini" data-ctx="open">${T('Выбрать героя')}</button></div>`;
  }
  if (v.ready.length) {
    h += `<div class="alert ready">${T('Уровень {0} — взять:', v.hero.level)} ` +
      `${v.ready.map(g => esc(fullName(g)) + (g.fact ? ' (' + esc(g.fact) + ')' : '')).join(', ')}</div>`;
  }
  const stash = v.stash || [];
  // Цели, которые скрывает фильтр, — не отдельной красной строкой здесь, а в строке фильтра («скрывает N целей»).
  if (v.planError) h += `<div class="warn">${esc(v.planError)}</div>`;
  if (v.planProblems && v.planProblems.length) h += `<div class="warn">${T('В плане:')} ${v.planProblems.map(esc).join('; ')}</div>`;
  // база знаний о путевых камнях разошлась с данными игры (после патча): ответу по камню верить нельзя
  if (v.wayProblems && v.wayProblems.length) h += `<div class="warn">${v.wayProblems.map(esc).join('; ')}</div>`;
  // Забег перешёл на другой шаг — просмотр чужого шага сбрасывается, и полоска шагов возвращается к текущему.
  if (lastPos !== v.pos) { peek = null; stripFrom = null; lastPos = v.pos; }
  // Блок «Маршрут»: полоска шагов переключает только карточку шага внутри этого блока. Пока полоску листали
  // (многоточиями по её краям), у заголовка стоит кнопка «к текущему»: вплотную к нему, над началом полоски.
  // Заход на карту шага впереди: её карточка встаёт на место текущей сразу (если игрок сам не смотрит
  // другой шаг и не убрал её). Кнопка смены шага с отсчётом есть всё время, пока заход длится.
  const pend = v.pending && v.pending.id ? (v.cards || []).find(c => c.id === v.pending.id) : null;
  if (!v.pending) pendOff = null;
  const arriving = !peek && pend && pendOff !== v.pending.at ? pend : null;
  const shown = peek ? (v.cards || []).find(c => c.id === peek) : arriving;
  showId = shown ? shown.id : null;
  const goBtn = pend ? `<button class="mini go" data-move="${esc(pend.id)}" data-k="move">${T('Сменить шаг ·')} <span id="t-pend"></span></button>` : '';
  // та же кнопка под карточкой, когда карточка новой карты убрана или смотрят другой шаг
  const pendLine = !v.pending ? ''
    : `<p class="sub pend">${T('Вы на карте «{0}»', esc(pend ? pend.name : v.pending.name))} ${goBtn || (T('шаг сменится через') + ' <span id="t-pend"></span>')}` +
      `${pend ? (' <button class="mini" data-pendoff="show">' + T('показать её') + '</button>') : ''}</p>`;
  h += `<div class="panel" id="s-route"><div class="ptitle"><span>${T('Маршрут')}` +
    `${stripFrom != null ? `<button class="mini" data-strip="">${T('к текущему')}</button>` : ''}</span>` +
    `<span>${v.pos != null ? (T('шаг') + ' ') + (v.pos + 1) + (' ' + T('из') + ' ') + v.route.length : ''}</span></div>`;
  h += routeStrip(v);

  if (shown && shown === arriving) {
    // Карточка выглядит как у текущего шага (точки — «активировать», смена фильтра — действием):
    // игрок уже стоит на этой карте. Рамка сплошная, цвета акцента, — в отличие от просмотра чужого шага.
    h += `<div class="pstep peeking here"><div class="sthead"><span><span class="stpre">${T('Вы на карте')}</span>` +
      `<span class="stname">${esc(shown.name)}</span></span><span class="stmeta">${goBtn} ` +
      `<button class="mini" data-pendoff="hide">${T('к текущему')}</button></span></div>` +
      `${stepBody(Object.assign({}, shown, {state: 'current'}), false)}</div>`;
    h += lateBlock(v) + missedBlock(v);
  } else if (shown) {
    h += `<div class="pstep peeking"><div class="sthead"><span><span class="stpre">${T('Просмотр шага')}</span>` +
      `<span class="stname">${esc(shown.name)}</span></span><span class="stmeta">` +
      `<button class="mini" data-peek="">${T('к текущему')}</button> ` +
      `<button class="mini" data-move="${esc(shown.id)}" data-k="move" title="${T('Если страница ошиблась с шагом')}">${T('сделать текущим')}</button>` +
      `</span></div>${stepBody(shown, true)}${pendLine}</div>`;
    h += lateBlock(v) + missedBlock(v);
  } else if (s && !v.beyond) {
    // Заголовок шага: слева — его имя, справа — кнопка «☐ Шаг пройден → Замок Огам»: сначала действие (закрыть шаг) с
    // пустым квадратиком, как у целей, которые отмечают нажатием, за стрелкой — куда оно переведёт. Одно «Дальше: Замок
    // Огам» читалось как справка или переход посмотреть, как в крошках маршрута, а «✓ Шаг пройден» — как уже отмеченное
    // (их замечания 2026-11-24). Что мы в городе, сказано в шапке
    // страницы. Фильтр шага здесь не повторяется: «Фильтр ✓ …» — в строке состояния над маршрутом, а сменить его —
    // плашка в блоке «Сменить».
    // «Шаг пройден»: игрок знает, что закончил шаг (на сегодня или до похода в убежище), и хочет видеть следующий: шаг
    // сменится сразу, не дожидаясь входа в его зону; несделанное на этом шаге загорится опозданием.
    // Строки «Дальше» внизу карточки нет (их замечание 2026-11-24): ею не пользовались — внизу её не видно, и она
    // читалась как часть текущего шага; счёт боссов и целей не нужен — после нажатия карточка покажет их все сама.
    const nxt = (v.cards || [])[v.pos + 1];
    const nxtTip = T('Шаг сделан — показать следующий: «{0}». Время этого шага остановится, несделанное на нём загорится опозданием', nxt ? nxt.name : '') +
      (nxt && nxt.event ? ' ' + T('Шаг наступит сам, когда возьмёте {0} узел восхождения', ascNode(nxt.event)) : '');
    // Шаг сменился — кнопка проявляется не сразу (NX_WAIT, .stmeta.fresh): второй клик двойного нажатия иначе закрыл бы и
    // следующий шаг. На шаге отмечено всё — кнопка залита и трижды вспыхивает (.all). Анимации идут от своего момента,
    // а не от перерисовки: страница перерисовывается на каждую строку лога.
    if (s.id !== stepSeenId) { stepSeenId = s.id; stepSeenAt = Date.now(); }
    const fresh = Date.now() - stepSeenAt;
    // проявление кончилось — перерисовать уже без него: во вкладке, которую не видно, анимации стоят, и кнопка иначе
    // осталась бы прозрачной
    clearTimeout(nxTimer);
    if (fresh < NX_FADE) nxTimer = setTimeout(() => render(), NX_FADE - fresh + 30);
    const todo = stepLeft(s);
    const all = todo.marks > 0 && todo.open === 0;
    if (!all) stepAllId = null;
    else if (stepAllId !== s.id) { stepAllId = s.id; stepAllAt = Date.now(); }
    const glow = all ? ` style="animation-delay:-${Date.now() - stepAllAt}ms"` : '';
    const doneBtn = nxt ? `<span class="stmeta${fresh < NX_FADE ? ' fresh' : ''}"${fresh < NX_FADE ? ` style="animation-delay:-${fresh}ms"` : ''}>` +
      `<button class="mini go nx${all ? ' all' : ''}" data-move="${esc(nxt.id)}" data-k="move"${glow} ` +
      `title="${esc(nxtTip)}"><span class="nxb" aria-hidden="true"></span>${T('Шаг пройден')}` +
      `<span class="nxn"> → ${esc(nxt.name)}</span></button></span>` : '';
    h += `<div class="pstep"><div class="sthead"><span class="stname">${esc(s.name)}</span>${doneBtn}</div>`;
    h += stepBody(s);
    if (v.pending) h += pendLine;
    else if (!v.run.paused && !v.onStep && !z.town && v.fieldZone) h += `<p class="sub">${T('Сейчас вы в зоне «{0}», она не из этого шага', esc(v.fieldZone))}</p>`;
    h += '</div>';
    h += lateBlock(v) + missedBlock(v);
  } else if (z) {
    h += ('<div class="pstep"><p class="empty">' + T('Этой зоны нет в плане') + '</p>') +
      `${s ? `<p class="sub">${T('Последний шаг плана:')} ${esc(s.name)}</p>` : ''}</div>`;
    h += lateBlock(v) + missedBlock(v);
  }
  h += '</div>';
  // Между маршрутом и инвентарём ничего нет: инвентарь идёт сразу за маршрутом,
  // чтобы между ними не приходилось прокручивать страницу.
  // Всё, что ниже, от выбранного шага не зависит: это состояние всего забега.
  h += ('<div class="divider"><span>' + T('Текущее состояние героя') + '</span></div>');

  // Носители: слоты и умения, у каждого база и части (цели по статам, поддержки, уровень камня).
  const mine = v.holders || [];
  // Слоты — схемой, как в окне снаряжения игры: длинного списка нет, раскрыт только выбранный слот.
  // Подсказок «нажмите…» в заголовках и под плитками нет: плитка и так выглядит кнопкой, а лишняя
  // строка — это шум, который приходится перечитывать при каждом взгляде.
  // Скопированная вещь, которой в плане нет места (чужой класс, снятая вещь), — в окне сравнения (cmpUpdate), как и
  // любая копия: страницу копия не трогает.
  // Буфер обмена не читается (ошибка при запуске) — сказать об этом здесь же: копии вещей не придут.
  const clipBad = v.clip && v.clip !== 'on' && v.clip !== 'off' ? `<div class="warn">${esc(v.clip)}</div>` : '';
  h += `<section id="s-gear"><h2><span>${T('Надето')}</span></h2>` + clipBad + doll(v, mine.filter(r => r.slot));
  // Рюкзака нет: в схеме — то, что надето на деле, а вещь следующего периода — цель «позже» на своём шаге.
  h += '</section>';
  // Умения — одним блоком: сначала те, что уже можно брать, за ними серыми — умения, которые придут
  // позже (после вознесения). Отдельной второй копии для будущих нет.
  const skills = mine.filter(r => !r.slot).concat(stash.flatMap(st => (st.rows || []).filter(r => !r.slot)));
  if (skills.length) {
    h += `<section id="s-skills"><h2><span>${T('Умения')}</span></h2>` + skillTiles(skills) + '</section>';
  }
  // Дерево и под ним атлас — открытыми блоками сразу за умениями: порядок страницы — маршрут, инвентарь,
  // умения, дерево, атлас. Блок атласа есть, когда у этапа билда названа версия атласа.
  h += treeBlock(v) + atlasBlock(v);
  // Списков всех целей по группам («Боссы», «Награды»…), «Снято после…» и журнала на странице нет (с 2026-11-22): во
  // время игры в них не смотрят, а план целиком — в редакторе. Нужное сейчас — на карточке шага, в «Опаздываю» и
  // «Пропущено». Каким героем идёт игра и по какому плану — в шапке, слева (список героев и планов).
  h += `<p class="foot">${esc(v.planTitle)}</p>`;
  $('#app').innerHTML = Q(h);
  CTX.data = {plans: v.plans, heroes: v.runs};
  $('#hbar').innerHTML = Q(appBar() + `<div class="in">${sectionNav()}</div>`);
  ctxPaint();
  headPad();
  navSpy();
  tick();
  wayUpdate(v);
  ptsUpdate(v);
  cmpUpdate(v);
  shutCheck(v);
  popPlace();
  tilePop(v);  // окно плитки времени, над которой стоит курсор, — с новыми числами
  drawMap();   // карта дерева рисуется в уже вставленный блок: ей нужна его ширина
}

function tick() {
  if (!V) return;
  const now = Date.now() / 1000 + skew;
  const r = $('#t-run'), zt = $('#t-zone');
  // Таймер забега — чистое время: без отрезков, когда героя не было в игре (экран персонажей, игра
  // закрыта). Программа присылает его на момент V.now; пока герой в игре, страница досчитывает сама.
  const more = V.run.paused ? 0 : Math.max(0, now - V.now);
  if (r) r.textContent = !V.run.started ? '' : dur(V.run.active == null ? now - V.run.started : V.run.active + more);
  if (zt) zt.textContent = V.run.held ? T('пауза') : V.run.paused ? T('вне игры') : V.zone ? (T('здесь') + ' ') + dur(now - V.zone.since) : '';
  // плитки времени идут вживую: и числа, и цвет (шаг может стать жёлтым между строками лога)
  const tm = $('#ttime');
  if (tm && V.time) tm.innerHTML = timeTiles(V, more);
  const tp = $('#t-pend');
  if (tp && V.pending) tp.textContent = Math.max(0, Math.ceil(V.pending.at - now)) + ' ' + T('с##секунды');
  // окно поверх игры: время шага в строке шага идёт вживую
  const ot = $('#ov-t');
  if (ot) ot.outerHTML = ovTime(V);
}

function send(body, el) {
  const key = el.dataset.k || JSON.stringify(body), now = Date.now();
  if (lock[key] && now - lock[key] < 700) return;
  lock[key] = now;
  el.classList.add('busy');
  fetch('/api/mark', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .catch(() => {})
    .finally(() => el.classList.remove('busy'));
}

document.addEventListener('click', e => {
  // что фильтр показывает на этом уровне зоны: список под строкой состояния открывается и закрывается нажатием
  if (e.target.closest('[data-toggle="facts"]')) { factsOpen = !factsOpen; render(); return; }
  const ha = e.target.closest('[data-hattr]');
  if (ha && heroPick && treeGeo) {
    // атрибут взятого узла «Характеристика» у героя: уходит программе и запоминается в забеге
    send({pick: {node: treeGeo.nodes[heroPick.i][0], attr: ha.dataset.hattr || null}}, ha);
    heroPick = null;
    render();
    return;
  }
  const af = e.target.closest('[data-afrom]');
  if (af && V && V.atlas) {
    // чей атлас продолжает герой: тот же, что у героя другого забега, или новый — слово игрока, хранится
    // в забегах (runs/atlas.json); тот же ответ ещё раз ничего не меняет — вопрос просто закрывается
    const id = af.dataset.afrom;
    const same = V.atlas.from === id || (id !== '' && (V.atlas.offers || []).some(o => o.run === id && o.on));
    if (!same) send({atlasFrom: {run: id}}, af);
    atlasAsk = false;
    render();
    return;
  }
  if (e.target.closest('[data-atlasask]')) { atlasAsk = !atlasAsk; atlasMark = null; render(); return; }
  const atr = e.target.closest('[data-atree]');
  if (atr) {
    // название дерева в строке под картой атласа: карта показывает это дерево и следует за его узлами;
    // плашка атласа в «Опаздываю» (data-ago) — то же и прокрутка к блоку «Атлас»
    useMap('atlas');
    Object.assign(mapView, {tree: +atr.dataset.atree, follow: true, fit: false});
    render();
    const box = atr.hasAttribute('data-ago') && document.querySelector('.tmap[data-kind="atlas"]');
    if (box) box.closest('section').scrollIntoView({behavior: 'smooth', block: 'start'});
    return;
  }
  const am = e.target.closest('[data-amark]');
  if (am && atlasMark && atlasGeo) {
    // узел атласа взят до героя — отметка игрока на карте (или снять её)
    send({atlasHad: {node: atlasGeo.nodes[atlasMark.i][0], on: am.dataset.amark === 'on'}}, am);
    atlasMark = null;
    render();
    return;
  }
  const mb = e.target.closest('[data-map]');
  if (mb) {
    // кнопки карты: к следующим узлам, всё дерево, мельче, крупнее — у той карты, на которой нажали
    const k = mb.dataset.map;
    useMap((mb.closest('.tmap') || {dataset: {}}).dataset.kind);
    if (k === 'follow') { mapView.follow = true; mapView.fit = false; }
    else if (k === 'fit') { mapView.fit = true; mapView.follow = false; }
    else {
      mapView.follow = mapView.fit = false;
      mapView.s = Math.max(MAP_MIN, Math.min(MAP_MAX, mapView.s * (k === 'in' ? 1.35 : 1 / 1.35)));
    }
    render();
    return;
  }
  const sp = e.target.closest('[data-strip]');
  if (sp && V) {
    // «…» в полоске шагов листает её на семь шагов в свою сторону; «к текущему» у заголовка возвращает на место.
    // Долистали обратно до текущего шага — полоска снова следует за ним
    const at = sp.dataset.strip === '' ? null : Number(sp.dataset.strip);
    stripFrom = at === stripHome(V) ? null : at;
    render();
    return;
  }
  // Вещь из буфера: «Надеть» ставит отметки слота по вещи; ✕ убирает её со страницы, ничего не отмечая.
  const wr = e.target.closest('[data-wear]');
  if (wr) { send({wear: {row: wr.dataset.wear}}, wr); return; }
  const fg = e.target.closest('[data-forget]');
  if (fg) { send({wear: {forget: fg.dataset.forget}}, fg); return; }
  const cd = e.target.closest('[data-copydrop]');
  if (cd) {
    send({wear: {drop: true}}, cd);
    // крестик окна сравнения: окно уходит сразу, не дожидаясь ответа программы
    if (cd.closest('#cmp')) { cmpGone = cmpKey; cmpClose(); popPlace(); }
    return;
  }
  // «НАДЕТО» в окне сравнения: крестик только скрывает окно
  if (e.target.closest('[data-cmpclose]')) { cmpGone = cmpKey; cmpClose(); popPlace(); return; }
  const cr =e.target.closest('[data-copyrow]');
  if (cr && V && V.copy) {
    // у кольца слотов два: показать вещь против другого; программа запоминает выбор — в этот слот наденет и клавиша
    // «Надеть» в игре. В карточке слота она переходит на выбранное кольцо; в окне сравнения карточек не трогаем.
    copyRow = {at: V.copy.at, row: cr.dataset.copyrow};
    send({wear: {choose: cr.dataset.copyrow}}, cr);
    openList = null;
    if (!cr.closest('#cmp')) {
      openHolder = cr.dataset.copyrow;
      try { localStorage.setItem('openHolder', openHolder); } catch (err) { /* без памяти браузера просто не запомним */ }
    }
    render();
    return;
  }
  // «Снять»: умение (камень поддержки) снимают на шаге, где план его снимает; на зелёной плашке «снято» — вернуть
  const of = e.target.closest('[data-off]');
  if (of) { send({off: {goal: of.dataset.off, on: of.dataset.on !== '0'}}, of); return; }
  const m =e.target.closest('[data-move]');
  if (m) {
    // «Шаг пройден» только что сменил шаг: кнопка следующего ещё проступает — второй клик двойного нажатия не в счёт
    if (m.classList.contains('nx') && Date.now() - stepSeenAt < NX_WAIT) return;
    peek = null;
    send({moveTo: m.dataset.move}, m);
    return;
  }
  // «Пауза» / «Продолжить»: время героя и шага стоит
  const ho = e.target.closest('[data-hold]');
  if (ho) { send({hold: ho.dataset.hold === '1'}, ho); return; }
  const ps = e.target.closest('details.plan > summary');
  if (ps) {
    // «План» в карточке: раскрыть или свернуть. Состояние держит страница (planOpen), а не сам блок:
    // так нажатие срабатывает сразу, не дожидаясь события toggle, и перерисовка его не теряет.
    e.preventDefault();
    const card = ps.parentElement.dataset.card;
    planOpen[card] = !planOpen[card];
    render();
    return;
  }
  const sh = e.target.closest('[data-shut]');
  if (sh) {
    // крестик в углу карточки: закрыть её, как повторное нажатие на её плитку (и свернуть её «План»)
    openList = null;
    if (sh.dataset.shut === 'skill') {
      openSkill = cardSwitch('skill', openSkill, openSkill);
      try { localStorage.setItem('openSkill', ''); } catch (err) { /* без памяти браузера просто не запомним */ }
    } else {
      openHolder = cardSwitch('item', openHolder, openHolder);
      try { localStorage.setItem('openHolder', ''); } catch (err) { /* без памяти браузера просто не запомним */ }
    }
    render();
    return;
  }
  if (e.target.closest('details.how > summary')) {
    // «Как сделать» в карточке слота — так же, как «План»: состояние у страницы (howOpen)
    e.preventDefault();
    howOpen = !howOpen;
    render();
    return;
  }
  const o = e.target.closest('[data-open]');
  if (o) {
    // плитка вещи: раскрыть её под схемой; та же плитка ещё раз — закрыть (и свернуть её «План»). Плитка слота, с
    // которым сейчас сравнивают вещь из буфера: сравнение со всеми подробностями — в карточке, окно сравнения уходит
    const cur = copyCur(V);
    if (cur && cur.row === o.dataset.open && cmpKey === 'c' + V.copy.at) { cmpGone = cmpKey; cmpShown = null; cmpClose(); }
    openList = null;
    openHolder = cardSwitch('item', openHolder, o.dataset.open);
    try { localStorage.setItem('openHolder', openHolder || ''); } catch (err) { /* без памяти браузера просто не запомним */ }
    render();
    return;
  }
  const lv = e.target.closest('[data-list]');
  if (lv) {
    // плашка части (уровень камня): раскрыть под ней список ступеней; ещё раз — закрыть
    openList = openList === lv.dataset.list ? null : lv.dataset.list;
    render();
    return;
  }
  const ch = e.target.closest('[data-set]');
  if (ch) {
    // Выбор в списке ступеней: лесенка встаёт на эту ступень одним запросом, отметки выше снимаются.
    // Стартовый уровень камня приходит вместе с камнем — отметки у него нет, поэтому «до него» значит
    // «снять все». «нет» у взятого умения снимает и сам камень; уровень у невзятого заодно его берёт.
    const d = ch.dataset;
    const body = {chain: d.chain.split(',').filter(Boolean), to: d.set && d.set !== d.start ? d.set : null};
    if (!d.set && d.drop) body.drop = d.drop;
    if (d.set && d.take) body.take = {goal: d.take, status: Number(d.takeStatus)};
    openList = null;
    send({set: body}, ch);
    render();
    return;
  }
  const sk = e.target.closest('[data-skill]');
  if (sk) {
    // плитка умения: раскрыть его под плитками; та же плитка ещё раз — закрыть (и свернуть его «План»)
    openList = null;
    openSkill = cardSwitch('skill', openSkill, sk.dataset.skill);
    try { localStorage.setItem('openSkill', openSkill || ''); } catch (err) { /* без памяти браузера просто не запомним */ }
    render();
    return;
  }
  const po = e.target.closest('[data-pendoff]');
  if (po) {
    // карточка карты, на которую зашли: убрать до конца этого захода («к текущему») или вернуть
    pendOff = po.dataset.pendoff === 'hide' && V && V.pending ? V.pending.at : null;
    peek = null;
    render();
    return;
  }
  const p = e.target.closest('[data-peek]');
  if (p) {
    const id = p.dataset.peek;
    const current = V && V.step && !V.beyond ? V.step.id : null;
    peek = !id || id === current ? null : id;
    if (!id) stripFrom = null;      // «к текущему» на карточке возвращает к текущему шагу и полоску
    if (V && V.pending) {
      // во время захода: нажатие на текущий шаг показывает его карточку, на саму новую карту — её
      if (!id || id === current) pendOff = V.pending.at;
      else if (id === V.pending.id) { pendOff = null; peek = null; }
    }
    render();
    return;
  }
  const b = e.target.closest('[data-goal]');
  if (b) send({goal: b.dataset.goal, status: Number(b.dataset.status)}, b);
});
// Карту дерева таскают мышью: окно сдвигается и перестаёт само следовать за следующими узлами
// (вернуть — кнопкой «к следующим»). При движении перерисовывается только карта, не вся страница.
let mapDrag = null;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !e.target.closest || !e.target.closest('.mbox')) return;
  mapDrag = {x: e.clientX, y: e.clientY, moved: false, kind: (e.target.closest('.tmap') || {dataset: {}}).dataset.kind || 'tree'};
});
document.addEventListener('pointermove', e => {
  if (!mapDrag) return;
  const dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
  if (!mapDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  mapDrag.moved = true;
  mapDrag.x = e.clientX;
  mapDrag.y = e.clientY;
  useMap(mapDrag.kind);
  mapView.follow = mapView.fit = false;
  mapView.x -= dx / mapView.s;
  mapView.y -= dy / mapView.s;
  drawMap(mapDrag.kind);
});
document.addEventListener('pointerup', e => {
  const drag = mapDrag;
  mapDrag = null;
  if (drag && drag.moved) { render(); return; }   // кнопки «к следующим» и «всё дерево» гаснут
  // нажатие без сдвига карты на карте дерева героя — по взятому узлу «Характеристика»: каким атрибутом его считать
  if (drag && drag.kind === 'tree') {
    const box = $('.tmap[data-kind="tree"] .mbox');
    if (box) {
      const r = box.getBoundingClientRect();
      heroPickClick(e.clientX - r.left, e.clientY - r.top, box.clientWidth, box.clientHeight);
    }
  }
  // на карте атласа — по невзятому узлу: отметить его взятым до героя (или снять свою отметку)
  if (drag && drag.kind === 'atlas') {
    const box = $('.tmap[data-kind="atlas"] .mbox');
    if (box) {
      const r = box.getBoundingClientRect();
      atlasMarkClick(e.clientX - r.left, e.clientY - r.top, box.clientWidth, box.clientHeight);
    }
  }
});
document.addEventListener('keydown', e => {
  // Esc закрывает меню узла на карте: «Характеристика» у дерева героя, отметка у атласа
  if (e.key === 'Escape' && (heroPick || atlasMark)) { heroPick = atlasMark = null; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tile')) {
    e.preventDefault();
    e.target.click();
  }
  // Esc — как клавиша «Закрыть» в игре: убирает верхнее окно поверх страницы, следующее нажатие — следующее
  if (e.key === 'Escape') popTopClose();
});
// Окно путевого камня: крестик закрывает, нажатие в любом другом его месте оставляет окно до крестика.
$('#way').addEventListener('click', e => {
  if (e.target.closest('[data-wayclose]')) { wayClose(); popPlace(); return; }
  if (!wayOpen || wayPin) return;
  wayPin = true;
  clearTimeout(wayTimer);
  wayTimer = null;
  $('#way').classList.add('pin');
});
// Окно новых очков дерева — так же: крестик закрывает, нажатие в другом его месте оставляет окно до крестика (пока очки
// не потрачены, само оно и так не уходит; потом — не уйдёт и через PTS_CHECK_SECONDS).
$('#pts').addEventListener('click', e => {
  if (e.target.closest('[data-ptsclose]')) { ptsClose(); popPlace(); return; }
  if (!ptsOpen || ptsPin) return;
  ptsPin = true;
  clearTimeout(ptsTimer);
  ptsTimer = null;
  $('#pts').classList.add('pin');
});
// Окно открылось, закрылось или стало другой высоты (картинка вещи догрузилась) — окна под ним сдвигаются.
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => popPlace());
  for (const id of POPS) ro.observe(document.getElementById(id));
}

// Окно плитки времени: курсор над плиткой — окно под ней; ушёл с плитки или из окна программы — окна нет.
document.addEventListener('pointermove', e => {
  const tt = e.target.closest ? e.target.closest('.tt[data-tk]') : null, k = tt ? tt.dataset.tk : null;
  if (k === tileOver) return;
  tileOver = k;
  tilePop(V);
});
document.documentElement.addEventListener('pointerleave', () => { if (tileOver) { tileOver = null; tilePop(V); } });
RV.boxes();

function connect() {
  const es = new EventSource(langUrl('/api/events'));
  es.onmessage = e => {
    V = JSON.parse(e.data);
    skew = V.now - Date.now() / 1000;
    live = true;
    render();
  };
  es.onerror = () => { if (live) { live = false; render(); } };
}
setInterval(tick, 1000);
$('#hbar').innerHTML = Q(appBar()) + '<div class="in"><nav class="tabs"></nav></div>';
connect();
}
loadLang().then(startPage);
</script>
