.ovr .ovb{border:1.5px solid var(--due-text);border-radius:3px;font-size:11px;line-height:11px;opacity:.7}
.ovr .ovd{color:var(--due-text)}
.ovr .ovd::after{content:"•";opacity:.8}
.ovr .ovd.g::after{content:"▸";opacity:1}
.ovr .ovn{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* нужное число цели («· уровень 5», «: от 120») — хвост имени: длинное имя обрезается, число остаётся */
.ovr .ovq{flex:none;margin-left:-8px;white-space:pre}
/* подпись справа — целиком (в ней состояние); длинное имя обрезается раньше неё */
.ovr .ovo{flex:none;margin-left:auto;padding-left:10px;font-size:12.5px;color:var(--due-text);max-width:62%;overflow:hidden;text-overflow:ellipsis}
.ovr.over{border-left-color:var(--over);background:var(--over-bg)}
.ovr.over .ovb{border-color:var(--over-text)}
.ovr.over .ovo,.ovr.over .ovd{color:var(--over-text)}
.ovr.soft,.ovr.early{border-left-color:var(--line);background:var(--tile)}
.ovr.soft .ovo,.ovr.soft .ovd,.ovr.early .ovo,.ovr.early .ovd{color:var(--muted)}
.ovr.soft .ovb,.ovr.early .ovb{border-color:var(--muted)}
.ovr.ok{border-left-color:var(--ok);background:var(--ok-bg);color:#a9cdb8}
.ovr.ok .ovb{border-color:var(--ok);color:var(--ok);opacity:1}
.ovr.ok .ovb::after,.ovr.ok .ovd::after{content:"✓";opacity:1}
.ovr.ok .ovo,.ovr.ok .ovd{color:var(--ok)}
.ovr.bad{border-left-color:var(--over);background:var(--over-bg);color:var(--over-text)}
.ovr .ov12{position:absolute;left:0;bottom:0;height:2px;border-radius:0 2px 2px 0;background:var(--ok)}
/* точки перехода — одной строкой: у каждой свой ромб; взятая — зелёная с галочкой, пока не уйдёт */
.ovr.pts .ovn{display:flex;gap:14px;overflow:hidden}
.ovp{display:inline-flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.ovp i{flex:none;width:9px;height:9px;border:1.5px solid var(--due-text);transform:rotate(45deg)}
.ovp.ok{color:var(--ok)}
.ovp.ok i{width:14px;height:14px;border:0;transform:none;font:700 12px/14px "Segoe UI",system-ui,sans-serif;text-align:center;font-style:normal}
.ovp.ok i::after{content:"✓"}
/* Свёрнутый список — одна-две строки над строкой шага (вместе они встают в полосу над полосой опыта, под окнами игры;
   сколько строк — --ovk, говорит программа): по именам дела зоны — квадратик (отмечает игрок), точка (отметит
   программа), ромб (точка перехода); сделанное — зелёным с галочкой, пока не уйдёт. Справа в первой строке числом —
   остальные цели и долги (красным). Имена целиком: не вошли — их считает число. */
.ovf{max-height:calc(26px * var(--ovk, 1));padding:0 9px 0 7px;border-left:3px solid var(--due);border-radius:4px;
  background:var(--due-bg);line-height:26px;overflow:hidden}
.ovc{display:inline-flex;align-items:center;gap:7px;height:26px;max-width:100%;margin-right:10px;vertical-align:top;white-space:nowrap}
.ovc b{min-width:0;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.ovc i{flex:none;width:14px;height:14px;text-align:center;font:700 12px/14px "Segoe UI",system-ui,sans-serif;color:var(--due-text)}
.ovc.oc-dot i::after{content:"•";opacity:.8}
.ovc.oc-box i{border:1.5px solid var(--due-text);border-radius:3px;opacity:.7}
.ovc.oc-pt i{width:9px;height:9px;margin:0 2px;border:1.5px solid var(--due-text);transform:rotate(45deg)}
.ovc.oc-soft{color:var(--muted)}
.ovc.oc-soft i{border-color:var(--muted);color:var(--muted)}
.ovc.oc-ok{color:var(--ok)}
.ovc.oc-ok i{color:var(--ok)}
.ovc.oc-ok i::after{content:"✓"}
.ovc.oc-bad{color:var(--over-text)}
.ovc.oc-bad i{color:var(--over-text)}
.ovc.oc-bad i::after{content:"✕"}
.ovms{float:right;display:flex;align-items:center;gap:12px;height:26px;margin-left:4px;font-size:12.5px;white-space:nowrap}
.ovm{color:var(--due-text)}
.ovm.oc-late{color:var(--over-text)}
.ovl.armed .ovr .ovb{opacity:1}
.ovl.armed button.ovr{cursor:pointer}
.ovl.armed button.ovr.hov,.ovl.armed button.ovr:hover{filter:brightness(1.35)}
/* строка шага: имя, время шага с целью, «Шаг пройден → следующий» */
.ovh{display:flex;align-items:center;gap:9px;height:32px;margin-top:6px;border-top:1px solid #343a44;white-space:nowrap}
.ovl > .ovh:first-child{margin-top:0;border-top:0}
.ovh .ovs{flex:none;max-width:250px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ovt{display:flex;flex:none;align-items:center;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.ovt b{font-size:14px;font-weight:600}
.ovt span{color:var(--muted)}
.ovt .ovbar{display:block;width:54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ovt .ovbar i{display:block;height:100%;background:var(--muted)}
.ovt.s-warn b{color:var(--due-text)}.ovt.s-warn .ovbar i{background:var(--due)}
.ovt.s-over b{color:var(--over-text)}.ovt.s-over .ovbar i{background:var(--over)}
.ovnx{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0;max-width:236px;padding:2px 9px;border-radius:6px;
  border:1px solid #4a525e;background:transparent;color:var(--muted);font:600 13px/18px "Segoe UI",system-ui,sans-serif;white-space:nowrap;cursor:default}
.ovnx .nxn{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.ovnx .nxb{flex:none;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px}
.ovnx b{flex:none;font-variant-numeric:tabular-nums}
.ovnx.pnd{border-color:var(--accent);color:var(--text)}
.ovnx.pnd b{color:var(--accent)}
.ovnx.all{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.ovnx.all .nxn{font-weight:600}
.ovnx.all .nxb{border-color:var(--bg)}
.ovnx.all b{color:var(--bg)}
.ovl.armed .ovnx{border-color:var(--accent);color:var(--text);cursor:pointer}
.ovl.armed .ovnx.all{color:var(--bg)}
.ovl.armed .ovnx.hov,.ovl.armed .ovnx:hover{background:var(--accent);color:var(--bg)}
/* --- Режим «Разбор» (адрес /review): куда ушло время героя — и погибшего тоже. Страница идёт от целого к частному: герой →
   куда ушло время (четыре плитки) → шаги (таблица) → заходы шага (раскрытая строка). С чем сравнивать — с целями плана
   или с другим героем — выбор над таблицей; порядок строк — кнопками второго ряда шапки (как вкладки редактора: под рукой
   на любой глубине страницы). Графики актов и всей игры — по наведению: страницу они не удлиняют. Все классы режима — с
   приставкой rv-: со стилями «Игры» они не пересекаются. Цвета мест (зоны шага · город · вне маршрута) — три разных тона,
   различимых и без цвета (серый, синий, золотой); красный и зелёный — только у разницы с базой. */
:root{--rv-zone:#767a80;--rv-town:#3987e5;--rv-off:#c98500;--rv-ink:#d3d6da}
.rv{min-width:0}
.rv button{font:inherit;color:inherit}
.rv :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rv-wait{color:var(--muted);margin:16px 0}
.rv-wait.rv-bad{color:var(--over-text)}
/* чей разбор */
.rv-who{position:relative;margin:4px 0 14px}
.rv-hpick{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;max-width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.rv-hn{font-size:30px;font-weight:600;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.rv-hs{font-size:14px;color:var(--muted);white-space:nowrap}
.rv-hc{color:var(--muted);font-size:13px;white-space:nowrap}
.rv-hpick:hover .rv-hn,.rv-hpick:hover .rv-hc{color:var(--accent)}
.rv-hmeta{color:var(--muted);margin-top:4px;font-size:14px}
.rv-hmeta b{color:var(--text);font-weight:600}
.rv-hlist{position:absolute;left:0;right:0;top:100%;z-index:6;margin-top:6px;padding:6px;border:1px solid var(--accent);border-radius:10px;
  background:var(--card);box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:min(60vh,520px);overflow-y:auto}
.rv-hrow{display:grid;grid-template-columns:88px minmax(0,1.3fr) minmax(0,1fr) 92px 70px;gap:10px;align-items:baseline;width:100%;padding:6px 8px;
  border:1px solid transparent;border-radius:6px;background:none;text-align:left;font-size:14px;cursor:pointer}
.rv-hrow.rv-head{color:var(--muted);font-size:12px;cursor:default;padding-block:2px}

.rv-ag{display:grid;grid-template-columns:minmax(0,1fr) 104px 118px 76px 60px;column-gap:10px;align-items:center;padding:2px 0;font-size:13px;

<body>
<div class="hbar" id="hbar"><div class="abar"><span class="aname"></span></div><div class="in"><nav class="tabs"></nav></div></div>
<div id="ctxbg" hidden></div><div id="ctx" role="dialog" tabindex="-1" hidden></div>
<div id="app"><p class="wait" data-t>Подключаюсь…</p></div>
<div id="cmp" role="status" hidden></div>
<div id="way" role="status" hidden></div>
<div id="pts" role="status" hidden></div>
<script>
'use strict';
// Окно поверх игры (?ov=list — список шага, ?ov=answer — ответ на копию): вид страницы без шапки — с первого кадра.
{
  const ov = new URLSearchParams(location.search).get('ov');
  if (ov === 'list' || ov === 'answer' || ov === 'tree') document.documentElement.className = 'ov ov-' + ov;
}
// Режим страницы — по её адресу: «Игра» (/) или «Разбор» (/review). У них одна страница и одна шапка; у «Редактора» —
// своя страница (/admin).
const PAGE_MODE = location.pathname === '/review' ? 'review' : 'play';
// Шапка программы с первого кадра: её прошлый вид браузер помнит (appBar ниже) — он ставится сразу, ещё до словаря
// языка и данных, и при смене режима шапка не мигает.
try {
  const c = JSON.parse(localStorage.getItem('appBar') || 'null');
  const was = localStorage.getItem('lang') || localStorage.getItem('langAuto') || 'en';
  if (c && c.lang === was && c[PAGE_MODE]) document.querySelector('#hbar .abar').innerHTML = c[PAGE_MODE];
} catch (err) { /* без памяти браузера шапка появится с данными */ }
// --- Язык страницы -------------------------------------------------------------------------------------
// Тексты записаны в коде по-русски и обёрнуты вызовом T('…'); перевод — словарь языка, который страница берёт
// у программы (/api/lang, файлы planner/lang/<язык>.json; ключ — русский текст из кода). Язык выбирает
// пользователь переключателем; выбор помнит браузер, он общий для страницы забега и редактора плана. Пока
// выбора нет — язык клиента игры, если на него есть перевод (иначе английский): его называет программа в ответе на
// lang=auto, а браузер помнит его отдельно (langAuto) — только для шапки с первого кадра.
// Язык называется программе в каждом запросе (?lang=…): сама она языка не помнит,
// поэтому вкладки на разных языках друг другу не мешают.
// Весь остальной код страницы стоит в функции startPage и запускается, когда словарь получен: подписи,
// собранные один раз при запуске, тоже выходят на выбранном языке.
const I18N = {lang: 'ru', source: 'ru', name: 'ru', plural: 'slavic', quotes: '', locale: 'ru-RU', texts: {}, patterns: [], langs: []};
const LANG_KEY = 'lang', LANG_AUTO = 'auto';
function langChoice() {
  try { return localStorage.getItem(LANG_KEY) || LANG_AUTO; } catch (err) { return LANG_AUTO; }
}
// Текст на языке страницы: T('взято {0} из', n). Пометка после «##» различает одинаковые русские тексты
// с разным переводом (T('цель##время')); в сам текст она не входит. Нет перевода — текст как в коде.
function T(key, ...args) {
  let s = I18N.texts[key];
  if (s === undefined) { const cut = key.indexOf('##'); s = cut < 0 ? key : key.slice(0, cut); }
  return args.length ? s.replace(/\{(\d)\}/g, (m, i) => (args[+i] === undefined ? m : args[+i])) : s;
}
// Ключ, который переведут позже (TN или T от переменной): так его видит проверка слоя языка.
const TK = key => key;
// Уровень зоны словами игрока. Путевой камень уровня N открывает зону 64 + N (данные игры: T1…T16 = 65…80): на картах
// игрок говорит уровнем камня — «T13», а не «зона 77»; в кампании — уровнем зоны.
const mapTier = lv => (lv >= 65 && lv <= 80 ? lv - 64 : 0);
const zoneWord = lv => (mapTier(lv) ? 'T' + mapTier(lv) : T('зона') + ' ' + lv);
const fromZone = lv => (mapTier(lv) ? T('с T{0}', mapTier(lv)) : T('с зоны {0}', lv));
const PLURALS = {
  slavic: n => { const a = Math.abs(n) % 100, b = Math.abs(n) % 10; return a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2; },
  one_other: n => (Math.abs(n) === 1 ? 0 : 1),
  french: n => (Math.abs(n) <= 1 ? 0 : 1),
  polish: n => { const a = Math.abs(n) % 100, b = Math.abs(n) % 10; return Math.abs(n) === 1 ? 0 : b >= 2 && b <= 4 && !(a >= 12 && a <= 14) ? 1 : 2; },
  czech: n => (Math.abs(n) === 1 ? 0 : Math.abs(n) >= 2 && Math.abs(n) <= 4 ? 1 : 2),
  none: () => 0,
};
// Форма слова для числа: TN(3, 'шаг|шага|шагов') — «шага», по-английски «steps». Само число в текст не входит.
function TN(n, key) {
  const own = I18N.texts[key];
  const forms = (own === undefined ? key.split('##')[0] : own).split('|');
  const rule = PLURALS[own === undefined ? 'slavic' : I18N.plural] || PLURALS.one_other;
  return forms[Math.min(rule(n), forms.length - 1)];

// Кавычки языка: по-английски «ёлочки» вокруг названий заменяются на “лапки” — одним местом, перед выводом.

// Переключатель слева в шапке — одинаковый на обеих страницах: герой и выбранный план. Выбранный план один на обе
// страницы: по нему идёт герой, его играет «Игра» и правит «Редактор»; переключатель режима план не меняет.
// По нажатию под ним открывается список (ctxPanel): герои — кем играют сейчас, кого больше нет; планы библиотеки — строка
// плана целиком и есть выбор; присланный файл плана. Список шириной в колонку страницы и до низа окна, крутится целиком;
// страница под ним стоит (подложка ловит колесо и нажатие мимо); закрывается по Esc и нажатию мимо.
// Данные даёт страница: CTX.data = {plans: {library, list, current, ask, inGame}, heroes: [забеги]}; CTX.page — 'play' |
// 'edit'; CTX.edit — план на странице редактора (выбранный); CTX.after() — после действия (редактор спрашивает данные
// заново, «Игре» они приходят сами); CTX.before(дело) — перед сменой плана (редактор сперва спрашивает о несохранённых
// правках); CTX.picked() — план сменён (редактор открывает выбранный план).
const CTX = {data: null, page: PAGE_MODE, edit: '', editTitle: '', open: false, all: false, arm: null, msg: null, same: null, busy: false,
  q: null, after: () => {}, before: go => go(), picked: () => ctxShow(false)};
const ctxEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ctxPlan = id => { const p = CTX.data && CTX.data.plans; return (p && (p.list || []).find(q => q.id === id)) || null; };
const ctxTitle = id => { const x = ctxPlan(id); return x ? x.title : ''; };
// Текущий герой словами страницы. Героя без имени (лог называет героя со второго уровня) зовут его классом; героя ещё
// нет (лог не начинал забег) — пусто.
function ctxHero() {
  const cur = ((CTX.data && CTX.data.heroes) || []).find(r => r.current);
  return cur ? cur.name || cur.cls || T('новый герой') : '';
}
// Надпись переключателя — одна на обе страницы: герой и выбранный план (в редакторе — название, как его набирают).
function ctxLabel() {
  const d = CTX.data, p = d && d.plans;
  if (!p) return null;
  const plan = CTX.page === 'edit' ? CTX.editTitle || ctxTitle(CTX.edit) : ctxTitle(p.current);
  return {text: [ctxHero(), plan].filter(Boolean).join(' · '), ask: !!p.ask};
}
function appBar() {
  const cur = CTX.page;
  let mem = null;
  try { mem = JSON.parse(localStorage.getItem(BAR_KEY) || 'null'); } catch (err) { /* нет памяти */ }
  const lab = ctxLabel() || {text: (mem && mem[cur + 'Text']) || '', ask: false};
  const tip = lab.ask ? T('Новый герой: по какому плану он идёт? Выберите план в списке') : T('Герои и планы');
  const btn = open => `<button class="ctxb${lab.ask ? ' need' : ''}${open ? ' on' : ''}" data-ctx="toggle" aria-haspopup="dialog" ` +
    `aria-expanded="${open}" title="${ctxEsc(tip)}"><span class="ctxt">${ctxEsc(lab.text || T('Герои и планы'))}</span>` +
    `<span class="ctxc" aria-hidden="true">▾</span></button>`;
  const row = (open, lg, st) => btn(open) + `<div class="corner">${modeSwitch(cur)}${setSwitch(st)}${langSwitch(lg)}</div>`;
  // ряд другой страницы остаётся, каким та его запомнила (на том же языке)
  const keep = mem && mem.lang === I18N.lang ? mem : {};
  const memo = JSON.stringify(Object.assign({}, keep, {lang: I18N.lang, [cur]: row(false, false, false), [cur + 'Text']: lab.text}));
  if (memo !== barMemo) {
    barMemo = memo;
    try { localStorage.setItem(BAR_KEY, memo); } catch (err) { /* без памяти браузера шапка появится чуть позже */ }
  }
  return `<div class="abar">${row(CTX.open, langOpen, SET.open)}</div>`;
}
// Первый ряд шапки заново — когда изменились герой, план или открыт ли список (вся страница при этом не рисуется)
function ctxBar() {
  const a = document.querySelector('#hbar .abar');
  if (a) a.outerHTML = Q(appBar());
}
// Время героя: меньше минуты — «42 сек», до десяти минут — «4:38», дальше — «12 мин», от часа — «3 ч 30 мин»
function ctxTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + ' ' + T('сек');
  if (sec < 600) return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const m = Math.floor(sec / 60);
  return m < 60 ? m + ' ' + T('мин') : Math.floor(m / 60) + ' ' + T('ч') + ' ' + String(m % 60).padStart(2, '0') + ' ' + T('мин');
}
// Когда план прислан — днём, без часов: «23.11.2026»
const ctxDay = at => String(at || '').replace(/^(\d{4})-(\d\d)-(\d\d).*$/, '$3.$2.$1');
const ctxArmed = key => !!CTX.arm && CTX.arm.key === key && Date.now() - CTX.arm.at < 6000;
// Список героев и планов.
// Герои: живые и текущий; погибшие и удалённые — за «все герои». «Играю им» — вернуться к прежнему герою: действует с его
// входа в игру (с экрана выбора персонажа), со второго нажатия. «Нет героя» — погиб или удалён, а лог не сказал (тоже со
// второго нажатия); «вернуть» снимает это слово. У погибшего вместо кнопок — даты жизни.
// Планы: свои и присланные. Строка плана целиком — выбор: герой идёт по этому плану, «Игра» и «Редактор» — о нём;
// выбранный план — с ✓. Герой в игре — сперва вопрос под строкой (шаг, цели и фильтр шага сменятся прямо в игре); новому
// герою, которого спрашивают о плане, выбор — сразу ответ. «Убрать» — у плана, по которому не идёт ни один живой герой
// (со второго нажатия; выбранный не убрать). Внизу — «Новый план» и «Добавить план из файла».
function ctxPanel() {
  const d = CTX.data;
  if (!d || !d.plans) return `<p class="ctxw">${T('Загрузка…')}</p>`;
  const p = d.plans, lib = !!p.library;
  const day = ts => { const t = new Date(ts * 1000); return String(t.getDate()).padStart(2, '0') + '.' + String(t.getMonth() + 1).padStart(2, '0'); };
  // --- герои
  const all = (d.heroes || []).slice().reverse();
  const alive = all.filter(r => r.current || (r.fate || 'alive') === 'alive');
  const runs = CTX.all ? all : alive;
  const toggle = all.length > alive.length || CTX.all
    ? `<button class="mini" data-cxall>${CTX.all ? T('только живые ·') + ' ' + alive.length : T('все герои ·') + ' ' + all.length}</button>` : '';
  const hero = r => {
    const born = day(r.started), end = r.died ? day(r.died) : born;
    const act = r.current ? `<span class="runnow">${T('сейчас')}</span>`
      : r.fate === 'dead' ? `<span class="runl" title="${ctxEsc(T('погиб'))}">${end !== born ? born + ' – ' + end : born}</span>`
        : r.fate === 'gone' ? (r.byHand ? `<span class="runl">${T('нет героя')}</span>` +
            `<button class="mini" data-cxgone="${ctxEsc(r.id)}:off" title="${ctxEsc(T('Герой есть: снова предлагать его'))}">${T('вернуть')}</button>`
          : `<span class="runl">${T('удалён')}</span>`)
          : `<button class="mini${ctxArmed('run:' + r.id) ? ' arm' : ''}" data-cxrun="${ctxEsc(r.id)}" title="${ctxEsc(T('«Играю им» — после входа этим героем в игру'))}">` +
            `${ctxArmed('run:' + r.id) ? T('Точно?') : T('Играю им')}</button>` +
            `<button class="mini rm${ctxArmed('gone:' + r.id) ? ' arm' : ''}" data-cxgone="${ctxEsc(r.id)}:on" title="${ctxEsc(T('Героя больше нет — погиб или удалён: не предлагать его'))}">` +
            `${ctxArmed('gone:' + r.id) ? T('Точно?') : T('Нет героя')}</button>`;
    const plan = lib ? `<span class="runp">${ctxEsc(r.plan ? ctxTitle(r.plan) : T('план убран'))}</span>` : '';
    const gone = r.fate === 'dead' || r.fate === 'gone';
    return `<div class="runrow${lib ? ' lib' : ''}${r.current ? ' cur' : ''}${gone ? ' gone' : ''}">` +
      `<span class="runn">${ctxEsc(r.name || '—')}</span><span class="runc">${ctxEsc(r.cls || T('герой'))} ${r.level}</span>` +
      `<span class="runz">${ctxEsc(r.zone || '—')}</span>${plan}` +
      `<span class="runt">${r.spent != null ? ctxTime(r.spent) : ''}</span><span class="runa">${act}</span></div>`;
  };
  const heads = `<div class="runrow runhead${lib ? ' lib' : ''}"><span>${T('герой')}</span><span>${T('класс')}</span><span class="runz">${T('где')}</span>` +
    (lib ? `<span class="runp">${T('план')}</span>` : '') + `<span class="runt">${T('время')}</span><span></span></div>`;
  let h = `<div class="cxs"><div class="cxh"><h3>${T('Герои')}</h3>${toggle}</div>` +
    (runs.length ? heads + runs.map(hero).join('') : `<p class="ctxw">${T('Героев пока нет: лог не начинал забег')}</p>`) + '</div>';
  // --- планы
  const ask = !!p.ask;
  const plan = x => {
    const mine = x.id === p.current;
    const tag = x.received ? T('присланный') : !x.from ? T('мой') : x.from.template ? T('из шаблона')
      : x.from.take === 'route' ? T('маршрут «{0}»', x.from.title || '') : T('копия «{0}»', x.from.title || '');
    const tip = x.received ? T('Прислан файлом «{0}» {1}', x.received.file || '', ctxDay(x.received.at)) : '';
    const yes = lib && mine && ask ? `<button class="mini go" data-cxpick="${ctxEsc(x.id)}">${T('Да, по нему')}</button>` : '';
    const rm = lib && !mine && !x.heroes ? `<button class="mini rm${ctxArmed('rm:' + x.id) ? ' arm' : ''}" data-cxrm="${ctxEsc(x.id)}" ` +
      `title="${ctxEsc(T('Убрать план из библиотеки (папка плана уйдёт в backup/removed). План, по которому идёт живой герой, не убрать'))}">` +
      `${ctxArmed('rm:' + x.id) ? T('Точно?') : T('Убрать')}</button>` : '';
    const pick = !lib ? '' : ` data-cxpick="${ctxEsc(x.id)}" role="button" tabindex="0" aria-pressed="${mine}" title="${ctxEsc(mine
      ? T('Выбранный план: по нему идёт герой, его играет «Игра» и правит «Редактор»')
      : T('Выбрать план: герой пойдёт по нему, «Игра» и «Редактор» — о нём'))}"`;
    const row = `<div class="planrow${mine ? ' cur' : ''}${lib ? ' pick' : ''}"${pick}>` +
      `<span class="pln">${mine ? '<span class="tdone">✓</span> ' : ''}${ctxEsc(x.title)}</span>` +
      `<span class="plc">${ctxEsc(x.clsName || '')}</span><span class="plt"${tip ? ` title="${ctxEsc(tip)}"` : ''}>${ctxEsc(tag)}</span>` +
      `<span class="runa">${yes}${rm}</span></div>`;
    // герой в игре: выбор этого плана ждёт ответа — вопрос прямо под строкой
    return row + (CTX.q !== x.id ? '' : `<div class="cxq"><span>${T('{0} в игре: шаг, цели и фильтр шага станут по плану «{1}». Сменить?',
      ctxEsc(ctxHero() || T('герой')), ctxEsc(x.title))}</span><span class="runa"><button class="mini go" data-cxyes="${ctxEsc(x.id)}">${T('Сменить')}</button>` +
      `<button class="mini" data-cxno>${T('Отмена')}</button></span></div>`);
  };
  const list = (p.list || []).slice().sort((a, b) => a.title.localeCompare(b.title, I18N.locale));
  h += `<div class="cxs"><div class="cxh"><h3${ask ? ' class="need"' : ''}>${ask ? T('Новый герой — по какому плану?') : T('Планы')}</h3></div>` +
    list.map(plan).join('');
  if (CTX.same) {
    // присланный план уже есть (та же метка): заменить его этим файлом или добавить отдельным планом
    h += `<div class="cxq"><span>${T('План «{0}» у вас уже есть. Заменить его этим файлом?', ctxEsc(CTX.same.title))}</span>` +
      `<span class="runa"><button class="mini go" data-cxsame="replace">${T('Заменить')}</button>` +
      `<button class="mini" data-cxsame="separate">${T('Добавить отдельно')}</button><button class="mini" data-cxsame="cancel">${T('Отмена')}</button></span></div>`;
  }
  if (lib) {
    h += `<div class="cxadd"><button class="mini add" data-cxnew title="${ctxEsc(T('Свой план: из шаблона кампании или на основе любого плана'))}">${T('Новый план')}</button>` +
      `<button class="mini add" data-cxadd>${T('Добавить план из файла')}</button></div>`;
  }
  h += '</div>';
  if (CTX.msg) h += `<p class="cxmsg${CTX.msg.ok ? ' ok' : ''}">${ctxEsc(CTX.msg.text)}</p>`;
  return h;
}
// Место списка: прямо под первым рядом шапки, по ширине колонки — от левого края переключателя до правого края языка (не
// шире окна), высота — до низа окна. Подложка — ниже первого ряда: режим и язык остаются под рукой.
function ctxPlace() {
  const box = document.getElementById('ctx'), bg = document.getElementById('ctxbg'), row = document.querySelector('#hbar .abar');
  if (!box || !row) return;
  const r = row.getBoundingClientRect(), b = document.querySelector('#hbar .ctxb'), c = document.querySelector('#hbar .corner');
  const left = b ? Math.max(8, Math.round(b.getBoundingClientRect().left)) : 8;
  const right = Math.min(innerWidth - 8, c ? Math.round(c.getBoundingClientRect().right) : innerWidth - 8);
  box.style.top = Math.round(r.bottom + 4) + 'px';
  box.style.left = left + 'px';
  box.style.width = Math.max(0, right - left) + 'px';
  box.style.maxHeight = Math.max(120, Math.round(innerHeight - r.bottom - 12)) + 'px';
  if (bg) bg.style.top = Math.round(r.bottom) + 'px';
}
// Содержимое списка — заново, только когда оно изменилось; прокрутка списка остаётся на месте
let ctxMemo = '';
function ctxPaint() {
  const box = document.getElementById('ctx'), bg = document.getElementById('ctxbg');
  if (!box) return;
  box.hidden = bg.hidden = !CTX.open;
  if (!CTX.open) { ctxMemo = ''; return; }
  const html = Q(ctxPanel());
  if (html !== ctxMemo) {
    const top = box.scrollTop;
    box.innerHTML = html;
    box.scrollTop = top;
    ctxMemo = html;
  }
  ctxPlace();
}
function ctxShow(open) {
  if (CTX.open === open) return;
  CTX.open = open;
  if (!open) { CTX.arm = null; CTX.msg = null; CTX.same = null; CTX.all = false; CTX.q = null; }
  ctxBar();
  ctxPaint();
  if (open) { const box = document.getElementById('ctx'); box.scrollTop = 0; box.focus({preventScroll: true}); }
}
// Второе нажатие в течение 6 с — действие; первое — «Точно?»
function ctxArm(key) {
  if (ctxArmed(key)) { CTX.arm = null; return true; }
  CTX.arm = {key, at: Date.now()};
  CTX.msg = null;
  setTimeout(() => { if (CTX.arm && CTX.arm.key === key) { CTX.arm = null; ctxPaint(); } }, 6000);
  ctxPaint();
  return false;
}
// Запрос программе; ответ — {ok, …}. Ошибка связи — {ok: false} с причиной.
function ctxPost(url, body) {
  CTX.busy = true;
  return fetch(langUrl(url), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json().catch(() => ({ok: r.ok})))
    .catch(() => ({ok: false, problems: [T('нет связи с программой')]}))
    .finally(() => { CTX.busy = false; });
}
function ctxDone(j, text, close) {
  CTX.msg = j.ok ? (text ? {ok: true, text} : null) : {ok: false, text: (j.problems || []).join('; ') || T('программа отказала')};
  if (j.ok && close) ctxShow(false);
  else ctxPaint();
  if (j.ok) CTX.after();
}
// Выбрать план: герой идёт по нему, «Игра» и «Редактор» — о нём. Редактор сперва спрашивает о несохранённых правках
// (CTX.before; список на это время закрыт), потом открывает выбранный план (CTX.picked). Не вышло — список с причиной.
function ctxPick(id) {
  CTX.q = null;
  CTX.before(() => ctxPost('/api/plans', {use: id}).then(j => {
    if (!j.ok) { if (!CTX.open) ctxShow(true); ctxDone(j); return; }
    CTX.picked();
  }));
}
// Присланный файл плана: страница читает его сама и отдаёт программе; та проверяет, что это план, и кладёт его в
// библиотеку. План с той же меткой уже есть — вопрос: заменить его этим файлом или добавить отдельно.
let ctxFile = null;
function ctxImport(extra) {
  if (!ctxFile) return;
  ctxPost('/api/plans', Object.assign({import: ctxFile.data, file: ctxFile.name}, extra || {})).then(j => {
    if (j.same) { CTX.same = j.same; CTX.msg = null; ctxPaint(); return; }
    CTX.same = null;
    ctxFile = null;
    ctxDone(j, j.ok ? T('Добавлен план «{0}»', j.title || '') : '');
  });
}
document.addEventListener('change', e => {
  if (e.target.id !== 'ctxfile' || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0];
  e.target.value = '';
  f.text().then(t => {
    let data = null;
    try { data = JSON.parse(t); } catch (err) { data = null; }
    if (!data || typeof data !== 'object') { CTX.msg = {ok: false, text: T('Это не файл плана: в нём не JSON')}; ctxPaint(); return; }
    ctxFile = {data, name: f.name};
    ctxImport();
  }, () => { CTX.msg = {ok: false, text: T('Файл не прочитан')}; ctxPaint(); });
});
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest) return;
  if (t.closest('[data-ctx="toggle"]')) { ctxShow(!CTX.open); return; }
  if (t.closest('[data-ctx="open"]')) { ctxShow(true); return; }
  if (!CTX.open) return;
  if (t.id === 'ctxbg') { ctxShow(false); return; }
  if (!t.closest('#ctx') || CTX.busy) return;
  const el = t.closest('[data-cxall], [data-cxrun], [data-cxgone], [data-cxrm], [data-cxyes], [data-cxno], [data-cxpick], [data-cxadd], ' +
    '[data-cxsame], [data-cxnew]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.cxall !== undefined) { CTX.all = !CTX.all; ctxPaint(); return; }
  if (ds.cxrun !== undefined) {
    if (!ctxArm('run:' + ds.cxrun)) return;
    ctxPost('/api/mark', {run: ds.cxrun}).then(j => ctxDone(j.ok ? j : {ok: false, problems: [j.problems ? j.problems.join('; ')
      : T('Не переключено: после последнего входа в игру создан новый герой — эта сессия его')]}, '', true));
    return;
  }
  if (ds.cxgone !== undefined) {
    const k = ds.cxgone.lastIndexOf(':'), id = ds.cxgone.slice(0, k), on = ds.cxgone.slice(k + 1) === 'on';
    if (on && !ctxArm('gone:' + id)) return;
    ctxPost('/api/mark', {gone: {run: id, on}}).then(j => ctxDone(j));
    return;
  }
  if (ds.cxrm !== undefined) {
    if (!ctxArm('rm:' + ds.cxrm)) return;
    const title = ctxTitle(ds.cxrm);
    ctxPost('/api/plans', {remove: ds.cxrm}).then(j => ctxDone(j, T('План «{0}» убран', title)));
    return;
  }
  if (ds.cxno !== undefined) { CTX.q = null; ctxPaint(); return; }
  if (ds.cxyes !== undefined) { ctxPick(ds.cxyes); return; }
  if (ds.cxpick !== undefined) {
    const id = ds.cxpick, p = CTX.data.plans;
    if (id === p.current && !p.ask) { ctxShow(false); return; }        // он и так выбран
    // новому герою выбор — ответ на вопрос; герой в игре — сперва вопрос под строкой; иначе — сразу
    if (!p.ask && p.inGame) { CTX.q = id; CTX.arm = null; CTX.msg = null; ctxPaint(); return; }
    ctxPick(id);
    return;
  }
  if (ds.cxnew !== undefined) { ctxNewOpen(); return; }
  if (ds.cxadd !== undefined) {
    let inp = document.getElementById('ctxfile');
    if (!inp) {
      inp = document.createElement('input');
      Object.assign(inp, {type: 'file', id: 'ctxfile', accept: '.json,application/json', hidden: true});
      document.body.appendChild(inp);
    }
    inp.click();
    return;
  }
  if (ds.cxsame !== undefined) {
    if (ds.cxsame === 'cancel') { CTX.same = null; ctxFile = null; ctxPaint(); return; }
    ctxImport(ds.cxsame === 'replace' ? {replace: CTX.same.id} : {separate: true});
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && CTX.open && !document.querySelector('.leave')) ctxShow(false);
  // строка плана — кнопка: Enter и пробел выбирают план, как нажатие
  else if ((e.key === 'Enter' || e.key === ' ') && CTX.open && e.target.matches && e.target.matches('#ctx .planrow[data-cxpick]')) {
    e.preventDefault();
    e.target.click();
  }
});
// колесо и касание на подложке страницу не крутят: под списком она стоит
for (const ev of ['wheel', 'touchmove']) {
  document.addEventListener(ev, e => { if (CTX.open && e.target && e.target.id === 'ctxbg') e.preventDefault(); }, {passive: false});
}
// «Новый план» — единственный способ завести свой план: название, основа (шаблон кампании или любой план библиотеки) и что
// взять — план целиком или только маршрут (билд тогда пустой; у шаблона — только маршрут). Готовый план сразу выбран (по
// нему идёт герой) и открывается в редакторе на вкладке «Билд». «Сделать копию» и «Сделать свой план на его основе» в
// редакторе открывают это же окно.
const NW = {open: false, base: '', take: 'all', title: '', typed: false, busy: false, msg: null};
function nwTitle() {
  if (NW.typed) return NW.title;
  return NW.base === 'template' || NW.take === 'route' ? T('Новый план') : T('{0} · копия', ctxTitle(NW.base));
}
function ctxNewOpen(base, take) {
  const p = CTX.data && CTX.data.plans;
  if (!p || !p.library) return;
  ctxShow(false);
  const ids = (p.list || []).map(x => x.id);
  NW.base = base === 'template' ? (p.template ? 'template' : ids[0] || '') : ids.includes(base) ? base : p.template ? 'template' : ids[0] || '';
  NW.take = NW.base === 'template' ? 'route' : take === 'route' ? 'route' : 'all';
  Object.assign(NW, {typed: false, title: '', msg: null, busy: false, open: true});
  nwPaint(true);
}
function nwPaint(first) {
  let box = document.getElementById('ctxnew');
  if (!NW.open) { if (box) box.remove(); return; }
  if (!box) { box = document.createElement('div'); box.id = 'ctxnew'; document.body.appendChild(box); }
  const p = CTX.data.plans, list = (p.list || []).slice().sort((a, b) => a.title.localeCompare(b.title, I18N.locale));
  const tpl = NW.base === 'template';
  const opt = (v, name) => `<option value="${ctxEsc(v)}"${v === NW.base ? ' selected' : ''}>${ctxEsc(name)}</option>`;
  const take = tpl ? `<span class="nwfix">${T('маршрут кампании — только то, что задаёт игра; билд пустой')}</span>`
    : '<span class="nwtake">' + [['all', T('Весь план')], ['route', T('Только маршрут — билд пустой')]].map(([v, n]) =>
      `<button class="mini${NW.take === v ? ' on' : ''}" data-nw="take:${v}">${n}</button>`).join('') + '</span>';
  // новый план сразу станет выбранным: что это значит для героя — одной строкой (герой в игре — жёлтой)
  const who = ctxHero();
  const note = p.inGame ? `<p class="nwnote">${T('{0} в игре — шаг, цели и фильтр шага станут по новому плану', ctxEsc(who))}</p>`
    : `<p class="nwhint">${who ? T('{0} пойдёт по новому плану', ctxEsc(who)) : T('По новому плану пойдёт первый герой')}</p>`;
  box.innerHTML = Q('<div class="nwbox" role="dialog" aria-modal="true" aria-labelledby="nw-h">' +
    `<h3 id="nw-h">${T('Новый план')}</h3>` +
    `<label class="nwrow"><span class="lab">${T('Название')}</span><input data-nw="title" maxlength="80" value="${ctxEsc(nwTitle())}"></label>` +
    `<label class="nwrow"><span class="lab">${T('Основа')}</span><select data-nw="base">` +
    (p.template ? opt('template', T('Шаблон кампании')) : '') +
    list.map(x => opt(x.id, x.title + (x.received ? ' · ' + T('присланный') : ''))).join('') + '</select></label>' +
    `<div class="nwrow"><span class="lab">${T('Взять')}</span>${take}</div>` + note +
    (NW.msg ? `<p class="cxmsg">${ctxEsc(NW.msg)}</p>` : '') +
    `<div class="nwbtns"><button class="mini go" data-nw="create"${NW.busy ? ' disabled' : ''}>${T('Создать')}</button>` +
    `<button class="mini" data-nw="cancel">${T('Отмена')}</button></div></div>`);
  if (first) { const i = box.querySelector('[data-nw="title"]'); i.focus(); i.select(); }
}
function nwClose() { NW.open = false; nwPaint(); }
function nwCreate() {
  if (NW.busy) return;
  const title = nwTitle().trim(), base = NW.base;
  if (!title) { NW.msg = T('Назовите план'); nwPaint(); return; }
  NW.msg = null;
  // новый план сразу станет выбранным: редактор сперва спрашивает о несохранённых правках (окно на это время закрыто;
  // сохранённые правки попадут и в копию — она берёт план, как он записан)
  nwClose();
  CTX.before(() => {
    NW.busy = true;
    ctxPost('/api/plans', {create: {title, base, take: base === 'template' ? 'route' : NW.take}}).then(j => {
      NW.busy = false;
      if (!j.ok) { NW.msg = (j.problems || []).join('; ') || T('программа отказала'); NW.open = true; nwPaint(); return; }
      // новый план — сразу в редактор, на вкладку «Билд»: сначала название, класс и вознесение
      location.href = '/admin?from=' + encodeURIComponent(base) + '#build';
    });
  });
}
document.addEventListener('input', e => {
  if (NW.open && e.target.dataset && e.target.dataset.nw === 'title') { NW.title = e.target.value; NW.typed = true; }
});
document.addEventListener('change', e => {
  if (!NW.open || !e.target.dataset || e.target.dataset.nw !== 'base') return;
  NW.base = e.target.value;
  if (NW.base === 'template') NW.take = 'route';
  nwPaint();
});
document.addEventListener('click', e => {
  if (!NW.open || !e.target.closest) return;
  if (e.target.id === 'ctxnew') { nwClose(); return; }            // нажатие мимо окна — закрыть
  const b = e.target.closest('button[data-nw]');
  if (!b) return;
  const v = b.dataset.nw;
  if (v === 'cancel') nwClose();
  else if (v === 'create') nwCreate();
  else if (v.startsWith('take:')) { NW.take = v.slice(5); nwPaint(); }
});
document.addEventListener('keydown', e => {
  if (!NW.open) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); nwClose(); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.nw === 'title') { e.preventDefault(); nwCreate(); }
}, true);
window.addEventListener('resize', () => { if (CTX.open) ctxPlace(); });
// язык сменили на другой странице (редактор плана, страница забега) — эта идёт следом
window.addEventListener('storage', e => {
  if (e.key === LANG_KEY && e.newValue && e.newValue !== I18N.lang && !(window.langHold && window.langHold())) location.reload();
});

// --- Время по месту и графики отставания: общее для режима «Разбор» и плиток времени «Игры» ------------------------------
// Рисуется узлами, а не строками разметки: названия зон и шагов приходят из лога и плана как есть.
const RV = (() => {
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function clock(s) {
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60, p = x => String(x).padStart(2, '0');
    return h ? h + ':' + p(m) + ':' + p(c) : m + ':' + p(c);
  }
  const signed = s => (s < 0 ? '−' : '+') + clock(Math.abs(s));
  let uid = 0;
  function sv(tag, attrs, text) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  const nice = (span, steps, most) => steps.find(s => span / s <= most) || steps[steps.length - 1];
  // График отставания: точки pts — по шагам подряд ({x — время к концу шага, y — накопленное отставание от базы, s — шаг
  // (s.n — имя), d — отставание на этом шаге или null}); первая точка — ноль. Общая часть графика и значка: области выше
  // и ниже нуля (отстаёт — красная, впереди — зелёная) и линия
  function curve(svg, pts, px, py, box, thin) {
    const id = 'rvc' + (++uid), zero = py(0), defs = sv('defs');
    const up = sv('clipPath', {id: id + 'u'}), down = sv('clipPath', {id: id + 'd'});
    up.append(sv('rect', {x: box.l, y: box.t, width: box.w, height: Math.max(0, zero - box.t)}));
    down.append(sv('rect', {x: box.l, y: zero, width: box.w, height: Math.max(0, box.t + box.h - zero)}));
    defs.append(up, down);
    const line = pts.map(p => px(p.x).toFixed(1) + ',' + py(p.y).toFixed(1)).join(' ');
    const area = 'M' + px(0).toFixed(1) + ',' + zero.toFixed(1) + ' L' + line.replace(/ /g, ' L') + ' L' + px(pts[pts.length - 1].x).toFixed(1) + ',' + zero.toFixed(1) + ' Z';
    svg.append(defs, sv('path', {d: area, class: 'rv-up', 'clip-path': 'url(#' + id + 'u)'}),
               sv('path', {d: area, class: 'rv-down', 'clip-path': 'url(#' + id + 'd)'}),
               sv('line', {x1: box.l, x2: box.l + box.w, y1: zero, y2: zero, class: 'rv-zero'}),
               sv('polyline', {points: line, class: 'rv-line' + (thin ? ' rv-thin' : '')}));
  }
  function spark(pts, w, h) {
    const X = pts[pts.length - 1].x || 1, lo = Math.min(0, ...pts.map(p => p.y)), hi = Math.max(0, ...pts.map(p => p.y)), span = (hi - lo) || 1;
    const px = x => 3 + (w - 7) * x / X, py = y => 3 + (h - 6) * (hi - y) / span;
    const svg = sv('svg', {viewBox: '0 0 ' + w + ' ' + h, width: w, height: h, class: 'rv-svg', 'aria-hidden': 'true'});
    curve(svg, pts, px, py, {l: 0, t: 0, w, h}, true);
    const end = pts[pts.length - 1];
    svg.append(sv('circle', {cx: px(end.x), cy: py(end.y), r: 3, class: 'rv-pt'}));
    return svg;
  }
  function chart(pts, o) {
    const W = o.w, Hh = o.h, L = 38, R = 12, top = o.bands ? 20 : 8, Bm = 20, X = pts[pts.length - 1].x || 1;
    let lo = Math.min(0, ...pts.map(p => p.y)), hi = Math.max(0, ...pts.map(p => p.y));
    const step = nice((hi - lo) || 60, [60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 28800], 4);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    if (lo === hi) hi = lo + step;
    const box = {l: L, t: top, w: W - L - R, h: Hh - top - Bm};
    const px = x => L + box.w * x / X, py = y => top + box.h * (hi - y) / (hi - lo);
    const svg = sv('svg', {viewBox: '0 0 ' + W + ' ' + Hh, width: W, height: Hh, class: 'rv-svg rv-chart', role: 'img', 'aria-label': o.label});
    for (let v = lo; v <= hi + 1; v += step) {
      if (v !== 0) svg.append(sv('line', {x1: L, x2: W - R, y1: py(v), y2: py(v), class: 'rv-grid'}));
      svg.append(sv('text', {x: L - 6, y: py(v) + 4, 'text-anchor': 'end'}, v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v) / 60));
    }
    const sx = nice(X, [300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400], 6);
    for (let t = sx; t < X - sx * 0.25; t += sx) {
      svg.append(sv('text', {x: px(t), y: Hh - 5, 'text-anchor': 'middle'},
        t < 3600 ? t / 60 + ' ' + T('мин') : (t % 3600 ? clock(t).slice(0, -3) : t / 3600) + ' ' + T('ч')));
    }
    for (const b of o.bands || []) {
      if (b.x0 > 0) svg.append(sv('line', {x1: px(b.x0), x2: px(b.x0), y1: top - 6, y2: top + box.h, class: 'rv-band'}));
      if (px(b.x1) - px(b.x0) >= 46) svg.append(sv('text', {x: (px(b.x0) + px(b.x1)) / 2, y: 11, 'text-anchor': 'middle'}, b.name));
    }
    curve(svg, pts, px, py, box, false);
    if (o.dots) for (const p of pts.slice(1)) if (p.d != null) svg.append(sv('circle', {cx: px(p.x), cy: py(p.y), r: 2.5, class: 'rv-pt'}));
    // подписаны только два шага: где потеряно больше всего и где больше всего отыграно
    const moved = pts.filter(p => p.d != null && Math.abs(p.d) >= 60);
    const worst = moved.reduce((a, p) => (!a || p.d > a.d ? p : a), null), best = moved.reduce((a, p) => (!a || p.d < a.d ? p : a), null);
    const notes = [];
    for (const [p, up] of [[worst && worst.d > 0 ? worst : null, true], [best && best.d < 0 ? best : null, false]]) {
      if (!p) continue;
      const x = px(p.x), left = x > L + box.w * 0.55;
      let y = py(p.y) + (up ? -9 : 16);
      y = Math.max(top + 10, Math.min(top + box.h - 4, y));
      if (notes.some(n => Math.abs(n.y - y) < 13 && Math.abs(n.x - x) < 170)) continue;
      notes.push({x, y});
      svg.append(sv('circle', {cx: x, cy: py(p.y), r: 4, class: 'rv-pt'}),
                 sv('text', {x: x + (left ? -8 : 8), y, 'text-anchor': left ? 'end' : 'start', class: 'rv-lab'}, p.s.n + ' ' + signed(p.d)));
    }
    return svg;
  }
  // Полоса времени по месту: r = {z, t, o — секунды в зонах шагов, в городе, вне маршрута; qz, qo — из них в копиях
  // карт, брошенных выходом из игры}. Части по порядку: брошенные копии (штриховкой) стоят перед остальным временем
  // своего места.
  const parts = r => [['zq', r.qz || 0], ['z', r.z - (r.qz || 0)], ['t', r.t], ['oq', r.qo || 0], ['o', r.o - (r.qo || 0)]].filter(p => p[1] > 0);
  function strip(box, r) {
    for (const [k, v] of parts(r)) { const i = el('i', 'rv-' + k); i.style.flex = v + ' 0 0'; box.append(i); }
    return box;
  }
  // Шапка окна по наведению: название, строка чисел (узлы и строки), полосы времени по месту в одной шкале (rows:
  // [{name, cls, z, t, o, qz, qo}]) и подписи цветов с временем (по первой строке)
  function head(box, title, fig, rows) {
    const f = el('div', 'rv-fig');
    f.append(...fig);
    box.append(el('div', 'rv-ph', title), f);
    const sum = r => r.z + r.t + r.o, most = Math.max(...rows.map(sum), 1);
    for (const r of rows) {
      const row = el('div', 'rv-pb' + (r.cls || '')), trk = el('div', 'rv-trk'), hold = el('div');
      trk.style.width = (100 * sum(r) / most) + '%';
      hold.append(strip(trk, r));
      row.append(el('span', '', r.name || ''), hold, el('span', 'rv-tot', clock(sum(r))));
      box.append(row);
    }
    const leg = el('div', 'rv-leg'), r = rows[0];
    for (const [k, t, v] of [['z', T('в зонах'), r.z], ['t', T('город'), r.t], ['o', T('вне маршрута'), r.o],
                             ['zq', T('в прерванных попытках'), (r.qz || 0) + (r.qo || 0)]]) {
      if (!(v > 0)) continue;
      const one = el('span');
      one.append(el('i', 'rv-sw rv-' + k), t + ' ' + clock(v));
      leg.append(one);
    }
    box.append(leg);
  }
  // окно встаёт под тем, на что навели (r — его рамка), а не помещается — над ним
  function place(pop, r) {
    pop.hidden = false;
    const p = pop.getBoundingClientRect();
    let top = r.bottom + 8 + p.height < innerHeight ? r.bottom + 8 : r.top - p.height - 8;
    if (top < 8) top = Math.min(r.bottom + 8, innerHeight - p.height - 8);
    pop.style.top = Math.max(8, top) + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - p.width - 12)) + 'px';
  }
  // окно графика и подсказка у полосы — по одному на страницу
  function boxes() {
    for (const id of ['rv-tip', 'rv-pop']) {
      if (document.getElementById(id)) continue;
      const box = el('div', id);
      box.id = id;
      box.hidden = true;
      document.body.append(box);
    }
  }
  return {el, clock, signed, spark, chart, strip, head, place, boxes};
})();

// --- Режим «Разбор» (адрес /review) ----------------------------------------------------------------------------------------
// Куда ушло время героя — и того, которым играют, и погибшего. Время привязано к шагу, которым герой был занят (а не к
// кнопке «Шаг пройден»), и разложено по месту: зоны шага · город · вне маршрута; считает программа (planner/review.py,
// /api/review). Страница — от целого к частному: герой → плитки → таблица шагов с полосами в общей шкале минут →
// заходы шага по порядку (строка раскрывается). С чем сравнивать — с целями плана или с другим героем (его время
// разложено по шагам того же плана) — выбор над таблицей; порядок строк — кнопки второго ряда шапки. Графики актов и
// всей игры — по наведению. Открывается разбор героя, которым играют; пока он в игре, числа обновляются сами. Героя,
// которым играют, режим не трогает: чей разбор открыт, помнит только эта страница.
function reviewPage() {
  const $ = id => document.getElementById(id);
  const {el, clock, signed, spark, chart} = RV;
  // Текст с подстановками-узлами: fill(box, T('погиб {0} на шаге {1}'), [дата, узел]) — порядок слов задаёт перевод
  function fill(box, text, parts) {
    let last = 0;
    text.replace(/\{(\d)\}/g, (m, i, at) => {
      box.append(text.slice(last, at), parts[+i] == null ? '' : parts[+i]);
      last = at + m.length;
      return m;
    });
    box.append(text.slice(last));
    return box;
  }
  // --- числа словами (часами — RV.clock) --------------------------------------------------------------------------------
  function words(s) {
    s = Math.round(s);
    if (s < 60) return s + ' ' + T('сек');
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h ? h + ' ' + T('ч') + ' ' + String(m).padStart(2, '0') + ' ' + T('мин') : m + ' ' + T('мин');
  }
  const day = ts => { const t = new Date(ts * 1000); return String(t.getDate()).padStart(2, '0') + '.' + String(t.getMonth() + 1).padStart(2, '0'); };
  const quoted = s => Q('«' + s + '»');
  // Как назвать героя рядом с другим героем: днём, когда он начат, — «23.11». Имя для этого не годится: имя погибшего
  // героя достаётся следующему, и у героев оно часто одно. Начатых в один день различает время: «23.11 12:29».
  // stamp — в списке героев (день; время — если в этот день начат ещё кто-то), tag — в таблице, где героев двое
  // (время — только если оба начаты в один день).
  const dayTime = ts => { const t = new Date(ts * 1000); return day(ts) + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); };
  const stamp = h => (((D && D.runs) || []).filter(r => day(r.started) === day(h.started)).length < 2 ? day(h.started) : dayTime(h.started));
  const tag = h => (D && D.hero && D.base && day(D.hero.started) === day(D.base.started) ? dayTime(h.started) : day(h.started));

  // --- состояние страницы ---------------------------------------------------------------------------------------------
  // D — ответ программы: герои, чей разбор показан (pick), разбор героя (hero) и второго героя (base) по тому же плану.
  // S.base — с кем сравнивать (id героя; null — с целями плана); S.order — порядок строк; open — раскрытые шаги, shut —
  // свёрнутые акты; list — какой список героев открыт. Кого показывали в прошлый раз и когда, помнит браузер (MEM): по
  // этому программа решает, кого показать при открытии, — героя, которым играют, или прежнего (если с тех пор не играли).
  const MEM = 'review';
  const KIND = ['z', 'x', 't', 'o', 'l', 'b', 'd', 'a'];      // виды записей ленты шага по номерам (review.KINDS)
  const LIVE_EVERY = 15000;      // пока герой в игре, его разбор берётся заново раз в столько миллисекунд
  let D = null, loadedAt = 0, asked = 0;
  const S = {base: null, order: 'route', open: new Set(), shut: new Set(), list: null, lost: false};
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(MEM) || '{}') || {}; } catch (err) { /* без памяти браузера — герой, которым играют */ }
  S.base = typeof mem.base === 'string' ? mem.base : null;
  const H = () => D.hero;
  const B = () => D.base;
  const all = s => s.z + s.t + s.o;
  const twin = s => { const b = B(); return b ? b.byId[s.id] || null : null; };      // тот же шаг у второго героя
  // с чем сравнивается время шага: цель плана или время второго героя, если он этот шаг прошёл
  function ref(s) {
    const b = B();
    if (!b) return s.g || null;
    const x = b.byId[s.id];
    return x && x.c == null ? all(x) : null;
  }
  // шаг, на котором время героя кончилось (гибель, конец лога), не пройден: с базой его не сравнить
  const delta = s => { const r = ref(s); return r != null && s.c == null ? all(s) - r : null; };
  // цветом — только заметное: на четверть базы и не меньше минуты
  function tone(d, goal) {
    const edge = Math.max(goal / 4, 60);
    return d == null || !goal ? '' : d >= edge ? ' rv-slow' : d <= -edge ? ' rv-fast' : '';
  }
  // героя зовут его именем; героя без имени (лог называет героя со второго уровня) — классом
  const nameOf = h => h.name || h.cls || T('герой');
  const kindOf = h => [(h.cls || T('герой')) + ' ' + h.level, h.asc].filter(Boolean).join(' · ');
  const lastStep = h => h.steps.find(s => s.c != null) || h.steps[h.steps.length - 1];
  // шаги, пройденные до конца обоими героями: только по ним честно сравнивать суммы
  const common = () => H().steps.filter(s => s.c == null && twin(s) && twin(s).c == null);
  // Карта, начатая заново: герой вышел из игры на карте и вернулся уже в новую её копию. s.q — сколько попыток на шаге
  // так прервано, lost — сколько времени осталось в брошенных копиях (оно часть зон шага или «вне маршрута»).
  const lost = s => (s.qz || 0) + (s.qo || 0);
  const times = n => n + ' ' + TN(n, 'раз|раза|раз');

  // --- запрос к программе ------------------------------------------------------------------------------------------------
  // pick.hero — героя выбрали в списке. Страница уже кого-то показывает — обновляется он же: сам герой на открытой
  // странице не меняется. При открытии решает программа: герой, которым играют, или прежний, если с тех пор не играли.
  function load(pick) {
    const q = new URLSearchParams(), n = ++asked;
    if (pick && pick.hero) q.set('hero', pick.hero);
    else if (D && D.pick) q.set('hero', D.pick);
    else if (mem.hero) { q.set('last', mem.hero); q.set('since', String(mem.at || 0)); }
    if (S.base) q.set('base', S.base);
    const args = q.toString();
    return fetch(langUrl('/api/review' + (args ? '?' + args : '')))
      .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(d => {
        if (n !== asked) return;      // уже спросили о другом герое: этот ответ устарел
        for (const h of [d.hero, d.base]) if (h) { h.byId = {}; for (const s of h.steps) h.byId[s.id] = s; }
        if (D && D.pick !== d.pick) { S.open.clear(); S.shut.clear(); }
        if (!d.base) S.base = null;
        D = d;
        S.lost = false;
        loadedAt = Date.now();
        mem = {hero: d.pick, at: Date.now() / 1000, base: S.base};
        try { localStorage.setItem(MEM, JSON.stringify(mem)); } catch (err) { /* выбор живёт до перезагрузки */ }
        CTX.data = {plans: d.plans, heroes: d.runs};
        draw();
      })
      .catch(() => {
        if (n !== asked) return;
        S.lost = true;
        if (D && $('rv-state')) drawState(); else { $('app').textContent = ''; $('app').append(el('p', 'rv-wait rv-bad', T('нет связи с программой'))); }
        setTimeout(() => { if (S.lost) load(); }, 2000);
      });
  }

  // --- шапка: второй ряд — порядок строк -----------------------------------------------------------------------------
  function orders() {
    const h = D && D.hero, steps = h ? h.steps : [];
    return [['route', T('По маршруту'), steps.length],
      ['late', D && D.base ? T('Где отстал от {0}', tag(D.base)) : T('Где отстал от цели'), steps.filter(s => delta(s) > 0).length],
      ['town', T('Где дольше в городе'), steps.filter(s => s.t > 0).length],
      ['off', T('Где уходил с маршрута'), steps.filter(s => s.o > 0).length],
      ['again', T('Карты заново'), steps.filter(s => s.q > 0).length]];
  }
  function bar() {
    const tabs = `<nav class="tabs" aria-label="${ctxEsc(T('Порядок строк'))}">` + orders().map(([id, name, n]) =>
      `<button data-rvo="${id}"${id === S.order ? ' class="on"' : ''} aria-pressed="${id === S.order}">${ctxEsc(name)}` +
      (D && D.hero ? `<span class="cnt">${n}</span>` : '') + '</button>').join('') + '</nav>';
    document.getElementById('hbar').innerHTML = Q(appBar() + `<div class="in">${tabs}</div>`);
    ctxPaint();
    pad();
  }
  // шапка закреплена: заголовок таблицы встаёт под неё, а переход к таблице не уводит её под шапку
  function pad() {
    const b = document.querySelector('.hbar'), top = b ? b.offsetHeight : 87;
    document.documentElement.style.setProperty('--rv-top', top + 'px');
    document.documentElement.style.scrollPaddingTop = (top + 8) + 'px';
  }

  // --- каркас страницы -----------------------------------------------------------------------------------------------
  function frame() {
    const app = $('app'), root = el('div', 'rv');
    app.textContent = '';
    const who = el('div', 'rv-who'), pick = el('button', 'rv-hpick');
    pick.id = 'rv-hpick';
    pick.type = 'button';
    pick.setAttribute('aria-haspopup', 'listbox');
    pick.append(el('span', 'rv-hn'), el('span', 'rv-hs'), el('span', 'rv-hc', T('сменить героя') + ' ▾'));
    const meta = el('div', 'rv-hmeta'), list = el('div', 'rv-hlist');
    meta.id = 'rv-hmeta';
    list.id = 'rv-hlist';

    const state = el('p', 'rv-wait');

    state.hidden = true;
    const body = el('div');

    tiles.id = 'rv-tiles';

    whole.setAttribute('role', 'img');
    agl.id = 'rv-agl';
    sum.append(tiles, whole, agl, el('p', 'rv-rule', T('Время идёт шагу, которым герой занят. Шаг сменяется, когда герой пришёл на карту следующего работать. Короткий заход — открыть точку, взять вход — шаг не меняет, и город после него остаётся у прежнего шага. Вне игры и на паузе время не идёт.') + ' ' + T('Карта начата заново — герой вышел из игры на карте, а вернулся уже в новую её копию.')));
    const cmp = el('div', 'rv-chips');
    cmp.id = 'rv-cmp';
    cmp.setAttribute('role', 'group');
    cmp.setAttribute('aria-label', T('С чем сравнивать'));
    cmp.append(el('span', 'rv-cl', T('Сравнить с')));
    const own = el('p', 'rv-own');
    own.id = 'rv-own';
    own.hidden = true;
    const tw = el('div', 'rv-tw'), tb = el('table', 'rv-tb'), cg = el('colgroup'), head = el('thead'), hr = el('tr');
    tb.id = 'rv-tb';
    for (const c of ['', 'rv-c-bar', 'rv-c-n', 'rv-c-n', 'rv-c-o', 'rv-c-a', 'rv-c-g', 'rv-c-d']) cg.append(el('col', c));
    const th = (text, cls, sw) => {
      const x = el('th', cls);
      x.scope = 'col';
      if (sw) x.append(el('i', 'rv-sw rv-' + sw));
      if (text) x.append(text);
      hr.append(x);
      return x;
    };
    th(T('Шаг'));
    const axis = el('div', 'rv-axis');
    axis.id = 'rv-axis';
    th('').append(axis);
    th(T('В зоне'), 'rv-nw', 'z');
    th(T('Город'), 'rv-nw', 't');
    th(T('Вне маршрута'), '', 'o');
    th(T('Всего'));
    th(T('Цель##время'));
    th('').id = 'rv-dh';
    head.append(hr);
    const rows = el('tbody'), foot = el('tfoot');
    rows.id = 'rv-rows';
    foot.id = 'rv-foot';
    tb.append(cg, head, rows, foot);
    tw.append(tb);
    body.append(sum, cmp, own, tw);
    root.append(who, state, body);
    app.append(root);
    pick.addEventListener('click', e => { e.stopPropagation(); S.list = S.list === 'hero' ? null : 'hero'; drawHero(); drawCompare(); });
    RV.boxes();
  }

  // --- герой и с кем сравнить -----------------------------------------------------------------------------------------
  // Список героев: все герои лога, новые сверху. Нажатие — показать его разбор (или сравнить с ним): героя, которым
  // играют, это не меняет.
  function heroRows(box, skip, on, pick) {
    const head = el('div', 'rv-hrow rv-head');
    for (const [t, c] of [[T('начат'), ''], [T('герой'), ''], [T('где'), ''], [T('время'), 'rv-num'], ['', 'rv-fate']]) head.append(el('span', c, t));
    box.append(head);
    for (const r of (D.runs || []).slice().reverse()) {
      if (r.id === skip) continue;
      const b = el('button', 'rv-hrow' + (r.id === on ? ' rv-on' : '')), name = el('span');
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', String(r.id === on));
      name.append(r.name || r.cls || T('герой'), el('small', '', (r.name && r.cls ? r.cls + ' ' : '') + r.level));
      const fate = r.fate === 'dead' ? T('погиб') : r.current ? T('сейчас') : r.fate === 'gone' ? (r.byHand ? T('нет героя') : T('удалён')) : T('жив');
      b.append(el('span', 'rv-dim', stamp(r)), name, el('span', '', r.zone || '—'),
               el('span', 'rv-num', r.spent != null ? ctxTime(r.spent) : ''), el('span', 'rv-dim rv-fate' + (r.current && r.fate !== 'dead' ? ' rv-now' : ''), fate));
      b.addEventListener('click', e => { e.stopPropagation(); pick(r.id); });
      box.append(b);
    }
  }
  function drawHero() {
    const h = H(), pick = $('rv-hpick'), l = $('rv-hlist'), m = $('rv-hmeta');
    const row = (D.runs || []).find(r => r.id === D.pick) || {};
    pick.children[0].textContent = h ? nameOf(h) : row.name || row.cls || T('герой');
    pick.children[1].textContent = h ? (h.name ? kindOf(h) : [h.level, h.asc].filter(Boolean).join(' · ')) : '';
    pick.setAttribute('aria-expanded', String(S.list === 'hero'));
    m.textContent = '';
    if (h && h.steps.length) {
      const step = el('b', '', quoted(lastStep(h).n));
      fill(m, h.fate === 'dead' ? T('погиб {0} на шаге {1}') : h.fate === 'now' ? T('в игре с {0}, сейчас на шаге {1}') : T('начат {0}, остановился на шаге {1}'),
           [day(h.fate === 'dead' ? h.end : h.started), step]);
      if (D.plan && D.plan.title) m.append(' · ' + T('план «{0}»', D.plan.title));
    }
    l.hidden = S.list !== 'hero';
    l.textContent = '';
    if (S.list === 'hero') heroRows(l, null, D.pick, id => { S.list = null; S.base = S.base === id ? null : S.base; drawHero(); load({hero: id}); });
  }
  function drawCompare() {
    const box = $('rv-cmp'), b = B(), own = $('rv-own');
    while (box.children.length > 1) box.lastChild.remove();
    const plan = el('button', '', T('целями плана'));
    plan.type = 'button';
    plan.setAttribute('aria-pressed', String(!b));
    plan.addEventListener('click', () => { S.list = null; if (S.base) { S.base = null; load(); } else drawCompare(); });
    const other = el('button', '', (b ? T('героем {0}', stamp(b) + ' · ' + nameOf(b) + ' ' + b.level) : T('другим героем')) + ' ▾');
    other.type = 'button';
    other.id = 'rv-cmph';
    other.setAttribute('aria-pressed', String(!!b));
    other.setAttribute('aria-haspopup', 'listbox');
    other.setAttribute('aria-expanded', String(S.list === 'base'));
    other.addEventListener('click', e => { e.stopPropagation(); S.list = S.list === 'base' ? null : 'base'; drawHero(); drawCompare(); });
    box.append(plan, other);
    if (b) {
      const k1 = el('span', 'rv-key'), k2 = el('span', 'rv-key');
      k1.append(el('i'), T('этот герой'));
      k2.append(el('i', 'rv-b'), tag(b));
      box.append(k1, k2, el('span', 'rv-note', T('общих пройденных шагов: {0}', common().length)));
    }
    // у второго героя свой план: его время всё равно разложено по шагам плана этого героя — иначе шаги не сопоставить
    own.hidden = !(b && b.ownPlan);
    own.textContent = b && b.ownPlan ? T('У героя {0} свой план — «{1}»: его время разложено по шагам плана «{2}»', tag(b), b.ownPlan, (D.plan && D.plan.title) || '') : '';
    if (S.list === 'base') {
      const l = el('div', 'rv-hlist');
      l.id = 'rv-blist';
      heroRows(l, D.pick, b ? b.id : null, id => { S.list = null; S.base = id; drawCompare(); load(); });
      box.append(l);
    }
  }

  // --- куда ушло время ------------------------------------------------------------------------------------------------
  function drawTiles() {
    const h = H(), b = B(), tot = h.total, sum = tot.z + tot.t + tot.o;
    const box = $('rv-tiles');
    box.textContent = '';
    const tile = (label, kind, value, sub) => {
      const t = el('div', 'rv-tt'), l = el('div', 'rv-tl');
      if (kind) l.append(el('i', 'rv-sw rv-' + kind));
      l.append(label);
      t.append(l, el('div', 'rv-tv', value), sub || el('div', 'rv-ts'));
      box.append(t);
      return t;
    };
    const dl = v => el('span', v > 0 ? 'rv-slow' : v < 0 ? 'rv-fast' : '', signed(v));
    const line = (text, parts) => fill(el('div', 'rv-ts'), text, parts || []);
    let first, parts;
    if (b) {
      // второй герой: разница на общих шагах — всего и по каждому месту
      const cs = common(), d = k => cs.reduce((a, s) => a + s[k] - twin(s)[k], 0);
      first = cs.length ? line(T('к {0} {1}'), [tag(b), dl(d('z') + d('t') + d('o'))]) : line(T('общих шагов нет'));
      parts = ['z', 't', 'o'].map(k => (cs.length ? line(T('к {0} {1}'), [tag(b), dl(d(k))]) : line('')));
    } else {
      const passed = h.steps.filter(s => s.g && s.c == null), lag = passed.reduce((a, s) => a + all(s) - s.g, 0);
      first = passed.length ? line(T('к целям шагов {0}'), [dl(lag)]) : line('');
      parts = [tot.z, tot.t, tot.o].map(x => line(sum && x ? T('{0}% времени', Math.round(100 * x / sum)) : ''));
    }
    const t1 = tile(h.dead ? T('До гибели') : T('Всего'), '', words(sum), first);
    const big = v => (v ? words(v) : '—');      // места, где герой не был, — прочерком, а не «0 сек»
    tile(T('В зонах шагов'), 'z', big(tot.z), parts[0]);
    tile(h.maps ? T('В городах и убежище') : T('В городах'), 't', big(tot.t), parts[1]);
    tile(T('Вне маршрута'), 'o', big(tot.o), parts[2]);
    // на первой плитке — ход отставания за всю игру; крупно — по наведению
    const pts = track(h.steps);
    if (pts.some(p => p.d != null)) {
      t1.classList.add('rv-graph');
      t1.tabIndex = 0;
      const m = spark(pts, 84, 34);
      m.classList.add('rv-mini');
      t1.append(m);
      const show = () => popRun(t1), hide = () => { $('rv-pop').hidden = true; };
      t1.addEventListener('pointerenter', show);
      t1.addEventListener('pointerleave', hide);
      t1.addEventListener('focus', show);
      t1.addEventListener('blur', hide);
    }
    const w = $('rv-whole'), sumOf = (hh, k) => hh.steps.reduce((a, s) => a + (s[k] || 0), 0);
    w.textContent = '';
    w.setAttribute('aria-label', T('В зонах шагов {0}, в городах {1}, вне маршрута {2}', words(tot.z), words(tot.t), words(tot.o)));
    RV.strip(w, {z: tot.z, t: tot.t, o: tot.o, qz: sumOf(h, 'qz'), qo: sumOf(h, 'qo')});
    // Карты, начатые заново: сколько раз и сколько времени осталось в брошенных копиях (в полосах — штриховкой)
    const ag = $('rv-agl'), q = sumOf(h, 'q'), ql = sumOf(h, 'qz') + sumOf(h, 'qo');
    ag.textContent = '';
    ag.append(el('i', 'rv-sw rv-zq'));
    if (q) {
      fill(ag, T('Карты начаты заново: {0} · в прерванных попытках {1} · {2}% времени'),
           [el('b', '', times(q)), el('b', '', words(ql)), sum ? Math.round(100 * ql / sum) : 0]);
    } else ag.append(T('Ни одну карту герой не начинал заново.'));
    if (b) {
      const bq = sumOf(b, 'q'), bl = sumOf(b, 'qz') + sumOf(b, 'qo');
      ag.append(' · ', bq ? T('у {0}: {1}, {2}', tag(b), times(bq), words(bl)) : T('у {0}: ни разу', tag(b)));
    }
    if (D.again && D.again.rows.length) {
      const all = el('span', 'rv-all', T('по всем героям'));
      all.tabIndex = 0;
      const show = () => popAgain(all), hide = () => { $('rv-pop').hidden = true; };
      all.addEventListener('pointerenter', show);
      all.addEventListener('pointerleave', hide);
      all.addEventListener('focus', show);
      all.addEventListener('blur', hide);
      ag.append(all);
    }
  }

  // --- график отставания: по шагам подряд, ширина шага — его время, высота — накопленное отставание от базы --------
  function track(steps) {
    let x = 0, y = 0;
    const pts = [{x: 0, y: 0, d: null}];
    for (const s of steps) {
      const d = delta(s);
      x += all(s);
      if (d != null) y += d;
      pts.push({x, y, s, d});
    }
    return pts;
  }
  // --- всплывающий график ---------------------------------------------------------------------------------------------
  function popHead(box, title, list) {
    const b = B(), fig = [];
    const sumA = list.reduce((a, s) => a + all(s), 0);
    const cmp = list.filter(s => delta(s) != null), base = cmp.reduce((a, s) => a + ref(s), 0), d = cmp.reduce((a, s) => a + delta(s), 0);
    fig.push(el('b', '', clock(sumA)));
    if (cmp.length) {
      fig.push(' · ' + (b ? tag(b) : T('цель##время')) + ' ' + clock(base) + ' · ', el('b', d > 0 ? 'rv-slow' : 'rv-fast', signed(d)));
      if (cmp.length < list.length) fig.push(' · ' + T('сравнено шагов: {0} из {1}', cmp.length, list.length));
    }
    // полосы: герой и, при сравнении, второй герой — в одной шкале
    const sums = (ss, name, cls) => ({name, cls, z: ss.reduce((a, s) => a + s.z, 0), t: ss.reduce((a, s) => a + s.t, 0),
      o: ss.reduce((a, s) => a + s.o, 0), qz: ss.reduce((a, s) => a + (s.qz || 0), 0), qo: ss.reduce((a, s) => a + (s.qo || 0), 0)});
    const rows = [sums(list, b ? tag(H()) : '', '')];
    if (b) rows.push(sums(list.map(twin).filter(Boolean), tag(b), ' rv-b'));
    RV.head(box, title, fig, rows);
  }
  // Где карты начинают заново — по всем героям лога: зоны, где в брошенных копиях осталось больше всего времени
  function popAgain(anchor) {
    const pop = $('rv-pop'), a = D.again, rows = a.rows.slice(0, 10), most = Math.max(...rows.map(r => r.lost), 1);
    pop.textContent = '';
    pop.className = 'rv-pop rv-wide';
    pop.append(el('div', 'rv-ph', T('Где карты начинают заново')),
               el('div', 'rv-fig', T('по всем героям из лога: {0} · сначала карты, где в прерванных попытках осталось больше времени', a.heroes)));
    const head = el('div', 'rv-ag rv-head');
    for (const [t, c] of [[T('карта'), ''], ['', ''], [T('начинали заново'), ''], [T('сколько раз'), 'rv-num'], [T('время'), 'rv-num']]) head.append(el('span', c, t));
    pop.append(head);
    for (const r of rows) {
      const row = el('div', 'rv-ag'), trk = el('div', 'rv-trk'), i = el('i', 'rv-zq');
      i.style.width = Math.max(2, 100 * r.lost / most) + '%';
      trk.append(i);
      row.append(el('span', '', r.n), trk, el('span', 'rv-dim', T('{0} из {1} героев', r.who, r.came)),
